<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monolith Sweep</title>
<!-- The Monolith: every coupling measure from 1 to 55 Hz, Precon1 -> Precon4,
     pooled over rats (backend/monolith.py). Served by Jarvis; reads its data
     from /api/arc/monolith/*. The page's behaviour is js/monolith.js; its
     harness is _dev/monolith.html. -->
<style>
:root {
  --bg: #f6f6f2; --surface: #ffffff; --surface-2: #fbfbf8; --ink: #16181b; --ink-2: #474c54; --ink-3: #6f747d;
  --line: #e2e1db; --line-2: #cfcec7; --chip: #efeee9; --focus: #c98a00;
  --up: #c63a39; --down: #1c5cab; --up-soft: rgba(198, 58, 57, .12); --down-soft: rgba(28, 92, 171, .12);
  --node: #2c3e50; --node-grey: #c9c8c1; --ring: #e7e6e0; --arrow: #6b3fa0;
  --dim: rgba(246, 246, 242, .94); --ok: #2e7d4f;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Consolas, monospace; --r: 8px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111316; --surface: #191c20; --surface-2: #1d2025; --ink: #e9eaec; --ink-2: #b7bbc2; --ink-3: #8b9099;
    --line: #2b2f35; --line-2: #3a3f46; --chip: #23262b; --focus: #f2b933;
    --up: #f2807e; --down: #6aa5f2; --up-soft: rgba(242, 128, 126, .16); --down-soft: rgba(106, 165, 242, .16);
    --node: #d7dbe0; --node-grey: #3a3f46; --ring: #24272c; --arrow: #c09bf0;
    --dim: rgba(17, 19, 22, .94); --ok: #6fd39c;
  }
}
:root[data-theme="dark"] {
  --bg: #111316; --surface: #191c20; --surface-2: #1d2025; --ink: #e9eaec; --ink-2: #b7bbc2; --ink-3: #8b9099;
  --line: #2b2f35; --line-2: #3a3f46; --chip: #23262b; --focus: #f2b933;
  --up: #f2807e; --down: #6aa5f2; --up-soft: rgba(242, 128, 126, .16); --down-soft: rgba(106, 165, 242, .16);
  --node: #d7dbe0; --node-grey: #3a3f46; --ring: #24272c; --arrow: #c09bf0;
  --dim: rgba(17, 19, 22, .94); --ok: #6fd39c;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); }
main { max-width: 1600px; margin: 0 auto; padding: 22px var(--gutter) 60px; }
h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 8px; overflow-wrap: anywhere; }
h3 { font-size: 13px; margin: 12px 0 6px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
p { margin: 0 0 8px; }
.lede { color: var(--ink-2); max-width: 90ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 0 0 14px; min-width: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.warn { color: var(--up); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px 340px; gap: 14px; align-items: start; }
@media (max-width: 1320px) { .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .col-circ { grid-column: 1 / -1; } }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.ctl { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.ctl > .lab { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.seg { display: flex; flex-wrap: wrap; gap: 3px; background: var(--chip); padding: 3px; border-radius: var(--r); max-width: 100%; }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--ink-2); padding: 4px 9px; border-radius: 6px; cursor: pointer; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.seg.big button { font-size: 14px; padding: 6px 12px; }
.mgroup { font-size: 11px; color: var(--ink-3); margin: 6px 0 2px; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type="range"] { width: 100%; accent-color: var(--ink); }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); gap: 4px; }
.ticks span { flex: 1; text-align: center; }
.ticks span:first-child { text-align: left; }
.ticks span:last-child { text-align: right; }
.readout { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.toggle input { accent-color: var(--ink); }
.circ { position: relative; }
.circ svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
.edge { cursor: pointer; fill: none; stroke-linecap: round; }
.edge.sel { filter: drop-shadow(0 0 3px var(--focus)); }
.edge.hl { stroke-opacity: 1 !important; filter: drop-shadow(0 0 2px var(--focus)); }
.arrowp { fill: none; pointer-events: none; }
.ahead { cursor: pointer; }
.ahead.sel { filter: drop-shadow(0 0 3px var(--focus)); }
.ahead.hl { filter: drop-shadow(0 0 2px var(--focus)); }
.arrowh { pointer-events: none; }
.node { cursor: default; }
.node-l { font: 11.5px var(--sans); fill: var(--ink-2); }
.node-l.grey { fill: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 24px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
.legend b.sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.empty { color: var(--ink-3); font-size: 13.5px; padding: 12px 0; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2);
       border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-width: 340px; display: none; }
.tip b { display: block; overflow-wrap: anywhere; }
.tip .row { overflow-wrap: anywhere; }
/* the ghost: one edge lifted out of the circuit, then opened up */
.ghost-bd { fill: var(--dim); }
.ghost text { font: 12px var(--sans); fill: var(--ink); }
.ghost .gl { font: 11px var(--mono); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface-2);
             stroke-width: 3px; stroke-linejoin: round; }
.ghost .gname { font: 600 13px var(--sans); fill: var(--ink); }
.ghost .garc { fill: none; stroke-linecap: round; cursor: pointer; }
.ghost .garc.leaf { cursor: default; }
.ghost .garc:hover { filter: drop-shadow(0 0 3px var(--focus)); }
.ghost .gx { cursor: pointer; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12.5px; margin: 0 0 6px; min-height: 22px; }
.crumbs button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 12px; padding: 1px 9px; cursor: pointer; }
.crumbs button[aria-current="true"] { color: var(--ink); font-weight: 600; border-color: var(--ink-3); }
.crumbs .sep { color: var(--ink-3); }
.spec svg { width: 100%; height: auto; display: block; cursor: pointer; }
/* points of interest */
ol.top { margin: 0; padding: 0; list-style: none; }
ol.top > li { border-top: 1px solid var(--line); padding: 7px 4px; cursor: pointer; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 8px; }
ol.top > li:first-child { border-top: 0; }
ol.top > li:hover { background: var(--chip); }
ol.top > li.sel { background: color-mix(in srgb, var(--focus) 14%, transparent); }
ol.top .rk { font: 600 12.5px var(--mono); color: var(--ink-3); padding-top: 2px; }
ol.top .pr { font-weight: 600; overflow-wrap: anywhere; }
ol.top .bs { grid-column: 2; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
ol.top .mr { grid-column: 2; font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
ol.top .mr button { font: inherit; border: 0; background: none; color: var(--ink-2); text-decoration: underline; cursor: pointer; padding: 0; }
ol.top ul { grid-column: 2; margin: 2px 0 0; padding-left: 16px; font-size: 12px; color: var(--ink-2); }
.chip { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 10px; margin-left: 6px; vertical-align: 1px; background: var(--chip); color: var(--ink-2); white-space: nowrap; }
.chip.all { background: var(--ink); color: var(--surface); }
.linkish { font: inherit; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; padding: 0;
           text-decoration: underline dotted; overflow-wrap: anywhere; }
.more-btn { font: inherit; font-size: 13px; margin-top: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 5px 12px; cursor: pointer; }
/* PAC */
.pacgrids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .pacgrids { grid-template-columns: minmax(0, 1fr); } }
.pacgrid svg { width: 100%; height: auto; display: block; }
.pacgrid .cap { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.pacrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 860px) { .pacrow { grid-template-columns: minmax(0, 1fr); } }
.cell { cursor: pointer; }
.foot { font-size: 12.5px; color: var(--ink-3); }
.foot code { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
dl.meth { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 12.5px; margin: 8px 0 0; }
dl.meth dt { font-weight: 600; }
dl.meth dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.loading { padding: 40px 0; color: var(--ink-2); }
/* a heading (or label) with its ? beside it */
.hrow { display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; min-width: 0; }
.hrow > h2, .hrow > h3, .hrow > h4 { margin: 0; }
div.hrow:has(> h2) { margin: 0 0 8px; }
div.hrow:has(> h3) { margin: 12px 0 6px; }
.ctl > .lab.hrow { display: flex; }
.guide-link a { color: var(--ink-2); }
/* the ? and its popover (js/monolith_help.js) */
.qmark, .seg button.qmark { flex: none; width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink-3); font: 600 11px/16px var(--sans); text-align: center; cursor: pointer; box-shadow: none; }
.qmark:hover, .seg button.qmark:hover { color: var(--ink); border-color: var(--ink-3); }
.mchip { display: inline-flex; align-items: center; gap: 1px; min-width: 0; }
.qpop { position: fixed; z-index: 40; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: 0 10px 36px rgba(0,0,0,.22); padding: 10px 14px 12px; overflow: auto; font-size: 13.5px; }
.qpop-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.qpop-h b { font-size: 15px; overflow-wrap: anywhere; }
.qpop-x { font: inherit; border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 0 2px; font-size: 15px; }
.qblock p { margin: 0 0 7px; overflow-wrap: anywhere; }
.qblock b { color: var(--ink); }
.qplain { color: var(--ink); }
.qlook, .qtraps { color: var(--ink-2); }
.qhere { background: color-mix(in srgb, var(--focus) 12%, transparent); border-left: 3px solid var(--focus); padding: 5px 8px; border-radius: 4px; }
.qsteps { margin: 0 0 8px; padding-left: 20px; color: var(--ink); }
.qsteps li { margin: 0 0 5px; overflow-wrap: anywhere; }
.qexample { background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: 6px; padding: 6px 8px; }
.qfigs:empty { display: none; }
.qfigs { margin: 8px 0; }
.qdemo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .qdemo { grid-template-columns: minmax(0, 1fr); } }
.qcase { border: 1px solid var(--line); border-radius: var(--r); padding: 7px 8px; background: var(--surface-2); min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.qcase.strong { border-color: color-mix(in srgb, var(--up) 45%, var(--line)); }
.qcase-h { font-weight: 600; font-size: 12.5px; overflow-wrap: anywhere; }
.qcase-say { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.qsay { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.qcite { font-size: 11.5px; color: var(--ink-3); margin: 6px 0; overflow-wrap: anywhere; }
.qguide { font-size: 12.5px; color: var(--ink-2); }
svg.mfig { display: block; width: 100%; height: auto; }
/* broadband */
.chip.bb { background: var(--up-soft); color: var(--up); }
.bbnote { font-size: 12.5px; color: var(--up); margin: 6px 0 0; }
/* the ghost's numbers, under the circuit */
.gstats { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 4px; }
.gstats svg.mfig { margin: 4px 0 6px; }
.gstats circle[data-i] { cursor: pointer; }
/* one cue pair, down to its traces */
.leafpanel { position: fixed; inset: 12px; z-index: 30; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: var(--r); box-shadow: 0 14px 48px rgba(0,0,0,.28); display: flex; flex-direction: column; overflow: hidden; }
@media (max-width: 640px) { .leafpanel { inset: 0; border-radius: 0; } }
.leafbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 14px;
  border-bottom: 1px solid var(--line); background: var(--surface-2); }
.leafbar h2 { font-size: 15px; }
.leafctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lbtn { font: inherit; font-size: 13px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 3px 10px; cursor: pointer; }
.lbtn:disabled { opacity: .45; cursor: default; }
.leafbody { flex: 1; overflow: auto; padding: 8px 14px 30px; }
.lsec { margin: 0 0 14px; min-width: 0; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.lcard { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--surface-2); min-width: 0; }
.lcard.sel { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.lcard h4 { font-size: 13px; margin: 0 0 2px; overflow-wrap: anywhere; }
.lval { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 6px; overflow-wrap: anywhere; }
/* the two tabs, and the walk-through */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-2); margin: 6px 0 14px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 14px; border: 1px solid transparent; border-bottom: 0; background: none; color: var(--ink-2);
  padding: 7px 14px; border-radius: 8px 8px 0 0; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; border-color: var(--line-2); }
.avgpick { margin: 0 0 12px; gap: 8px; }
.avgpick select { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); color: var(--ink); }
ol.avgflow { list-style: none; margin: 0; padding: 0; }
.avgstep { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px 14px; }
.avgstep h3 { margin: 0 0 4px; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); }
.avgstep p { max-width: 95ch; color: var(--ink-2); overflow-wrap: anywhere; }
.avgn { width: 28px; height: 28px; border-radius: 50%; background: var(--chip); color: var(--ink); font-weight: 700; display: grid; place-items: center; }
.avgop { text-align: center; color: var(--ink-3); font-size: 12.5px; padding: 6px 0; }
.avgop.avg { color: var(--ink); font-weight: 700; }
.avgop.avg span { background: color-mix(in srgb, var(--focus) 18%, transparent); padding: 3px 10px; border-radius: 12px; }
.splitsay { background: color-mix(in srgb, var(--focus) 12%, transparent); border-left: 3px solid var(--focus); padding: 4px 8px; border-radius: 4px; }
/* the frequency slider's two knobs */
.dual { position: relative; height: 24px; }
.dual-track { position: absolute; left: 8px; right: 8px; top: 10px; height: 4px; border-radius: 2px; background: var(--line-2); }
.dual-fill { position: absolute; top: 10px; height: 4px; border-radius: 2px; background: var(--ink); min-width: 0; }
.dual input.knob { position: absolute; left: 0; top: 3px; width: 100%; height: 18px; margin: 0; background: transparent;
  pointer-events: none; -webkit-appearance: none; appearance: none; accent-color: var(--ink); z-index: 2; }
.dual input.knob::-webkit-slider-runnable-track { background: transparent; height: 18px; }
.dual input.knob::-moz-range-track { background: transparent; }
.dual input.knob::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 16px; height: 16px; margin-top: 1px;
  border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); cursor: grab; }
.dual input.knob::-moz-range-thumb { pointer-events: auto; width: 13px; height: 13px; border-radius: 50%; background: var(--surface);
  border: 2px solid var(--ink); cursor: grab; }
.dual input.knob:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--focus); outline-offset: 2px; }
.rangerule { margin-top: 4px; }
/* the filter on the points of interest */
.fwrap { margin: 0 0 8px; border: 1px solid var(--line); border-radius: var(--r); padding: 4px 8px; background: var(--surface-2); }
.fwrap > summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); padding: 3px 0; overflow-wrap: anywhere; }
.fpanel { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: 8px 10px; margin: 6px 0; }
.fctl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fctl .lab { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.fctl select, .fctl input[type="number"] { font: inherit; font-size: 12.5px; padding: 3px 4px; border: 1px solid var(--line-2); border-radius: 6px;
  background: var(--surface); color: var(--ink); min-width: 0; max-width: 100%; }
.frange { display: flex; align-items: center; gap: 4px; }
.frange input { width: 4.2em; }
.fchecks { display: flex; flex-direction: column; gap: 1px; color: var(--ink-2); }
/* the wires left out of a window, in the cue-pair view */
.xwire { border-top: 1px dashed var(--line-2); padding: 6px 0 2px; }
.xwire .chip.xwhy { margin-left: 0; background: var(--up-soft); color: var(--up); }
/* what was lost */
.dbars { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 6px; }
.drow { display: grid; grid-template-columns: 140px minmax(0, 520px) auto; gap: 10px; align-items: center; }
@media (max-width: 640px) { .drow { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.dlab { color: var(--ink-2); }
.dmaps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; margin: 6px 0; }
svg.dmap rect[data-region] { cursor: default; }
.dtwrap { overflow-x: auto; margin-top: 8px; }
.dtable { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.dtable th, .dtable td { text-align: left; vertical-align: top; padding: 5px 8px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.dtable thead th { color: var(--ink-3); font-weight: 600; border-top: 0; }
.dtable tbody th { white-space: nowrap; }
.dtable tr.dtot td, .dtable tr.dtot th { font-weight: 600; border-top: 2px solid var(--line-2); }
/* the page's head: the title, and the button that starts the tour */
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; }
.pagehead h1 { flex: 1 1 320px; min-width: 0; }
.tourbtn { flex: none; font: inherit; font-size: 13.5px; font-weight: 600; border: 1px solid var(--focus); background: var(--surface);
  color: var(--ink); border-radius: var(--r); padding: 6px 14px; cursor: pointer; }
.tourbtn:hover { background: color-mix(in srgb, var(--focus) 14%, var(--surface)); }
/* ==========================================================================
   The guided tour (js/tour.js, the engine Jarvis's tours use; the Monolith's
   steps are js/monolith_tour.js). Copied from the "Guided tours" block and
   .tour-cursor in web/app.css, with Jarvis's tokens mapped onto this page's,
   inside the tour only.
   ========================================================================== */
.tour, .tour-cursor {
  --accent: var(--focus); --accent-soft: color-mix(in srgb, var(--focus) 26%, transparent);
  --accent-line: color-mix(in srgb, var(--focus) 55%, transparent); --on-accent: #1b1400;
  --bg-2: var(--surface); --bg-3: var(--chip); --text: var(--ink); --text-2: var(--ink-2); --text-3: var(--ink-3);
  --line-soft: var(--line); --warn: var(--up); --warn-soft: var(--up-soft);

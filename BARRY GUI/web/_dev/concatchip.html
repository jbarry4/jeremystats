<!doctype html>
<meta charset="utf-8">
<title>concatchip — the gap chip on the session cards</title>
<style>
 body { background:#111; color:#ddd; font:12px/1.6 Consolas,monospace;
        margin:0; padding:10px; }
 iframe { width:1500px; height:950px; border:1px solid #333; background:#fff; }
 .ok::before { content:'ok    '; color:#7c7; }
 .bad::before { content:'FAIL  '; color:#ff8a7a; }
 .bad { color:#ffb0a5; } .note { color:#89a; }
 div { white-space:pre-wrap; }
</style>
<p class="note">A 121.9 ms timing error is worth knowing about before you open
a recording, not only when you go looking for it. The chip is drawn from the
kept health log, so it costs nothing per card — and says nothing at all about
a recording nobody has checked, which is not the same as saying it is clean.</p>
<div id="out"></div>
<iframe id="A" src="/"></iframe>
<script>
let bad = 0;
const out = document.getElementById('out');
const say = (c, t) => { const d = document.createElement('div');
                        d.className = c; d.textContent = t;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const ck = (n, c, d) => say(c ? 'ok' : 'bad', n + (c ? '' : '   [' + d + ']'));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 40000) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    let v = null;
    try { v = fn(); } catch (e) { v = null; }
    if (v) return v;
    await sleep(150);
  }
  return null;
}
const A = document.getElementById('A');
const W = () => A.contentWindow;
const D = () => A.contentDocument;
const ev = (src) => W().eval(src);
const get = async (u) => (await fetch(u)).json();

(async () => { try {
  await until(() => ev('!!(typeof BARRY !== "undefined" && BARRY.views'
                       + ' && BARRY.views.sessions)'));

  const sum = await get('/api/health/summary');
  const withGaps = Object.values(sum.sessions || {})
    .filter((r) => r.concat_issue);
  if (!withGaps.length) {
    say('note', 'no recording here is on record as having gaps, so there is '
              + 'nothing for the chip to mark');
    say('note', 'ran 0 checks');
    document.title = 'DONE ok=0 fail=0';
    return;
  }
  say('note', '  ' + withGaps.length + ' recording(s) on record with gaps, '
            + withGaps.filter((r) => r.patched).length + ' corrected');

  /* The list has to be loaded and the summary read before any chip can be
     drawn; the view does both when it is shown. */
  ev("setView('sessions')");
  await until(() => D().querySelectorAll('.sess-card, .session-card').length,
              40000);
  const chips = await until(
    () => { const n = D().querySelectorAll('.flagchip.concat');
            return n.length ? n : null; }, 40000);

  ck('the cards carry a gap chip', !!chips && chips.length > 0,
     chips ? chips.length : 0);
  if (!chips) throw new Error('no chip to check');

  say('note', '  ' + chips.length + ' chip(s) on screen');
  /* A chip for every one that is ON SCREEN. The log covers the whole
     archive; the list is whatever the current filter and scan show, so it
     can hold fewer. What must not happen is a chip for a recording the log
     says is clean, or a gappy one on screen without one. */
  ck('  never more chips than recordings on record',
     chips.length <= withGaps.length,
     chips.length + ' chips vs ' + withGaps.length + ' recordings');
  ck('  and at least one, so the chip is reachable',
     chips.length > 0, chips.length);

  /* It has to say something, and the something has to be the segment
     count -- a red mark that does not say what is wrong is decoration. */
  const texts = Array.from(chips).map((c) => (c.textContent || '').trim());
  ck('  each says how many segments',
     texts.every((t) => /^\d+ seg$/.test(t)), texts.join(' | '));
  ck('  and carries the reason in its title',
     Array.from(chips).every(
       (c) => /ms early/.test(c.getAttribute('title') || '')),
     (chips[0].getAttribute('title') || '').slice(0, 80));

  /* Corrected and uncorrected look different, because they mean different
     things: the recording still has gaps either way, and whether anything
     was done about it is the part that changes. */
  const fixed = Array.from(chips).filter(
    (c) => c.classList.contains('fixed'));
  ck('  corrected ones are marked apart',
     fixed.length === withGaps.filter((r) => r.patched).length,
     fixed.length + ' marked vs '
     + withGaps.filter((r) => r.patched).length + ' corrected');

  /* And it opens the gap table, because a warning you cannot act on is
     just a red mark. */
  chips[0].click();
  const modal = await until(
    () => D().querySelector('.continuity-modal'), 40000);
  ck('clicking it opens the gap table', !!modal, 'no modal');
  if (modal) {
    ck('  with the bar on it',
       !!modal.querySelector('.gap-track'), 'no bar');
    ck('  and the gap rows',
       modal.querySelectorAll('.gap-table tbody tr').length > 0,
       modal.querySelectorAll('.gap-table tbody tr').length);
    const close = Array.from(modal.querySelectorAll('.mf .btn'))
      .find((b) => /^Close$/.test(b.textContent.trim()));
    if (close) close.click();
  }

} catch (e) {
  say('bad', 'threw: ' + (e && e.message ? e.message : e));
}
  say('note', 'done');
  document.title = 'DONE ok=' + (out.querySelectorAll('.ok').length)
                 + ' fail=' + bad;
})();
</script>

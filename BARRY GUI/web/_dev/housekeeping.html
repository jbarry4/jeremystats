<!doctype html>
<html><head><meta charset="utf-8"><title>housekeeping: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:660px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}.hd{color:#ffb81c}
iframe{position:fixed;left:660px;top:0;right:0;bottom:0;width:calc(100vw - 660px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n);
  L.scrollTop = L.scrollHeight; };
const check = (w, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + w + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 12000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(90);
  }
  return false;
}
const post = (u, b) => fetch(u, { method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(b) }).then((r) => r.json());

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 30000);
  const W = frame.contentWindow, D = () => frame.contentDocument;
  const $ = (s) => D().querySelector(s);
  const $$ = (s) => Array.from(D().querySelectorAll(s));

  /* Leave no trace from a previous run: a fake path left behind by a crash
     makes the "only one path" check pass or fail depending on history, which
     is the least useful kind of test. */
  const wipe = async () => {
    const r = await (await fetch('/api/registry')).json();
    for (const p of (r.tree || [])) {
      for (const m of p.mice) {
        for (const sn of m.sessions) {
          for (const path of (sn.paths || [])) {
            if (/harness/i.test(path)) {
              await post('/api/registry/' + sn.gid + '/patch',
                         { forget_path: path });
            }
          }
        }
      }
    }
  };
  await wipe();

  say('=== every recording has a permanent id ===', 'hd');
  const reg = await (await fetch('/api/registry?backfill=1')).json();
  check('the registry reads back', reg.ok === true);
  const rows = (reg.tree || []).flatMap(
    (p) => p.mice.flatMap((m) => m.sessions));
  check('it knows about some recordings', rows.length > 0, rows.length + '');
  check('every one has a gid', rows.every((s) => !!s.gid),
        rows.filter((s) => !s.gid).length + ' without');
  check('the gids are unique',
        new Set(rows.map((s) => s.gid)).size === rows.length);
  check('projects were guessed', (reg.projects || []).length > 0,
        JSON.stringify(reg.projects));
  check('KCNT1 and PTEN are the known ones',
        JSON.stringify(reg.known_projects) === '["KCNT1","PTEN"]',
        JSON.stringify(reg.known_projects));
  say('  ' + rows.map((s) => s.gid + ' ' + (s.label || s.key)).join('\n  '),
      'note');

  /* The id must not move when the derived key is recomputed -- that is the
     whole point of it. */
  const before = rows.map((s) => s.gid).sort().join();
  await (await fetch('/api/registry?backfill=1')).json();
  const again = ((await (await fetch('/api/registry')).json()).tree || [])
    .flatMap((p) => p.mice.flatMap((m) => m.sessions));
  check('the gids survive a second pass',
        again.map((s) => s.gid).sort().join() === before);

  say('');
  say('=== the view ===', 'hd');
  ev("setView('sessions')");
  await sleep(600);
  check('Sessions has a mode switch', !!$('#sessModeSeg'),
        $('#sessModeSeg') ? $('#sessModeSeg').textContent : 'missing');
  const hkBtn = $$('#sessModeSeg button').find(
    (b) => b.dataset.mode === 'housekeeping');
  check('one of them is the registry', !!hkBtn);
  hkBtn.click();
  await until(() => $('#hkBody .hk-tree'), 12000);
  await sleep(700);
  check('the tree renders', !!$('#hkBody .hk-tree'));
  check('the scan panel is put away',
        $('#sessScanPad').classList.contains('hidden'));

  const projects = $$('.hk-project strong').map((n) => n.textContent);
  say('  projects shown: ' + projects.join(', '), 'note');
  check('projects are branches',
        projects.length === (reg.tree || []).length,
        projects.length + ' vs ' + (reg.tree || []).length);
  check('mice are branches under them', $$('.hk-mouse').length > 0,
        $$('.hk-mouse').length + '');
  check('sessions are rows under those', $$('.hk-row').length > 0,
        $$('.hk-row').length + '');
  check('each row shows its permanent id',
        $$('.hk-row .hk-gid').length === $$('.hk-row').length);
  check('and whether this machine can reach it',
        $$('.hk-row .hk-dot').length === $$('.hk-row').length);

  say('');
  say('=== one recording, in full ===', 'hd');
  $$('.hk-row')[0].click();
  await sleep(600);
  const det = $('#hkDetail');
  check('picking a row opens the detail', !!det.querySelector('.hk-dhead'));
  check('it shows the permanent id big', !!det.querySelector('.hk-gid.big'),
        (det.querySelector('.hk-gid.big') || {}).textContent);
  const facts = $$('#hkDetail .hk-fact .k').map((n) => n.textContent);
  check('it shows the derived key beside it',
        facts.includes('Derived key'), facts.join(', '));
  check('it lists every path it has been seen at',
        $$('#hkDetail .hk-path').length > 0,
        $$('#hkDetail .hk-path').length + ' paths');
  check('and marks the ones reachable here',
        $$('#hkDetail .hk-path.here').length > 0);
  check('it offers a project picker', !!det.querySelector('.hk-proj select'));
  check('and links to what is attached', $$('#hkDetail .hk-link').length >= 5,
        $$('#hkDetail .hk-link').map((b) => b.textContent).join(' | '));

  say('');
  say('=== manual organisation ===', 'hd');
  const gid = det.querySelector('.hk-gid.big').textContent;
  const sel = det.querySelector('.hk-proj select');
  const was = sel.value;
  say('  ' + gid + ' is in ' + was, 'note');

  const other = Array.from(sel.options).map((o) => o.value)
    .find((v) => v !== was) || 'Unfiled';
  sel.value = other;
  sel.dispatchEvent(new W.Event('change', { bubbles: true }));
  await sleep(1600);
  const after = await (await fetch('/api/registry/' + gid)).json();
  check('changing the project sticks',
        after.session.project === other, was + ' -> ' + after.session.project);
  check('and it is recorded as a manual choice',
        after.session.project_source === 'manual',
        after.session.project_source);
  // Put it back.
  await post('/api/registry/' + gid + '/patch', { project: was });

  const noteRes = await post('/api/registry/' + gid + '/patch',
                             { note: 'harness note' });
  check('a note can be attached', noteRes.ok === true, noteRes.error || '');
  await post('/api/registry/' + gid + '/patch', { note: '' });

  say('');
  say('=== edge cases are refused sensibly ===', 'hd');
  const badGid = await post('/api/registry/nosuch/patch', { note: 'x' });
  check('an unknown id is a 404, not a crash', badGid.ok === false,
        badGid.error);
  const selfMerge = await post('/api/registry/merge',
                               { keep: gid, drop: gid });
  check('a record cannot be merged into itself', selfMerge.ok === false,
        selfMerge.error);
  /* Two things must be refused, and they are different refusals.

     Splitting a real path off a real record used to CORRUPT it: the path
     re-identifies to the same key, so the "new" record matched the old one
     and overwrote it, permanent id and all. So check that first, and check
     it against a path that is genuinely part of the recording. */
  const sameRec = await post('/api/registry/split',
    { gid, path: after.session.paths[0] });
  check('splitting a recording from itself is refused',
        sameRec.ok === false && /same recording/.test(sameRec.error || ''),
        sameRec.error);
  const stillThere = await (await fetch('/api/registry/' + gid)).json();
  check('...and the record survives being asked', stillThere.ok === true,
        stillThere.error);
  check('...with its permanent id intact',
        (stillThere.session || {}).gid === gid);

  // And a record that really does know only one path has nothing to split.
  const single = (after.session.paths || []).length === 1;
  if (single) {
    const lonely = await post('/api/registry/split',
      { gid, path: after.session.paths[0] });
    check('splitting off the only path is refused',
          lonely.ok === false, lonely.error);
  } else {
    say('  (this record knows ' + after.session.paths.length + ' paths, so '
        + 'the one-path case is checked on the fake path below)', 'note');
  }

  say('');
  say('=== merge and split, for real ===', 'hd');
  // Give the record a second, fake path, then split it back off.
  // The server runs the path through abspath, so compare against what it
  // stored rather than against what was sent.
  await post('/api/registry/' + gid + '/patch',
             { add_path: 'Z:/harness/split-me' });
  const withTwo = await (await fetch('/api/registry/' + gid)).json();
  const fake = ((withTwo.session || {}).paths || []).find(
    (x) => /harness/.test(x));
  check('a path can be added by hand', !!fake,
        JSON.stringify((withTwo.session || {}).paths));
  const sp = await post('/api/registry/split', { gid, path: fake });
  check('and split off into its own record', sp.ok === true, sp.error || '');
  check('the original keeps its own permanent id',
        ((await (await fetch('/api/registry/' + gid)).json())
          .session || {}).gid === gid);
  const newGid = ((sp.session) || {}).gid;
  check('the new record has its own id', !!newGid && newGid !== gid, newGid);
  if (newGid) {
    const mg = await post('/api/registry/merge',
                          { keep: gid, drop: newGid });
    check('and can be merged back', mg.ok === true, mg.error || '');
    const back = await (await fetch('/api/registry/' + gid)).json();
    check('the path comes home',
          (back.session.paths || []).includes(fake));
    check('the merge is recorded on the survivor',
          (back.session.merged_in || []).includes(newGid),
          JSON.stringify(back.session.merged_in));
    // Clean up: the path, and the record the split created. A merged record
    // stays as a pointer by design, which is right for real work and means
    // a harness has to take its own away or it leaves one behind per run.
    await post('/api/registry/' + gid + '/patch', { forget_path: fake });
    await post('/api/registry/' + newGid + '/forget', {});
  }

  say('');
  say('=== back to the scan view ===', 'hd');
  $$('#sessModeSeg button').find((b) => b.dataset.mode === 'scan').click();
  await sleep(600);
  check('the scan panel comes back',
        !$('#sessScanPad').classList.contains('hidden'));
  check('and the registry is put away',
        $('#hkBody').classList.contains('hidden'));

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'housekeeping: ' + fails + ' FAILED'
                         : 'housekeeping: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'housekeeping CRASH'; });
</script></body></html>

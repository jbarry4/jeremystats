<!doctype html>
<html><head><meta charset="utf-8"><title>vaccmode: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:680px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:680px;top:0;width:calc(100vw - 680px);height:50vh;border:0}
iframe#two{top:50vh}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe><iframe id="two"></iframe>
<script>
/* The switch: does it stick, and does it stick to the right thing?

   VACC Mode is remembered exactly the way the theme is, and the theme's
   arrangement is not obvious -- two layers, because they answer two
   different questions. localStorage answers "what should the very first
   paint look like", before anything has been fetched and therefore before
   the machine is even known. The prefs map keyed by hostname answers "what
   does THIS computer prefer", which is the one that survives a browser
   reset and the one that must not overwrite a colleague's.

   And `?vacc=` must win over both while being written to neither. It is how
   a pop-out inherits the window it came from; a link is not a preference,
   and a harness that opens one must not silently change the machine's
   settings by doing so. */
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 8000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(40);
  }
  return false;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 25000);
  const root = () => frame.contentDocument.documentElement;
  const tok = (n) => getComputedStyle(root()).getPropertyValue(n).trim();
  const host = ev('JSON.stringify(((BARRY.state.catalog||{}).system||{}).hostname)');

  const wasOn = ev('BARRY.state.vacc') === true;
  say('=== the switch ===');
  say('    this machine is ' + host + ', mode currently '
      + (wasOn ? 'ON' : 'off'), 'note');

  ev('applyVacc(true)');
  await sleep(120);
  check('state records it', ev('BARRY.state.vacc') === true);
  check('the root attribute is set', root().dataset.vacc === 'on',
        String(root().dataset.vacc));
  check('the tokens actually moved', tok('--fire') === '1', tok('--fire'));
  check('localStorage remembers it',
        ev("localStorage.getItem('barry.vacc')") === '1',
        String(ev("localStorage.getItem('barry.vacc')")));
  check('the prefs map is keyed by hostname, not a bare boolean',
        ev('typeof (BARRY.prefs.get("vacc", {}) || {})') === 'object'
        && ev('JSON.stringify(BARRY.prefs.get("vacc", {}))') !== 'true',
        ev('JSON.stringify(BARRY.prefs.get("vacc", {}))'));
  check('and this machine is the key that changed',
        ev('JSON.stringify(BARRY.prefs.get("vacc", {}))').indexOf(
          JSON.parse(host)) >= 0,
        ev('JSON.stringify(BARRY.prefs.get("vacc", {}))'));

  const chip = frame.contentDocument.querySelector('#vaccToggle');
  check('there is a chip in the rail foot', !!chip);
  check('the chip reads as lit while the mode is on',
        !!chip && chip.classList.contains('on'),
        chip ? chip.className : 'no chip');

  ev('applyVacc(false)');
  await sleep(120);
  check('off again clears the attribute', !root().dataset.vacc);
  check('off again rests the tokens', tok('--fire') === '0', tok('--fire'));
  check('the chip goes dark with it',
        !!chip && !chip.classList.contains('on'));
  check('localStorage records the off state too',
        !ev("localStorage.getItem('barry.vacc')"),
        String(ev("localStorage.getItem('barry.vacc')")));

  /* ---- the two attributes are genuinely independent ---- */
  say('');
  say('=== changing theme never disturbs the mode ===');
  ev('applyVacc(true)');
  const themes = ev('THEMES').map((t) => t.id);
  let lost = [];
  for (const id of themes) {
    ev("applyTheme('" + id + "', false)");
    await sleep(60);
    if (root().dataset.vacc !== 'on') lost.push(id);
  }
  check('survives all ten themes', lost.length === 0, lost.join(' '));
  check('and the theme still applied', root().dataset.theme === themes[themes.length - 1],
        String(root().dataset.theme));
  ev("applyTheme(themeForThisMachine() || 'dark', false)");
  ev('applyVacc(false)');
  await sleep(80);

  /* ---- first paint, and the URL ---- */
  say('');
  say('=== ?vacc=on is applied before anything is fetched ===');
  const before = ev("localStorage.getItem('barry.vacc')");
  const two = document.getElementById('two');
  two.src = '/?vacc=on';
  await new Promise((r) => two.addEventListener('load', r, { once: true }));
  const ev2 = (c) => two.contentWindow.eval(c);
  // Catch it in the window between the attribute landing and the catalog
  // arriving. That window is the whole point: a mode applied after the fetch
  // is a mode the user watches switch on.
  let sawEarly = false;
  const t0 = Date.now();
  while (Date.now() - t0 < 20000) {
    let attr = null, cat = 'pending';
    try {
      attr = two.contentDocument.documentElement.dataset.vacc;
      cat = ev2('BARRY.state.catalog');
    } catch (e) { /* still booting */ }
    if (attr === 'on') { sawEarly = !cat; break; }
    await sleep(8);
  }
  check('the attribute is on before the catalog arrives', sawEarly,
        sawEarly ? '' : 'catalog beat the attribute, or it never applied');
  await until(() => ev2('typeof BARRY') === 'object' && ev2('BARRY.state.catalog'), 25000);
  check('the pop-out is in the mode it was sent in',
        two.contentDocument.documentElement.dataset.vacc === 'on');
  check('a ?vacc= link does not rewrite the machine preference',
        ev("localStorage.getItem('barry.vacc')") === before,
        before + ' -> ' + ev("localStorage.getItem('barry.vacc')"));

  /* ---- a solo window is one thing on a screen ---- */
  say('');
  say('=== a single-purpose window stays plain ===');
  two.src = '/?role=comod&vacc=on#comod';
  await new Promise((r) => two.addEventListener('load', r, { once: true }));
  await until(() => two.contentWindow.eval('typeof BARRY') === 'object', 25000);
  await sleep(500);
  const body2 = two.contentDocument.body;
  check('it is marked as a solo window',
        body2.classList.contains('solo-window'), body2.className);
  /* Measured on what is actually on screen. The rail is
     `display: none !important` in a solo window, and getComputedStyle on a
     display:none element reports border width inconsistently -- 1px in one
     run and 0px in the next, which is how this check first failed in the
     full suite having passed on its own. Asking a hidden element what it
     looks like is not a question with an answer. */
  const head2 = two.contentDocument.querySelector('.view.active .view-head')
             || two.contentDocument.querySelector('.view-head');
  check('the rail is not shown at all here',
        getComputedStyle(two.contentDocument.querySelector('#rail')).display
          === 'none');
  if (head2) {
    const cs = getComputedStyle(head2);
    check('the header keeps its ordinary hairline',
          parseFloat(cs.borderBottomWidth) < 2, cs.borderBottomWidth);
  } else {
    check('the header keeps its ordinary hairline', true, 'no header here');
  }
  const btn2 = two.contentDocument.querySelector('.btn');
  if (btn2) {
    check('and buttons are not ringed',
          getComputedStyle(btn2).boxShadow === 'none',
          getComputedStyle(btn2).boxShadow);
  } else {
    check('and buttons are not ringed', true, 'no button here');
  }

  // Put the machine back exactly as it was found.
  ev('applyVacc(' + (wasOn ? 'true' : 'false') + ')');
  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'vaccmode: ' + fails + ' FAILED' : 'vaccmode: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'vaccmode CRASH'; });
</script></body></html>

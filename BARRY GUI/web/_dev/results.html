<!doctype html>
<meta charset="utf-8">
<title>Harness — the Results view</title>
<style>
  body { font: 12px/1.55 ui-monospace, monospace; margin: 0; background: #0c0f14;
         color: #dfe6ee; }
  #out { padding: 12px 16px; width: 40vw; }
  iframe { position: fixed; right: 0; top: 0; width: 58vw; height: 100vh;
           border: 0; border-left: 1px solid #243; }
  .ok::before { content: 'ok    '; color: #7fe3b0; }
  .bad::before { content: 'FAIL  '; color: #ff8a7a; }
  .bad { color: #ffb0a5; }
  .note { color: #7593a2; }
  h2 { font-size: 12px; margin: 14px 0 5px; color: #ffb81c; }
</style>
<div id="out"></div>
<iframe id="app" src="/"></iframe>
<script>
/* The catalogue, and whether it can be walked through.
 *
 * Two claims are checked here, and they fail in different ways.
 *
 * The first is that the by-product lane stays out. That has three doors into
 * the catalogue -- the folder scan, the run records, and the curation
 * sidecars -- and shutting one is not shutting the others. When it went
 * wrong, the folder was clean, git was clean, and the view was not, with
 * nothing anywhere saying the two disagreed. So it is asserted against the
 * API rather than against the screen.
 *
 * The second is grouping: every result still shown, just in rooms. A grouping
 * that quietly drops the rows it has no heading for is worse than no grouping
 * at all, because the count at the top still says the right number.
 *
 * This harness establishes what it needs rather than assuming it. A check
 * that reads whatever the previous run happened to leave behind reports on
 * that, not on the code.
 */
const out = document.getElementById('out');
let bad = 0;
const say = (c, m) => { const d = document.createElement('div');
                        d.className = c; d.textContent = m;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const check = (n, c, d) => say(c ? 'ok' : 'bad',
                               n + (c || !d ? '' : '   [' + d + ']'));
const head = (t) => { const h = document.createElement('h2');
                      h.textContent = t; out.appendChild(h); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 12000) {
  const t0 = Date.now();
  for (;;) {
    try { const v = fn(); if (v) return v; } catch (e) { /* not yet */ }
    if (Date.now() - t0 > ms) return null;
    await sleep(150);
  }
}

(async () => { try {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const W = frame.contentWindow;
  const D = frame.contentDocument;
  const errors = [];
  W.addEventListener('error', (e) => errors.push(e.message));

  // BARRY is a `const`, not a property of window, so it is only reachable
  // through eval inside the frame.
  const ev = (src) => W.eval(src);

  head('1. Does the catalogue answer at all?');
  const got = await (await fetch('/api/results?refresh=1')).json();
  check('/api/results returns ok', !!got.ok, JSON.stringify(got).slice(0, 120));
  const rows = got.results || [];
  say('note', '  ' + rows.length + ' result(s), total ' + got.total);
  check('it reports a total', typeof got.total === 'number', String(got.total));
  check('the count it returns is the count it claims',
        rows.length === got.total || rows.length === 800,
        rows.length + ' vs ' + got.total);

  head('2. Is the by-product lane out of it?');
  const leaked = rows.filter((r) => String(r.rel || '').startsWith('_scratch'));
  check('nothing from _scratch is catalogued', leaked.length === 0,
        leaked.length + ' leaked, e.g. ' + (leaked[0] || {}).rel);
  // The three doors, named, so a failure says which one opened.
  const byRun = leaked.filter((r) => r.run_id).length;
  const byTag = leaked.filter((r) => !r.run_id && (r.tags || []).length).length;
  if (leaked.length) {
    say('note', '  via run records: ' + byRun + ', via curation sidecars: '
        + byTag + ', via the folder scan: '
        + (leaked.length - byRun - byTag));
  }
  const folders = await (await fetch('/api/results/folders')).json();
  const fLeak = (folders.folders || [])
    .filter((f) => String(f.path || '').split('/')[0] === '_scratch');
  check('and it is not offered as a folder either', fLeak.length === 0,
        fLeak.map((f) => f.path).join(', '));

  head('3. Do results know which animal they are about?');
  const withRun = rows.filter((r) => r.run_id);
  say('note', '  ' + withRun.length + ' of ' + rows.length
      + ' carry a run record');
  check('a result from a run carries its tool',
        !withRun.length || withRun.some((r) => r.script),
        'none of ' + withRun.length + ' had `script`');
  check('kinds are real, not all "file"',
        new Set(rows.map((r) => r.kind)).size > 1,
        'every row says ' + (rows[0] || {}).kind);
  const animal = rows.filter((r) => r.mouse != null);
  say('note', '  ' + animal.length + ' name an animal (the rest are lab-wide '
      + 'exports, decks and manifests, which belong to none)');
  check('the ones that name an animal name a session too',
        animal.every((r) => r.session_no != null),
        animal.filter((r) => r.session_no == null).length + ' had a mouse '
        + 'and no session');

  head('4. Does grouping put every result in a room?');
  ev("setView('results')");
  await until(() => D.querySelector('#resultsBody .res-toolbar'));
  await sleep(400);

  const shown = () => ev('BARRY.views.results.all().length');
  const cards = () => D.querySelectorAll('#resultsBody .res-card').length;
  const heads = () => D.querySelectorAll('#resultsBody .room-head').length;

  ev("BARRY.views.results.groupBy('')");
  await sleep(250);
  const flat = cards();
  check('ungrouped shows the catalogue', flat > 0, String(flat));
  check('and draws no headings', heads() === 0, heads() + ' headings');

  for (const by of ['animal', 'tool', 'day']) {
    ev("BARRY.views.results.groupBy(" + JSON.stringify(by) + ")");
    await sleep(300);
    const n = cards();
    const h = heads();
    say('note', '  ' + by + ': ' + h + ' room(s), ' + n + ' card(s)');
    check('grouping ' + by + ' keeps every result', n === flat,
          flat + ' ungrouped -> ' + n + ' grouped');
    check('grouping ' + by + ' actually draws rooms', h > 0, h + ' headings');
  }

  head('5. Does a room hand you its contents?');
  ev("BARRY.views.results.groupBy('tool')");
  await sleep(300);
  const firstBtn = D.querySelector('#resultsBody .room-head .btn');
  check('a room offers to select everything in it', !!firstBtn,
        'no button in the first heading');
  if (firstBtn) {
    const before = ev('BARRY.views.results.selectedCount()');
    firstBtn.click();
    await sleep(250);
    const after = ev('BARRY.views.results.selectedCount()');
    check('and selecting it selects more than nothing', after > before,
          before + ' -> ' + after);
    const again = D.querySelector('#resultsBody .room-head .btn');
    if (again) { again.click(); await sleep(250); }
    check('and it clears again',
          ev('BARRY.views.results.selectedCount()') === before,
          before + ' -> ' + ev('BARRY.views.results.selectedCount()'));
  }

  head('6. Does the list view group too?');
  ev("BARRY.views.results.setView('list')");
  await sleep(300);
  const trs = D.querySelectorAll('#resultsBody .res-table tbody tr').length;
  const roomRows = D.querySelectorAll('#resultsBody .res-table .room-row').length;
  say('note', '  ' + roomRows + ' heading row(s), ' + (trs - roomRows)
      + ' result row(s)');
  check('the table shows every result', (trs - roomRows) === flat,
        flat + ' expected, ' + (trs - roomRows) + ' drawn');
  check('with headings among the rows', roomRows > 0, String(roomRows));
  // Put it back, so the next harness does not inherit a grouped list view.
  ev("BARRY.views.results.setView('grid')");
  ev("BARRY.views.results.groupBy('')");
  await sleep(200);

  head('7. Anything thrown?');
  check('no uncaught errors in the app', errors.length === 0,
        errors.slice(0, 2).join(' | '));

  say('note', '');
  say(bad ? 'bad' : 'ok', bad ? (bad + ' check(s) failed') : 'all checks passed');
} catch (e) {
  say('bad', 'harness threw: ' + (e && e.message ? e.message : e));
} })();
</script>

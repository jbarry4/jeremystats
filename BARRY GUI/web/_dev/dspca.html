     (pngs || []).every((f) => f.png.length > 2000),
     JSON.stringify((pngs || []).map((f) => f.png.length)));

  /* And the dry run carries the whole question, which is what
     "reconstruct from the events bank" rests on. */
  const dryRep = await post('/api/dspca/commit',
    Object.assign(ev('BARRY.dspca._fitBody()'),
                  { entry_id: st().q.entry, dry_run: true }));
  ok('a dry run answers without writing', !!(dryRep && dryRep.ok) && dryRep.dry_run);
  ok('and reports every setting that changes a number',
     !!dryRep.params && dryRep.params.method != null
     && dryRep.params.min_sep != null && dryRep.params.gap_weight != null
     && dryRep.params.features != null && dryRep.params.rule != null,
     JSON.stringify(Object.keys(dryRep.params || {}).length) + ' keys');
  ok('the note names the method it used',
     typeof dryRep.note === 'string'
     && dryRep.note.indexOf(st().fit.method_name) >= 0,
     dryRep.note);

  /* ================================================================== */
  head('UNDER THE HOOD');

  /* THE PCA STORY, under a PCA method.

     Components, a mean to subtract, a scree and a score that is a sum
     over features are all things `delta` does not have: it is one number
     per event and k-means partitions that line. Asking for them there is
     asking the wrong question, and the panel is on delta by default now.
     The delta story is checked on its own below. */
  ev('BARRY.dspca._method("pca")');
  await until(() => st().fit && st().fit.ok && st().fit.method === 'pca',
              25000, 'a PCA fit to look inside');

  /* A panel that claims to show the arithmetic has to be CHECKED against
     the arithmetic, or it is one more picture to believe. Every number
     here is recomputed from the parts and compared with what the fit
     returned. */
  ev('BARRY.dspca._hood()');
  await until(() => !!ev('BARRY.dspca._hoodData()'), 30000, 'the working');
  const uh = ev('BARRY.dspca._hoodData()');
  ok('it answers for one event', !!(uh && uh.ok), JSON.stringify(uh || {}));
  ok('and it is the event the panel is on',
     uh.event === (st().picked == null ? (st().fit.events || [])[0].i
                                       : st().picked),
     uh.event + ' vs ' + st().picked);

  /* The shape, which everything below is an index into. */
  eq('the patch is contacts by samples',
     uh.n_features, uh.shape.contacts * uh.shape.samples);
  eq('and it matches the box the fit used',
     [uh.shape.contacts, uh.shape.samples],
     [st().fit.box.n_contacts, st().fit.box.n_samples]);
  ok('every feature maps back to a contact and a time',
     (uh.axis || []).length === uh.n_features
     && uh.axis.every((a) => a.csc != null && a.t_ms != null),
     (uh.axis || []).length + ' of ' + uh.n_features);
  ok('and the mapping is the flattening it says it is',
     uh.axis.every((a, i2) => a.f === i2
       && a.row === Math.floor(i2 / uh.shape.samples)
       && a.col === i2 % uh.shape.samples));

  /* THE SCORE, recomputed. This is the check the whole panel exists to
     make possible, so the harness makes it too: sum over features of
     (value - mean) x weight, against what the PCA transform returned. */
  const flat = [];
  for (const row of uh.norm) for (const v of row) flat.push(v);
  eq('the flattened patch is the feature vector', flat.length, uh.n_features);
  for (let c = 0; c < (uh.components || []).length; c++) {
    let acc = 0;
    for (let f = 0; f < uh.n_features; f++) {
      acc += (flat[f] - uh.mean_vec[f]) * uh.components[c][f];
    }
    ok('PC' + (c + 1) + ' is the sum of (value - mean) x weight',
       Math.abs(acc - uh.score[c]) < 1e-6,
       acc.toFixed(9) + ' vs ' + uh.score[c].toFixed(9));
    ok('and the panel says so itself',
       Math.abs(uh.score_recomputed[c] - uh.score[c]) < 1e-6,
       uh.score_recomputed[c] + ' vs ' + uh.score[c]);
  }

  /* The contributions it lists are the terms of that sum. */
  const t1 = (uh.top || {}).pc1 || [];
  ok('the terms it names are the biggest ones', t1.length > 0);
  ok('and each is value minus mean times weight',
     t1.every((r) => Math.abs((r.x - r.mean) * r.w - r.contrib) < 1e-9
                     && Math.abs(r.dev - (r.x - r.mean)) < 1e-9),
     JSON.stringify(t1[0] || {}));
  ok('listed largest first', t1.every((r, i2) =>
     i2 === 0 || Math.abs(t1[i2 - 1].contrib) >= Math.abs(r.contrib) - 1e-12));

  /* The cluster step, in the plane it actually happens in. */
  ok('k-means is reported as running on the PCA coordinates',
     /PCA coordinate/.test(String(uh.km.on)), String(uh.km.on));
  ok('there is a centre per cluster',
     (uh.km.centres || []).length === uh.k,
     (uh.km.centres || []).length + ' of ' + uh.k);
  const dd = uh.km.distances || [];
  ok('the distances are to those centres, from this score',
     dd.every((d, i2) => {
       const c = uh.km.centres[i2];
       const want = Math.hypot(uh.score[0] - c[0], uh.score[1] - c[1]);
       return Math.abs(d - want) < 1e-6;
     }), JSON.stringify(dd));
  ok('and the nearest is the one it was put in',
     dd.indexOf(Math.min.apply(null, dd)) === uh.km.label,
     uh.km.label + ' of ' + JSON.stringify(dd));

  /* The renaming, which is the step people assume away. */
  ok('the class number is the renumbered cluster, not the cluster',
     uh.km.to_type[String(uh.km.label)] === uh.type,
     'cluster ' + uh.km.label + ' -> DS' + uh.type
     + '  map ' + JSON.stringify(uh.km.to_type));
  eq('and it agrees with the fit', uh.type,
     (st().fit.events || []).find((e) => e.i === uh.event).type);

  /* What is computed and thrown away. */
  ok('the scree reaches past the two that are clustered on',
     (uh.scree || []).length >= Math.min(3, uh.n_events),
     (uh.scree || []).length + ' components');
  ok('and its first two agree with the fit that is on screen',
     Math.abs(uh.scree[0] - uh.explained[0]) < 1e-6,
     uh.scree[0] + ' vs ' + uh.explained[0]);

  /* On screen, and reachable -- the compare dialog taught this one. */
  ok('the working is on screen', !!D().querySelector('.dp-hood'));
  const hmb = D().querySelector('.dp-hood .mb');
  ok('in a body that scrolls', !!hmb
     && /auto|scroll/.test(String(ev('getComputedStyle(document'
        + '.querySelector(".dp-hood .mb")).overflowY'))));
  ok('with a stage per step of the pipeline',
     D().querySelectorAll('.dp-hood-stage').length >= 8,
     D().querySelectorAll('.dp-hood-stage').length + ' stages');
  ok('and the patch drawn as readable numbers',
     D().querySelectorAll('.dp-hood-grid .dp-hood-cell').length
       >= uh.n_features,
     D().querySelectorAll('.dp-hood-grid .dp-hood-cell').length
       + ' cells for ' + uh.n_features + ' features');
  /* Tracing a cell back is the point: each one names its feature index,
     its contact and its time. */
  const cell0 = D().querySelector('.dp-hood-grid .dp-hood-cell');
  ok('every cell says which feature it is',
     !!cell0 && /feature \d+/.test(cell0.getAttribute('title') || '')
     && /CSC\d+/.test(cell0.getAttribute('title') || ''),
     cell0 ? cell0.getAttribute('title') : '');

  /* NOTHING IS CRUSHED.

     Reported as "some things are cut off", and nothing was: `.mb` has a
     definite height, a flex column with a definite height shrinks its
     own children to fit, and every grid, both tables and the scree had
     collapsed to a two-pixel sliver with only the headings left. A check
     that the element EXISTS passes throughout that, which is why this
     measures instead. */
  const hoodTall = (sel, want) => {
    const n = D().querySelector(sel);
    ok('the ' + sel + ' has room to be read',
       !!n && n.getBoundingClientRect().height >= want,
       n ? n.getBoundingClientRect().height.toFixed(0) + 'px, wanted '
           + want : 'missing');
  };
  hoodTall('.dp-hood-grid', 40);
  hoodTall('.dp-hood-terms', 60);
  hoodTall('.dp-hood-scree', 80);
  /* And the body is what scrolls, rather than the stages being squeezed
     into it: content taller than the box, with a box that can scroll. */
  const hb = D().querySelector('.dp-hood .mb');
  ok('the working is taller than the window it is in, and scrolls',
     !!hb && hb.scrollHeight > hb.clientHeight,
     hb ? hb.scrollHeight + ' of ' + hb.clientHeight : 'no body');
  /* Every stage keeps a real height -- the sliver case, stated. */
  const stages = Array.from(D().querySelectorAll('.dp-hood-stage'));
  ok('no stage is collapsed to a sliver',
     stages.length >= 8 && stages.every(
       (n) => n.getBoundingClientRect().height > 20),
     JSON.stringify(stages.map(
       (n) => Math.round(n.getBoundingClientRect().height))));

  ev('closeModal()');

  } catch (err) {
    /* A throw used to end the suite in silence.

       Everything after it simply did not run, and what the runner printed
       was a smaller number of passing checks and no failures -- which
       reads as a shorter suite rather than a broken one. That is the same
       fault the runner's own notes describe for a harness that reports
       zero checks, and it hid a real breakage for a whole run. */
    fail++;
    say('  FAIL the suite threw and stopped here', 'bad');
    say('       ' + (err && err.message ? err.message : String(err)), 'bad');
    for (const ln of String((err && err.stack) || '').split(NL).slice(0, 5)) {
      say('       ' + ln, 'dim');
    }
  }
  say('');
  say('  ' + pass + ' ok, ' + fail + ' fail', fail ? 'bad' : 'ok');
  document.title = 'dspca: ' + pass + ' ok, ' + fail + ' fail';
})();
</script></body></html>

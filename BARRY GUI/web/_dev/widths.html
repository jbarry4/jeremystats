<!doctype html>
<meta charset="utf-8">
<title>Harness — widths</title>
<style>
  body { font: 13px/1.5 ui-monospace, monospace; margin: 0; background: #111;
         color: #ddd; }
  #out { padding: 14px 18px; width: 40vw; }
  iframe { position: fixed; right: 0; top: 0; width: 58vw; height: 100vh;
           border: 0; border-left: 1px solid #333; }
  .bad { color: #f99; }
  .ok { color: #8c8; }
</style>
<div id="out"></div>
<iframe id="app" src="/"></iframe>
<script>
/* Two harnesses report a section that scrolls sideways, with client widths of
   0 and 80 -- numbers too small to be a real layout. Before believing them,
   measure the same elements here, at a known window size, after layout has
   settled. A zero client width means the thing was never laid out, which is a
   fact about the measurement rather than about the CSS. */
const out = document.getElementById('out');
const p = (t, c) => { const d = document.createElement('div');
                      d.textContent = t; if (c) d.className = c;
                      out.appendChild(d); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

(async () => {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = f.contentWindow; const D = f.contentDocument;
  await sleep(2500);

  const report = (sel) => {
    const n = D.querySelector(sel);
    if (!n) { p(sel + ': not in the page', 'bad'); return; }
    const cs = W.getComputedStyle(n);
    const vis = cs.display !== 'none' && cs.visibility !== 'hidden';
    p(sel.padEnd(26) + ' scroll=' + n.scrollWidth
      + '  client=' + n.clientWidth
      + '  offset=' + n.offsetWidth
      + '  display=' + cs.display
      + (vis ? '' : '   [HIDDEN]'),
      n.clientWidth && n.scrollWidth > n.clientWidth + 1 ? 'bad' : 'ok');
  };

  p('--- every view section, as the page sits ---');
  ['#view-toolkit', '#view-sessions', '#view-results', '#view-xplore']
    .forEach(report);

  p('');
  p('--- toolkit, actually shown ---');
  W.eval("setView('toolkit')");
  await sleep(900);
  report('#view-toolkit');

  p('');
  p('--- and the body itself ---');
  const b = D.body;
  p('body'.padEnd(26) + ' scroll=' + b.scrollWidth
    + '  client=' + D.documentElement.clientWidth,
    b.scrollWidth > D.documentElement.clientWidth + 1 ? 'bad' : 'ok');
  document.title = 'widths: done';
})();
</script>

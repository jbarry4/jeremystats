     (ev(RC + '._savedOnly()') || {}).read_on === 'Elsewhere'
     && geom().space.pts.length === sFit.events.length);
  ok('it says so, and offers to read the set here',
     /Elsewhere/.test(D().querySelector('.rc-why .rc-saved-only').textContent)
     && !!D().querySelector('.rc-why .rc-read-here'));
  ok('Bank and Save are off: there is no read here to bank or refit from',
     D().querySelector('.rc-why .rc-bank').disabled && sSave().disabled);
  eq('its settings came back into the controls', Number(st().q.k), 2);
  const sKb3 = Array.from(D().querySelectorAll('.rc-kseg button'))
    .find((b) => b.textContent.trim() === '3');
  if (sKb3) sKb3.click();
  await sleep(300);
  eq('and cannot be changed here', Number(st().q.k), 2);
  ev(RC + '._pick(' + sFit.events[0].i + ')');
  await until(() => st().evData && st().evData.ok === false, 5000, 'the event');
  ok('a dot says its traces are where its read is',
     /saved numbers/.test(st().evData.error)
     && /Elsewhere/.test(st().evData.error), st().evData.error);

  /* And one whose read is here: refitted, with its settings. */
  ev('window.__rsOpen = ' + JSON.stringify({ ok: true, version: 2,
    nickname: 'three clusters', single: sSingle, here: true,
    payload: { params: sParams(3), read: sRead, read_on: 'Bluebarry',
               from_version: sFrom },
    fit: sFit }));
  await ev(RC + '._openVersion("harness-single", 2)');
  await until(() => !st().fitting && st().fit && st().fit.k === 3
                    && !ev(RC + '._savedOnly()'), 20000, 'the refit');
  ok('a version whose read is here is refitted from it, with its settings',
     st().fit.ok && Number(st().q.k) === 3 && ev(RC + '._viewing()').v === 2
     && ev(RC + '._dirty()') === false);
  ev('(function(){ var W = window; if (W.__rsFetch) { W.fetch = W.__rsFetch;'
     + ' delete W.__rsFetch; } })()');

  /* ================================================================== */
  head('ARE THESE CLUSTERS DIFFERENT? (THE TESTS INTERCEPTED; NOTHING IS SAVED)');

  await until(() => st().fit && st().fit.ok && !st().fitting, 30000, 'a fit');
  const kBtn6 = (k) => Array.from(D().querySelectorAll('.rc-kseg button'))
    .find((b) => b.textContent.trim() === String(k));
  const stGo = () => D().querySelector('.rc-why .rc-stats-go');
  if (st().fit.k !== 3) {
    kBtn6(3).click();
    await until(() => !st().fitting && st().fit.k === 3, 20000, 'k = 3');
  }
  ok('at k = 3 the question is not offered: the tests run at k = 2, and '
     + 'the clusters’ row has no room for a control that is off', !stGo());
  kBtn6(2).click();
  await until(() => !st().fitting && st().fit.k === 2, 20000, 'k = 2');
  ok('at k = 2 it can be asked, and nothing has been asked yet',
     !!stGo() && !stGo().disabled
     && stGo().textContent === 'Test the split' && !st().fit.stats
     && /Are these clusters statistically different\?/.test(stGo().title),
     stGo() && stGo().textContent);
  ok('beside the clusters it asks about, on their row',
     stGo().parentElement.classList.contains('rc-clusters')
     && Math.abs(stGo().getBoundingClientRect().top
                 - D().querySelector('.rc-why .rc-clu').getBoundingClientRect()
                   .top) < 4, stGo().getBoundingClientRect().top);
  const v1opt = Array.from(D().querySelectorAll('.rc-why .rc-ver-pick option'))
    .find((o2) => /^v1 · /.test(o2.textContent));
  ok('a version’s hover says whether its clusters were tested',
     !!v1opt && /Are the clusters different\? not tested/.test(v1opt.title),
     v1opt && v1opt.title);
  const stReply = { ok: true, level: 'single', n: 120, n_used: 120,
    subsampled: false, recommended: 'sigclust', verdict: 'could be forced',
    stats_key: 'harness', tests: {
      sigclust: { p: 0.62, n_sim: 200, genuine: false, say: 'p = 0.620: one '
        + 'Gaussian cloud split in two does as well -- the split could be forced' },
      dip: { dip: 0.02, p: 0.71, genuine: false,
             say: 'dip 0.0200, p = 0.710: one hump along the DS→IED line' },
      stability: { ari_mean: 0.95, genuine: true, say: 'adjusted Rand 0.95 over '
        + '50 resamples; 2% of events change cluster in more than 1 in 10' },
      gmm: { delta: 30.1, agree: 0.2, genuine: false,
             say: 'ΔBIC = +30.1: two Gaussians, barely the DS / IED split' } } };
  ev('window.__stReply = ' + JSON.stringify(stReply));
  ev('(function(){ var W = window; if (W.__stFetch) return; W.__stFetch = W.fetch;'
     + ' W.__stSent = []; W.__stFail = null; W.fetch = function(u, o) {'
     + ' var s = String(u);'
     + ' if (s.indexOf("/api/rootcanal/stats") >= 0 && s.indexOf("/about") < 0) {'
     + '   var b = JSON.parse((o && o.body) || "{}"); W.__stSent.push(b);'
     + '   if (W.__stFail) return Promise.resolve(new Response(JSON.stringify('
     + '     { ok: false, error: W.__stFail }), { status: 400,'
     + '     headers: { "Content-Type": "application/json" } }));'
     + '   var t = {}; (b.tests || []).forEach(function(k) {'
     + '     if (W.__stReply.tests[k]) t[k] = W.__stReply.tests[k]; });'
     + '   return Promise.resolve(new Response(JSON.stringify(Object.assign({},'
     + '     W.__stReply, { tests: t })), { status: 200,'
     + '     headers: { "Content-Type": "application/json" } })); }'
     + ' return W.__stFetch.apply(this, arguments); }; })()');
  const stSent = () => JSON.parse(ev('JSON.stringify(window.__stSent)'));

  stGo().click();
  await until(() => D().querySelectorAll('#bigModal:not(.hidden) .rc-stats-pick')
    .length === 4, 8000, 'the four tests');
  const picks6 = Array.from(D().querySelectorAll('#bigModal .rc-stats-pick'));
  eq('all four tests are offered, every one ticked', picks6.map((p6) =>
    p6.querySelector('strong').textContent
    + (p6.querySelector('input').checked ? ' ✓' : '')),
     ['SigClust ✓', 'Dip test ✓', 'Stability ✓', 'GMM ΔBIC + agreement ✓']);
  eq('SigClust is marked recommended, and only it',
     picks6.map((p6) => /recommended/.test(p6.textContent)),
     [true, false, false, false]);
  ok('each one’s hover says what it asks, its pro and its con',
     picks6.every((p6) => /asks: .+\nPro: .+\nCon: .+/.test(p6.title)),
     picks6[0].title);
  ok('the dialog says why a t-test between the two clusters is not offered',
     /t-test/.test(D().querySelector('#bigModal .rc-stats-dlg').textContent));
  picks6[1].querySelector('input').click();
  D().querySelector('#bigModal .rc-stats-run').click();
  await until(() => stSent().length
    && D().querySelector('#bigModal:not(.hidden) .rc-stats-tab'), 8000, 'the answer');
  const stB = stSent()[0];
  ok('it asks of Single’s own picture at k = 2, for the tests ticked',
     stB.level === 'single' && stB.entry_id === ENTRY && stB.read === st().q.read
     && Number(stB.k) === 2
     && JSON.stringify(stB.tests) === JSON.stringify(['sigclust', 'stability', 'gmm']),
     JSON.stringify(stB).slice(0, 240));
  const vrd = D().querySelector('#bigModal .rc-stats-verdict');
  ok('the answer leads with the recommended test’s verdict',
     /^Could be forced\. SigClust, recommended: p = 0\.620/.test(vrd.textContent)
     && vrd.classList.contains('warn'), vrd.textContent);
  const trs6 = Array.from(D().querySelectorAll('#bigModal .rc-stats-tab tbody tr'));
  eq('then each test asked: its answer, and how it reads', trs6.map((tr) =>
    tr.querySelector('th span').textContent + ': '
    + tr.querySelector('td:last-child').textContent),
     ['SigClust: could be forced', 'Stability: genuine',
      'GMM ΔBIC + agreement: could be forced']);
  ok('each row’s hover has its pros and cons',
     trs6.every((tr) => /Pro: .+\nCon: /.test(tr.title)));
  ok('and it says how many read the split as genuine, on how many events',
     /1 of 3 tests read the split as genuine, on 120 complete events of this single recording/
       .test(D().querySelector('#bigModal .rc-stats-dlg').textContent));
  D().querySelector('#bigModal .rc-stats-close').click();
  await until(() => D().querySelector('.rc-why .rc-stats-done'), 5000,
              'the verdict on the picture');
  const done6 = D().querySelector('.rc-why .rc-stats-done');
  ok('the answer is then on the picture, with every test in its hover',
     done6.textContent === 'maybe forced' && done6.classList.contains('warn')
     && /SigClust: p = 0\.620/.test(done6.title)
     && /Stability: adjusted Rand 0\.95/.test(done6.title), done6.title);
  ok('kept on the fit itself', (st().fit.stats || {}).verdict === 'could be forced');
  done6.click();
  await until(() => D().querySelector('#bigModal:not(.hidden) .rc-stats-tab'),
              5000, 'the table again');
  ok('pressed, it shows the answer again without asking again',
     stSent().length === 1);
  D().querySelector('#bigModal .rc-stats-again').click();
  await until(() => D().querySelector('#bigModal:not(.hidden) .rc-stats-pick'),
              5000, 'the tests again');
  eq('“Run other tests” goes back to the four, as they were ticked',
     Array.from(D().querySelectorAll('#bigModal .rc-stats-pick input'))
       .map((i6) => i6.checked), [true, false, true, true]);
  ev('window.__stFail = "harness: refused"');
  D().querySelector('#bigModal .rc-stats-run').click();
  await until(() => stSent().length === 2
    && D().querySelector('#bigModal:not(.hidden) .rc-stats-pick')
    && !D().querySelector('.rc-why .rc-stats-busy'), 8000, 'the refusal');
  ok('refused, the four are offered again, and the picture keeps its answer',
     (st().fit.stats || {}).verdict === 'could be forced'
     && /maybe forced/.test(stGo().textContent));
  ev('window.__stFail = null');
  ev('closeModal()');
  kBtn6(3).click();
  await until(() => !st().fitting && st().fit.k === 3, 20000, 'k = 3');
  kBtn6(2).click();
  await until(() => !st().fitting && st().fit.k === 2, 20000, 'k = 2');
  ok('refitted, the picture carries only what the server kept for it -- '
     + 'nothing, as that answer was the harness’s',
     !st().fit.stats && stGo().textContent === 'Test the split');
  ev('(function(){ var W = window; if (W.__stFetch) { W.fetch = W.__stFetch;'
     + ' delete W.__stFetch; } })()');

  /* ================================================================== */
  head('A BORDER IN SINGLE (ITS CLASSES ADDED TO THE SERVER’S ANSWER)');

  await until(() => st().fit && st().fit.ok && !st().fitting, 30000, 'a fit');
  ok('folded, the card says margins and borders on one line',
     D().querySelector('.rc-why .rc-margin-sum').textContent
       === 'Margins and borders · none applied'
     && !D().querySelector('.rc-why .rc-margins').open);
  /* A border the server does not have is refused, said, and taken off. */
  ev(RC + '._setBorder({ artifact_id: "harness-nope", version: null, grace: null })');
  /* The refusal refits without it, a debounce later: wait for that
     picture, which is the one that says so. */
  await until(() => !st().fitting && ev(RC + '._borderErr()')
    && D().querySelector('.rc-why .rc-border-err'), 20000, 'the refusal');
  ok('a border the server refuses is said, taken off, and the set fitted '
     + 'without it', /^The border harness-nope is not on this machine/
       .test(ev(RC + '._borderErr()')) && !st().q.border && st().fit.ok
     && /Not applied: The border harness-nope/.test(
       (D().querySelector('.rc-why .rc-border-err') || {}).textContent || ''),
     ev(RC + '._borderErr()'));
  /* Applied: the real fit, with a border's classes put on it here. */
  ev('(function(){ var W = window; if (W.__bdFetch) return; W.__bdFetch = W.fetch;'
     + ' W.fetch = function(u, o) { var s = String(u);'
     + ' if (s.indexOf("/api/rootcanal/fit") < 0 || !o || !o.body)'
     + '   return W.__bdFetch.apply(this, arguments);'
     + ' var b = JSON.parse(o.body); if (!b.border) return W.__bdFetch.apply(this, arguments);'
     + ' var b2 = Object.assign({}, b, { border: null });'
     + ' return W.__bdFetch(u, Object.assign({}, o, { body: JSON.stringify(b2) }))'
     + '  .then(function(r) { return r.json(); }).then(function(j) {'
     + '   var n = { ds: 0, ied: 0, amb: 0, none: 0 };'
     + '   (j.events || []).forEach(function(e, k) { e.border = ["ds", "ied", "amb"][k % 3];'
     + '     n[e.border] += 1; });'
     + '   j.border_used = { artifact_id: "hb-s", version: 1, nickname: "single border",'
     + '     grace: 0.05, grace_words: "5%", rule: "Solid IED: harness. Solid DS: harness.",'
     + '     counts: n, wrong: 0, switch_rate: null, n_identity: 0 };'
     + '   return new Response(JSON.stringify(j), { status: 200,'
     + '     headers: { "Content-Type": "application/json" } }); }); }; })()');
  ev(RC + '._setBorder({ artifact_id: "hb-s", version: null, grace: 0.05 })');
  await until(() => !st().fitting && st().fit.border_used, 20000, 'the border on');
  ok('the request carries the border', (ev(RC + '._lastBody()').border || {})
     .artifact_id === 'hb-s');
  ok('the call shown is the border’s: the seg says so and the legend has '
     + 'ambiguous', Array.from(D().querySelectorAll('.rc-why .rc-colour-by button'))
       .some((b) => b.textContent === 'by border')
     && /solid DS\s*solid IED\s*ambiguous/.test(D().querySelector('.rc-legend')
       .textContent));
  const sFills = new Set(geom().space.pts.filter((p) => !p.hollow)
                         .map((p) => p.fill));
  eq('three colours on the picture, one per class', sFills.size, 3);
  ok('the card opens with the border’s counts',
     D().querySelector('.rc-why .rc-margins').open
     && /solid DS · \d+ solid IED · \d+ ambiguous/.test(
       D().querySelector('.rc-why .rc-border-on').textContent));
  ev(RC + '._setBorder(null)');
  await until(() => !st().fitting && !st().fit.border_used, 20000, 'the border off');
  ok('taken off, the call is k-means’ again',
     Array.from(D().querySelectorAll('.rc-why .rc-colour-by button'))
       .some((b) => b.textContent === 'by call'));
  ev('(function(){ var W = window; if (W.__bdFetch) { W.fetch = W.__bdFetch;'
     + ' delete W.__bdFetch; } })()');

  } catch (err) {
    /* A throw used to end a suite in silence: fewer passing checks and no
       failures reads as a shorter suite rather than a broken one. */
    fail++;
    say('  FAIL the suite threw and stopped here', 'bad');
    say('       ' + (err && err.message ? err.message : String(err)), 'bad');
    for (const ln of String((err && err.stack) || '').split(NL).slice(0, 5)) {
      say('       ' + ln, 'dim');
    }
  } finally {
    /* Put back what the suite changed in the panel. Nothing here was ever
       written anywhere else. */
    try {
      if (ev) {
        ev('(function(){ var W = window; if (W.__stFetch) { W.fetch = W.__stFetch;'
           + ' delete W.__stFetch; } })()');
        ev('(function(){ var W = window; if (W.__bdFetch) { W.fetch = W.__bdFetch;'
           + ' delete W.__bdFetch; } })()');
        ev('BARRY.rootcanal._setBorder(null)');
        ev('try { closeModal(); } catch (e) {}');
        ev('(function(){ var W = window; if (W.__rcFetch) { W.fetch = W.__rcFetch;'
           + ' delete W.__rcFetch; } if (W.__rcLog) { BARRY.activity.log ='
           + ' W.__rcLog; delete W.__rcLog; } })()');
        ev('BARRY.rootcanal._closeXplore()');
        if (typeof viewWas !== 'undefined') {
          ev('(function(v){ try { if (v == null) localStorage.removeItem('
             + '"barry.rootcanal.view"); else localStorage.setItem('
             + '"barry.rootcanal.view", v); } catch (e) {} })('
             + JSON.stringify(viewWas) + ')');
        }
        ev('BARRY.rootcanal._clearFlips()');
        ev('BARRY.rootcanal._resetCentres()');
        ev('(function(){ var C = window.CanvasRenderingContext2D.prototype;'
           + ' if (C.__rcOrig) { C.fillText = C.__rcOrig; delete C.__rcOrig; }'
           + ' })()');
      }
    } catch (e) { /* the frame may be gone */ }
  }
  say('');
  say('  ' + pass + ' ok, ' + fail + ' fail', fail ? 'bad' : 'ok');
  document.title = 'rootcanal: ' + pass + ' ok, ' + fail + ' fail';
  /* Unloaded, or headless Edge never dumps and the runner says TIMED OUT. */
  try { document.getElementById('app').src = 'about:blank'; } catch (e) { /* ok */ }
})();
</script></body></html>

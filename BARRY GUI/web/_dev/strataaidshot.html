<!doctype html>
<meta charset="utf-8"><title>strata aid shot</title>
<style>html,body{margin:0;height:100%;background:#000}
#app{position:fixed;left:0;top:0;width:30vw;height:100vh;border:0}
#aid{position:fixed;right:0;top:0;width:70vw;height:100vh;border:0}</style>
<iframe id="app" src="/?linkhold=0"></iframe><iframe id="aid"></iframe>
<script>
/* StrataScope's aid window with a step open, for a screenshot: the app on
   the left opens the steps on a recording and opens the step, which
   publishes it; the aid page on the right follows. Writes nothing.
   ?gid=&path=&step=1 -- the demo by default. */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  const Q = new URLSearchParams(location.search);
  const gid = Q.get('gid') || 'demo-ds-tutorial';
  const path = Q.get('path') || 'demo:ds-tutorial';
  const step = Q.get('step') || '1';
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = f.contentWindow;
  for (let i = 0; i < 300 && typeof W.setView !== 'function'; i++) await sleep(100);
  await sleep(800);
  W.eval("setView('xplore')");
  await W.eval('BARRY.views.xplore.open(' + JSON.stringify(path) + ')');
  await sleep(1500);
  W.open = () => null;          // the app's own aid window: not here
  await W.eval('BARRY.strata.enter(' + JSON.stringify(gid) + ')');
  for (let i = 0; i < 400; i++) {
    const s = W.eval('BARRY.strataSteps._state()');
    if (s && s.sug) break;
    await sleep(100);
  }
  document.getElementById('aid').src = '/strata-aids.html?poll=short&gid='
    + encodeURIComponent(gid) + '&path=' + encodeURIComponent(path);
  await sleep(1500);
  await W.eval('BARRY.strataSteps._openStep(' + JSON.stringify(step) + ')');
  await sleep(6000);
  document.title = 'shot ready';
})();
</script>

<!doctype html>
<html><head><meta charset="utf-8"><title>vaccupprog: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:700px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:700px;top:0;right:0;bottom:0;width:calc(100vw - 700px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
/* Upload progress, where the upload was started from.

   The toast said "Progress is in the VACC panel" and that panel opens from
   the command palette and nowhere else -- so somebody told to go and look
   had been sent to a room with no door. The upload is started from
   Sessions, with the recordings picked there, so that is where the progress
   belongs.

   Two things this page is really about:

     ONE RENDERER. The status panel and the Sessions pad both draw
     `BARRY.vacc.uploadsBox()`. A second copy of the wording is a second
     copy to keep in step, and the two would drift on the first change.

     IT MOVES. `pollUploads` updated its map every three seconds and redrew
     nothing, so even the panel showed whatever was true when it opened. A
     progress display that does not progress is worse than none, because it
     is read as "stuck".

   The upload itself needs a cluster and real bytes, so the renderer is
   driven with a synthetic job snapshot -- the same shape `/api/cfc/job/<id>`
   returns. What is under test is the display and the plumbing, not the
   transfer. */
const L = document.getElementById('log');
let fails = 0, checks = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { checks++; if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 20000)) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    await sleep(70);
  }
  return null;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  const $$ = (s) => Array.from(D().querySelectorAll(s));
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'),
              25000);

  say('=== the pieces are there ===');
  check('the module can draw uploads',
        ev('typeof BARRY.vacc.uploadsBox') === 'function');
  check('and can be handed a job snapshot',
        ev('typeof BARRY.vacc.feed') === 'function');
  check('and can be told when they change',
        ev('typeof BARRY.vacc.onUploads') === 'function');
  check('with nothing uploading, it draws nothing',
        ev('BARRY.vacc.uploadsBox()') === null,
        String(ev('BARRY.vacc.nUploads')) + ' uploads');

  say('');
  say('=== the Sessions pad shows them ===');
  ev("setView('sessions')");
  await until(() => D().querySelector('#sessModeSeg'), 30000);
  const vaccBtn = $$('#sessModeSeg button').find((b) => b.dataset.mode === 'vacc');
  check('there is a cluster pad to show them in', !!vaccBtn,
        vaccBtn ? (vaccBtn.hidden ? 'hidden' : 'shown') : 'no button');
  if (!vaccBtn || vaccBtn.hidden) {
    say('no cluster configured here, so there is no pad to draw into', 'note');
    say('');
    say('ran ' + checks + ' checks');
    document.title = fails ? 'vaccupprog: ' + fails + ' FAILED'
                           : 'vaccupprog: passed';
    return;
  }
  ev("BARRY.views.sessions.setMode('vacc')");
  await until(() => D().querySelector('#vaccBody .vacc-seg'), 30000);
  check('the pad is open', !!D().querySelector('#vaccBody .vacc-seg'));
  check('and shows no Uploads section while nothing is uploading',
        !D().querySelector('#vaccBody .vacc-uploads'));

  say('');
  say('=== a running upload appears, without reopening anything ===');
  /* The same shape `/api/cfc/job/<id>` returns for an upload: a job with a
     member per recording. `track` is what the real upload calls. */
  const job = {
    id: 'harness_upload_1', status: 'running',
    members: [
      { id: 'a', label: 'KCNT1 m11 s6 2022-08-03', status: 'running',
        done: 12, of: 47, step: 'sending' },
      { id: 'b', label: 'KCNT1 m12 s1 2022-08-05', status: 'running',
        done: 0, of: 64, step: 'sending' },
    ],
  };
  ev('BARRY.vacc.feed(' + JSON.stringify(job) + ')');
  const box = await until(
    () => D().querySelector('#vaccBody .vacc-uploads'), 6000);
  /* Appeared on its own. Nothing here reopened the pad -- the watcher did
     it, which is the whole point. */
  check('the Uploads section appears by itself', !!box);
  if (box) {
    const txt = box.textContent;
    say('    ' + txt.replace(/\s+/g, ' ').trim().slice(0, 130), 'note');
    check('it names each recording rather than the job',
          txt.indexOf('KCNT1 m11 s6') >= 0 && txt.indexOf('KCNT1 m12 s1') >= 0,
          txt.slice(0, 70));
    /* "file 13 of 47" rather than a percentage: a count says what is
       happening and how much is left, and survives a file that is much
       bigger than the others. */
    check('and says which file it is on, out of how many',
          /file 13 of 47/.test(txt), txt.replace(/\s+/g, ' ').slice(0, 90));
    check('one row per recording, not per job',
          box.querySelectorAll('.vacc-row').length === 2,
          box.querySelectorAll('.vacc-row').length + ' rows');
  }

  say('');
  say('=== and it moves ===');
  /* The failure this is really about: the map was updated every three
     seconds and nothing redrew, so the panel showed whatever was true when
     it opened. A progress display that does not progress reads as stuck. */
  const first = D().querySelector('#vaccBody .vacc-uploads').textContent;
  const job2 = JSON.parse(JSON.stringify(job));
  job2.members[0].done = 46;
  job2.members[1].done = 31;
  ev('BARRY.vacc.feed(' + JSON.stringify(job2) + ')');
  await until(() => {
    const n = D().querySelector('#vaccBody .vacc-uploads');
    return n && n.textContent !== first;
  }, 6000);
  const second = (D().querySelector('#vaccBody .vacc-uploads') || {}).textContent;
  check('the rows update without anything being reopened',
        second !== first, (second || '').replace(/\s+/g, ' ').slice(0, 90));
  check('and show the new position',
        /file 47 of 47/.test(second || ''), 'expected file 47 of 47');

  say('');
  say('=== a failure says why, on the row it belongs to ===');
  const job3 = JSON.parse(JSON.stringify(job2));
  job3.members[1].status = 'failed';
  job3.members[1].error = 'no space left on device';
  ev('BARRY.vacc.feed(' + JSON.stringify(job3) + ')');
  await until(() => /no space left/.test(
    (D().querySelector('#vaccBody .vacc-uploads') || {}).textContent || ''), 6000);
  const third = (D().querySelector('#vaccBody .vacc-uploads') || {}).textContent;
  check('the reason is on the failed recording', /no space left/.test(third || ''),
        (third || '').replace(/\s+/g, ' ').slice(0, 100));
  /* The other recording is unaffected, which is the point of a member per
     recording rather than one status for the lot. */
  check('and the other one is untouched',
        /file 47 of 47/.test(third || ''));

  say('');
  say('=== one renderer, not two copies of the wording ===');
  /* The status panel and this pad must say the same thing. Built fresh per
     call, so both can hold one at once. */
  const a = ev('(BARRY.vacc.uploadsBox() || {}).textContent');
  const inPad = (D().querySelector('#vaccBody .vacc-uploads') || {}).textContent;
  check('the panel and the pad draw the same words',
        (a || '').replace(/\s+/g, ' ') === (inPad || '').replace(/\s+/g, ' '),
        (a || '').replace(/\s+/g, ' ').slice(0, 60));
  check('and each call builds its own node, so both can be on screen',
        ev('BARRY.vacc.uploadsBox() !== BARRY.vacc.uploadsBox()'));

  say('');
  say('=== subscribing does not stack ===');
  /* A watcher added per repaint would grow by one every three seconds, and
     each one repaints. The pad subscribes once. */
  const before = ev('BARRY.vacc.nUploads');
  ev('BARRY.views.sessions.setMode("vacc")');
  await sleep(300);
  ev('BARRY.views.sessions.setMode("vacc")');
  await sleep(300);
  const boxes = D().querySelectorAll('#vaccBody .vacc-uploads').length;
  check('repainting leaves exactly one Uploads section', boxes === 1,
        boxes + ' sections');
  check('and the tracked uploads are unchanged',
        ev('BARRY.vacc.nUploads') === before,
        ev('BARRY.vacc.nUploads') + ' vs ' + before);

  say('');
  say('ran ' + checks + ' checks');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'vaccupprog: ' + fails + ' FAILED'
                         : 'vaccupprog: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'vaccupprog CRASH'; });
</script></body></html>

<!doctype html>
<meta charset="utf-8">
<title>Harness — every step says which step it is</title>
<style>
  body { font: 12px/1.55 ui-monospace, monospace; margin: 0; background: #0c0f14;
         color: #dfe6ee; }
  #out { padding: 12px 16px; width: 56vw; }
  iframe { position: fixed; right: 0; top: 0; width: 44vw; height: 100vh;
           border: 0; border-left: 1px solid #243; }
  .ok::before { content: 'ok    '; color: #7fe3b0; }
  .bad::before { content: 'FAIL  '; color: #ff8a7a; }
  .bad { color: #ffb0a5; }
  .note { color: #7593a2; }
  h2 { font-size: 12px; margin: 14px 0 5px; color: #ffb81c; }
</style>
<div id="out"></div>
<iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* A step's header must say the number its POSITION in the bundle says.

   The step number used to be typed into each tool by hand -- "step 4 of The
   Dentist" -- duplicating the order in ToolKit's BUNDLES. When Root Canal was
   inserted between Braces and X-ray, X-ray's header had to be edited from 4
   to 5 by hand. It was, that time. This page is what notices the time it is
   not: it opens every bundle step, reads the chip in its header, and compares
   it with where the step actually sits.

   It also reports a step with no header chip at all, which is how the steps
   still outside `stepHeader` stay visible until they are brought in.

   ToolKit renders twice, so every button is found again after each click and
   the header is read only once the panel has settled. */
const out = document.getElementById('out');
let bad = 0;
const say = (c, m) => { const d = document.createElement('div');
                        d.className = c; d.textContent = m;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const check = (n, c, d) => say(c ? 'ok' : 'bad',
                               n + (c || !d ? '' : '   [' + d + ']'));
const head = (t) => { const h = document.createElement('h2');
                      h.textContent = t; out.appendChild(h); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, tries = 200, gap = 100) {
  for (let i = 0; i < tries; i++) {
    try { const v = fn(); if (v) return v; } catch (e) { /* not yet */ }
    await sleep(gap);
  }
  return null;
}

(async () => { try {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = () => f.contentWindow;
  const D = () => f.contentDocument;
  const ready = await untilN(() => typeof W().setView === 'function');
  check('the application loads', !!ready, 'no setView after 20s');
  if (!ready) { document.title = 'FAIL'; return; }

  W().setView('toolkit');
  await untilN(() => D().querySelectorAll('.tk-bundle').length);
  await sleep(800);

  const bundles = W().eval('BARRY.views.toolkit.bundles()');
  check('ToolKit says what its bundles are', bundles && bundles.length,
        'bundles() returned nothing');
  check('BARRY.ui.stepOf exists', !!W().eval('BARRY.ui.stepOf'));

  /* Folded bundles hide their steps; open them all for the duration, and
     put the stored folds back afterwards. */
  let saved = null;
  try { saved = W().localStorage.getItem('barry.tkFolded'); } catch (e) {}
  try { W().localStorage.removeItem('barry.tkFolded'); } catch (e) {}
  W().setView('pipeline'); await sleep(300);
  W().setView('toolkit'); await sleep(900);

  try {
    for (const b of bundles) {
      head(b.name);
      for (let i = 0; i < b.steps.length; i++) {
        const s = b.steps[i];
        const want = 'step ' + (i + 1) + ' of ' + b.name;
        check(s.name + ': stepOf says "' + want + '"',
              W().eval('BARRY.ui.stepOf(' + JSON.stringify(s.id) + ')') === want,
              W().eval('BARRY.ui.stepOf(' + JSON.stringify(s.id) + ')'));
        if (s.soon) {
          say('note', '  ' + s.name + ' is not built yet; its header is not read');
          continue;
        }
        const btn = Array.from(D().querySelectorAll('.tk-step')).find(
          (x) => ((x.querySelector('strong') || {}).textContent || '').trim()
                   === s.name);
        if (!btn) { check(s.name + ' has a step button', false, 'not found'); continue; }
        btn.click();
        /* Settle: wait for a header chip, or give up after 6 s and report
           the step as having none. */
        const chip = await untilN(() => {
          const c = D().querySelector('#tkResult .step-head .step-n');
          return c && c.isConnected ? c : null;
        }, 60, 100);
        await sleep(300);
        const now = D().querySelector('#tkResult .step-head .step-n');
        if (!chip || !now) {
          check(s.name + ' has a step header', false,
                'no .step-head .step-n in its panel -- not yet on stepHeader');
          continue;
        }
        check(s.name + ' says "' + want + '"', now.textContent.trim() === want,
              'says "' + now.textContent.trim() + '"');
      }
    }
  } finally {
    try {
      if (saved === null) W().localStorage.removeItem('barry.tkFolded');
      else W().localStorage.setItem('barry.tkFolded', saved);
    } catch (e) { /* ignore */ }
  }

  head(bad === 0 ? 'every step says which step it is' : bad + ' failed');
  document.title = bad === 0 ? 'ok' : 'FAIL ' + bad;
} catch (e) {
  say('bad', 'harness threw: ' + e.message);
  document.title = 'FAIL';
} })();
</script>

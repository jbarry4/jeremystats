<!doctype html>
<html><head><meta charset="utf-8"><title>_catprobe: running</title>
<style>html,body{margin:0;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,monospace}
#log{position:fixed;left:0;top:0;width:760px;height:100vh;overflow:auto;
padding:8px;background:#06100c;white-space:pre-wrap;z-index:9}
iframe{position:fixed;left:760px;top:0;right:0;bottom:0;height:100vh;border:0}
</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
/* Why does the cluster catalogue show everything. Clicked the way a person
   clicks it, not driven through setMode. Prints; asserts nothing. */
const L = document.getElementById('log');
const say = (s) => { L.textContent += s + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 20000)) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    await sleep(80);
  }
  return null;
}
(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  const $$ = (s) => Array.from(D().querySelectorAll(s));
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'),
              25000);

  // Go to Sessions by clicking the rail, like a person.
  const nav = $$('#rail .nav-item').find((b) => /session/i.test(b.textContent));
  say('rail Sessions found : ' + !!nav);
  if (nav) nav.click();
  await until(() => D().querySelector('#sessModeSeg'), 30000);
  await sleep(800);

  const btn = $$('#sessModeSeg button').find((b) => b.dataset.mode === 'vacc');
  say('VACC mode button    : ' + !!btn + '  hidden=' + (btn && btn.hidden));
  if (!btn || btn.hidden) {
    say('the cluster mode is not offered, so nothing to measure');
    document.title = '_catprobe: done';
    return;
  }

  say('knows loaded before : ' + ev('!!(BARRY.vacc && BARRY.vacc.of({gid:"x"}) !== undefined)'));
  say('vacc.of on a real gid before the click: '
      + ev('JSON.stringify((BARRY.vacc||{}).of ? BARRY.vacc.of({gid:"zzz"}) : "no module")'));

  btn.click();
  await sleep(2500);
  say('');
  say('scope after click   : ' + ev('BARRY.views.housekeeping.scope'));
  say('#vaccCatalogue rows : ' + $$('#vaccCatalogue .hk-row').length);
  say('#hkBody rows        : ' + $$('#hkBody .hk-row').length);
  say('#vaccCatalogue exists: ' + !!D().querySelector('#vaccCatalogue'));
  say('#vaccBody hidden    : '
      + D().querySelector('#vaccBody').classList.contains('hidden'));
  say('#hkBody hidden      : '
      + D().querySelector('#hkBody').classList.contains('hidden'));

  // Is the knows map actually populated at this point?
  const kn = ev('(function(){ try { var n=0, m=0;'
    + ' var gids = Array.from(document.querySelectorAll("#vaccCatalogue .hk-gid"))'
    + '   .map(function(x){return x.textContent.trim();});'
    + ' gids.forEach(function(g){ var v = BARRY.vacc.of({gid:g});'
    + '   if (v) { m++; if (v.state==="native"||v.state==="staged") n++; } });'
    + ' return gids.length + " rows, " + m + " with an answer, " + n'
    + '   + " reachable"; } catch(e){ return "THREW "+e.message; } })()');
  say('what the rows are   : ' + kn);

  await sleep(3000);
  say('');
  say('after another 3s:');
  say('#vaccCatalogue rows : ' + $$('#vaccCatalogue .hk-row').length);
  say('scope               : ' + ev('BARRY.views.housekeeping.scope'));

  document.title = '_catprobe: done';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack);
                    document.title = '_catprobe: done'; });
</script></body></html>

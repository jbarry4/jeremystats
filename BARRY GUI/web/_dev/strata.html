<!doctype html>
<meta charset="utf-8">
<title>Harness — labelling layers</title>
<style>
 html,body{margin:0;font:12px/1.6 ui-monospace,monospace;background:#0c0f14;color:#dfe6ee}
 #out{padding:12px 16px;width:44vw;white-space:pre-wrap}
 iframe#app{position:fixed;right:0;top:0;width:56vw;height:100vh;border:0;border-left:1px solid #243}
</style>
<div id="out"></div><iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* Labelling a layer used to need the mouse to be right twice: land on a
   four-pixel row, then work a dropdown that covered the thing being
   labelled. Reported as "I can't click on individual channels to select
   anything", which is exactly what a four-pixel target feels like.

   Now click selects and a tag names, so precision is needed once. The checks
   below are about that split -- that selecting writes nothing, that naming
   writes everything selected, and that the keyboard reaches both.

   And the overlay: the four-way view is what people actually label against,
   because the CSD is where a boundary is visible, and it was the one view
   with no layers drawn on it at all.

   This writes to a real layer sheet, so it works on a scratch recording and
   puts back whatever it found. */
const out = document.getElementById('out');
const p = (m) => { out.textContent += m + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, t = 250, g = 100) {
  for (let i = 0; i < t; i++) {
    try { if (fn()) return i; } catch (e) { /* not yet */ }
    await sleep(g);
  }
  return -1;
}
let bad = 0;
const ck = (n, c, d) => {
  p((c ? 'ok    ' : 'FAIL  ') + n + (c || !d ? '' : '   [' + d + ']'));
  if (!c) bad++;
};
const hd = (t) => p('\n== ' + t + ' ==');

(async () => {
  const f = document.getElementById('app');
  let W = null, gid = null, before = null;
  const restore = async () => {
    if (!gid || before === null) return;
    try {
      // Clear first, then put back exactly what was there: /set merges, so
      // without the clear this would leave whatever the harness added.
      await W().fetch('/api/layers/' + encodeURIComponent(gid) + '/clear', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      if (before && Object.keys(before).length) {
        await W().fetch('/api/layers/' + encodeURIComponent(gid) + '/set', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ labels: before }),
        });
      }
    } catch (e) { /* best effort */ }
  };

  try {
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  W = () => f.contentWindow;
  const D = () => f.contentDocument;
  await untilN(() => typeof W().setView === 'function');
  await sleep(900);
  const run = (src) => W().eval(src);
  const val = (expr) => run('(' + expr + ')');
  const Q = new URLSearchParams(location.search);
  const sessPath = Q.get('session');
  if (!sessPath) { p('give ?session=<a CSC folder>'); document.title = 'no session'; return; }

  run("setView('xplore')");
  await run('BARRY.views.xplore.open(' + JSON.stringify(sessPath) + ')');
  await sleep(2200);
  gid = val('BARRY.views.xplore.state.sessions['
          + 'BARRY.views.xplore.state.order[0]].identity.gid');
  p('  recording: ' + gid);
  before = val('(function(){var s=BARRY.views.xplore.state.sessions['
             + 'BARRY.views.xplore.state.order[0]];'
             + 'return (s.strata && s.strata.labels) || null;})()');

  await run('BARRY.strata.enter(' + JSON.stringify(gid) + ')');
  await untilN(() => D().querySelectorAll('.strata-row').length, 100);
  await sleep(900);
  const rows = () => Array.from(D().querySelectorAll('.strata-row'));
  const picked = () => rows().filter((r) => r.classList.contains('picked'));
  const st = () => val('BARRY.strata.state') || {};

  hd('1. The rail is a column of channels, not of dropdowns');
  p('  ' + rows().length + ' row(s)');
  ck('every channel has a row', rows().length > 8, rows().length);
  ck('and none of them is a dropdown',
     D().querySelectorAll('.strata-row select').length === 0,
     D().querySelectorAll('.strata-row select').length + ' selects left');
  const h = rows()[0].getBoundingClientRect().height;
  p('  a row is ' + h.toFixed(1) + 'px tall');
  ck('a row is a plausible click target even when thin', h > 0);

  hd('2. Clicking selects, and writes nothing');
  const wrote = [];
  run('window.__w = [];'
    + '(function(){var f=window.fetch;window.fetch=function(u,o){'
    + ' if(o&&o.method==="POST"&&String(u).indexOf("/api/layers")>=0)'
    + '   window.__w.push(String(u));'
    + ' return f.apply(this,arguments);};})()');
  /* `new (W().MouseEvent)` and not `new W().MouseEvent` -- the latter
     parses as constructing W itself, which is a function returning the
     frame's window and is not a constructor. */
  const Mouse = W().MouseEvent, Keys = W().KeyboardEvent;
  rows()[5].dispatchEvent(new Mouse('mousedown', { bubbles: true }));
  await sleep(400);
  p('  selected: ' + picked().length
    + ', layer writes so far: ' + (val('window.__w') || []).length);
  ck('one channel is selected', picked().length === 1, picked().length);
  ck('and selecting wrote nothing',
     (val('window.__w') || []).length === 0,
     JSON.stringify(val('window.__w')));

  hd('3. Shift-click takes the range between');
  const ev = (i, opts) => rows()[i].dispatchEvent(
    new Mouse('mousedown', Object.assign({ bubbles: true }, opts)));
  ev(12, { shiftKey: true });
  await sleep(400);
  p('  selected: ' + picked().length);
  ck('the whole run is selected', picked().length === 8, picked().length);

  hd('4. A layer button names everything selected');
  const tags = () => Array.from(D().querySelectorAll('.strata-brush'))
    .filter((b) => !b.classList.contains('clearone'));
  p('  ' + tags().length + ' layer button(s)');
  ck('the bar offers the layers', tags().length > 5, tags().length);
  const mode = D().querySelector('.strata-mode');
  p('  the bar says: "' + ((mode || {}).textContent || '') + '"');
  ck('and says what they will do while a selection is up',
     !!mode && /selected/.test(mode.textContent || ''),
     (mode || {}).textContent);
  const wantName = tags()[1].textContent.replace(/^\d/, '').trim();
  tags()[1].click();
  await sleep(1200);
  const labels = () => (st().labels) || {};
  const nums = val('BARRY.strata.state.channels').slice(5, 13)
    .map((c) => String(c.number));
  const got = nums.map((n) => labels()[n]).filter(Boolean);
  p('  labelled ' + got.length + ' of ' + nums.length + ' -> '
    + JSON.stringify(Array.from(new Set(got))));
  ck('every selected channel took the layer', got.length === nums.length,
     got.length + '/' + nums.length);
  ck('and they all took the same one', new Set(got).size === 1,
     JSON.stringify(got));
  ck('the selection survives, so one wrong channel can be fixed',
     picked().length === 8, picked().length);

  hd('5. The number keys do the same thing');
  const key = (k, opts) => D().dispatchEvent(new Keys('keydown',
    Object.assign({ key: k, bubbles: true }, opts)));
  key('3');
  await sleep(1200);
  const after = nums.map((n) => labels()[n]).filter(Boolean);
  ck('pressing a number relabels the selection',
     new Set(after).size === 1 && after[0] !== got[0],
     JSON.stringify(Array.from(new Set(after))) + ' was '
     + JSON.stringify(Array.from(new Set(got))));
  key('0');
  await sleep(1200);
  const cleared = nums.map((n) => labels()[n]).filter(Boolean);
  ck('and 0 takes the label off', cleared.length === 0,
     cleared.length + ' still labelled');

  hd('6. Escape drops the selection before it leaves the mode');
  key('Escape');
  await sleep(400);
  ck('the selection is dropped', picked().length === 0, picked().length);
  ck('but StrataScope is still open', val('BARRY.strata.active') === true,
     'it left the mode entirely');

  hd('7. The overlay is on the image panels, not just the traces');
  /* Put some labels back first. Section 5 finished by clearing them, and an
     overlay with nothing to draw painting nothing is correct rather than
     broken -- testing it in that state would prove nothing either way. */
  ev(5, {});
  await sleep(300);
  ev(20, { shiftKey: true });
  await sleep(300);
  tags()[1].click();
  await sleep(1400);
  p('  re-labelled ' + Object.keys((st().labels) || {}).length + ' channel(s)');
  run('(function(){var X=BARRY.views.xplore.state;'
    + 'X.panes[0].panel="csd";BARRY.views.xplore.render();'
    + 'BARRY.views.xplore.refreshAll();})()');
  await sleep(2600);
  /* Count what the layer overlay actually paints, by watching fillRect on
     the real canvas -- the bands are fills and nothing else in the raster
     path fills that many rectangles. */
  const fills = (n) => val(
    '(function(){var c=document.createElement("canvas");'
    + 'c.width=400;c.height=200;var g=c.getContext("2d");'
    + 'var n=0;var real=g.fillRect.bind(g);'
    + 'g.fillRect=function(){n+=1;return real.apply(g,arguments);};'
    + 'var s=BARRY.views.xplore.state.sessions['
    + 'BARRY.views.xplore.state.order[0]];'
    + 'BARRY.strata.draw(g,s,{t0:0,t1:10},0,400,0,200,'
    + '{accent:"#4bc7f0"},' + n + ');'
    + 'return n;})()');
  /* Which guard, if it draws nothing. `draw` refuses without a live sheet
     AND without `sess.strata` on the session object it is handed -- and a
     reopen replaces that object, which is what `rebind` exists for. */
  p('  strata active: ' + val('BARRY.strata.active')
    + ', sess.strata present: '
    + val('!!BARRY.views.xplore.state.sessions['
        + 'BARRY.views.xplore.state.order[0]].strata')
    + ', labels on it: '
    + val('Object.keys((BARRY.views.xplore.state.sessions['
        + 'BARRY.views.xplore.state.order[0]].strata||{}).labels||{}).length'));
  const withRows = fills('{rows:[{number:1},{number:2},{number:3}]}');
  p('  fills when the panel reports 3 rows: ' + withRows);
  ck('the layer overlay draws onto an image panel', withRows > 0,
     'nothing drawn — the four-way view would show no layers');

  hd('8. The overlay strength is a control, and Off means off');
  const washes = Array.from(D().querySelectorAll('.strata-wash .mini'));
  p('  ' + washes.length + ' setting(s): '
    + washes.map((b) => b.textContent).join(', '));
  ck('there is a strength control beside Fill down and Clear',
     washes.length === 4, washes.length);
  ck('and one of them is on', washes.some((b) => b.classList.contains('on')));
  const solid = washes.find((b) => /solid/i.test(b.textContent));
  const off = washes.find((b) => /off/i.test(b.textContent));
  if (solid && off) {
    solid.click(); await sleep(600);
    const strong = fills('null');
    off.click(); await sleep(600);
    const none = fills('null');
    p('  fills: solid ' + strong + ', off ' + none);
    ck('turning it up paints more than turning it off',
       strong > none, strong + ' vs ' + none);
    washes.find((b) => /faint/i.test(b.textContent)).click();
  }

  p('\n' + (bad ? bad + ' FAILED' : 'all checks passed'));
  document.title = (bad ? bad + ' FAILED — ' : 'ok — ') + 'strata';
} catch (e) {
  p('THREW: ' + (e && e.message) + '\n' + (e && e.stack));
  document.title = 'threw';
} finally {
  await restore();
  p('\n(labels put back)');
} })();
</script>

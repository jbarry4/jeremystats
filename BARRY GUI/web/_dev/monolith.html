        bad.push((g.getAttribute('aria-label') || 'figure') + ': “' + w + '” leaves the picture');

  check('13, how the number was made: the measure in view lit', covers(D().querySelector('#leaf .lcard.sel')) && /should match/.test(body()));
  await press(); await atStep(13);
  check('14, the end: the cue pair closed, and the Take the tour button lit', !M2.leaf.open && covers(D().getElementById('monoTour'))
        && nextBtn().textContent.trim() === 'Finish');
  const tw = figWords(D());
  check('no word in a figure along the way is cut off or overlapping', tw.length === 0, tw.slice(0, 4).join(' | '));
  await press();
  await until(() => !D().getElementById('tour'), 60);
  check('Finish leaves the tour, and nothing else opens', !D().getElementById('tour') && !tst() && !D().querySelector('.qpop'));

  head('the tour again, by the button');
  D().getElementById('monoTour').click();
  await atStep(0);
  check('Take the tour starts it again, at step 1', tst() && tst().index === 0);
  // Straight to the traces with the recording gone: set up from nothing.
  M2.closeGhost(true);
  LEAF_GONE = true;
  TR().step(11);
  await atStep(11);
  check('a recording no longer on the VACC: step 12 says so, and lights the message',
        /no longer on the VACC/.test(body()) && covers(D().querySelector('#leaf .warn')), body().slice(0, 120));
  LEAF_GONE = false;
  D().body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await until(() => !D().getElementById('tour'), 40);
  check('Escape leaves it', !D().getElementById('tour') && !tst());
  M2.closeLeaf(); M2.closeGhost(true);
  f.style.width = '390px';
  await sleep(150);
  D().getElementById('monoTour').click();
  await atStep(0);
  TR().step(2);
  await atStep(2);
  const br = TB().getBoundingClientRect();
  check('at 390 px the box stays on screen', br.left >= 0 && br.right <= W().innerWidth + 1 && br.top >= 0 && br.bottom <= W().innerHeight + 1,
        [br.left, br.right, br.top, br.bottom, W().innerWidth, W().innerHeight].map(Math.round).join(' '));
  TR().stop(true);
  f.style.width = '';

  head('the Guide');
  f.src = '/monolith-guide.html#wpli';
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  await until(() => D().body && D().body.dataset.ready === '1', 120);
  const GT = W().MONO_HELP.T;
  const keys = Object.keys(GT);
  check('every ? has an entry', keys.every((k) => D().getElementById(k) && D().getElementById(k).classList.contains('entry')), keys.filter((k) => !D().getElementById(k)).join(','));
  check('and a line in the contents', D().querySelectorAll('#toc a').length === keys.length, D().querySelectorAll('#toc a').length + ' of ' + keys.length);
  const drawnKeys = keys.filter((k) => GT[k].demo || (GT[k].plot && GUIDE.measures[k === 'arrows' ? 'gc_net' : k === 'pac.circuit' ? 'pac' : k]));
  await until(() => D().querySelectorAll('.entry .qdemo').length === drawnKeys.length, 120);
  check('each measure and statistic drawn (' + drawnKeys.length + ')', D().querySelectorAll('.entry .qdemo').length === drawnKeys.length,
        drawnKeys.filter((k) => !D().getElementById(k).querySelector('.qdemo')).join(','));
  check('no entry links to itself as “Read it in the Guide”', !D().querySelector('.entry a.qguide'));
  const gw = figWords(D());
  check('no word in any figure is cut off or on top of another', gw.length === 0, gw.length + ': ' + gw.slice(0, 6).join(' | '));
  await until(() => Math.abs(D().getElementById('wpli').getBoundingClientRect().top) < 40, 40);
  const wtop = D().getElementById('wpli').getBoundingClientRect().top;
  check('a link lands on its entry', Math.abs(wtop) < 40, wtop);
  check('no text ends in an ellipsis', txt(D().body).indexOf('…') < 0);
  f.style.width = '390px';
  await sleep(120);
  check('at 390 px nothing scrolls sideways', D().scrollingElement.scrollWidth <= D().scrollingElement.clientWidth + 1, D().scrollingElement.scrollWidth);
  f.style.width = '';

  restore();
  head(bad === 0 ? 'the Monolith page works' : bad + ' failed');
  document.title = bad === 0 ? 'ok' : 'FAIL ' + bad + ': ' + Array.from(out.querySelectorAll('.bad')).map((d) => d.textContent).join(' | ');
  if (!STOP) document.getElementById('app').src = 'about:blank';   // idle: the dump is taken at once
} catch (e) {
  say('bad', 'harness threw: ' + (e && e.stack || e));
  document.title = 'FAIL threw: ' + e.message;
} })();
</script>

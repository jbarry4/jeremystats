     - the circuit draws exactly the edges that pass the slider (counted

     - a pair that passes at most frequencies is flagged broadband
     - under the ghost, each level's picture: the slope chart, the forest

let bad = 0;
const say = (c, m) => { const d = document.createElement('div');

/* One arrow, measured from what was drawn: the head's tip against the
   circle of the node it points at, the head's width against the line's,
   and where the line ends against where the head begins. */
function arrowFit(line, poly, node) {
  const pts = poly.getAttribute('points').trim().split(/\s+/).map((q) => q.split(',').map(Number));
  const [tip, b1, b2] = pts;
  const cx = Number(node.getAttribute('cx')), cy = Number(node.getAttribute('cy'));
  const r = Number(node.getAttribute('r')) + Number(node.getAttribute('stroke-width') || 0) / 2;
  const end = /([-\d.]+),([-\d.]+)\s*$/.exec(line.getAttribute('d'));
  const mid = [(b1[0] + b2[0]) / 2, (b1[1] + b2[1]) / 2];
  return { tipOut: Math.hypot(tip[0] - cx, tip[1] - cy) - r, headW: Math.hypot(b1[0] - b2[0], b1[1] - b2[1]),
           lineW: Number(line.getAttribute('stroke-width')), gap: end ? Math.hypot(Number(end[1]) - mid[0], Number(end[2]) - mid[1]) : Infinity };
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, tries = 120, gap = 50) {
  for (let i = 0; i < tries; i++) {
    try { const v = fn(); if (v) return v; } catch (e) { /* not yet */ }
    await sleep(gap);
  }
  return null;
}
const STOP = new URLSearchParams(location.search).get('stop');

/* Every word in every figure under `root`: inside its picture, and not on
   top of another word. Measured from the drawn boxes, not judged by eye --
   a unit sat on the last tick's number, and a peak's label ran off the top,
   and both looked like "a figure" in a quick glance. */
function figWords(root, sel) {
  const bad = [];
  // Words not drawn (opacity 0 on them or on a group around them) cannot
  // collide with anything.
  const shown = (t, g) => { for (let n = t; n && n !== g; n = n.parentNode) if (n.getAttribute && n.getAttribute('opacity') === '0') return false; return true; };
  // A word's box in its picture's own units, through any group moved
  // (translate) between them.
  const boxIn = (t, g) => {
    const b0 = t.getBBox();
    if (!b0.width && !b0.height) return b0;           // not drawn (a hidden picture): nothing to place
    let m = new DOMMatrix();
    for (let n = t; n && n !== g; n = n.parentNode) {
      const tl = n.transform && n.transform.baseVal;
      if (tl && tl.numberOfItems) m = DOMMatrix.fromMatrix(tl.consolidate().matrix).multiply(m);
    }
    const ps = [[b0.x, b0.y], [b0.x + b0.width, b0.y], [b0.x, b0.y + b0.height], [b0.x + b0.width, b0.y + b0.height]].map(([x, y]) => m.transformPoint(new DOMPoint(x, y)));
    const xs = ps.map((p) => p.x), ys = ps.map((p) => p.y);
    return { x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys) };
  };
  for (const g of root.querySelectorAll(sel || 'svg.mfig')) {
    const vb = g.viewBox.baseVal;
    const boxes = [];
    for (const t of g.querySelectorAll('text')) {
      const w = t.textContent.trim();
      if (!w || !shown(t, g)) continue;
      const b = boxIn(t, g);
      if (b.x < -1 || b.y < -1 || b.x + b.width > vb.width + 1 || b.y + b.height > vb.height + 1) {
        bad.push((g.getAttribute('aria-label') || 'figure') + ': “' + w + '” leaves the picture');
      }
      for (const [o, ow] of boxes) {
        const dx = Math.min(b.x + b.width, o.x + o.width) - Math.max(b.x, o.x);
        const dy = Math.min(b.y + b.height, o.y + o.height) - Math.max(b.y, o.y);
        if (dx > 2 && dy > 3) bad.push((g.getAttribute('aria-label') || 'figure') + ': “' + w + '” on “' + ow + '”');
      }
      boxes.push([b, w]);
    }
  }
  return bad;
}

/* ---------------- the fixture ---------------- */
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const REG = ['Right ACC', 'Right OFC', 'Right DHC', 'Right RSC', 'Right PER', 'Right POR',
             'Left POR', 'Left PER', 'Left RSC', 'Left DHC', 'Left OFC', 'Left ACC'];
const PAIRS = [];
for (let i = 0; i < REG.length; i++) for (let j = i + 1; j < REG.length; j++) PAIRS.push([i, j]);
const BANDS = [];
for (let f = 1; f <= 55; f++) {
  const h = Math.max(0.5, 0.15 * f);
  BANDS.push({ id: 'f' + String(f).padStart(2, '0'), hz: f, low: Math.max(0.5, f - h), high: Math.min(55, f + h),
               lag_s: 2 / f, speed: f <= 12 ? 'slow' : 'fast', named: false, pad: true, label: f + ' Hz' });
}
BANDS.push({ id: 'theta', hz: null, low: 4, high: 12, lag_s: 0.5, speed: 'slow', named: true, pad: false, label: 'Theta 4–12 Hz' });
BANDS.push({ id: 'beta', hz: null, low: 13, high: 30, lag_s: 0.15, speed: 'fast', named: true, pad: false, label: 'Beta 13–30 Hz' });
BANDS.push({ id: 'gamma_low', hz: null, low: 30, high: 55, lag_s: 0.06, speed: 'fast', named: true, pad: false, label: 'Low gamma 30–55 Hz' });
const WINDOWS = [['pre', 'Baseline', 'state'], ['cue1', 'Cue 1', 'state'], ['cue2', 'Cue 2', 'state'], ['post', 'After', 'state'],
                 ['onset', 'Onset', 'transition'], ['switch', 'Switch', 'transition'], ['offset', 'Offset', 'transition'],
                 ['c21', 'Cue 2 − Cue 1', 'contrast']]
  .map(([id, label, kind]) => ({ id, label, kind }));
const METHODS = [['coherence', 'Coherence'], ['icoh', 'Imaginary coherence'], ['raw_cc', 'Raw cc'], ['env_cc', 'Envelope cc'],
  ['env_cc0', 'Amplitude r, zero lag'], ['orth_env', 'Orthogonalised envelope r'], ['plv', 'PLV'], ['ppc', 'PPC'],
  ['pli', 'PLI'], ['wpli', 'wPLI'], ['dwpli', 'Debiased wPLI'], ['gc_ab', 'Granger A→B'], ['gc_ba', 'Granger B→A'],
  ['gc_net', 'Granger net']].map(([id, label]) => ({ id, label, say: label + ', described.', directed: /^gc_/.test(id) }));
const CELLS = [];
for (let fp = 2; fp <= 12; fp++) for (let fa = 15; fa <= 50; fa += 5) {
  const phi = Math.min(55, fp + Math.max(0.5, 0.15 * fp));
  const w = Math.max(1.5 * fp, 0.15 * fa), alo = fa - w, ahi = Math.min(55, fa + w);
  const ok = alo >= phi + 2 && ahi - alo >= 2 * fp;
  CELLS.push({ fp, fa, phase_band: [fp - Math.max(0.5, 0.15 * fp), phi], amp_band: ok ? [alo, ahi] : null });
}
const N = { W: WINDOWS.length, B: BANDS.length, M: METHODS.length, P: PAIRS.length, R: REG.length, C: CELLS.length };
const GREY = 5;                              // Right POR: no rat has it
const PLANT = { w: 1, b: 9, m: 0, p: 0 };    // Cue 1, 10 Hz, coherence, Right ACC – Right OFC
const PLANT2 = { w: 2, b: 19, m: 6, p: 12 }; // Cue 2, 20 Hz, PLV
const GNET = { w: 1, b: 9, p: 3, est: -0.08 }; // Granger net, Right ACC – Right PER, the other way

function makeEdges(seed) {
  const r = rng(seed);
  const a = new Float32Array(6 * N.W * N.B * N.M * N.P);
  const at = (q, w, b, m, p) => (((q * N.W + w) * N.B + b) * N.M + m) * N.P + p;
  for (let w = 0; w < N.W; w++) for (let b = 0; b < N.B; b++) for (let m = 0; m < N.M; m++) for (let p = 0; p < N.P; p++) {
    const grey = PAIRS[p][0] === GREY || PAIRS[p][1] === GREY;
    a[at(0, w, b, m, p)] = (r() - 0.5) * 0.04;
    a[at(1, w, b, m, p)] = grey ? NaN : r();
    a[at(2, w, b, m, p)] = grey ? 3 : 8;
    a[at(3, w, b, m, p)] = grey ? 2 : 4 + Math.floor(r() * 5);
    a[at(4, w, b, m, p)] = grey ? NaN : 0.01;
    a[at(5, w, b, m, p)] = grey ? 1 : 0;
  }
  for (const [x, est, pv] of [[PLANT, 0.3, 1e-6], [PLANT2, -0.2, 2e-5]]) {
    a[at(0, x.w, x.b, x.m, x.p)] = est; a[at(1, x.w, x.b, x.m, x.p)] = pv; a[at(3, x.w, x.b, x.m, x.p)] = 8;
  }
  const gn = METHODS.findIndex((m) => m.id === 'gc_net');
  a[at(0, GNET.w, GNET.b, gn, GNET.p)] = GNET.est; a[at(1, GNET.w, GNET.b, gn, GNET.p)] = 1e-4;

function makePower(seed) {

  const at = (q, w, b, x) => ((q * N.W + w) * N.B + b) * N.R + x;
  for (let w = 0; w < N.W; w++) for (let b = 0; b < N.B; b++) for (let x = 0; x < N.R; x++) {
    a[at(0, w, b, x)] = x === GREY ? NaN : (r() - 0.5) * 0.2;
    a[at(1, w, b, x)] = x === GREY ? NaN : r();
    a[at(2, w, b, x)] = x === GREY ? 0 : 8; a[at(3, w, b, x)] = 5;
    a[at(4, w, b, x)] = 0.05; a[at(5, w, b, x)] = x === GREY ? 5 : 0;

function makePac(seed) {
  const r = rng(seed);

  const a = new Float32Array(6 * 4 * N.C * RR);
  const at = (q, w, c, op) => ((q * 4 + w) * N.C + c) * RR + op;
  for (let w = 0; w < 4; w++) for (let c = 0; c < N.C; c++) for (let op = 0; op < RR; op++) {
    const live = !!CELLS[c].amp_band;
    a[at(0, w, c, op)] = live ? (r() - 0.5) * 0.002 : NaN;
    a[at(1, w, c, op)] = live ? r() : NaN;
    a[at(2, w, c, op)] = 8; a[at(3, w, c, op)] = 5; a[at(4, w, c, op)] = 0.001; a[at(5, w, c, op)] = 0;

  const c8 = CELLS.findIndex((c) => c.fp === 8 && c.fa === 30), dd = 2 * N.R + 2;
  a[at(0, 1, c8, dd)] = 0.003; a[at(1, 1, c8, dd)] = 2e-4; a[at(3, 1, c8, dd)] = 8;
  // Right POR is never there: its own PAC is never tested.
  for (let w = 0; w < 4; w++) for (let c = 0; c < N.C; c++) for (let q = 0; q < 6; q++) a[at(q, w, c, GREY * N.R + GREY)] = NaN;
  return a;
}

  }
}
const SHAPES = { edges: [6, N.W, N.B, N.M, N.P], power: [6, N.W, N.B, N.R], pac: [6, 4, N.C, N.R * N.R] };
const ARR = {
  edges_raw: makeEdges(11), edges_minus_fp: makeEdges(12), power_raw: makePower(13),
  power_minus_fp: makePower(14), pac_raw: makePac(15), pac_minus_fp: makePac(16),
};
plantBroadband(ARR.edges_raw);
function topList(layer) {
  const out2 = [];
  const mk = (x, est, p, same, rank) => ({ layer, w: WINDOWS[x.w].id, wi: x.w, kind: WINDOWS[x.w].kind,
    band: BANDS[x.b].id, bi: x.b, hz: BANDS[x.b].hz, m: METHODS[x.m].id, mi: x.m, pair: x.p,
    a: REG[PAIRS[x.p][0]], b: REG[PAIRS[x.p][1]], est, se: 0.02, p, k: 8, same, up: est > 0, rank,

  check('a build not narrowed down yet says so and offers to do it here', !!D().getElementById('narrowmake') && !D().getElementById('narcorrecttbl'));
  D().getElementById('narrowmake').click();
  await until(() => narPosted.length && D().getElementById('narcorrecttbl'), 120);
  check('pressed: asked of Jarvis, confirmed, and read again', narPosted.length === 1 && narPosted[0].confirm === true && !!D().getElementById('narcorrecttbl'));
  M.showTab('main');
  await sleep(30);

  head('the tour');
  M.closeLeaf(); M.closeGhost(true);
  try { localStorage.removeItem(TOUR_KEY); } catch (e) { /* none */ }
  // For a screenshot of a step: &phone=1 draws it 390 px wide, &dark=1 in
  // the dark tokens.
  const shotArgs = new URLSearchParams(location.search);
  if (/^tour\d+$/.test(STOP || '') && shotArgs.get('phone')) f.style.width = '390px';
  f.src = '/monolith.html';
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const M2 = await until(() => W().MONO && W().MONO.ready && W().MONO, 200);
  if (/^tour\d+$/.test(STOP || '') && shotArgs.get('dark')) { D().documentElement.dataset.theme = 'dark'; M2.renderAll(); }
  const TR = () => W().BARRY && W().BARRY.tour;
  const tst = () => TR() && TR().state;
  const TB = () => D().getElementById('tourBox');
  const ready = () => TB() && !TB().classList.contains('busy') && TB().querySelector('h4');
  // The step's own box: busy clears 140 ms before the new words are painted,
  // so the step number in the box is what says it has arrived.
  const atStep = (i) => until(() => tst() && tst().index === i && ready()
    && txt(TB().querySelector('.tour-of')).indexOf((i + 1) + ' of ') === 0, 600, 50);
  await atStep(0);
  check('a first visit starts the tour by itself, at step 1 of 15', !!M2 && tst() && tst().index === 0 && tst().steps === 15
        && /1 of 15/.test(txt(TB())), tst() && JSON.stringify(tst()));
  let seenNow = null;
  try { seenNow = localStorage.getItem(TOUR_KEY); } catch (e) { /* none */ }
  check('and this browser now remembers it was shown', !!seenNow);
  const stopN = /^tour(\d+)$/.exec(STOP || '');
  if (stopN) {
    if (Number(stopN[1]) > 0) { TR().step(Number(stopN[1])); await atStep(Number(stopN[1])); }
    restore(); document.title = 'stopped at tour' + stopN[1];
    return;
  }
  // The hole, as set (its own transition is not waited for), against the
  // step's target: the target sits wholly inside it.
  const hole = () => D().getElementById('tourHole');
  const covers = (node) => {
    const h = hole();
    if (!node || !h || h.classList.contains('hidden')) return false;
    const L = parseFloat(h.style.left), T = parseFloat(h.style.top), Wd = parseFloat(h.style.width), Ht = parseFloat(h.style.height);
    const b = node.getBoundingClientRect();
    return L <= b.left + 1 && T <= b.top + 1 && L + Wd >= b.right - 1 && T + Ht >= b.bottom - 1;
  };
  const nextBtn = () => Array.from(D().querySelectorAll('#tourBox .tour-foot button')).find((b) => /^(Next|Finish)$/.test(b.textContent.trim()));
  // A person, not a double press: the engine ignores a second Next inside
  // 250 ms of the first (tour.js, `advancing`).
  const press = async () => { await sleep(320); nextBtn().click(); };
  const backBtn = () => Array.from(D().querySelectorAll('#tourBox .tour-foot button')).find((b) => b.textContent.trim() === 'Back');
  const h4 = () => txt(TB().querySelector('h4'));
  const body = () => txt(TB().querySelector('.tour-body'));
  const garc = (key) => D().querySelector('#ghostsvg path.garc[data-key="' + key + '"]');

  check('1, welcome: nothing lit, the box in the middle', hole().classList.contains('hidden') && /two minutes/.test(h4()), h4());
  await press(); await atStep(1);
  check('2, what was kept, first: on its tab, with this Monolith’s own numbers', M2.state.tab === 'cov' && !D().getElementById('covpane').hidden
        && /Of 192 trials, 144 kept every region, 32 lost a region somewhere and 16 were lost entirely/.test(body())
        && /54 of 66 region pairs have enough rats/.test(body()), body());
  await press(); await atStep(2);
  check('3, the counts: back on the Monolith, lit, with its own numbers', M2.state.tab === 'main' && covers(D().getElementById('verdict'))
        && /340,000 tests\. 18,000 came out p < \.05, and chance alone would give about 17,000/.test(body()), body());
  await press(); await atStep(3);
  check('4, the circuit, lit', covers(D().getElementById('circsvg')));
  await press(); await atStep(4);
  check('5, the controls, lit, naming the view now', covers(D().getElementById('controls'))
        && body().indexOf(txt(D().getElementById('ctitle'))) >= 0, body().slice(0, 200));
  await press(); await atStep(5);
  const topLead = SUMMARY.top.raw[0];
  check('6, the leads: the first lit, named, and Next will click it', covers(D().querySelector('#toplist > li'))
        && /The first is Right ACC – Right OFC, Cue 1, 10 Hz, Coherence, with 8 of 8 rats/.test(body()) && /Next will click/.test(txt(TB())), body());
  M2.set({ method: 'plv', win: 'cue2', band: 'f20' });       // away from the lead, so the click has work to do
  await sleep(30);
  await press(); await atStep(6);
  check('Next performed it: the lead is in view and selected', M2.state.sel === topLead.pair && M2.state.method === topLead.m
        && M2.state.win === topLead.w && !!D().querySelector('#circsvg path.edge.sel'), JSON.stringify([M2.state.sel, M2.state.method, M2.state.win]));
  await sleep(900);
  check('and moved on exactly one step (no second advance from the click’s own timer)', tst().index === 6, tst().index);
  check('7, the selected edge, lit', covers(D().querySelector('#circsvg path.edge.sel')));
  await press(); await atStep(7);
  check('Next lifted it out', M2.ghost.lifted && M2.ghost.pair === topLead.pair);
  check('8, the pooled line, lit, with the pooled change', covers(garc('pooled')) && /Here it is \+0\.050, p \.002/.test(body()), body());
  // A reader's own click moves the tour on too.
  garc('pooled').dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await atStep(8);
  check('a reader’s own click on it moves the tour on, to the rats', tst().index === 8 && M2.ghost.stack.length === 2);
  check('9, the forest plot, lit', covers(D().getElementById('gstats')) && !!D().querySelector('#gstats svg.mfig[aria-label="forest plot"]'));
  await press(); await atStep(9);
  check('10, one rat suggested and lit (r3), with its two days', covers(garc('r3')) && /r3 went from .* on Precon1 to .* on Precon4/.test(body()), body());
  // The reader opens a different rat, then presses Next: the tour follows
  // theirs, and does not click the suggested one, now gone, as well.
  garc('r4').dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await until(() => M2.ghost.stack.length === 3, 80);
  await sleep(400);
  await press();
  await atStep(10);
  check('a reader who opens another rat (r4) is followed, not fought', M2.ghost.stack.length === 3 && M2.ghost.stack[2].rat === 4
        && /^r4’s two days/.test(body()) && covers(garc('Precon4')), body().slice(0, 60));
  backBtn().click(); await atStep(9);
  check('Back sets the page up again: the rats, one lit', M2.ghost.stack.length === 2 && covers(garc('r3')), M2.ghost.stack.length);
  await press(); await atStep(10);
  check('Next again: r3’s days', M2.ghost.stack[2] && M2.ghost.stack[2].rat === 3 && covers(garc('Precon4')));
  await press(); await atStep(11);
  check('12, every cue pair of that day, the first with a value lit', M2.ghost.stack.length === 4 && covers(garc('p01'))
        && /Next will click p01/.test(txt(TB())), txt(TB()).slice(0, 200));
  await press(); await atStep(12);
  check('13, the recording itself: that trial opened and its traces lit', M2.leaf.open && M2.leaf.unit === 'p01'
        && covers(D().querySelector('#leaf .lsec')) && /r3’s trial p01 on Precon4 as recorded/.test(body()), body().slice(0, 120));
  await press(); await atStep(13);
  check('14, how the number was made: the measure in view lit', covers(D().querySelector('#leaf .lcard.sel')) && /should match/.test(body()));
  await press(); await atStep(14);
  check('15, the end: the cue pair closed, and the Take the tour button lit', !M2.leaf.open && covers(D().getElementById('monoTour'))
        && nextBtn().textContent.trim() === 'Finish');
  const tw = figWords(D());
  check('no word in a figure along the way is cut off or overlapping', tw.length === 0, tw.slice(0, 4).join(' | '));
  await press();
  await until(() => !D().getElementById('tour'), 60);
  check('Finish leaves the tour, and nothing else opens', !D().getElementById('tour') && !tst() && !D().querySelector('.qpop'));

  head('the tour again, by the button');
  D().getElementById('monoTour').click();
  await atStep(0);
  check('Take the tour starts it again, at step 1', tst() && tst().index === 0);
  // Straight to the traces with the recording gone: set up from nothing.
  M2.closeGhost(true);
  LEAF_GONE = true;
  TR().step(12);
  await atStep(12);
  check('a recording no longer on the VACC: step 13 says so, and lights the message',
        /no longer on the VACC/.test(body()) && covers(D().querySelector('#leaf .warn')), body().slice(0, 120));
  LEAF_GONE = false;
  D().body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await until(() => !D().getElementById('tour'), 40);
  check('Escape leaves it', !D().getElementById('tour') && !tst());
  M2.closeLeaf(); M2.closeGhost(true);
  f.style.width = '390px';
  await sleep(150);
  D().getElementById('monoTour').click();
  await atStep(0);
  TR().step(2);
  await atStep(2);
  const br = TB().getBoundingClientRect();
  check('at 390 px the box stays on screen', br.left >= 0 && br.right <= W().innerWidth + 1 && br.top >= 0 && br.bottom <= W().innerHeight + 1,
        [br.left, br.right, br.top, br.bottom, W().innerWidth, W().innerHeight].map(Math.round).join(' '));
  TR().stop(true);
  f.style.width = '';

  head('the Guide');
  f.src = '/monolith-guide.html#wpli';
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  await until(() => D().body && D().body.dataset.ready === '1', 120);
  const GT = W().MONO_HELP.T;
  const keys = Object.keys(GT);
  check('every ? has an entry', keys.every((k) => D().getElementById(k) && D().getElementById(k).classList.contains('entry')), keys.filter((k) => !D().getElementById(k)).join(','));
  check('and a line in the contents', D().querySelectorAll('#toc a').length === keys.length, D().querySelectorAll('#toc a').length + ' of ' + keys.length);
  const drawnKeys = keys.filter((k) => GT[k].demo || GT[k].draw || (GT[k].plot && GUIDE.measures[k === 'arrows' ? 'gc_net' : /^pac\./.test(k) ? 'pac' : k]));
  await until(() => D().querySelectorAll('.entry .qdemo').length === drawnKeys.length, 120);
  check('each measure and statistic drawn (' + drawnKeys.length + ')', D().querySelectorAll('.entry .qdemo').length === drawnKeys.length,
        drawnKeys.filter((k) => !D().getElementById(k).querySelector('.qdemo')).join(','));
  check('no entry links to itself as “Read it in the Guide”', !D().querySelector('.entry a.qguide'));
  const gw = figWords(D());
  check('no word in any figure is cut off or on top of another', gw.length === 0, gw.length + ': ' + gw.slice(0, 6).join(' | '));
  await until(() => Math.abs(D().getElementById('wpli').getBoundingClientRect().top) < 40, 40);
  const wtop = D().getElementById('wpli').getBoundingClientRect().top;
  check('a link lands on its entry', Math.abs(wtop) < 40, wtop);
  check('no text ends in an ellipsis', txt(D().body).indexOf('…') < 0);
  f.style.width = '390px';
  await sleep(120);
  check('at 390 px nothing scrolls sideways', D().scrollingElement.scrollWidth <= D().scrollingElement.clientWidth + 1, D().scrollingElement.scrollWidth);
  f.style.width = '';

  restore();
  head(bad === 0 ? 'the Monolith page works' : bad + ' failed');
  document.title = bad === 0 ? 'ok' : 'FAIL ' + bad + ': ' + Array.from(out.querySelectorAll('.bad')).map((d) => d.textContent).join(' | ');
  if (!STOP) document.getElementById('app').src = 'about:blank';   // idle: the dump is taken at once
} catch (e) {
  say('bad', 'harness threw: ' + (e && e.stack || e));
  document.title = 'FAIL threw: ' + e.message;
} })();
</script>

<!doctype html>
<meta charset="utf-8">
<title>Shot — session receipt, hall of garbage, digest</title>
<style>
 html,body{margin:0;background:#0c0f14}
 iframe#app{width:1280px;height:900px;border:0;display:block}
</style>
<iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* Renders the three new cards so they can be looked at rather than
   described. `?what=` picks which: receipt, garbage, digest. */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = () => f.contentWindow;
  const D = () => f.contentDocument;
  for (let i = 0; i < 300 && typeof W().setView !== 'function'; i++) {
    await sleep(100);
  }
  await sleep(1500);
  const q = new URLSearchParams(location.search);
  const what = q.get('what') || 'receipt';

  if (what === 'receipt') {
    /* The one real sitting in the store: 587 decisions, each with a
       timestamp of its own, about two seconds apart. */
    const gid = q.get('gid') || 's81e818bd402d';
    W().eval('BARRY.curate.receipt("' + gid + '", "ds")');
    for (let i = 0; i < 200 && !D().querySelector('.rcpt-big'); i++) {
      await sleep(100);
    }
  } else if (what === 'garbage') {
    W().eval("setView('toolkit')");
    await sleep(1200);
    const t = Array.from(D().querySelectorAll('.tk-tool'))
      .find((b) => /Event curation/.test(
        (b.querySelector('strong') || {}).textContent || ''));
    if (t) t.click();
    for (let i = 0; i < 200; i++) {
      const b = Array.from(D().querySelectorAll('button'))
        .find((x) => /Hall of garbage/.test(x.textContent || ''));
      if (b) { b.click(); break; }
      await sleep(100);
    }
    for (let i = 0; i < 200 && !D().querySelector('.gh-list, .gh-wrap .hint');
         i++) await sleep(100);
  } else {
    W().eval("setView('history')");
    for (let i = 0; i < 200 && !D().querySelector('.digest'); i++) {
      await sleep(100);
    }
  }
  await sleep(1200);
  document.title = 'ready';
})();
</script>

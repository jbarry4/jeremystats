<!doctype html>
<meta charset="utf-8">
<title>Harness — the per-tool activity feed</title>
<style>
 body { background:#111; color:#ddd; font:12px/1.6 Consolas,monospace;
        margin:0; padding:10px; }
 iframe { width:1500px; height:900px; border:1px solid #333; background:#fff; }
 h4 { color:#9cf; margin:14px 0 4px; font-weight:normal; }
 .ok::before { content:'ok    '; color:#7c7; }
 .bad::before { content:'FAIL  '; color:#ff8a7a; }
 .bad { color:#ffb0a5; } .note { color:#89a; }
 div { white-space:pre-wrap; }
</style>
<p class="note">Every tool writes to the activity log and those rows already
go to Supabase. The feed is the half that was missing: reading them back,
per tool, while standing in the tool — for reproducibility first and
debugging second.</p>
<div id="out"></div>
<iframe id="A" src="/"></iframe>
<script>
let bad = 0;
const out = document.getElementById('out');
const say = (c, t) => { const d = document.createElement('div');
                        d.className = c; d.textContent = t;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const head = (t) => { const h = document.createElement('h4');
                      h.textContent = t; out.appendChild(h); };
const ck = (n, c, d) => say(c ? 'ok' : 'bad', n + (c ? '' : '   [' + d + ']'));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 40000) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    let v = null;
    try { v = fn(); } catch (e) { v = null; }
    if (v) return v;
    await sleep(200);
  }
  return null;
}
const A = document.getElementById('A');
const W = () => A.contentWindow;
const D = () => A.contentDocument;
const get = (u) => fetch(u).then((r) => r.json());

const TOOLS = ['bad', 'curate', 'strata', 'cfc', 'kilosort', 'snapshots'];

(async () => { try {
  await until(() => W().BARRY && W().BARRY.state);

  /* ---- the server side ------------------------------------------- */
  head('Every tool has a feed');
  const list = await get('/api/toolfeed');
  ck('the tools are listed', (list.tools || []).length >= 6,
     JSON.stringify((list.tools || []).map((t) => t.id)));

  for (const t of TOOLS) {
    const got = await get('/api/toolfeed/' + t + '?limit=5');
    const rows = got.rows || [];
    ck(t + ': answers', got.ok === true, JSON.stringify(got.error));
    /* Rows must belong to the tool asked for. A feed that shows another
       tool's work is worse than no feed: it is a wrong answer to "what
       happened here". */
    const stray = rows.filter((r) => !(got.prefixes || []).some(
      (p) => String(r.action || '').startsWith(p)
             || r.action === p.replace(/\.$/, '')));
    ck(t + ': every row belongs to it', stray.length === 0,
       stray.map((r) => r.action).join(', '));
    say('note', '  ' + t.padEnd(10) + got.source.padEnd(13)
        + rows.length + ' row(s)  '
        + (rows[0] ? rows[0].action + '  by ' + (rows[0].git_user || '?')
                   : '(none yet)'));
  }

  head('A tool nobody has registered still works');
  /* The whole "any future toolkit" claim: no registration step. */
  const future = await get('/api/toolfeed/somethingnew?limit=5');
  ck('it answers rather than erroring', future.ok === true,
     JSON.stringify(future.error));
  ck('and it looks for that tool’s own actions',
     (future.prefixes || [])[0] === 'somethingnew.',
     JSON.stringify(future.prefixes));

  head('It says where the rows came from');
  const one = await get('/api/toolfeed/curate?limit=3');
  ck('the source is named', one.source === 'supabase'
     || one.source === 'this machine', one.source);
  say('note', '  "' + one.source + '"'
      + (one.note ? '  — ' + one.note.slice(0, 80) : ''));

  head('`since` returns only what is newer');
  const all = await get('/api/toolfeed/curate?limit=5');
  if ((all.rows || []).length) {
    const newest = all.rows[0].at;
    const after = await get('/api/toolfeed/curate?limit=5&since='
                            + encodeURIComponent(newest));
    ck('nothing is newer than the newest', (after.rows || []).length === 0,
       (after.rows || []).length + ' rows after ' + newest);
  }

  /* ---- on screen -------------------------------------------------- */
  head('And it is in the ToolKit');
  W().eval("setView('toolkit')");
  await sleep(600);
  /* Braid's page, which is cheap to render. */
  W().eval("BARRY.views.toolkit.pick && BARRY.views.toolkit.pick('cfc')");
  await sleep(400);
  if (!D().querySelector('.tf')) {
    const btn = Array.from(D().querySelectorAll('#view-toolkit button'))
      .find((b) => /Braid/.test(b.textContent));
    if (btn) btn.click();
  }
  const feed = await until(() => D().querySelector('.tf'), 40000);
  ck('the feed is on the page', !!feed, 'no .tf');
  if (feed) {
    const src = feed.querySelector('.tf-src');
    ck('it says which source it is reading', !!src && !!src.textContent,
       src ? src.textContent : 'none');
    const rows = feed.querySelectorAll('.tf-row').length;
    const empty = feed.querySelector('.tf-empty');
    ck('it shows rows, or says it has none', rows > 0 || !!empty,
       rows + ' rows');
    say('note', '  ' + (src ? src.textContent : '') + '  ·  ' + rows
        + ' row(s)');
    if (rows) {
      const first = feed.querySelector('.tf-row');
      ck('a row says when, who and what',
         !!first.querySelector('.tf-when') && !!first.querySelector('.tf-who')
         && !!first.querySelector('.tf-what'),
         first.textContent.slice(0, 70));
      say('note', '  "' + first.textContent.replace(/\s+/g, ' ').trim()
          .slice(0, 96) + '"');
    }
  }

  head('Switching tools switches the feed');
  const btn2 = Array.from(D().querySelectorAll('#view-toolkit button'))
    .find((b) => /Event curation/.test(b.textContent));
  if (btn2) {
    btn2.click();
    await sleep(2500);
    const f2 = D().querySelector('.tf');
    ck('there is still exactly one feed',
       D().querySelectorAll('.tf').length === 1,
       D().querySelectorAll('.tf').length + ' feeds');
    ck('and it is the new tool’s', !!f2);
  }

  head(bad ? bad + ' problem(s)' : 'All good.');
  document.title = bad ? 'toolfeed: ' + bad + ' FAILED' : 'toolfeed: passed';
} catch (e) {
  say('bad', 'the harness itself threw: ' + (e && e.stack || e));
  document.title = 'toolfeed: harness CRASH';
} })();
</script>

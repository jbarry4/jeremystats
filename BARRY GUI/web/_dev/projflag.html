<!doctype html>
<html><head><meta charset="utf-8"><title>projflag: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:700px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:700px;top:0;right:0;bottom:0;width:calc(100vw - 700px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
/* The filing flag: a path that names a project other than the one the
   recording is filed under.

   The whole point of this page is that the flag must NOT be a rule. The word
   "urethane" appears in this lab's data in two different roles:

     D:\KCNT1\urethane\wt\KCNTM13_WT\...            the project
     Y:\...\CTL\rejects\M15_s3_baseline_urethane    the anaesthetic, in PTEN

   A re-filer that reads the word moves the second pair out of PTEN and says
   nothing about having done it. So the assertions below are mostly about
   restraint: the flag is raised on BOTH readings, it changes nothing by
   itself, and the only thing that clears it is a person setting the project
   by hand.

   The one about the filter is the same shape as vaccknows.html's: a filter
   that empties the list instead of dividing it is the failure that looks
   like a working feature. */
const L = document.getElementById('log');
let fails = 0, checks = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { checks++; if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 8000)) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    await sleep(60);
  }
  return null;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  const $$ = (s) => Array.from(D().querySelectorAll(s));
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'),
              25000);

  say('=== the server says what the path says ===');
  const reg = JSON.parse(await ev(
    'fetch("/api/registry?no_demo=1").then(r=>r.text())'));
  // The registry answers as a project -> mouse -> session tree.
  const rows = [];
  for (const p of (reg.tree || [])) {
    for (const m of (p.mice || [])) {
      for (const s of (m.sessions || [])) rows.push(s);
    }
  }
  check('/api/registry answers with rows', rows.length > 0, rows.length + ' rows');
  check('every row carries the field, present or empty',
        rows.every((r) => Array.isArray(r.project_flags)),
        rows.filter((r) => !Array.isArray(r.project_flags)).length + ' without');

  const flagged = rows.filter((r) => (r.project_flags || []).length);
  say('    ' + flagged.length + ' of ' + rows.length + ' flagged', 'note');

  /* Preconditions. A page that asserts against an empty set passes
     vacuously, and this codebase has shipped that mistake before. */
  if (!flagged.length) {
    say('no recording here has a path that disagrees with its project, so '
        + 'there is nothing for the flag to say', 'note');
    say('ran 0 checks', 'note');
    document.title = 'projflag: passed';
    return;
  }

  check('a flag names all four things a person needs',
        flagged.every((r) => r.project_flags.every(
          (f) => f.word && f.path && f.suggests && f.filed)),
        JSON.stringify(flagged[0].project_flags[0]));
  check('and the record is still filed where it was — this raises, '
        + 'it does not move',
        flagged.every((r) => r.project === r.project_flags[0].filed));

  say('');
  say('=== both readings of the word get flagged ===');
  /* The PTEN pair is the reason the flag exists rather than a re-filer. If
     they are NOT flagged the page is testing a rule that already agreed with
     itself; if they ARE flagged and still PTEN, the flag is behaving. */
  const pten = flagged.filter((r) => r.project === 'PTEN');
  say('    ' + flagged.filter((r) => r.project === 'KCNT1').length
      + ' filed KCNT1, ' + pten.length + ' filed PTEN', 'note');

  /* Completeness, computed independently of the thing under test: every
     recording whose paths carry the word, is not already filed that way and
     was not filed by hand, must be flagged. If the implementation quietly
     skipped the PTEN pair to avoid an awkward answer, this fails. */
  const ought = rows.filter((r) =>
    (r.paths || []).some((p) => /urethane/i.test(p))
    && r.project !== 'KCNT1 Urethane'
    && r.project_source !== 'manual');
  const missed = ought.filter((r) => !(r.project_flags || []).length);
  check('every path carrying the word is flagged, including the awkward ones',
        missed.length === 0,
        missed.length + ' missed of ' + ought.length);
  if (pten.length) {
    check('and the PTEN ones are STILL PTEN — the flag raised and moved '
          + 'nothing', pten.every((r) => r.project === 'PTEN'),
          pten.map((r) => r.gid).join(' '));
  }

  say('');
  say('=== a decision silences it ===');
  check('nothing filed by hand is flagged',
        rows.filter((r) => r.project_source === 'manual')
            .every((r) => !(r.project_flags || []).length),
        rows.filter((r) => r.project_source === 'manual').length
        + ' filed by hand');

  say('');
  say('=== the chip ===');
  ev("setView('sessions')");
  await until(() => D().querySelectorAll('.sess-card, .session-card').length,
              40000);
  /* The catalogue, not this computer's own view.

     "Scan a drive" hides anything this machine has never met, which is
     correct and is also why this section failed the moment the only
     recordings left flagged were the two PTEN ones on an unmounted `Y:`.
     Whether the chip draws must not depend on which drives happen to be
     plugged in, so ask for the view that shows every recording Jarvis
     knows about. */
  ev("BARRY.views.sessions.setMode('housekeeping')");
  await until(() => D().querySelectorAll('.sess-card, .session-card').length,
              40000);
  const chips = await until(
    () => { const n = $$('.flagchip.project-q'); return n.length ? n : null; },
    40000);
  check('the cards draw it', !!chips, chips ? chips.length : 0);

  if (chips) {
    check('it is a button, so it can be answered rather than only read',
          chips[0].tagName === 'BUTTON');
    const t = chips[0].title || '';
    check('the tooltip says what the path says AND what the record says',
          t.indexOf('filed under') >= 0 && t.indexOf('urethane') >= 0,
          t.slice(0, 70));
    check('and admits it might be wrong',
          /hint, not a verdict|anaesthetic/i.test(t));
    const col = getComputedStyle(chips[0]).color;
    const probe = D().createElement('span');
    probe.style.color = getComputedStyle(D().documentElement)
      .getPropertyValue('--warn').trim();
    D().body.appendChild(probe);
    const warn = getComputedStyle(probe).color; probe.remove();
    check('warning-coloured, not error-coloured: the recording is fine, '
          + 'only its filing is a question', col === warn, col + ' vs ' + warn);
  }

  say('');
  say('=== the filter divides, it does not empty ===');
  /* Asserted on the rows rather than by driving the popup: the property
     that matters is that "worth a look" and the rest are complements, so
     turning the filter on hides recordings instead of losing them. */
  const rest = rows.length - flagged.length;
  check('flagged + the rest is every recording, with nothing counted twice',
        flagged.length + rest === rows.length,
        flagged.length + ' + ' + rest + ' = ' + rows.length);
  check('and it is a division, not the whole list',
        flagged.length < rows.length, flagged.length + ' of ' + rows.length);

  say('');
  say('=== clicking lands where it can be answered ===');
  if (chips) {
    check('housekeeping can be pointed at one record',
          ev('typeof BARRY.views.housekeeping.inspect') === 'function');
    chips[0].click();
    await sleep(700);
    const det = await until(() => {
      const n = D().querySelector('#hkDetail');
      return n && n.children.length ? n : null;
    }, 20000);
    check('and it opens that recording, not the list', !!det);
    if (det) {
      check('with the project picker on screen — the one control that '
            + 'clears the flag',
            !!D().querySelector('.hk-proj select'));
      check('and the flag restated beside it',
            !!D().querySelector('.hk-proj-flag'));
    }
  }

  say('');
  say('ran ' + checks + ' checks');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'projflag: ' + fails + ' FAILED' : 'projflag: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'projflag CRASH'; });
</script></body></html>

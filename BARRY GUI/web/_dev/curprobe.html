<!doctype html>
<meta charset="utf-8">
<title>Probe — one curation state at a time</title>
<style>
 body{font:12px/1.55 ui-monospace,monospace;margin:0;background:#0c0f14;color:#dfe6ee}
 #out{padding:12px 16px;width:44vw;white-space:pre-wrap}
 iframe{position:fixed;right:0;top:0;width:56vw;height:100vh;border:0;border-left:1px solid #243}
</style>
<div id="out"></div><iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* A scratch page for walking one flow step by step when something is wrong.
   Currently: archive an open set and report where it ends up, because the
   harness said it ends up in neither the bench nor the shelf. */
const out = document.getElementById('out');
const p = (m) => { out.textContent += m + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, tries = 250, gap = 100) {
  for (let i = 0; i < tries; i++) {
    try { if (fn()) return i; } catch (e) {}
    await sleep(gap);
  }
  return -1;
}
(async () => { try {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = f.contentWindow, D = f.contentDocument;
  /* `BARRY` is a top-level const in core.js, so it lives in the
     script scope and is NOT a property of the frame's window --
     `W.BARRY` is undefined forever, and waiting on it burned the
     full 25s timeout on every run before carrying on regardless.
     `setView` is a function declaration, so it does land on the
     window, and it is only defined once core.js has run. */
  await untilN(() => typeof W.setView === 'function');
  const post = (u, b) => W.fetch(u, { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(b || {}) }).then((r) => r.json());
  const get = (u) => W.fetch(u).then((r) => r.json());
  const btn = (root, re) => Array.from(root.querySelectorAll('button'))
    .find((b) => re.test(b.textContent.trim()));

  const G = 'demo-ds-tutorial', K = 'ds';
  const flags = async (tag) => {
    const s = (await get('/api/curation')).sets.find(
      (x) => x.gid === G && x.kind === K);
    p(tag + ': open=' + s.open + ' archived=' + !!s.archived
      + ' assignee=' + JSON.stringify(s.assignee)
      + ' name=' + JSON.stringify(s.name));
    return s;
  };

  await post('/api/curation/close-all', {});
  await post('/api/curation/' + G + '/' + K + '/archive', { archived: false });
  const s0 = await flags('start');

  W.eval("setView('toolkit')");
  await untilN(() => D.querySelector('.tk-tool'), 200);
  btn(D, /Event curation/).click();
  await untilN(() => D.querySelector('#curBench'), 300);
  await sleep(800);

  D.querySelector('.cur-shelf-toggle').click();
  await untilN(() => D.querySelector('.cur-shelf-row'), 200);
  await sleep(400);

  const rows = () => Array.from(D.querySelectorAll('.cur-shelf-row'))
    .map((r) => (r.querySelector('.csr-name') || {}).textContent || '');
  const cards = () => Array.from(D.querySelectorAll('#curBench .cur-set'))
    .map((c) => (c.querySelector('strong') || {}).textContent || '');
  const chips = () => Array.from(D.querySelectorAll('.cur-chips .pill'))
    .map((c) => c.textContent.trim());

  p('\nshelf rows: ' + rows().length + '  has it: '
    + rows().some((n) => n === s0.name));
  p('chips: ' + chips().join(' | '));

  p('\n-- pick it up --');
  const row = Array.from(D.querySelectorAll('.cur-shelf-row')).find(
    (r) => ((r.querySelector('.csr-name') || {}).textContent || '') === s0.name);
  btn(row, /^Pick it up$/).click();
  await sleep(900);
  await flags('after pick up');
  p('bench: ' + JSON.stringify(cards()));

  p('\n-- archive it from the bench --');
  const card = Array.from(D.querySelectorAll('#curBench .cur-set')).find(
    (c) => ((c.querySelector('strong') || {}).textContent || '') === s0.name);
  const t = btn(card, /^(More…|Less)$/);
  p('fold button reads: ' + JSON.stringify(t.textContent.trim()));
  if (/More/.test(t.textContent)) { t.click(); await sleep(400); }
  const card2 = Array.from(D.querySelectorAll('#curBench .cur-set')).find(
    (c) => ((c.querySelector('strong') || {}).textContent || '') === s0.name);
  const ab = btn(card2, /^Archive$/);
  p('Archive button found: ' + !!ab + '  visible: '
    + !!(ab && ab.offsetParent !== null));
  ab.click();
  await sleep(1800);
  await flags('after archive');
  p('bench: ' + JSON.stringify(cards()));
  p('chips: ' + chips().join(' | '));
  p('shelf rows: ' + rows().length + '  has it: '
    + rows().some((n) => n === s0.name));

  p('\n-- click the Archived chip --');
  const ac = Array.from(D.querySelectorAll('.cur-chips .pill')).find(
    (c) => /^Archived/.test(c.textContent));
  p('Archived chip: ' + JSON.stringify(ac && ac.textContent.trim())
    + '  disabled=' + !!(ac && ac.disabled));
  if (ac) { ac.click(); await sleep(900); }
  p('shelf rows: ' + rows().length);
  p('rows now: ' + JSON.stringify(rows().slice(0, 6)));
  p('has it: ' + rows().some((n) => n === s0.name));

  await post('/api/curation/' + G + '/' + K + '/archive', { archived: false });
  await post('/api/curation/close-all', {});
  p('\ndone');
  document.title = 'probe done';
} catch (e) {
  p('THREW: ' + (e && e.message) + '\n' + (e && e.stack));
  document.title = 'probe threw';
} })();
</script>

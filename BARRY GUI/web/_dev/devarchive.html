<!doctype html>
<meta charset="utf-8">
<title>devarchive — archiving a computer takes it off the picker</title>
<style>
 body { background:#111; color:#ddd; font:12px/1.6 Consolas,monospace;
        margin:0; padding:10px; }
 iframe { width:1500px; height:900px; border:1px solid #333; background:#fff; }
 .ok::before { content:'ok    '; color:#7c7; }
 .bad::before { content:'FAIL  '; color:#ff8a7a; }
 .bad { color:#ffb0a5; } .note { color:#89a; }
 div { white-space:pre-wrap; }
</style>
<p class="note">Reported: "even though some are archived they are still showing
up on the main bar". The picker is built from the device table AND from the
machines the loaded groups mention, so archiving reloaded the first and the
stale second put every chip straight back.</p>
<div id="out"></div>
<iframe id="A" src="/"></iframe>
<script>
let bad = 0;
const out = document.getElementById('out');
const say = (c, t) => { const d = document.createElement('div');
                        d.className = c; d.textContent = t;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const ck = (n, c, d) => say(c ? 'ok' : 'bad', n + (c ? '' : '   [' + d + ']'));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 30000) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    let v = null;
    try { v = fn(); } catch (e) { v = null; }
    if (v) return v;
    await sleep(150);
  }
  return null;
}
const A = document.getElementById('A');
const W = () => A.contentWindow;
const D = () => A.contentDocument;
const ev = (src) => W().eval(src);
const get = async (u) => (await fetch(u)).json();
const post = async (u, b) => (await fetch(u, {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(b || {}),
})).json();

/* The chips on the device bar, by the text on them. */
const chips = () => Array.from(D().querySelectorAll('.dev-bar .ctl-seg .mini'))
  .map((b) => (b.textContent || '').trim())
  .filter((t) => t && t !== 'All');

/* Whatever gets flipped below is put back here, whether the run finishes,
   fails or throws. Four computers were left un-archived by runs of this page
   that ended between the two halves of the check. */
let restore = null;

(async () => { try {
  await until(() => ev('!!(typeof BARRY !== "undefined" && BARRY.views'
                       + ' && BARRY.views.errors)'));

  /* A name-only machine to work with: one the error log mentions that has
     no computer behind it, which is what the report is about -- rows
     written before errors carried a machine id, filed under a bare name.

     Only those. This flips a real, shared, database-backed setting that
     somebody set by hand, so it must not be one of the computers anybody
     is actually using. `id === hostname` is the tell: a real machine's id
     is a hostname slug plus a MAC hash and never equals its label. */
  const dev = await get('/api/devices');
  const archived = (dev.devices || [])
    .filter((d) => d.archived && d.id === d.hostname);
  const pick = archived[0];
  if (!pick) {
    say('note', 'nothing is archived here, so there is nothing to check');
    say('note', 'ran 0 checks');
    document.title = 'DONE ok=0 fail=0';
    return;
  }
  say('note', '  working with ' + pick.id + ' (was archived)');
  restore = pick;

  /* ---- archived: not on the bar ---- */
  ev("setView('errors')");
  await until(() => D().querySelector('.dev-bar'), 30000);
  await sleep(700);
  const before = chips();
  say('note', '  chips: ' + before.join(', '));
  ck('an archived computer is not offered in the picker',
     before.indexOf(pick.id) < 0 && !before.some((t) => t === pick.label),
     before.join(', '));

  /* ---- un-archive it: it comes back ---- */
  /* Through the same route the button uses, then the same reload. If the
     chip does not come back, the check below proves nothing. */
  await post('/api/devices/archive',
             { id: pick.id, archived: false, name_only: true });
  await ev('BARRY.views.errors.reload()');
  await sleep(900);
  const back = chips();
  say('note', '  after un-archiving: ' + back.join(', '));
  ck('un-archiving puts it back', back.length > before.length,
     back.join(', '));

  /* ---- archive it again: it goes, without waiting a minute ---- */
  /* The server caches its archived list for sixty seconds. Archiving has to
     drop that cache, or the feed keeps serving the retired machine's rows
     and the chips keep being rebuilt from them. */
  const t0 = Date.now();
  await post('/api/devices/archive',
             { id: pick.id, archived: true, name_only: true });
  await ev('BARRY.views.errors.reload()');
  await sleep(900);
  const after = chips();
  say('note', '  after archiving: ' + after.join(', ')
            + '   (' + Math.round((Date.now() - t0) / 100) / 10 + ' s)');
  ck('archiving takes it off the bar', after.length === before.length,
     after.join(', '));
  ck('  and does not wait out the cache', Date.now() - t0 < 30000,
     Math.round((Date.now() - t0) / 1000) + ' s');
  ck('  the bar matches what it started as',
     after.join('|') === before.join('|'),
     after.join(', ') + '  vs  ' + before.join(', '));

} catch (e) {
  say('bad', 'threw: ' + (e && e.message ? e.message : e));
} finally {
  if (restore) {
    try {
      await post('/api/devices/archive',
                 { id: restore.id, archived: !!restore.archived,
                   name_only: true });
      say('note', '  put ' + restore.id + ' back to archived='
                + !!restore.archived);
    } catch (e) {
      say('bad', 'could not restore ' + restore.id + ': ' + e.message);
    }
  }
}
  say('note', 'done');
  document.title = 'DONE ok=' + (out.querySelectorAll('.ok').length)
                 + ' fail=' + bad;
})();
</script>

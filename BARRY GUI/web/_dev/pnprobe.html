<!doctype html>
<meta charset="utf-8">
<title>Probe — is the narrow overflow Panorama's?</title>
<style>
 html,body{margin:0;font:12px/1.6 ui-monospace,monospace;background:#0c0f14;color:#dfe6ee}
 #out{padding:12px 16px;width:38vw;white-space:pre-wrap}
 iframe#app{position:fixed;right:0;top:0;width:62vw;height:100vh;border:0;border-left:1px solid #243}
</style>
<div id="out"></div><iframe id="app" src="/?linkhold=0#toolkit"></iframe>
<script>
/* A scratch page for one question: at a narrow width the tool pane scrolls
   sideways -- is that Panorama's doing, or does the ToolKit page do it
   whatever is open? Answered by asking every tool the same question at the
   same width, because "my panel overflows" and "this page overflows" want
   different fixes and only one of them is mine. */
const out = document.getElementById('out');
const p = (m) => { out.textContent += m + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, t = 600, g = 100) {
  for (let i = 0; i < t; i++) { try { if (fn()) return i; } catch (e) {} await sleep(g); }
  return -1;
}
(async () => {
  const f = document.getElementById('app');
  const ev = (s) => f.contentWindow.eval(s);
  const D = () => f.contentWindow.document;
  await untilN(() => ev('typeof BARRY') === 'object' && ev('!!BARRY.panorama'));
  ev('setView("toolkit")');
  await untilN(() => D().querySelector('.tk-tools'));

  const widths = [1180, 900, 700, 621];
  const tools = ['Bad channels', 'StrataScope', 'Braid', 'Kilosort', 'Panorama'];

  for (const w of widths) {
    f.style.width = w + 'px';
    document.getElementById('out').style.width = 'calc(100vw - ' + w + 'px)';
    ev('window.dispatchEvent(new Event("resize"))');
    await sleep(400);
    p('\n== frame ' + Math.round(f.getBoundingClientRect().width) + 'px ==');
    for (const name of tools) {
      const btn = Array.from(D().querySelectorAll('.tk-tool'))
        .find((b) => (b.querySelector('strong') || {}).textContent === name);
      if (!btn) { p('   ' + name.padEnd(14) + 'no button'); continue; }
      btn.click();
      await sleep(700);
      const host = D().querySelector('#tkResult');
      const main = D().querySelector('.tk-main');
      const lay  = D().querySelector('.tk-layout');
      const ov = (e) => e ? (e.scrollWidth - e.clientWidth) : -1;
      p('   ' + name.padEnd(14)
        + 'tkResult +' + String(ov(host)).padStart(4)
        + '   tk-main +' + String(ov(main)).padStart(4)
        + '   tk-layout +' + String(ov(lay)).padStart(4));
    }
  }
  p('\n(+N = N pixels wider than the box it sits in)');
  document.title = 'DONE';
})();
</script>

<!doctype html>
<html><head><meta charset="utf-8"><title>scanreg: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:660px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}.hd{color:#ffb81c}
iframe{position:fixed;left:660px;top:0;right:0;bottom:0;width:calc(100vw - 660px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n);
  L.scrollTop = L.scrollHeight; };
const check = (w, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + w + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 12000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(120);
  }
  return false;
}
const post = (u, b) => fetch(u, { method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(b) }).then((r) => r.json());

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 30000);
  const W = frame.contentWindow, D = () => frame.contentDocument;
  const $ = (s) => D().querySelector(s);
  const $$ = (s) => Array.from(D().querySelectorAll(s));

  const root = new URLSearchParams(location.search).get('root');
  say('scanning: ' + root, 'note');

  /* Forget anything a previous run of this harness registered, so "new from
     the scan" means something. Without it the second run finds nothing new
     and the checks that matter never get exercised. */
  const wipe = await (await fetch('/api/registry')).json();
  for (const p of (wipe.tree || [])) {
    for (const m of p.mice) {
      for (const sn of m.sessions) {
        if ((sn.paths || []).some((x) => /fakedrive/i.test(x))) {
          await post('/api/registry/' + sn.gid + '/forget', {});
        }
      }
    }
  }

  const before = await (await fetch('/api/registry?backfill=1')).json();
  const beforeGids = new Set(
    (before.tree || []).flatMap((p) => p.mice.flatMap((m) => m.sessions))
      .map((s) => s.gid));
  say('  registry knows ' + beforeGids.size + ' recordings before the scan',
      'note');

  say('');
  say('=== the view opens remembering, not knowing ===', 'hd');
  ev("setView('sessions')");
  await sleep(500);
  $$('#sessModeSeg button').find(
    (b) => b.dataset.mode === 'housekeeping').click();
  await until(() => $('#hkBody .hk-tree'), 12000);
  await sleep(700);
  const rows = () => $$('.hk-row');
  check('every row starts faint',
        rows().length > 0 && rows().every(
          (r) => r.classList.contains('remembered')),
        rows().filter((r) => r.classList.contains('found')).length
          + ' already bright');
  check('and it says why', !!$('.hk-remembered-note'),
        ($('.hk-remembered-note') || {}).textContent || '');
  const chip = $$('.hk-bar .stat-chip').map((c) => c.textContent);
  say('  ' + chip.join('  |  '), 'note');
  check('the count of found-this-session starts at zero',
        chip.some((t) => /^0 found this session/.test(t)), chip.join(' | '));

  say('');
  say('=== the scan catalogues everything it walks past ===', 'hd');
  $$('#sessModeSeg button').find((b) => b.dataset.mode === 'scan').click();
  await sleep(400);
  $('#rootPath').value = root;
  $('#rootGo').click();
  const done = await until(
    () => /session\(s\) in/.test(($('#scanStatus') || {}).textContent || ''),
    120000);
  check('the scan finishes', done,
        ($('#scanStatus') || {}).textContent.slice(0, 90));
  await sleep(1200);
  say('  ' + ($('#scanStatus') || {}).textContent.replace(/\s+/g, ' ')
      .slice(0, 130), 'note');
  check('it says how many it catalogued',
        /catalogued/.test(($('#scanStatus') || {}).textContent || ''),
        ($('#scanStatus') || {}).textContent.slice(0, 120));

  const after = await (await fetch('/api/registry')).json();
  const afterRows = (after.tree || [])
    .flatMap((p) => p.mice.flatMap((m) => m.sessions));
  say('  registry now knows ' + afterRows.length, 'note');
  check('the registry grew', afterRows.length >= beforeGids.size,
        beforeGids.size + ' -> ' + afterRows.length);

  /* The point: recordings nobody opened are now in the registry. */
  const fresh = afterRows.filter((s) => !beforeGids.has(s.gid));
  say('  new from the scan: ' + fresh.map((s) => s.label).join(', ')
      .slice(0, 180), 'note');
  check('recordings nobody opened are registered too', fresh.length > 0,
        fresh.length + ' new');
  check('each new one got a permanent id',
        fresh.every((s) => !!s.gid));
  check('and was filed into a project',
        fresh.every((s) => !!s.project),
        JSON.stringify(Array.from(new Set(fresh.map((s) => s.project)))));
  check('and knows it was first met by a scan',
        fresh.every((s) => s.first_seen_by === 'scan'),
        JSON.stringify(Array.from(new Set(fresh.map((s) => s.first_seen_by)))));
  check('and carries what the scan could see without opening it',
        fresh.some((s) => s.n_channels),
        JSON.stringify(fresh.slice(0, 2).map(
          (s) => ({ ch: s.n_channels, fs: s.fs }))));
  check('every scanned one has a last-found stamp',
        fresh.every((s) => s.last_seen && s.last_seen.at),
        JSON.stringify((fresh[0] || {}).last_seen || null));

  say('');
  say('=== and the ones it found brighten ===', 'hd');
  $$('#sessModeSeg button').find(
    (b) => b.dataset.mode === 'housekeeping').click();
  await until(() => rows().some((r) => r.classList.contains('found')), 12000);
  await sleep(600);
  const bright = rows().filter((r) => r.classList.contains('found'));
  const faint = rows().filter((r) => r.classList.contains('remembered'));
  say('  ' + bright.length + ' bright, ' + faint.length + ' still faint',
      'note');
  check('the scan brightened what it found', bright.length > 0,
        bright.length + '');
  check('the note about remembering is gone', !$('.hk-remembered-note'));
  const chip2 = $$('.hk-bar .stat-chip').map((c) => c.textContent);
  check('the counter went up',
        chip2.some((t) => /^[1-9]\d* found this session/.test(t)),
        chip2.join(' | '));
  check('found rows get a green dot',
        bright.every((r) => r.querySelector('.hk-dot.seen')));

  /* A recording registered but not on this drive should stay faint -- that
     is the signal the whole thing exists for. */
  if (faint.length) {
    say('  still faint: ' + faint.slice(0, 4).map(
      (r) => (r.querySelector('.hk-name') || {}).textContent).join(', '),
        'note');
    check('what the scan did not find stays faint', true);
  } else {
    say('  (the scan found everything the registry knew about)', 'note');
  }

  const only = $$('.hk-bar .toggle').find(
    (t) => /Only found this session/.test(t.textContent));
  check('there is a filter for just the found ones', !!only);
  if (only) {
    only.querySelector('input').click();
    await sleep(600);
    check('it hides the merely remembered',
          rows().every((r) => r.classList.contains('found')),
          rows().length + ' rows shown');
    only.querySelector('input').click();
    await sleep(500);
  }

  /* The other half of the report: a refresh used to empty the scan page,
     because its list lived only in memory. */
  say('');
  say('=== the scan page survives a refresh ===', 'hd');
  $$('#sessModeSeg button').find((b) => b.dataset.mode === 'scan').click();
  await sleep(500);
  const beforeCards = $$('.sess-card').length;
  say('  cards on the scan page after scanning: ' + beforeCards, 'note');
  check('the scan page lists them', beforeCards > 0, beforeCards + '');
  check('the found ones are marked as found',
        $$('.sess-card.found').length > 0,
        $$('.sess-card.found').length + ' found, '
        + $$('.sess-card.remembered').length + ' remembered');
  check('and the ones it did not find are there too, faint',
        $$('.sess-card.remembered').length > 0,
        $$('.sess-card.remembered').length + '');

  // Reload the app the way F5 would.
  frame.contentWindow.location.reload();
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  await until(() => ev('typeof BARRY') === 'object'
                    && ev('BARRY.state.catalog'), 30000);
  ev("setView('sessions')");
  const back = await until(() => $$('.sess-card').length > 0, 15000);
  await sleep(700);
  say('  cards after a refresh: ' + $$('.sess-card').length, 'note');
  check('the page is not empty after a refresh', back,
        $$('.sess-card').length + ' cards');
  check('and they come back faint, since no scan has run yet',
        $$('.sess-card').length > 0
        && $$('.sess-card.remembered').length === $$('.sess-card').length,
        $$('.sess-card.remembered').length + ' of ' + $$('.sess-card').length);

  say('');
  say('=== a second scan does not duplicate anything ===', 'hd');
  const n1 = afterRows.length;
  $$('#sessModeSeg button').find((b) => b.dataset.mode === 'scan').click();
  await sleep(400);
  $('#rootGo').click();
  await until(
    () => /session\(s\) in/.test(($('#scanStatus') || {}).textContent || ''),
    120000);
  await sleep(1500);
  const twice = await (await fetch('/api/registry')).json();
  const n2 = (twice.tree || [])
    .flatMap((p) => p.mice.flatMap((m) => m.sessions)).length;
  check('the count is unchanged', n2 === n1, n1 + ' -> ' + n2);

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'scanreg: ' + fails + ' FAILED' : 'scanreg: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'scanreg CRASH'; });
</script></body></html>

<!doctype html>
<meta charset="utf-8">
<title>Pose — Avery sweep</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100vw;height:100vh;display:block}#out{display:none}</style>
<div id="out"></div>
<iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* POSE, for screenshots: Avery's sweep screen with a faked server, left
   open. `?at=scan` stops while it is scanning; anything else runs on to
   the summary. Never reads, trains or writes. */
/* (The fake data below is the harness's, avery.html.)

   Every /api/avery* and /api/cfc/* request the panel makes is answered here,
   so the harness never reads a recording, never trains, never writes a
   label or a bank version -- it checks the screen: the confirm dialog says
   what it will do, starting shows the scanner, the scanner scans real
   samples and stamps the verdicts it is given, the summary counts what it
   was told and lists every candidate, a tile filters the list, and Accept
   posts once and hands control back. */
const out = document.getElementById('out');
let bad = 0;
const say = (c, m) => { const d = document.createElement('div');
                        d.className = c; d.textContent = m;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const check = (n, c, d) => say(c ? 'ok' : 'bad',
                               n + (c || !d ? '' : '   [' + d + ']'));
const head = (t) => { const h = document.createElement('h2');
                      h.textContent = t; out.appendChild(h); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, tries = 300, gap = 100) {
  for (let i = 0; i < tries; i++) {
    try { const v = fn(); if (v) return v; } catch (e) { /* not yet */ }
    await sleep(gap);
  }
  return null;
}

const wave = (k, sign) => Array.from({ length: 51 }, (_, i) =>
  +(Math.exp(-((i - 25) ** 2) / (8 + k)) * sign
    + 0.05 * Math.sin(i / 3)).toFixed(3));
const LABS = ['spike', 'review', 'flag', 'garbage'];
const CHANS = (k) => Array.from({ length: 32 }, (_, c) =>
  wave(k, 1).map((v, i) => +(v * 300 * Math.exp(-((c - 20) ** 2) / 40)
                         - 40 * Math.exp(-((c - 9) ** 2) / 20) * Math.sin(i / 4)).toFixed(1)));
const SAMPLES = Array.from({ length: 12 }, (_, k) => ({
  i: k * 3, id: 'e' + k, t: 10 + k * 11.1, wave: wave(k, 1),
  channels: CHANS(k), channel_numbers: Array.from({ length: 32 }, (_, c) => 2 * c + 2),
  csd: wave(k + 3, -1).map((v) => Math.abs(v)), profile: [],
  readouts: { amp_uv: 300 + k * 10, half_width_ms: 14.2, rise_ms: 12,
              csd_peak: 2.1, common_mode: 0.31, mua: 0.2, likeness: 0.6 },
  p: null, label: null }));
const ROWS = Array.from({ length: 40 }, (_, k) => ({
  id: 'e' + k, start: 5 + k * 3.3, p: +(1 - k / 40).toFixed(3),
  label: k < 18 ? 'spike' : k < 21 ? 'review' : k < 37 ? 'flag' : 'garbage',
  readable: true, human: k % 9 === 0 ? 'spike' : null,
  human_by: k % 9 === 0 ? 'A person' : null }));
const COUNTS = { spike: 18, review: 3, flag: 16, garbage: 3 };
const RESULT = {
  id: 'job1', gid: 'demo-ds-tutorial', kind: 'ds', set_name: 'Fake set',
  run_id: 'aiFAKE', n: 40, n_readable: 40, counts: COUNTS,
  already_decided: 5, agreement: { compared: 5, agree: 4 },
  label_colors: {}, rows: ROWS,
  samples: SAMPLES.map((s, k) => Object.assign({}, s,
    { p: +(0.9 - k * 0.07).toFixed(2), label: LABS[k % 4] })),
  held_out: { spike: { n: 100, n_ds: 99, n_garbage: 1 },
              garbage: { n: 10, n_ds: 1, n_garbage: 9 },
              review: { n: 5, n_ds: 4, n_garbage: 1 },
              flag: { n: 50, n_ds: 30, n_garbage: 20 } },
};

const TOLS = [0.05, 0.10, 0.15, 0.20, 0.25, 0.30].map((L, k) => ({
  ds_loss: L, garbage_cleaned: [0.551, 0.708, 0.82, 0.888, 0.942, 0.963][k],
  garbage_left: [0.439, 0.282, 0.169, 0.102, 0.048, 0.026][k],
  garbage_into_ds: 0.011, ds_called_garbage: L,
  flagged: [0.37, 0.307, 0.25, 0.198, 0.148, 0.101][k] }));

(async () => {
  const Q = new URLSearchParams(location.search);
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = () => f.contentWindow;
  await untilN(() => typeof W().setView === 'function');
  let polls = 0;
  const realFetch = W().fetch.bind(W());
  const reply = (obj) => Promise.resolve(new (W().Response)(JSON.stringify(obj),
    { status: 200, headers: { 'Content-Type': 'application/json' } }));
  W().fetch = (url, opts) => {
    const u = String(url);
    if (u === '/api/avery') {
      const b = { ready: true, model: 'forest', n_recordings: 45, garbage_caught: 0.9853, ds_flagged: 0.4285 };
      return reply(Object.assign({ ok: true, running: null }, b, { run_id: 'ai20261002-190224-c618', models: {
        avery: Object.assign({}, b, { name: 'Avery', run_id: 'ai20261002-190224-c618', families: new Array(14).fill('x'), garbage_into_ds: 0.011, garbage_called_garbage: 0.013, ds_called_garbage: 0.0002, flagged_share: 0.45 }),
        avery_plus: Object.assign({}, b, { name: 'Avery+', run_id: 'aiPLUS', families: new Array(16).fill('x'), garbage_into_ds: 0.012, garbage_called_garbage: 0.61, ds_called_garbage: 0.05, flagged_share: 0.2, tolerances: TOLS, default_tolerance: 0.2 }),
        avery_gd: Object.assign({}, b, { name: 'Avery Garbage Dystrophy+', model: 'hgb', run_id: 'aiGD', families: new Array(17).fill('x'), garbage_into_ds: 0.011, garbage_called_garbage: 0.6, ds_called_garbage: 0.05, flagged_share: 0.2, tolerances: TOLS, default_tolerance: 0.2 }) } }));
    }
    if (u === '/api/avery/sweep') return reply({ ok: true, job: { id: 'job1', status: 'running', stages: [], preview_rev: 0 } });
    if (u.startsWith('/api/cfc/job/job1')) {
      polls += 1;
      const done = Q.get('at') !== 'scan' && polls > 6;
      return reply({ ok: true, job: { id: 'job1', status: done ? 'done' : 'running',
        preview_rev: polls >= 2 ? 1 : 0, elapsed: 30 + polls, eta_s: 50,
        stages: [{ name: 'avery read', of: 27, done: 27, status: 'done', unit: 'stretches' },
                 { name: 'avery physio', of: 41, done: Math.min(41, 12 + polls * 2), status: done ? 'done' : 'running', unit: 'stretches' },
                 { name: 'avery score', of: 40, done: done ? 40 : 0, status: done ? 'done' : 'waiting' }] } });
    }
    if (u.startsWith('/api/avery/sweep/job1/peek')) return reply({ ok: true, rev: 1, peek: { stage: 'physio', samples: SAMPLES } });
    if (u.startsWith('/api/cfc/result/job1')) return reply({ ok: true, result: Object.assign({}, RESULT, { label_colors: { spike: '#2f9e6e', garbage: '#dc2626', flag: '#E5A823', review: '#8b5cf6' } }) });
    return realFetch(url, opts);
  };
  W().eval(`BARRY.avery.open({ gid: 'demo-ds-tutorial', kind: 'ds', name: 'PTEN m22 s3 2024-07-15 (fake numbers)', n: 40, decided: 5, colors: { spike: '#2f9e6e', garbage: '#dc2626', flag: '#E5A823', review: '#8b5cf6' } });`);
  const go = await untilN(() => Array.from(f.contentDocument.querySelectorAll('#bigModal button')).find((b) => b.textContent.trim() === 'Start the sweep'));
  if (Q.get('at') === 'confirm') { document.title = 'posed'; return; }
  go.click();
  if (Q.get('at') === 'stamp') {
    await untilN(() => { const x = f.contentDocument.getElementById('averyStamp');
                         return x && x.classList.contains('hit'); }, 900);
    await sleep(250);
    document.title = 'posed';
    return;
  }
  if (Q.get('at') === 'feed') {
    await untilN(() => f.contentDocument.querySelectorAll('#averyLog.stream .avery-logline').length >= 25, 900);
    document.title = 'posed';
    return;
  }
  if (Q.get('at') !== 'scan') {
    const skip = await untilN(() => Array.from(f.contentDocument.querySelectorAll('#averyOv button')).find((b) => /Skip/.test(b.textContent)), 900);
    if (skip) { await sleep(2500); skip.click(); }
  }
  document.title = 'posed';
})();
</script>

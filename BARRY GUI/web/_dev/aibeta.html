<!doctype html>
<meta charset="utf-8">
<title>Harness — Checkup's AI Beta</title>
<style>
  body { font: 12px/1.55 ui-monospace, monospace; margin: 0; background: #0c0f14;
         color: #dfe6ee; }
  #out { padding: 12px 16px; width: 56vw; }
  iframe { position: fixed; right: 0; top: 0; width: 44vw; height: 100vh;
           border: 0; border-left: 1px solid #243; }
  .ok::before { content: 'ok    '; color: #7fe3b0; }
  .bad::before { content: 'FAIL  '; color: #ff8a7a; }
  .bad { color: #ffb0a5; }
  .note { color: #7593a2; }
  h2 { font-size: 12px; margin: 14px 0 5px; color: #ffb81c; }
</style>
<div id="out"></div>
<iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* Checkup's AI Beta: the switch, the panel, and that it changes nothing.

   What is checked:
     - Checkup's header carries a Sets | AI Beta switch, and the choice is
       remembered across a reopen;
     - the panel states what it learns from, and its counts are the
       server's own;
     - the primary names what it will do, and is refused with no inputs;
     - the cost line fills in;
     - the newest run, if there is one, is summarised from its record;
     - switching back puts the sets back, and no AI panel is left behind.

   It never trains: a POST to /api/aibeta/train is intercepted and counted,
   and the count must be zero. Training reads every labelled recording and
   is minutes of disk; tools/check_aibeta.py checks the arithmetic.

   The stored pane is read first and put back in a `finally`, never
   cleared -- clearing a preference to get a known start is how a harness
   deletes somebody's setting. ToolKit renders twice, so every node is
   found again after it settles and asserted to be connected. */
const out = document.getElementById('out');
let bad = 0;
const say = (c, m) => { const d = document.createElement('div');
                        d.className = c; d.textContent = m;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const check = (n, c, d) => say(c ? 'ok' : 'bad',
                               n + (c || !d ? '' : '   [' + d + ']'));
const head = (t) => { const h = document.createElement('h2');
                      h.textContent = t; out.appendChild(h); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, tries = 300, gap = 100) {
  for (let i = 0; i < tries; i++) {
    try { const v = fn(); if (v) return v; } catch (e) { /* not yet */ }
    await sleep(gap);
  }
  return null;
}
const KEY = 'barry.checkupPane';

(async () => {
  const f = document.getElementById('app');
  let saved = null;
  let W = null;
  try {
    await new Promise((r) => f.addEventListener('load', r, { once: true }));
    W = () => f.contentWindow;
    const D = () => f.contentDocument;
    const ready = await untilN(() => typeof W().setView === 'function');
    check('the application loads', !!ready, 'no setView after 30s');
    if (!ready) { document.title = 'FAIL'; return; }

    try { saved = W().localStorage.getItem(KEY); } catch (e) { saved = null; }

    /* Count any attempt to train. */
    const trains = [];
    const trainBodies = [];
    const realFetch = W().fetch.bind(W());
    W().fetch = (url, opts) => {
      if (String(url).indexOf('/api/aibeta/train') >= 0) {
        trains.push(url);
        try { trainBodies.push(JSON.parse((opts && opts.body) || '{}')); }
        catch (e) { trainBodies.push({}); }
        return Promise.resolve(new W().Response(
          JSON.stringify({ ok: false, error: 'blocked by the harness' }),
          { status: 400, headers: { 'Content-Type': 'application/json' } }));
      }
      return realFetch(url, opts);
    };

    const openCheckup = async () => {
      W().setView('toolkit');
      await untilN(() => D().querySelectorAll('.tk-step').length);
      const btn = Array.from(D().querySelectorAll('.tk-step')).find(
        (x) => ((x.querySelector('strong') || {}).textContent || '')
                 .trim() === 'Checkup');
      if (btn) btn.click();
      return !!btn;
    };

    /* ---- precondition: Sets showing ---- */
    head('the switch');
    W().localStorage.setItem(KEY, 'sets');
    check('Checkup has a step button', await openCheckup());
    const sw = await untilN(() => {
      const s = D().querySelector('#tkResult .tk-head .seg.cur-pane');
      return s && s.isConnected ? s : null;
    });
    check('the header carries a Sets | AI Beta switch', !!sw);
    if (!sw) throw new Error('no switch');
    await sleep(600);
    const sw2 = D().querySelector('#tkResult .tk-head .seg.cur-pane');
    const labels = Array.from(sw2.querySelectorAll('button'))
      .map((b) => b.textContent.trim());
    check('it offers exactly Sets and AI Beta',
          labels.join('|') === 'Sets|AI Beta', labels.join('|'));
    const act = sw2.querySelector('button.active');
    check('Sets is the one showing', act && act.textContent.trim() === 'Sets',
          act && act.textContent);
    check('no AI panel while Sets shows', !D().getElementById('aiBeta'));

    /* ---- AI Beta ---- */
    head('AI Beta');
    Array.from(sw2.querySelectorAll('button'))
      .find((b) => b.textContent.trim() === 'AI Beta').click();
    const intro = await untilN(() => {
      const n = D().querySelector('#aiBeta .ai-intro');
      return n && n.isConnected ? n : null;
    }, 400);
    check('the AI Beta panel draws', !!intro, 'no .ai-intro after 40s');
    if (!intro) throw new Error('no panel');
    check('the choice is stored', W().localStorage.getItem(KEY) === 'ai',
          W().localStorage.getItem(KEY));
    check('the set controls are not offered here',
          !Array.from(D().querySelectorAll('#tkResult .tk-head button'))
            .some((b) => /New curation set|Hall of garbage/.test(b.textContent)));

    const state = await (await realFetch('/api/aibeta/state')).json();
    check('the state route answers', state && state.ok, state && state.error);
    const sm = state.summary || {};
    const chips = Array.from(D().querySelectorAll('#aiBeta .ai-intro .stat-chip'))
      .map((c) => c.textContent.trim());
    const fmt = (x) => Number(x).toLocaleString();
    check('it states the recordings it learns from',
          chips.some((c) => c === sm.n_recordings + ' recordings'
                         || c === sm.n_recordings + ' recording'), chips.join(' · '));
    check('and the mice', chips.some((c) => c.startsWith(sm.n_mice + ' mice')
                                        || c === sm.n_mice + ' mouse'),
          chips.join(' · '));
    check('and the DS and Garbage counts, as the server counts them',
          chips.includes(fmt(sm.n_ds) + ' DS')
          && chips.includes(fmt(sm.n_garbage) + ' Garbage'), chips.join(' · '));
    check('no recording rejected whole is learned from',
          (state.entries || []).every((e) => e.n_ds > 0),
          (state.entries || []).filter((e) => !e.n_ds).map((e) => e.label)
            .join(', '));
    check('every entry left out says why',
          (state.skipped || []).every((s) => s.why && s.why.length > 10),
          (state.skipped || []).filter((s) => !s.why).map((s) => s.label)
            .join(', '));
    check('every entry learned from is a settled one with both counts',
          (state.entries || []).every((e) => e.n === e.n_ds + e.n_garbage
                                             && e.version_name),
          'an entry whose counts do not add up');

    const go = D().getElementById('aiTrain');
    check('the primary names what it will do',
          go && go.textContent.trim() === 'Train and test on '
                + state.entries.length + ' recordings',
          go && go.textContent);
    check('it is the only primary on the panel',
          D().querySelectorAll('#aiBeta button.btn:not(.ghost)').length === 1,
          D().querySelectorAll('#aiBeta button.btn:not(.ghost)').length);

    /* Every input off: the run is refused before it is asked for. */
    const boxes = Array.from(D().querySelectorAll('#aiBeta .ai-toggles input'));
    check('one toggle per kind of input',
          boxes.length === (state.families || []).length, boxes.length);
    const wasOn = boxes.map((b) => b.checked);
    for (const b of Array.from(D().querySelectorAll('#aiBeta .ai-toggles input'))) {
      if (b.checked) { b.click(); await sleep(50); }
    }
    for (let i = 0; i < 20; i++) {
      const left = Array.from(D().querySelectorAll('#aiBeta .ai-toggles input'))
        .find((b) => b.checked);
      if (!left) break;
      left.click(); await sleep(50);
    }
    const goOff = D().getElementById('aiTrain');
    check('with no inputs, the run cannot be started', goOff && goOff.disabled);
    /* Put the inputs back the way they were. */
    const now = Array.from(D().querySelectorAll('#aiBeta .ai-toggles input'));
    for (let i = 0; i < now.length; i++) {
      const b = Array.from(D().querySelectorAll('#aiBeta .ai-toggles input'))[i];
      if (wasOn[i] && !b.checked) { b.click(); await sleep(50); }
    }
    const back = Array.from(D().querySelectorAll('#aiBeta .ai-toggles input'))
      .map((b) => b.checked);
    check('the inputs are as they were', back.join() === wasOn.join(),
          back.join() + ' vs ' + wasOn.join());

    /* Which channels: all, or the even ones only, and the run is asked
       for with the one chosen. */
    const chanSeg = () => Array.from(D().querySelectorAll('#aiBeta .ui-field'))
      .find((f) => /^Channels$/i.test((f.querySelector('.section-label') || {})
        .textContent || ''));
    const cs = chanSeg();
    const csBtns = cs ? Array.from(cs.querySelectorAll('.seg button')) : [];
    check('it offers all channels or the even ones only',
          csBtns.map((b) => b.textContent.trim()).join('|') === 'All|Even only',
          csBtns.map((b) => b.textContent.trim()).join('|'));
    check('all of them to start with',
          !!cs && (cs.querySelector('.seg .active') || {}).textContent === 'All');
    if (csBtns[1]) csBtns[1].click();
    await sleep(200);
    const goEven = D().getElementById('aiTrain');
    if (goEven && !goEven.disabled) goEven.click();
    const sent = await untilN(() => trainBodies.length, 100);
    check('training is asked for with even channels only',
          !!sent && trainBodies[trainBodies.length - 1].channels === 'even',
          JSON.stringify(trainBodies[trainBodies.length - 1] || null));
    const allBtn = chanSeg() && chanSeg().querySelector('.seg button');
    if (allBtn) allBtn.click();
    await sleep(200);
    check('and back to all of them',
          (chanSeg().querySelector('.seg .active') || {}).textContent === 'All');

    const plan = await untilN(() => {
      const p = D().getElementById('aiPlan');
      const t = p ? p.textContent : '';
      return t && !/Checking/.test(t) ? t : null;
    }, 900);
    check('the cost line fills in', !!plan, 'still checking');
    if (plan) {
      check('and says what is read and what training costs',
            /already read|to read/.test(plan) && /training about/.test(plan),
            plan);
    }

    /* ---- a run, if there is one ---- */
    head('the newest run');
    if (!(state.runs || []).length) {
      say('note', 'no run on this machine yet; the summary is not checked');
      const empty = D().querySelector('#aiResults .empty-state');
      check('an empty panel says what to do next',
            empty && /Train and test/.test(empty.textContent),
            empty && empty.textContent);
    } else {
      const r0 = state.runs[0];
      const lede = await untilN(() => {
        const n = D().querySelector('#aiResults .ai-result .ai-lede');
        return n && n.isConnected ? n : null;
      }, 400);
      check('the newest run is summarised', !!lede);
      if (lede) {
        const want = (100 * r0.ds_kept_frac).toFixed(1) + '%';
        check('in its own numbers: DS kept ' + want,
              lede.textContent.indexOf(want) >= 0, lede.textContent);
        const g = (100 * r0.garbage_caught_frac).toFixed(1) + '%';
        check('and garbage caught ' + g, lede.textContent.indexOf(g) >= 0,
              lede.textContent);
        check('it says the mice were never seen',
              /mice it never saw|mouse it never saw/.test(lede.textContent));
      }
      const rows = D().querySelectorAll('#aiResults .ai-result table tbody tr');
      check('one row per held-out fold', rows.length >= 2, rows.length);
      const runRows = D().querySelectorAll('#aiBeta .ai-runs tbody tr');
      check('every run is listed', runRows.length === state.runs.length,
            runRows.length + ' of ' + state.runs.length);
      check('the one shown is marked',
            D().querySelector('#aiBeta .ai-runs tbody tr.ai-on') !== null);
    }

    /* ---- remembered, and back ---- */
    head('remembered, and back');
    W().setView('pipeline');
    await sleep(300);
    await openCheckup();
    const again = await untilN(() => {
      const n = D().querySelector('#aiBeta .ai-intro');
      return n && n.isConnected ? n : null;
    }, 300);
    check('reopening Checkup comes back to AI Beta', !!again);
    const sw3 = await untilN(() =>
      D().querySelector('#tkResult .tk-head .seg.cur-pane'));
    Array.from(sw3.querySelectorAll('button'))
      .find((b) => b.textContent.trim() === 'Sets').click();
    const sets = await untilN(() => {
      const t = D().querySelector('#tkResult');
      return t && !D().getElementById('aiBeta')
        && (t.querySelector('.cur-bench') || t.querySelector('.tk-empty')
            || t.querySelector('.tk-loading')) ? t : null;
    }, 300);
    check('Sets puts the sets back, and the AI panel is gone', !!sets);
    // The one the channel check asked for, which the harness blocked.
    check('nothing else tried to train', trains.length === 1,
          trains.join(', '));
  } catch (e) {
    say('bad', 'harness threw: ' + e.message);
  } finally {
    try {
      if (W) {
        if (saved === null) W().localStorage.removeItem(KEY);
        else W().localStorage.setItem(KEY, saved);
      }
    } catch (e) { /* ignore */ }
    head(bad === 0 ? 'AI Beta: all checks passed' : bad + ' failed');
    document.title = bad === 0 ? 'ok' : 'FAIL ' + bad;
    /* The app's own polling pins the runner's virtual time to the wall;
       blank the frame so the run can end. */
    f.src = 'about:blank';
  }
})();
</script>

<!doctype html>
<html><head><meta charset="utf-8"><title>checkupreach: running</title>
<style>body{font:12px/1.5 ui-monospace,Consolas,monospace;background:#0a1310;color:#dfeae4;margin:0;display:flex}
#log{width:820px;padding:10px;overflow:auto;height:100vh;white-space:pre}
iframe{flex:1;height:100vh;border:0}
.ok{color:#5cc98d}.bad{color:#ff6b5e}.hd{color:#FFB81C}.dim{color:#6f8c7d}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
/* Checkup's open buttons ask the same question the open does (2026-10-13).

   WHAT WENT WRONG
   Isabella, on a machine with no copy of PTEN_DKO m44 s1, found its set on
   the bench with "Look again…" greyed out. The card asked
   `session.reachable` -- "on a drive this computer mounts" and nothing
   else -- while Checkup itself opens a recording through
   `BARRY.vacc.reachFor`, this computer first and the cluster second, and
   the cluster reads that recording in place on netfiles. The button said
   no to something the open would have done.

   HOW IT IS SHOWN HERE
   This machine HAS a copy, so the card is shown as Isabella's machine sees
   it: the curation list is answered with that set's drive paths taken
   away (`here` empty, `reachable` false) and the set put on the bench. The
   cluster's answer about the recording is this machine's real one, and is
   checked first rather than assumed. Beside it, a set whose recording
   nobody can reach, which must stay greyed with the reason; and a copy on
   the shelf, for the shelf's arrow.

   IT WRITES NOTHING. Only the list's answer is changed, in this page; no
   set is opened, picked up or put down, and preference writes are held. */
const L = document.getElementById('log');
let pass = 0, fail = 0;
const say = (s, cls) => {
  const n = document.createElement('span');
  if (cls) n.className = cls;
  n.textContent = s + '\n';
  L.appendChild(n);
  L.scrollTop = L.scrollHeight;
};
const head = (s) => { say(''); say(s, 'hd'); say('-'.repeat(66), 'dim'); };
const ok = (name, good, why) => {
  if (good) { pass++; say('  ok   ' + name, 'ok'); }
  else { fail++; say('  FAIL ' + name + (why ? '\n       ' + why : ''), 'bad'); }
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms, what) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 15000)) {
    try { if (await fn()) return true; } catch (e) { /* not yet */ }
    await sleep(150);
  }
  say('       timed out waiting for ' + (what || 'something'), 'dim');
  return false;
}

const GID = 'sd699dd1d187e';            // PTEN_DKO m44 s1 2024-11-11
const NOWHERE = 'sharnessnowhere';

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  await until(() => ev('typeof BARRY') === 'object' && ev('!!BARRY.state')
              && ev('!!(BARRY.vacc && BARRY.prefs)'), 25000, 'the app to boot');
  ev('(function(){ var P = BARRY.prefs; window.__crSet = P.set;'
     + ' P.set = function(k, v) { return v; }; })()');
  try {
    head('THE PRECONDITION: WHAT THE CLUSTER MAKES OF THE RECORDING');
    await ev('BARRY.vacc.loadKnows(true)');
    const kn = ev('JSON.parse(JSON.stringify(BARRY.vacc.of({ gid: "' + GID + '" }) || null))');
    const conf = !!ev('BARRY.vacc.last && BARRY.vacc.last.configured');
    ok('the cluster reads PTEN_DKO m44 s1 in place, and this computer has a '
       + 'VACC account', !!kn && kn.readable === true && conf,
       JSON.stringify(kn) + ' configured ' + conf);

    /* The list as a machine without the drive sees it. */
    ev('(function(){ var W = window; W.__crFetch = W.fetch; W.fetch = function(u, o) {'
       + ' var s = String(u).split("?")[0];'
       + ' if (!/\\/api\\/curation$/.test(s) || (o && o.method && o.method !== "GET"))'
       + '   return W.__crFetch.apply(this, arguments);'
       + ' return W.__crFetch.apply(this, arguments).then(function(r) { return r.json(); })'
       + '  .then(function(j) {'
       + '   var sets = j.sets || []; var keep = [];'
       + '   sets.forEach(function(st) {'
       + '     if (st.gid === "' + GID + '" && st.kind === "ds") {'
       + '       var away = JSON.parse(JSON.stringify(st));'
       + '       away.session = Object.assign({}, away.session || {}, { here: [], loadable: [], reachable: false });'
       + '       away.open = true; away.archived = false; keep.push(away);'
       + '       var shelf = JSON.parse(JSON.stringify(away));'
       + '       shelf.kind = "harness"; shelf.name = "Harness shelf copy of m44 s1"; shelf.open = false;'
       + '       keep.push(shelf);'
       + '       var none = JSON.parse(JSON.stringify(away));'
       + '       none.gid = "' + NOWHERE + '"; none.name = "Harness: reachable nowhere";'
       + '       none.session = Object.assign({}, none.session, { gid: "' + NOWHERE + '", label: "nowhere" });'
       + '       keep.push(none);'
       + '     } else keep.push(st); });'
       + '   j.sets = keep;'
       + '   return new Response(JSON.stringify(j), { status: 200,'
       + '     headers: { "Content-Type": "application/json" } }); }); }; })()');
    ev('(function(){ try { localStorage.setItem("barry.checkupPane", "sets"); } catch (e) {} })()');

    head('CHECKUP, AS A MACHINE WITHOUT THE DRIVE SEES IT');
    ev('setView("toolkit")');
    await until(() => D().querySelectorAll('.tk-step').length, 15000, 'the ToolKit');
    const step = [...D().querySelectorAll('.tk-step')]
      .find((x) => ((x.querySelector('strong') || {}).textContent || '').trim() === 'Checkup');
    if (step) step.click();
    const card = (txt) => [...D().querySelectorAll('.cur-set')]
      .find((c) => (c.querySelector('.cur-set-top strong') || {}).textContent
                   && c.querySelector('.cur-set-top strong').textContent.indexOf(txt) >= 0);
    await until(() => card('PTEN_DKO m44 s1') && card('Harness: reachable nowhere'),
                30000, 'the bench');
    const go = (c) => c && [...c.querySelectorAll('.cur-set-acts .btn')]
      .find((b) => /^(Carry on|Look again)/.test(b.textContent));
    const m44 = go(card('PTEN_DKO m44 s1'));
    ok('its recording is not on this computer, as on hers, and the set is on '
       + 'the bench', !!m44);
    ok('“Look again…” can be pressed: Checkup opens it off the cluster',
       !!m44 && !m44.disabled, m44 && m44.title);
    ok('and says it will, and what that costs',
       !!m44 && /off the cluster/.test(m44.title) && /round trip/.test(m44.title),
       m44 && m44.title);
    const nowhere = go(card('Harness: reachable nowhere'));
    ok('a set whose recording nobody can reach stays greyed',
       !!nowhere && nowhere.disabled);
    ok('and says why in the reach’s own words, not only “not on a drive”',
       !!nowhere && /VACC cannot read it either/.test(nowhere.title),
       nowhere && nowhere.title);

    head('THE SHELF’S ARROW, THE SAME WAY');
    const shelfRow = () => [...D().querySelectorAll('.cur-shelf-row')]
      .find((r) => /Harness shelf copy of m44 s1/.test(r.textContent));
    // The shelf is folded until asked for: unfold it once.
    if (!shelfRow()) {
      const pick = D().querySelector('.cur-shelf-toggle');
      if (pick && !pick.classList.contains('on')) pick.click();
    }
    await until(() => shelfRow(), 10000, 'the shelf row');
    const arrow = shelfRow() && shelfRow().querySelector('.icon-only');
    ok('the shelf’s “go straight to the recording” arrow can be pressed',
       !!arrow && !arrow.disabled, arrow ? arrow.title : 'no row');
    ok('and says it reads off the cluster', !!arrow && /off the cluster/.test(arrow.title),
       arrow && arrow.title);
  } catch (err) {
    fail++;
    say('  FAIL the suite threw and stopped here', 'bad');
    say('       ' + (err && err.message ? err.message : String(err)), 'bad');
  }
  // The page is unloaded with the stubs in place: nothing after this runs.
  say('');
  say('  ' + pass + ' ok, ' + fail + ' fail', fail ? 'bad' : 'ok');
  document.title = 'checkupreach: ' + pass + ' ok, ' + fail + ' fail';
  try { frame.src = 'about:blank'; } catch (e) { /* ok */ }
})();
</script></body></html>

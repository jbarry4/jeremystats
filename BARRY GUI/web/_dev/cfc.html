<!doctype html>
<meta charset="utf-8">
<title>Harness — CFCScope</title>
<style>
 html,body{margin:0;font:12px/1.6 ui-monospace,monospace;background:#0c0f14;color:#dfe6ee}
 #out{padding:12px 16px;width:44vw;white-space:pre-wrap}
 iframe#app{position:fixed;right:0;top:0;width:56vw;height:100vh;border:0;border-left:1px solid #243}
</style>
<div id="out"></div><iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* CFCScope is the mode that decides nothing, so unlike the curation and
   layer harnesses this one has nothing to put back afterwards -- which is
   itself one of the things it checks.

   What it is actually here to catch, in order of how much it would hurt:

     * The band panel silently falling back to one wide 4-12 Hz filter. That
       is the trap the whole feature exists to avoid, and a regression to it
       would look completely normal on screen.
     * The realised bandwidth going unreported. The panel implies seventeen
       independent measurements and they overlap; the line that says so is
       load-bearing, not decoration.
     * The stage list lying. A progress display that reports stages it never
       entered, or times of zero, is worse than a spinner, because a spinner
       does not claim to know anything.
     * Cancel not landing. Half a minute of arithmetic you cannot stop is
       half a minute of a frozen tool.
*/
const out = document.getElementById('out');
const p = (m) => { out.textContent += m + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, t = 300, g = 100) {
  for (let i = 0; i < t; i++) {
    try { if (fn()) return i; } catch (e) { /* not yet */ }
    await sleep(g);
  }
  return -1;
}
let bad = 0;
let ran = 0;
const ck = (n, c, d) => {
  ran++;
  p((c ? 'ok    ' : 'FAIL  ') + n + (c || !d ? '' : '   [' + d + ']'));
  if (!c) bad++;
};
const hd = (t) => p('\n== ' + t + ' ==');

(async () => {
  const f = document.getElementById('app');
  const W = () => f.contentWindow;

  /* Into the frame's own scope. `const BARRY` in core.js is a lexical
     binding, not a property of window, so `W().BARRY` is undefined however
     well the app has loaded -- which reads exactly like the app failing to
     boot. `check.html` has done it this way from the start. */
  const ev = (code) => W().eval(code);

  const post = (u, b) => W().fetch(u, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(b || {}),
  }).then((r) => r.json());
  const get = (u) => W().fetch(u).then((r) => r.json());

  await untilN(() => ev('typeof BARRY !== "undefined" && !!BARRY.cfc '
                        + '&& !!(BARRY.views && BARRY.views.xplore)'));
  ck('the app and the mode are loaded',
     ev('typeof BARRY !== "undefined" && !!BARRY.cfc'));

  const SESSION = new URLSearchParams(location.search).get('session')
                  || 'demo:long-session';

  /* ---------------------------------------------------------------- */
  hd('the panel is registered');
  const panels = await get('/api/panels');
  const ids = (panels.panels || []).map((x) => x.id);
  ck('bandpower is a panel the client can offer', ids.includes('bandpower'),
     ids.join(','));
  const def = (panels.panels || []).find((x) => x.id === 'bandpower');
  ck('it declares itself single-channel', !!(def && def.single_channel));
  ck('a sequential colormap is offered for the map',
     (panels.colormaps || []).some((c) => c.id === 'seqblue'));

  /* ---------------------------------------------------------------- */
  hd('band-resolved power, not one wide filter');
  const bp = await post('/api/panel', {
    path: SESSION, panel: 'bandpower', channel: 0, t0: 20, t1: 40,
  });
  ck('the panel renders', bp.ok === true, bp.error || '');
  if (bp.ok) {
    ck('seventeen bands across theta', bp.bands === 17, String(bp.bands));
    ck('centres are the band middles, 4.25 to 12.25',
       bp.centers[0] === 4.25 && bp.centers[bp.centers.length - 1] === 12.25,
       bp.centers[0] + '..' + bp.centers[bp.centers.length - 1]);
    ck('the image has one row per band',
       bp.shape && bp.shape[0] === 17, JSON.stringify(bp.shape));
    ck('a marginal profile comes back for the curve',
       Array.isArray(bp.profile) && bp.profile.length === 17,
       String((bp.profile || []).length));
    ck('the peak band is named', bp.peak_band >= 4.25 && bp.peak_band <= 12.25,
       bp.peak_band + ' Hz');

    /* The load-bearing honesty check. eegfilt's realised width is about
       0.30 x the low cutoff, so a 0.5 Hz band is 1.1-3.4 Hz. If this ever
       comes back equal to the nominal width, either the measurement broke or
       somebody swapped the filter -- and the panel would then be quietly
       claiming a resolution it does not have. */
    const rb = bp.realised_bw_range || [];
    ck('the realised bandwidth is reported, and is wider than asked for',
       rb.length === 2 && rb[0] > bp.nominal_bw * 1.5,
       'nominal ' + bp.nominal_bw + ' Hz, really ' + rb.join('-') + ' Hz');
    ck('the caption says the rows overlap',
       /overlap/i.test(bp.method || ''), bp.method || '');
    ck('the caption says the samples were anti-aliased',
       /anti-aliased/i.test(bp.method || ''), bp.method || '');
    ck('it decimated rather than filtering at the acquisition rate',
       bp.decimation > 1 && bp.fs_used < bp.fs_native,
       bp.fs_native + '->' + bp.fs_used + ' Hz');

    // Different bands must give different numbers. One wide filter applied
    // seventeen times would give seventeen identical rows, which is exactly
    // the regression worth catching.
    const spread = Math.max.apply(null, bp.profile)
                 / Math.max(Math.min.apply(null, bp.profile), 1e-9);
    ck('the bands differ from each other (not one filter repeated)',
       spread > 1.2, 'loudest / quietest = ' + spread.toFixed(2));
  }

  /* Short windows, and the ends of the recording.

     This is the failure a user actually hit: a 400 carrying scipy's "The
     length of the input vector x must be greater than padlen". eegfilt's
     tap count comes from the LOW cutoff, so a 4 Hz band needs 2.25 s of
     signal before filtfilt will run at all -- and the padding was capped at
     the window's own length, which is exactly backwards, since padding
     matters most when the window is small. A quarter-second window came out
     three samples short.

     Also checked at t=0 and at the very end, where the pad is clipped on one
     side and has to be taken back on the other. */
  for (const [t0, span, where] of [[100, 0.25, 'a quarter-second window'],
                                   [100, 0.05, 'a twentieth of a second'],
                                   [0, 0.5, 'the very start of the recording'],
                                   [899, 0.5, 'the very end of the recording']]) {
    const r = await post('/api/panel', {
      path: SESSION, panel: 'bandpower', channel: 0, t0: t0, t1: t0 + span,
      highpass: 7, lowpass: 70, notch: 60,
    });
    ck('band power survives ' + where, r.ok === true,
       (r.error || '').slice(0, 80));
  }

  /* And when the recording genuinely is too short for the band asked for,
     the refusal has to be in words a person can act on rather than scipy's
     complaint about vector lengths. */
  const absurd = await post('/api/panel', {
    path: SESSION, panel: 'bandpower', channel: 0, t0: 100, t1: 101,
    band_lo: 0.05, band_hi: 0.2, band_step: 0.05,
  });
  ck('an impossible band is refused in words, not in scipy',
     absurd.ok === false && /recording/i.test(absurd.error || '')
       && !/padlen/i.test(absurd.error || ''),
     (absurd.error || '(it succeeded)').slice(0, 90));

  const wide = await post('/api/panel', {
    path: SESSION, panel: 'bandpower', channel: 0, t0: 20, t1: 40,
    band_lo: 30, band_hi: 100, band_step: 5,
  });
  ck('the band axis can be moved off theta',
     wide.ok === true && wide.bands === 15, String(wide.bands || wide.error));

  /* ---------------------------------------------------------------- */
  hd('the cost is stated before anything runs');
  const e0 = await post('/api/cfc/estimate',
                        { path: SESSION, channel: 0, t0: 100, t1: 140, nsurr: 0 });
  const e50 = await post('/api/cfc/estimate',
                         { path: SESSION, channel: 0, t0: 100, t1: 140, nsurr: 50 });
  ck('the grid size is known up front', e0.cells === 629, String(e0.cells));
  ck('surrogates are shown to cost much more',
     e50.seconds > e0.seconds * 2,
     e0.seconds + ' s -> ' + e50.seconds + ' s');

  /* ---------------------------------------------------------------- */
  hd('the run, and what it says while it runs');
  const started = await post('/api/cfc/comodulogram', {
    path: SESSION, channel: 0, t0: 100, t1: 140, nsurr: 0, force: true,
  });
  ck('it comes back at once with a job rather than a map',
     !!(started.job && started.job.id), JSON.stringify(started).slice(0, 90));

  const jid = started.job && started.job.id;
  let snap = started.job, sawRunning = false, sawEta = false;
  const names = [];
  for (let i = 0; i < 900 && jid; i++) {
    const got = await get('/api/cfc/job/' + jid);
    snap = got.job;
    if (snap.stage && names.indexOf(snap.stage) < 0) names.push(snap.stage);
    if (snap.status === 'running') sawRunning = true;
    if (snap.eta_s != null) sawEta = true;
    if (snap.status !== 'running') break;
    await sleep(60);
  }
  ck('it reports itself as running while it runs', sawRunning);
  ck('it finishes', snap.status === 'done', snap.status + ' ' + (snap.error || ''));

  const stages = snap.stages || [];
  ck('every stage it planned was entered',
     stages.every((s) => s.status === 'done'),
     stages.map((s) => s.name + ':' + s.status).join(' '));
  ck('every stage reports a real time, not zero',
     stages.every((s) => typeof s.seconds === 'number' && s.seconds >= 0)
       && stages.some((s) => s.seconds > 0.01),
     stages.map((s) => s.name + ' ' + s.seconds + 's').join(', '));
  ck('every stage counted to its own total',
     stages.every((s) => s.done === s.of),
     stages.map((s) => s.done + '/' + s.of).join(' '));
  /* Units per stage, not one shared percentage. "23 / 37 bands" reads;
     "62%" hides that the next stage is thirty thousand things. */
  const units = Array.from(new Set(stages.map((s) => s.unit)));
  ck('stages count in their own units', units.length >= 3, units.join(','));
  const ordered = stages.slice().sort((a, b) => a.order - b.order)
    .map((x) => x.name);
  ck('the stages ran in the order they were planned in',
     ordered.join('>') === stages.map((x) => x.name).join('>'),
     ordered.join(' > '));
  ck('and the ones that were seen in flight were seen in that order',
     names.every((n, i) => i === 0 || ordered.indexOf(names[i - 1])
                                       < ordered.indexOf(n)),
     'saw ' + (names.join(' > ') || 'none mid-flight'));
  ck('an estimate of the time left was offered', sawEta);

  /* ---------------------------------------------------------------- */
  hd('the map');
  const res = (await get('/api/cfc/result/' + jid)).result;
  ck('the grid is 17 phase by 37 amplitude',
     res.mi.length === 17 && res.mi[0].length === 37,
     res.mi.length + 'x' + res.mi[0].length);
  ck('the peak sits on the axes',
     res.peak.slow >= 4.25 && res.peak.slow <= 12.25,
     res.peak.slow.toFixed(2) + ' Hz / ' + Math.round(res.peak.fast) + ' Hz');
  ck('the realised widths of both axes are reported',
     res.slow.realised_bw.length === 17 && res.fast.realised_bw.length === 37);
  /* The one a reader is most likely to get wrong: the top amplitude row is
     labelled 205 Hz and is about 60 Hz of spectrum. */
  ck('the top amplitude band is admitted to be far wider than nominal',
     res.fast.realised_bw[36] > 5 * res.fast.nominal_bw,
     res.fast.realised_bw[36].toFixed(1) + ' Hz, asked for '
       + res.fast.nominal_bw);
  ck('how many slow cycles were in the window is reported',
     res.cycles > 100, String(res.cycles));
  ck('no null was claimed when none was run', res.p === undefined);

  const again = await post('/api/cfc/comodulogram', {
    path: SESSION, channel: 0, t0: 100, t1: 140, nsurr: 0,
  });
  ck('asking twice does not compute twice', again.cached === true);

  /* ---------------------------------------------------------------- */
  hd('surrogates, and stopping them');
  const surr = await post('/api/cfc/comodulogram', {
    path: SESSION, channel: 0, t0: 300, t1: 360, nsurr: 100, force: true,
  });
  const sid = surr.job.id;
  await sleep(1800);                          // let it get into the work
  const mid = (await get('/api/cfc/job/' + sid)).job;
  ck('a long run says which stage it is on',
     mid.status !== 'running' || !!mid.stage, String(mid.stage));
  const before = mid.elapsed;
  await post('/api/cfc/job/' + sid + '/cancel', {});
  let after = mid;
  for (let i = 0; i < 400; i++) {
    after = (await get('/api/cfc/job/' + sid)).job;
    if (after.status !== 'running') break;
    await sleep(25);
  }
  ck('cancel stops it', after.status === 'canceled', after.status);
  ck('and stops it fast enough to feel instant',
     after.elapsed - before < 1.5,
     (after.elapsed - before).toFixed(2) + ' s of real server time');

  const small = await post('/api/cfc/comodulogram', {
    path: SESSION, channel: 0, t0: 400, t1: 430, nsurr: 10,
    slow_hi: 6, fast_hi: 60, force: true,
  });
  let ss = small.job;
  for (let i = 0; i < 900; i++) {
    ss = (await get('/api/cfc/job/' + small.job.id)).job;
    if (ss.status !== 'running') break;
    await sleep(60);
  }
  ck('a run with a null finishes', ss.status === 'done',
     ss.status + ' ' + (ss.error || ''));
  if (ss.status === 'done') {
    const r2 = (await get('/api/cfc/result/' + small.job.id)).result;
    const cells = r2.mi.length * r2.mi[0].length;
    ck('a p value per cell', r2.p.length * r2.p[0].length === cells);
    /* Ten surrogates cannot express a p below 1/11. A map that claimed
       p = 0.001 off ten shuffles would be inventing precision. */
    let lowest = 1;
    r2.p.forEach((row) => row.forEach((v) => { if (v < lowest) lowest = v; }));
    ck('no p smaller than the surrogate count allows',
       lowest >= r2.p_floor - 1e-9,
       'lowest ' + lowest.toFixed(4) + ', floor ' + r2.p_floor);
    ck('what chance alone would give is stated too',
       Math.abs(r2.expected_by_chance - 0.05 * cells) < 0.11,
       r2.n_significant + ' significant, ' + r2.expected_by_chance
         + ' expected');
  }

  /* ---------------------------------------------------------------- */
  hd('a window too short to mean anything is refused');
  const tiny = await post('/api/cfc/comodulogram', {
    path: SESSION, channel: 0, t0: 100, t1: 100.4, nsurr: 0, force: true,
  });
  let ts = tiny.job;
  for (let i = 0; i < 200; i++) {
    ts = (await get('/api/cfc/job/' + tiny.job.id)).job;
    if (ts.status !== 'running') break;
    await sleep(50);
  }
  ck('it fails rather than returning a map of noise', ts.status === 'failed',
     ts.status);
  ck('and the refusal explains itself in cycles',
     /cycles/.test(ts.error || ''), (ts.error || '').slice(0, 80));

  /* ---------------------------------------------------------------- */
  hd('entering and leaving the mode');
  /* Where the log had got to before any of this. Everything checked at the
     end is measured against it. */
  const preRows = ((await get('/api/activity?limit=1')).activity
                   || (await get('/api/activity?limit=1')).actions || []);
  const mark = (preRows[0] || {}).at || '';

  const okIn = await ev('BARRY.cfc.enter(' + JSON.stringify(SESSION) + ')');
  ck('the mode enters on a path', okIn === true);
  await untilN(() => ev('BARRY.cfc.active'));
  ck('it reports itself active', ev('BARRY.cfc.active') === true);
  ck('the banner names it',
     (W().document.getElementById('modeName') || {}).textContent === 'CFCScope',
     (W().document.getElementById('modeName') || {}).textContent);
  ck('the banner says nothing is saved',
     /nothing here is saved/i.test(
       (W().document.getElementById('modeWhat') || {}).textContent || ''),
     (W().document.getElementById('modeWhat') || {}).textContent);
  ck('its bar is up', !!W().document.getElementById('cfcBar'));
  /* The handle the comodulogram window reaches through. `BARRY` is a const
     and so invisible from another window; if this stops being a property,
     the pop-out silently loses touch with the view it is meant to follow. */
  ck('the mode publishes a handle another window can actually see',
     ev('!!(window.barryCfc && window.barryCfc.context)'));
  ck('and so does the comodulogram view',
     ev('!!(window.barryComod && window.barryComod.openerMoved)'));
  ck('the main window shows the traces',
     !!W().document.querySelector('#view-xplore canvas'));

  /* ---- a bandpower pane in THIS window, headers and all ----

     The gap that let a real bug through. Everything above drives the panel
     over the API or inside a pop-out, and the pop-out is opened with its
     headers folded away -- so nothing ever rendered a bandpower pane's own
     header in the main window. A block of panelSpec code had landed inside
     panelWord() instead, where the variable it assigns to does not exist,
     and every header render threw "ReferenceError: spec is not defined".
     Seventy-two checks passed over it. */
  ev('BARRY.views.xplore.setPanes([{panel:"traces"},{panel:"bandpower"}],'
     + '{col:1,row:0.45})');
  await sleep(400);
  ck('a bandpower pane can be put in the main window',
     ev('BARRY.views.xplore._paneCount ? true : true')
       && !!W().document.querySelector('#view-xplore'));

  /* panelWord names the pane's most important setting on its own button.
     Called on every render, and it is where the bug was. */
  const word = ev(
    'JSON.stringify((function(){ try { return {ok:true, w:'
    + 'BARRY.views.xplore._panelWord && BARRY.views.xplore._panelWord(1)}; }'
    + ' catch (e) { return {ok:false, err:String(e)}; } })())');
  const w = JSON.parse(word);
  ck('naming the pane does not throw', w.ok !== false, w.err || '');

  /* The end-to-end claim: a band axis set on the pane reaches the server.
     If panelSpec never gained the band fields, the server silently uses its
     own defaults and this comes back as 17 theta bands instead of 7. */
  ev('(function(){ var p = BARRY.views.xplore._pane && '
     + 'BARRY.views.xplore._pane(1); if (p) { p.band = {lo:30, hi:60, '
     + 'step:5, bw:0, scale:"log"}; } })()');
  ev('BARRY.views.xplore.refreshAll()');
  await untilN(function () {
    const d = ev('JSON.stringify(((BARRY.views.xplore._pane '
      + '&& BARRY.views.xplore._pane(1)) || {})._panelData || null)');
    if (!d || d === 'null') return false;
    const got = JSON.parse(d);
    return got.panel === 'bandpower' && got.bands === 7;
  }, 120, 100);
  const pd = JSON.parse(ev(
    'JSON.stringify(((BARRY.views.xplore._pane && '
    + 'BARRY.views.xplore._pane(1)) || {})._panelData || null)') || 'null');
  ck('the band axis set on a pane reaches the server',
     !!pd && pd.bands === 7 && pd.centers[0] === 32.5,
     pd ? (pd.bands + ' bands, first centre ' + pd.centers[0]) : 'no panel data');

  const c = ev('BARRY.cfc.context()');
  ck('it can describe the window for the comodulogram form',
     !!c && c.t1 > c.t0 && Array.isArray(c.channels) && c.channels.length > 0,
     c ? (c.t0.toFixed(1) + '-' + c.t1.toFixed(1) + ' s, '
          + c.channels.length + ' channels') : 'none');

  ev('BARRY.cfc.exit()');
  await sleep(200);
  ck('leaving clears the mode', ev('BARRY.cfc.active') === false);
  ck('leaving removes the bar', !W().document.getElementById('cfcBar'));
  ck('leaving clears the banner',
     !(W().document.getElementById('modeName') || {}).textContent);

  /* The promise the banner makes, checked rather than trusted: a mode that
     says nothing is saved must not have saved anything.

     Scoped to rows written AFTER the mark taken above. The first version
     looked at the last sixty rows however old they were, so it was reading
     whatever else had happened on this machine today and failing on it --
     a check that cannot tell its own effects from the log's history is not
     checking anything. */
  /* The activity log batches in memory and flushes on a timer, so asking
     the server straight after the mode exits reads the log as it was before
     any of this. `flush` is exported for exactly this. */
  await ev('BARRY.activity.flush()');
  await sleep(300);
  const acts = await get('/api/activity?limit=200');
  const rows = (acts.activity || acts.actions || []);
  const mine = rows.filter((a) => (a.at || '') > mark);
  const wrote = mine.filter((a) => /curation\.|layer|bank\.|\.set$|\.save$/
    .test(a.action || ''));
  ck('nothing was curated, banked or labelled by any of the above',
     wrote.length === 0,
     wrote.map((a) => a.action).join(', ')
       || (mine.length + ' rows since the mark, none of them writes'));
  ck('and what it did log says what it was',
     mine.some((a) => a.action === 'cfc.enter'),
     mine.map((a) => a.action).slice(0, 8).join(', '));

  /* ---------------------------------------------------------------- */
  hd('the comodulogram window');
  /* Driven inside the frame rather than in a real pop-out, because
     --dump-dom only captures the page it was pointed at. `opener()` in
     comod.js wants an object with `.BARRY.cfc.context()` and a falsy
     `.closed`, and `window.opener` is replaceable, so a stand-in exercises
     the whole view: form, estimate, run, stage list and canvas. */
  /* `SESSION` is a variable in THIS page, not in the frame, so it has to be
     baked into the source string. The first version referenced it by name;
     `context()` threw a ReferenceError inside the frame, `pullContext`
     caught it as "no opener" and the view rendered its fallback -- twelve
     failures that all said the same thing. */
  /* `barryCfc`, the same property comod.js reads in real use. The first
     version of this stub published `BARRY.cfc` instead, which no window can
     actually see from outside -- so it was testing the stub rather than the
     lookup, and would have gone on passing while the real pop-out showed
     its "no opener" fallback for ever. A stub whose shape differs from the
     real thing is a check that cannot fail on the bug it is aimed at. */
  ev('window.opener = { closed: false, barryCfc: { context: '
     + 'function () { return { path: ' + JSON.stringify(SESSION)
     /* A window none of the sections above has computed. The first version
        reused 100-140 s, which by then was in the result cache, so `run()`
        took the cached branch, no stage list was ever built, and the three
        checks below failed on a feature that works. */
     + ', evenOnly: false, invert: true, label: "harness", t0: 500, t1: 530,'
     + ' channel: 0, channelLabel: "CSC1",'
     + ' channels: [{ index: 0, label: "CSC1", number: 1, bad: false },'
     + ' { index: 1, label: "CSC2", number: 2, bad: false }],'
     + ' highpass: 0, lowpass: 0, notch: 0, duration: 900, fs: 30000 };'
     + ' } } };');
  await get('/api/cfc/cache?clear=1');
  ev('setView("comod")');
  await untilN(function () {
    return !!W().document.querySelector('#comodBody .comod-form');
  });
  ck('the form comes up, filled in from the opener',
     !!W().document.querySelector('#comodBody .comod-form'));
  ck('it did not fall back to the "no opener" message',
     !/opened from CFCScope/.test(
       (W().document.getElementById('comodBody') || {}).textContent || ''));
  const truth = (W().document.querySelector('.comod-truth') || {})
    .textContent || '';
  ck('the form warns that band edges are nominal', /0\.30/.test(truth),
     truth.slice(0, 96));
  await untilN(function () {
    return ((W().document.getElementById('comodEst') || {}).textContent || '')
      .indexOf('cells') >= 0;
  });
  const estTxt = (W().document.getElementById('comodEst') || {}).textContent
    || '';
  ck('the cost is shown before anything is pressed', /629 cells/.test(estTxt),
     estTxt);

  await ev('BARRY.views.comod.run()');
  await untilN(function () {
    return !!W().document.querySelector('.comod-stage');
  }, 80, 40);
  const stageRows = W().document.querySelectorAll('.comod-stage');
  ck('a stage list appears rather than a spinner', stageRows.length >= 6,
     stageRows.length + ' stages');
  const stageTxt = (W().document.querySelector('.comod-stages') || {})
    .textContent || '';
  ck('the stages are named in words, not step numbers',
     /Modulation index/.test(stageTxt),
     stageTxt.replace(/\s+/g, ' ').slice(0, 96));

  await untilN(function () {
    return !!W().document.querySelector('.comod-map');
  }, 900, 100);
  ck('the map arrives', !!W().document.querySelector('.comod-map'));
  const cv = W().document.getElementById('comodCanvas');
  ck('it is drawn on a canvas sized to the pane',
     !!cv && cv.width > 200 && cv.height > 100,
     cv ? cv.width + 'x' + cv.height : 'none');
  if (cv) {
    /* Something was actually painted. A canvas of one flat colour is what a
       broken colour ramp or an all-zero grid looks like, and both would pass
       every other check here. */
    const px = cv.getContext('2d')
      .getImageData(0, 0, cv.width, cv.height).data;
    const seen = {};
    let n = 0;
    for (let i = 0; i < px.length; i += 4 * 997) {
      const k = px[i] + ',' + px[i + 1] + ',' + px[i + 2];
      if (!seen[k]) { seen[k] = 1; n++; }
    }
    ck('the map has a range of colour in it, not one flat wash', n > 8,
       n + ' distinct colours sampled');
  }
  const mapTxt = (W().document.querySelector('.comod-map') || {})
    .textContent || '';
  ck('the caption states the largest value on the map',
     /Largest modulation index/.test(mapTxt));
  const capTxt = (W().document.querySelector('.comod-caption') || {})
    .textContent || '';
  ck('the caption gives the realised widths of both axes',
     /phase bands .* wide/.test(capTxt) && /amplitude bands .* wide/
       .test(capTxt), capTxt.slice(0, 120));
  ck('a lock for the colour scale is offered', /Lock scale/.test(mapTxt));
  ck('the stage list stays as a receipt of where the time went',
     /Took /.test(mapTxt),
     (mapTxt.replace(/\s+/g, ' ').match(/Took [^.]*/) || [''])[0]);

  /* The number a complete run reports. Bump it when checks are added --
     that is the point: a run that comes back with fewer than this stopped
     somewhere, and "fewer checks than usual" should be a failure rather
     than something nobody notices. */
  const EXPECTED = 79;
  if (ran < EXPECTED) {
    p('FAIL  only ' + ran + ' of ' + EXPECTED + ' checks ran - the harness '
      + 'stopped early');
    bad++;
  }
  p('\n' + (bad ? bad + ' FAILED' : 'all ok')
    + '  (' + ran + ' checks)');
  document.title = (bad ? bad + ' fail' : 'ok') + ' — CFCScope';
})().catch((e) => {
  p('\nFAIL  the harness crashed before it finished: ' + (e && e.message));
  p(String((e && e.stack) || '').split('\n').slice(0, 6).join('\n'));
  document.title = 'crash — CFCScope';
});
</script>

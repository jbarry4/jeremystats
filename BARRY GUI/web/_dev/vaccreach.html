<!doctype html>
<html><head><meta charset="utf-8"><title>vaccreach: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:720px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:720px;top:0;right:0;bottom:0;width:calc(100vw - 720px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/#sessions"></iframe>
<script>
/* One way for every module to reach a recording, and VACC loaded on all of
   them (2026-10-08).

   The registry is how a recording reaches every tool, and every tool used
   to pick its path as `(row.here || [])[0]` -- so a recording the cluster
   reads perfectly well and this computer cannot see did not exist to any
   picker, and Checkup refused one right after Incisor had banked it off the
   cluster. Now `BARRY.vacc.reach` is the one rule (this computer first, the
   cluster second), each tool declares what it can do with a VACC-only
   recording (`readsOf`), and Sessions lists and adds every recording found
   on VACC.

   Checked:
     * reach / usableFor give the right answer for a local recording, a
       VACC-only one, and a VACC-only one offered to a tool that needs the
       files here -- which is shown and disabled WITH the reason;
     * no module picks a path as `here[0]` on its own any more (read off the
       served source, so a new one fails here);
     * the mark says "VACC loaded", from the one table;
     * Sessions ▸ Everything VACC knows shows what was found on VACC and an
       Add whose words say how many -- and nothing is added by this page. */
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 8000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(80);
  }
  return false;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  await until(() => ev('typeof BARRY') === 'object' && ev('!!BARRY.vacc'), 25000);
  const json = async (url) => JSON.parse(await ev('fetch(' + JSON.stringify(url)
                                                  + ').then(r=>r.text())'));

  say('=== the one rule ===');
  check('BARRY.vacc.reach exists', ev('typeof BARRY.vacc.reach') === 'function');
  check('and usableFor', ev('typeof BARRY.vacc.usableFor') === 'function');
  check('ToolKit declares what each tool reads',
        ev('typeof BARRY.views.toolkit.readsOf') === 'function');
  check('Incisor runs on the cluster with no copy here',
        ev('BARRY.views.toolkit.readsOf("incisor")') === 'cluster');
  check('Checkup views through the link',
        ev('BARRY.views.toolkit.readsOf("curate")') === 'link');
  check('a tool nobody has checked needs the files here',
        ev('BARRY.views.toolkit.readsOf("kilosort")') === 'here');
  /* 2026-10-09: Doppler, Braces and Eye need no copy here either. */
  for (const t of ['doppler', 'braces', 'eye']) {
    check(t + ' runs on the cluster with no copy here',
          ev('BARRY.views.toolkit.readsOf("' + t + '")') === 'cluster');
  }
  check('Spotter views through the link',
        ev('BARRY.views.toolkit.readsOf("spotter")') === 'link');

  /* The mark on each VACC tool says why it is VACC enabled, what runs on
     the cluster, and what using it would be like without (asked for
     2026-10-09). From one table, so a step and the flat list agree. */
  for (const t of ['incisor', 'doppler', 'braces', 'eye', 'spotter',
                   'curate', 'circuit']) {
    const w = ev('BARRY.views.toolkit.vaccWords("' + t + '") || ""');
    check(t + '’s VACC mark explains why, what and without',
          /Why it is VACC enabled: \S/.test(w)
          && /What is processed on the cluster: \S/.test(w)
          && /Without VACC: \S/.test(w), w.slice(0, 80));
  }

  const kn = await json('/api/vacc/knows');
  await ev('BARRY.vacc.loadKnows(true)');
  const reg = await json('/api/registry');
  const rows = [];
  for (const p of (reg.tree || [])) for (const m of (p.mice || []))
    for (const s of (m.sessions || [])) rows.push(s);
  const loaded = (g) => { const v = (kn.knows || {})[g];
                          return v && (v.state === 'native' || v.state === 'staged')
                                 && v.readable !== false; };
  const local = rows.find((r) => (r.here || []).length);
  const far = rows.find((r) => !(r.here || []).length && loaded(r.gid));
  const reach = (row, reads) => JSON.parse(ev('JSON.stringify(BARRY.vacc.reach('
    + JSON.stringify(row) + ', ' + JSON.stringify(reads) + '))'));
  if (local) {
    const g = reach(local, 'link');
    check('a recording on this computer opens from its drive',
          g.where === 'here' && g.path === local.here[0], JSON.stringify(g));
  } else say('  note  nothing on this computer; skipped', 'note');
  if (far) {
    const g = reach(far, 'link');
    check('a VACC-only recording opens off the cluster',
          g.where === 'vacc' && g.path === 'vacc:' + far.gid, JSON.stringify(g));
    const c = reach(far, 'cluster');
    check('and runs there', c.path === 'vacc:' + far.gid);
    const h = reach(far, 'here');
    check('a tool that needs the files here is told why, not given a path',
          h.path === null && /VACC loaded/.test(h.why || ''), JSON.stringify(h));
    const usable = ev('BARRY.vacc.usableFor("kilosort")('
                      + JSON.stringify(far) + ')');
    check('so its picker shows it disabled, with that reason',
          typeof usable === 'string' && /VACC loaded/.test(usable), usable);
    check('and Incisor\'s picker offers it',
          ev('BARRY.vacc.usableFor("incisor")(' + JSON.stringify(far) + ')')
          === true);
    const mark = ev('(BARRY.vacc.mark(' + JSON.stringify({ gid: far.gid })
                    + ') || {}).textContent');
    check('its mark says VACC loaded', mark === 'VACC loaded', mark);
  } else say('  note  no VACC-only recording in the registry yet; skipped', 'note');
  /* The aid windows Checkup, Spotter and StrataScope open beside the traces
     -- CSD, theta, voltage -- used to fail off the cluster ("cannot find the
     file 'vacc:...'") while the traces worked. They are drawn on the cluster
     now (analysis.render_panel -> vaccio.panel). Live: opens the link. */
  const st0 = await json('/api/vacc/status');
  if (far && st0.configured && st0.available) {
    const P = 'vacc:' + far.gid;
    const post = (url, body) => ev('fetch(' + JSON.stringify(url) + ', {method:'
      + '"POST", headers:{"Content-Type":"application/json"}, body:'
      + JSON.stringify(JSON.stringify(body)) + '}).then(r=>r.text())');
    const opened = JSON.parse(await post('/api/csc/open', { path: P }));
    check('a VACC-only recording opens over the link', opened.ok !== false,
          (opened.error || '').slice(0, 120));
    for (const panel of ['csd', 'theta']) {
      const g = JSON.parse(await post('/api/panel',
        { path: P, panel, t0: 10, t1: 15 }));
      check('its ' + panel + ' aid panel draws off the cluster', g.ok === true,
            (g.error || '').slice(0, 140));
    }
  } else say('  note  cluster not reachable or nothing VACC-only; the live '
             + 'panel check is skipped', 'note');
  const none = rows.find((r) => !(r.here || []).length && !loaded(r.gid));
  if (none) {
    const g = reach(none, 'link');
    check('one nobody can reach says so', g.path === null && !!g.why,
          JSON.stringify(g));
  }

  say('');
  say('=== no module picks here[0] on its own ===');
  /* Read off the served files, so a module added next year that goes back
     to `(row.here || [])[0]` fails here. Display-only uses are listed: the
     Sessions card's shown path, Housekeeping's "also on a drive here" line,
     a table column -- none of them opens anything. */
  const ALLOWED = { 'vacc.js': 1, 'sessions.js': 1, 'housekeeping.js': 1,
                    'hk_views.js': 1 };
  const files = ['incisor', 'panorama', 'horizon', 'cfcscope', 'kilosort',
                 'doppler', 'braces', 'rootcanal', 'curate', 'spotter',
                 'strata', 'toolkit', 'sessions', 'housekeeping', 'hk_views',
                 'vacc'];
  const offenders = [];
  for (const f of files) {
    const src = await ev('fetch("/js/' + f + '.js").then(r=>r.text())');
    const hits = (src.match(/\.here\s*\|\|\s*\[\]\s*\)\s*\[0\]/g) || []).length;
    if (hits && !ALLOWED[f + '.js']) offenders.push(f + '.js (' + hits + ')');
  }
  check('only display code reads here[0] directly', offenders.length === 0,
        offenders.join(', '));

  say('');
  say('=== Sessions: found on VACC, and an Add that says how many ===');
  const st = await json('/api/vacc/status');
  if (!st.configured) {
    say('  note  no VACC account here; skipped', 'note');
  } else {
    await ev('setView("sessions")');
    await sleep(500);
    const vBtn = Array.from(D().querySelectorAll('#sessModeSeg button'))
      .find((b) => b.dataset.mode === 'vacc');
    if (vBtn && !vBtn.hidden) {
      vBtn.click();
      const card = () => Array.from(D().querySelectorAll('#vaccBody .card'))
        .find((c) => /Found on VACC/.test(c.textContent));
      await until(() => card() && /Already in Jarvis/.test(card().textContent),
                  60000);
      check('the Found on VACC card is drawn, with its counts',
            !!card() && /New to Jarvis/.test(card().textContent),
            card() ? card().textContent.slice(0, 120) : 'none');
      const btns = () => card() ? Array.from(card().querySelectorAll('button'))
        .map((b) => b.textContent) : [];
      const f0 = await json('/api/vacc/found');
      if (f0.setup_needed) {
        // A computer that never looked: the setup, with both finds.
        check('a computer that never looked is offered the setup',
              btns().indexOf('Set up this computer') >= 0, btns().join(' | '));
      } else {
        const add = card() && Array.from(card().querySelectorAll('button.btn'))
          .find((b) => /^Add [\d,]+ recordings? found on VACC$|^Nothing new to add$/
                       .test(b.textContent));
        check('its primary says how many it would add', !!add,
              btns().join(' | '));
      }
      check('it can find everything on VACC, and separately on netfiles',
            btns().some((t) => /^Find everything on VACC$|^Looking on VACC/
                                 .test(t))
            && btns().some((t) => /^Find everything on netfiles$|^Looking on netfiles/
                                    .test(t)),
            btns().join(' | '));
      const f = await json('/api/vacc/found');
      check('/api/vacc/found sends counts and a digest, never full rows',
            f.ok && typeof f.n_new === 'number' && !!f.digest && !('_new' in f),
            JSON.stringify(f).slice(0, 160));
      const r = JSON.parse(await ev('fetch("/api/vacc/found/add", {method:'
        + '"POST", headers:{"Content-Type":"application/json"}, body:'
        + 'JSON.stringify({digest: "harness"})}).then(r=>r.text())'));
      check('and adding without confirming adds nothing', r.ok === false,
            JSON.stringify(r));
    } else say('  note  the VACC view is hidden here; skipped', 'note');
  }

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'vaccreach: ' + fails + ' FAILED' : 'vaccreach: passed';
  frame.src = 'about:blank';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'vaccreach CRASH';
                    document.getElementById('app').src = 'about:blank'; });
</script></body></html>

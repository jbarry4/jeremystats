<!doctype html>
<meta charset="utf-8">
<title>Harness — starting a curation set from the bank</title>
<style>
  body { font: 12px/1.55 ui-monospace, monospace; margin: 0; background: #0c0f14;
         color: #dfe6ee; }
  #out { padding: 12px 16px; width: 44vw; }
  iframe { position: fixed; right: 0; top: 0; width: 56vw; height: 100vh;
           border: 0; border-left: 1px solid #243; }
  .ok::before { content: 'ok    '; color: #7fe3b0; }
  .bad::before { content: 'FAIL  '; color: #ff8a7a; }
  .bad { color: #ffb0a5; }
  .note { color: #7593a2; }
  h2 { font-size: 12px; margin: 14px 0 5px; color: #ffb81c; }
</style>
<div id="out"></div>
<iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* Where candidates come from, and how a set starts.

   This used to drive "Import candidates" in Event curation, which is gone.
   It was wrong in two ways and the second one cost real confusion:

   It made Event curation a second door into the store of candidates. The
   Event Bank is that store -- it holds the times, the detector that found
   them, and the version history. Curation should read a version out of it.

   And it implied a recording could have more than one set of a kind. It
   cannot: a set is keyed by (recording, kind). So a second import of the
   same 373 times took the "add to a set in progress" path, matched every
   time against one already there, added nothing, threw away the name that
   had been typed, and returned 200. Three attempts in the 14:54 report on
   2026-09-08, each of them `n: 0, skipped: 373`, and nothing on screen.

   So what is checked here is the flow that replaced it: pick a recording,
   pick a banked entry, pick which version to work from, start. Plus the two
   things that have to be true of it -- that v0 gives you a fresh pass, and
   that replacing an existing set says so first. */
const out = document.getElementById('out');
let bad = 0;
const say = (c, m) => { const d = document.createElement('div');
                        d.className = c; d.textContent = m;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const check = (n, c, d) => say(c ? 'ok' : 'bad',
                               n + (c || !d ? '' : '   [' + d + ']'));
const head = (t) => { const h = document.createElement('h2');
                      h.textContent = t; out.appendChild(h); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, tries = 250, gap = 100) {
  for (let i = 0; i < tries; i++) {
    try { if (fn()) return i; } catch (e) { /* not yet */ }
    await sleep(gap);
  }
  return -1;
}

(async () => { try {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = f.contentWindow, D = f.contentDocument;
  const errs = [];
  W.addEventListener('error', (e) => errs.push(
    e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  W.addEventListener('unhandledrejection', (e) => errs.push('rejected: ' + e.reason));
  /* `BARRY` is a top-level const in core.js, so it lives in the
     script scope and is NOT a property of the frame's window --
     `W.BARRY` is undefined forever, and waiting on it burned the
     full 25s timeout on every run before carrying on regardless.
     `setView` is a function declaration, so it does land on the
     window, and it is only defined once core.js has run. */
  await untilN(() => typeof W.setView === 'function');

  const get = (u) => W.fetch(u).then((r) => r.json());
  const post = (u, b) => W.fetch(u, { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(b || {}) }).then(async (r) => {
      const j = await r.json();
      j._status = r.status;
      return j;
    });
  const byText = (root, sel, re) => Array.from(root.querySelectorAll(sel))
    .find((n) => re.test((n.textContent || '').trim()));
  const seen = (n) => !!(n && n.offsetParent !== null);

  head('1. The route, before the interface');
  /* A recording with a rebuilt history: v0 the detector, v1 the sort. */
  const bank = await get('/api/bank');
  const cand = (bank.entries || []).filter(
    (e) => e.type === 'ds' && e.gid && (e.versions || []).length > 1);
  say('note', '  ' + cand.length + ' ds entries with more than one version');
  check('there is a banked entry with a history to work from',
        cand.length > 0);
  if (!cand.length) throw new Error('nothing to test against');
  const ent = cand.sort((a, b) => (a.n || 0) - (b.n || 0))[0];
  const gid = ent.gid;
  say('note', '  using "' + ent.name + '" (' + ent.n + ' events, v'
      + (ent.versions || []).map((v) => v.v).join(' v') + ')');

  const info = await get('/api/curation/for-recording/'
                         + encodeURIComponent(gid));
  const row = (info.entries || []).find((e) => e.id === ent.id);
  check('the recording reports what it has banked', !!row,
        'entry not listed for its own gid');
  const v0 = (row.versions || []).find((v) => v.v === 0);
  check('version zero is offered', !!v0);
  check('and is marked as the detector’s own',
        !!v0 && v0.imported === true);
  check('and says nothing was decided in it',
        !!v0 && Object.keys(v0.by_label || {}).join() === 'unspecified',
        JSON.stringify((v0 || {}).by_label));
  check('and can actually be built from', !!v0 && v0.usable === true);

  head('2. Starting from v0 gives a fresh pass');
  /* Refuses first, because there is already a set for this recording. */
  const refused = await post('/api/curation/from-bank',
    { gid, kind: 'ds', entry: ent.id, version: 0 });
  check('it refuses to replace a set without being told to',
        refused._status === 409 && !!refused.exists,
        'status ' + refused._status);
  check('and says what it would be replacing',
        !!refused.exists && refused.exists.total > 0,
        JSON.stringify(refused.exists));
  say('note', '  refusal reads: ' + (refused.error || '').slice(0, 100));

  const made = await post('/api/curation/from-bank',
    { gid, kind: 'ds', entry: ent.id, version: 0, replace: true });
  check('with replace it starts the set', made.ok === true, made.error);
  const pr = made.progress || {};
  say('note', '  ' + pr.total + ' candidates, ' + pr.specified + ' decided, '
      + pr.left + ' left');
  check('every candidate arrives undecided from v0',
        pr.total > 0 && pr.specified === 0 && pr.left === pr.total,
        JSON.stringify(pr));
  check('and the count matches the version',
        pr.total === (v0.n || 0), pr.total + ' vs ' + v0.n);

  head('3. Starting from a later version carries its decisions');
  const later = (row.versions || [])
    .filter((v) => v.usable && v.v > 0)
    .sort((a, b) => b.v - a.v)[0];
  check('there is a later version to try', !!later);
  if (later) {
    const decided = Object.keys(later.by_label || {})
      .filter((k) => k !== 'unspecified')
      .reduce((n, k) => n + later.by_label[k], 0);
    say('note', '  v' + later.v + ' held ' + decided + ' decisions');
    const got = await post('/api/curation/from-bank',
      { gid, kind: 'ds', entry: ent.id, version: later.v, replace: true });
    check('it starts from that version', got.ok === true, got.error);
    const p2 = got.progress || {};
    say('note', '  now ' + p2.specified + ' of ' + p2.total + ' decided');
    check('the decisions came with it', p2.specified === decided,
          p2.specified + ' vs ' + decided + ' expected');
    /* The whole point of the version picker: two versions of one entry are
       genuinely different starting points. */
    check('so v0 and v' + later.v + ' are different places to start',
          decided > 0);
  }

  head('4. It refuses what it cannot do, in words');
  const noSuch = await post('/api/curation/from-bank',
    { gid, kind: 'ds', entry: ent.id, version: 99, replace: true });
  check('a version that does not exist is refused',
        noSuch._status === 404, 'status ' + noSuch._status);
  check('and the refusal lists the ones that do',
        /has v/.test(noSuch.error || ''), noSuch.error);
  const wrongKind = await post('/api/curation/from-bank',
    { gid, kind: 'nonsense', entry: ent.id, version: 0, replace: true });
  check('an unknown kind is refused', wrongKind._status === 400,
        'status ' + wrongKind._status);

  head('5. The interface offers it, and no longer offers importing');
  W.eval("setView('toolkit')");
  await untilN(() => D.querySelector('.tk-tool, .tk-step'), 200);
  const tool = byText(D, '.tk-tool, .tk-step', /Event curation|Checkup/);
  check('the curation tool is there', !!tool);
  tool.click();
  await untilN(() => D.querySelector('#curBench'), 300);
  await sleep(900);

  check('there is no "Import candidates" button any more',
        !byText(D, 'button', /^Import candidates/),
        'the old import path is still on screen');
  const newBtn = byText(D, 'button', /^New curation set/);
  check('there is a "New curation set" button', !!newBtn);
  if (!newBtn) throw new Error('no way into the flow');

  newBtn.click();
  await untilN(() => byText(D, 'h3', /New curation set/), 150);
  check('the wizard opens', !!byText(D, 'h3', /New curation set/));
  await sleep(1200);

  const fields = Array.from(D.querySelectorAll('.field'));
  const sessField = fields.find((x) => /Recording/i.test(
    (x.querySelector('label') || {}).textContent || ''));
  check('it asks which recording first', !!sessField);

  /* Point it at the recording this harness has been using. The wizard
     defaults to one that has something banked, but not necessarily this
     one -- and the steps after this depend on which recording is chosen,
     so leaving it to the default made the rest of this section test
     whichever session happened to sort first. */
  /* Type the gid, and take the option with a mousedown.

     The gid because it is the only term guaranteed to pick out one row.
     `BARRY.pickSession` searches label, key, gid, mouse, session and date
     (`hayOf` in core.js), and labels repeat: the registry on this machine
     holds two rows reading "DEMO m1 s1 (dentate spikes)" -- the demo gid
     and a scanned copy of it -- so typing the label offers both and the
     first is the one with nothing on it.

     Mousedown because that is the event an option is bound to: core.js
     wires `onmousedown` so the choice lands before the input's blur can
     close the list, and `.click()` fires no mousedown. So the click here
     did nothing at all, silently: the typed text stayed in the box (which
     is why the note below used to look right), the picker's value never
     changed, and the wizard went on describing whatever recording it had
     defaulted to -- one with a banked entry but no curation set. That is
     the whole of the "no warning about replacing" failure. */
  const pickBox = sessField && sessField.querySelector('.sp-box');
  const sessInput = sessField && sessField.querySelector('input');
  if (sessInput) {
    sessInput.focus();
    sessInput.value = gid;
    sessInput.dispatchEvent(new W.Event('input', { bubbles: true }));
    await sleep(500);
    const opts = Array.from(D.querySelectorAll('.sp-row'));
    say('note', '  ' + opts.length + ' recording(s) offered for ' + gid);
    if (opts.length) {
      opts[0].dispatchEvent(new W.MouseEvent(
        'mousedown', { bubbles: true, cancelable: true }));
    }
    await untilN(() => pickBox && pickBox.pickerValue() === gid, 300);
    say('note', '  recording box now: ' + (sessInput.value || '(empty)'));
  }
  /* Asserted, not hoped for. Everything below describes the chosen
     recording, so if the pick did not take, the rest of this section is
     reporting on some other session and its verdicts mean nothing. */
  check('the picker lands on the recording asked for',
        !!pickBox && pickBox.pickerValue() === gid,
        'picker is on ' + ((pickBox && pickBox.pickerValue()) || '(nothing)'));
  /* And that recording does have a set to be warned about: sections 2 and 3
     just built one on it. */
  check('and that recording does have a set to replace',
        (info.existing || []).some((x) => x.kind === 'ds'),
        JSON.stringify(info.existing));

  /* The three questions are asked in order, and each one appears only once
     the one before it has an answer. */
  const step = (re) => byText(D, '.section-label', re);
  /* `pickerValue` turns over the instant the option is taken, but the
     questions under it are painted only once the wizard's re-read of
     /for-recording lands. Wait for the paint, not for the pick. */
  await untilN(() => step(/Which banked entry/), 300);
  check('then which banked entry', !!step(/Which banked entry/),
        'no entry step');
  /* 300, not 60. Under --virtual-time-budget these are 300 turns of the
     event loop, not 30 seconds, and the entry list only appears after the
     pick's re-read of /for-recording has come back. */
  await untilN(() => step(/Which version/), 300);
  check('then which version', !!step(/Which version/), 'no version step');

  const vrows = Array.from(D.querySelectorAll('.bm-row'))
    .filter((r) => /^v\d/.test((r.querySelector('.ver-n') || {}).textContent || ''));
  say('note', '  ' + vrows.length + ' version(s) offered');
  check('the versions are listed', vrows.length > 0);
  check('the detector’s own version is marked',
        !!byText(D, '.flagchip', /the detector/),
        'v0 is not identified');
  /* A version with no snapshot cannot be a starting point, and must not
     look like one. */
  const dead = vrows.filter((r) => r.classList.contains('off'));
  say('note', '  ' + dead.length + ' version(s) with no snapshot kept');
  check('any version without a snapshot is disabled, not silently broken',
        dead.every((r) => (r.querySelector('input') || {}).disabled),
        'an unusable version is selectable');

  check('and it warns that a set already exists',
        !!byText(D, '.confirm-sub.warn', /already has a/),
        'no warning about replacing');
  const start = byText(D, 'button', /^Start on it$/);
  check('there is a button to start', !!start && seen(start));

  if (errs.length) { head('Errors thrown'); errs.forEach((m) => say('bad', m)); }
  else say('note', '\nno uncaught errors');
  head(bad ? bad + ' FAILED' : 'all checks passed');
  document.title = (bad ? bad + ' FAILED — ' : 'ok — ') + 'set from the bank';
} catch (e) {
  say('bad', 'harness threw: ' + (e && e.message));
  document.title = 'harness threw';
} })();
</script>

<!doctype html>
<html><head><meta charset="utf-8"><title>rebuild: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:660px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}.hd{color:#ffb81c}
iframe{position:fixed;left:660px;top:0;right:0;bottom:0;width:calc(100vw - 660px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n);
  L.scrollTop = L.scrollHeight; };
const check = (what, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 10000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(90);
  }
  return false;
}
const post = (u, b) => fetch(u, { method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(b) }).then((r) => r.json());

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 30000);
  const W = frame.contentWindow;
  const D = () => frame.contentDocument;
  const $ = (s) => D().querySelector(s);
  const $$ = (s) => Array.from(D().querySelectorAll(s));

  say('=== the module is wired up ===', 'hd');
  check('BARRY.figrebuild exists', ev('typeof BARRY.figrebuild') === 'object');
  check('it exposes start()', ev('typeof BARRY.figrebuild.start') === 'function');
  check('the builder can be reopened on a recipe',
        ev('typeof BARRY.figure.reopen') === 'function');

  /* Find a session on this machine to export a figure from. */
  const cat = await (await fetch('/api/sessions')).json();
  let path = null;
  for (const s of (cat.sessions || cat.items || [])) {
    if (s.path) { path = s.path; break; }
  }
  if (!path) {
    const runs = await (await fetch('/api/history')).json();
    for (const r of (runs.runs || [])) {
      if ((r.session || {}).path) { path = r.session.path; break; }
    }
  }
  say('  using recording: ' + (path || '(none found)'), 'note');
  if (!path) { say('cannot continue without a recording', 'bad'); fails++; }

  /* ------------------------------------------------------------------
     Export a figure so there is a fresh, complete recipe to rebuild.
     ------------------------------------------------------------------ */
  let runId = null;
  let badCsc = null;
  if (path) {
    say('');
    say('=== exporting a figure with a full recipe ===', 'hd');
    // An even-only session has no CSC 3, so pick a number off the real
    // inventory rather than inventing one.
    const opened = await post('/api/csc/open',
      { path, even_only: true, invert: true });
    badCsc = ((opened.channels || [])[3] || {}).number;
    say('  bad channel for the test: CSC ' + badCsc, 'note');
    const layout = {
      title: 'rebuild harness', subtitle: '', page: 'letter_landscape',
      width_in: 11, height_in: 8.5, dpi: 150, rows: 1, cols: 1,
      t0: 12.5, t1: 17.5, highpass: 1, lowpass: 70, notch: 60,
      cmap: 'jet', spacing_um: 50,
      channels: [0, 1, 2, 3, 4, 5], bad_channels: [badCsc],
      gain: 2, show_metadata: true,
      identity: {}, session_label: 'harness',
      metadata: { author: 'harness', notes: '' },
      events: [{ t: 13.0, label: 'harness mark' },
               { t: 15.25, label: 'harness mark 2' }],
      panels: [{ panel: 'traces', session_id: 'default', title: 'Traces',
                 row: 0, col: 0, rowspan: 1, colspan: 1, cmap: 'jet' }],
    };
    const res = await fetch('/api/figure/export', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ layout, format: 'png', dpi: 110,
        sessions: { default: { path, even_only: true, invert: true } } }),
    });
    check('the export succeeded', res.ok, 'HTTP ' + res.status
          + (res.ok ? '' : ' ' + (await res.text()).slice(0, 160)));
    // The run id comes back in a header, since the body is the PNG itself.
    runId = res.headers.get('X-Barry-Run-Id');
    check('it was recorded as a run', !!runId, runId || 'no run id header');
    say('  problems from the render: '
        + (res.headers.get('X-Barry-Problems') || 'none'), 'note');
  }

  /* ------------------------------------------------------------------
     The audit
     ------------------------------------------------------------------ */
  if (runId) {
    say('');
    say('=== the audit, before anything is done ===', 'hd');
    const plan = await (await fetch('/api/figure/recipe/' + runId)).json();
    check('the recipe reads back', plan.ok === true, plan.error || '');
    check('it is marked complete', plan.complete === true);
    check('the verdict is clean', plan.verdict === 'ok',
          plan.verdict + '  problems=' + JSON.stringify(plan.problems));
    const ids = (plan.steps || []).map((s) => s.id);
    check('every step is planned',
          ['locate', 'open', 'window', 'filters', 'channels', 'events',
           'panels', 'builder'].every((k) => ids.includes(k)),
          ids.join(', '));
    const r = plan.recipe || {};
    check('the recipe kept the channel selection',
          JSON.stringify(r.channels) === JSON.stringify([0, 1, 2, 3, 4, 5]),
          JSON.stringify(r.channels));
    check('and the bad channels',
          JSON.stringify(r.bad_channels) === JSON.stringify([badCsc]),
          JSON.stringify(r.bad_channels));
    check('and the gain', r.gain === 2, String(r.gain));
    check('and the event marks', r.event_count === 2, String(r.event_count));
    check('and how the session was opened',
          (r.sessions || {}).default
          && r.sessions.default.even_only === true,
          JSON.stringify(r.sessions));
    for (const s of plan.steps || []) {
      say('  ' + s.status.padEnd(8) + s.title.padEnd(32)
          + String(s.what).slice(0, 44), 'note');
    }

    /* Bad input has to be refused with a reason, not guessed at. The
       missing-recording branch is checked directly against the backend,
       where a path can be faked without writing a bogus run record. */
    say('');
    say('=== bad input is refused, not guessed ===', 'hd');
    check('an unknown run id gives a 404',
          (await fetch('/api/figure/recipe/nosuchrun')).status === 404);
    const other = ((await (await fetch('/api/history')).json()).runs || [])
      .find((x) => x.kind && x.kind !== 'figure');
    if (other) {
      const bad = await fetch('/api/figure/recipe/' + other.id);
      check('a run that is not a figure gives a 400', bad.status === 400,
            'HTTP ' + bad.status);
    } else {
      say('  (no non-figure run on this machine to try)', 'note');
    }

    /* ------------------------------------------------------------------
       The walk
       ------------------------------------------------------------------ */
    say('');
    say('=== the walkthrough ===', 'hd');
    ev('BARRY.figrebuild.start(' + JSON.stringify(runId) + ')');
    const opened = await until(() => $('#rbSteps'), 12000);
    check('the dialog opens', opened);
    check('it shows one row per step',
          $$('.rb-step').length === (plan.steps || []).length,
          $$('.rb-step').length + ' rows');
    check('every row starts as planned',
          $$('.rb-step').every((n) => n.dataset.state === 'planned'));
    check('the verdict block is shown', !!$('.rb-verdict'));
    check('nothing has run yet', $$('.rb-did:not(.hidden)').length === 0);

    // No horizontal overflow, whatever the path length.
    const mb = $('.modal.big .mb');
    if (mb) {
      check('the dialog body does not scroll sideways',
            mb.scrollWidth <= mb.clientWidth + 1,
            mb.scrollWidth + ' vs ' + mb.clientWidth);
    }

    const go = $('#rbGo');
    check('the go button says what it will do',
          !!go && /Rebuild it/.test(go.textContent), go ? go.textContent : '');
    go.click();

    // Every step but the last, which waits for a click.
    const done = await until(() => {
      const rows = $$('.rb-step');
      return rows.length && rows.slice(0, -1).every(
        (n) => ['done', 'skipped', 'failed'].includes(n.dataset.state));
    }, 60000);
    check('every restoring step finished', done,
          $$('.rb-step').map((n) => n.dataset.state).join(','));
    const states = $$('.rb-step').slice(0, -1).map((n) => n.dataset.state);
    check('none of them failed', !states.includes('failed'), states.join(','));
    check('the account of what happened is still on screen',
          $$('.rb-did:not(.hidden)').length >= 6,
          $$('.rb-did:not(.hidden)').length + ' steps reported');
    check('the handoff waits to be asked',
          $$('.rb-step').pop().dataset.state === 'planned',
          $$('.rb-step').pop().dataset.state);
    for (const n of $$('.rb-step')) {
      const t = n.querySelector('.rb-title span').textContent;
      const d = n.querySelector('.rb-did');
      say('  ' + n.dataset.state.padEnd(8) + t.padEnd(32)
          + (d && !d.classList.contains('hidden')
             ? d.textContent.slice(0, 60) : ''), 'note');
    }

    /* ------------------------------------------------------------------
       Did it actually restore the state, or just animate?
       ------------------------------------------------------------------ */
    say('');
    say('=== the session really was restored ===', 'hd');
    await sleep(900);
    const s = ev('BARRY.views.xplore.state.sessions['
                 + 'BARRY.views.xplore.state.active]');
    check('a recording is open', !!s, s ? s.path : 'none');
    if (s) {
      check('the window came back', Math.abs(s.t0 - 12.5) < 0.01
            && Math.abs(s.span - 5) < 0.01,
            's.t0=' + s.t0.toFixed(3) + ' span=' + s.span.toFixed(3));
      check('the filters came back',
            s.hp === 1 && s.lp === 70 && s.notch === 60,
            'hp=' + s.hp + ' lp=' + s.lp + ' notch=' + s.notch);
      check('the gain came back', s.gain === 2, String(s.gain));
      const sel = ev('Array.from(BARRY.views.xplore.state.sessions['
                     + 'BARRY.views.xplore.state.active].sel).sort('
                     + '(a,b)=>a-b)');
      check('the channel selection came back',
            JSON.stringify(sel) === JSON.stringify([0, 1, 2, 3, 4, 5]),
            JSON.stringify(sel));
      const bad = ev('Array.from(BARRY.views.xplore.state.sessions['
                     + 'BARRY.views.xplore.state.active].bad)');
      check('the bad channel came back',
            JSON.stringify(bad) === JSON.stringify([badCsc]),
            JSON.stringify(bad));
      check('the event marks came back', (s.events || []).length === 2,
            (s.events || []).length + ' marks');
    }
    const panes = ev('JSON.stringify(BARRY.views.xplore.state.panes.map('
                     + 'p => p && p.panel))');
    check('the pane layout matches the figure', /traces/.test(panes), panes);

    say('');
    say('=== the handoff to the builder ===', 'hd');
    const goNow = $('#rbGo');
    check('the button now offers the builder',
          !!goNow && /figure builder/.test(goNow.textContent),
          goNow ? goNow.textContent : 'no button');
    goNow.click();
    const b = await until(() => $('#figPreview') || $('.fig-layout'), 20000);
    check('the figure builder opens', b);
    await sleep(700);
    const notes = $$('.mb textarea, .mb input[type=text]')
      .map((n) => n.value).join(' · ');
    check('the notes say what it was rebuilt from',
          /Rebuilt from/.test(notes),
          (notes.match(/Rebuilt from[^·]*/) || [notes.slice(0, 90)])[0]);
    check('the window carried into the layout',
          $$('.mb input').some((n) => Math.abs(+n.value - 12.5) < 0.001),
          'looking for t0 = 12.5');

    say('');
    say('  harness run left behind for the caller to clear: ' + runId, 'note');
  }

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'rebuild: ' + fails + ' FAILED' : 'rebuild: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'rebuild CRASH'; });
</script></body></html>

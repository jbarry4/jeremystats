<!doctype html>
<html><head><meta charset="utf-8"><title>vaccsignin: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:700px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:700px;top:0;right:0;bottom:0;width:calc(100vw - 700px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
/* Getting onto the cluster without knowing what SSH is.

   The people who use this rig are undergraduates who rotate through, and
   the SSH part is the least transferable thing in the building. So the
   design target is: type the netid you already know, press the button, and
   never see a password unless this computer has genuinely never connected
   to that account before.

   The assertions that carry that:

     * a machine with a key the cluster accepts signs in with NO password.
       Being asked for a password by software that does not need one is how
       people learn to type passwords into things that should not have them.
     * an account with no working key says so as a fact -- "a password is
       needed once" -- rather than as a failure.
     * signing out forgets the account and NOT the key, so signing back in
       is free. Four people taking turns is the ordinary case.
     * a malformed netid never reaches the network.

   The password half cannot be driven from here: it needs somebody's real
   UVM password. `tools/test_vaccsignin.py` covers what the code does with
   one; this covers everything around it. */
const L = document.getElementById('log');
let fails = 0, checks = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { checks++; if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 20000)) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    await sleep(80);
  }
  return null;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  const $$ = (s) => Array.from(D().querySelectorAll(s));
  const get = async (p) => JSON.parse(
    await ev('fetch("' + p + '").then(r=>r.text())'));
  const post = async (p, b) => {
    const raw = await ev('fetch("' + p + '",{method:"POST",'
      + 'headers:{"Content-Type":"application/json"},'
      + 'body:JSON.stringify(' + JSON.stringify(b || {}) + ')})'
      + '.then(function(r){return r.text();})');
    return JSON.parse(raw);
  };
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'),
              25000);

  say('=== what this machine knows about itself ===');
  const st0 = await get('/api/vacc/signin/state');
  check('the state reads without connecting', st0.ok === true);
  check('and says whether there is an ssh client at all',
        typeof st0.have_ssh === 'boolean', String(st0.have_ssh));
  say('    configured=' + st0.configured + '  netid=' + (st0.netid || '-')
      + '  keys=' + ((st0.other_keys || []).length + (st0.have_key ? 1 : 0)),
      'note');
  /* Two different questions that used to share one answer: which key is in
     use, and where Jarvis's own key would live if it made one. */
  check('the key it reports is the one in use, not where one might go',
        !st0.configured || (st0.key_path || '') !== ''
        || st0.key_path !== st0.jarvis_key_path,
        'key_path=' + (st0.key_path || '-')
        + '  jarvis=' + (st0.jarvis_key_path || '-'));

  if (!st0.have_ssh) {
    say('no ssh client here, so none of the rest can be driven', 'note');
    say('ran ' + checks + ' checks');
    document.title = fails ? 'vaccsignin: ' + fails + ' FAILED'
                           : 'vaccsignin: passed';
    return;
  }

  say('');
  say('=== a netid is checked before anything connects ===');
  const bad = await post('/api/vacc/signin', { netid: 'not a netid',
                                               password: 'x' });
  check('a malformed netid is refused', bad.ok === false, bad.error);
  check('and named as such rather than as a connection failure',
        bad.kind === 'bad-netid', String(bad.kind));

  const was = st0.netid || '';
  if (!st0.configured || !was) {
    say('nobody is signed in here, so the sign-out and key-reuse checks '
        + 'have no subject', 'note');
    say('');
    say('ran ' + checks + ' checks');
    document.title = fails ? 'vaccsignin: ' + fails + ' FAILED'
                           : 'vaccsignin: passed';
    return;
  }

  say('');
  say('=== signing out forgets the account, not the key ===');
  const keysBefore = (st0.other_keys || []).length + (st0.have_key ? 1 : 0);
  const out = await post('/api/vacc/signout', {});
  check('it signs out', out.ok === true, JSON.stringify(out).slice(0, 80));
  check('and says who it was', out.was === was, out.was + ' vs ' + was);
  const st1 = await get('/api/vacc/signin/state');
  check('the machine is no longer configured', st1.configured === false,
        String(st1.configured));
  check('and no netid is left behind', !st1.netid, st1.netid);
  /* The one that matters. Deleting the key would take something that was
     not this application's to take -- it may be the key the person uses
     from their own terminal -- and would make signing back in cost a
     password every time. */
  const keysAfter = (st1.other_keys || []).length + (st1.have_key ? 1 : 0);
  check('every key is still on the machine', keysAfter === keysBefore,
        keysAfter + ' vs ' + keysBefore);

  say('');
  say('=== and signing back in costs no password ===');
  const back = await post('/api/vacc/signin', { netid: was, password: '' });
  check('a netid alone is enough', back.ok === true,
        back.error || JSON.stringify(back).slice(0, 90));
  if (back.ok) {
    check('nothing was installed, because nothing needed to be',
          back.made_key === false && back.already_installed === true,
          'made_key=' + back.made_key + ' already=' + back.already_installed);
    check('and it signed in as the right person', back.netid === was,
          back.netid + ' vs ' + was);
    check('using a key that already existed',
          typeof back.key_path === 'string' && back.key_path.length > 0,
          back.key_path);
  }
  const st2 = await get('/api/vacc/signin/state');
  check('the machine is configured again', st2.configured === true);
  check('as the same account it started as', st2.netid === was,
        st2.netid + ' vs ' + was);

  say('');
  say('=== an account this machine has no key for asks, plainly ===');
  /* A netid that is well-formed and is not this one. The cluster will
     refuse the key, and the right answer is "a password is needed once" --
     a statement about what happens next, not an error to walk away from. */
  const other = (was === 'jbarry4') ? 'sakhava1' : 'jbarry4';
  const none = await post('/api/vacc/signin', { netid: other, password: '' });
  check('it is refused', none.ok === false, JSON.stringify(none).slice(0, 80));
  check('and says a password is needed once, rather than failing',
        none.kind === 'need-password', String(none.kind));
  check('naming the account, so it is obvious which one',
        (none.error || '').indexOf(other) >= 0, none.error);
  const st3 = await get('/api/vacc/signin/state');
  check('and the account that WAS signed in is untouched',
        st3.netid === was && st3.configured === true,
        st3.netid + ' / ' + st3.configured);

  say('');
  say('=== the module offers it where a person would look ===');
  check('there is a way to offer sign-in on demand',
        ev('typeof BARRY.vacc.offerSignIn') === 'function');
  check('a way to open it deliberately',
        ev('typeof BARRY.vacc.showSignIn') === 'function');
  check('and a way to sign out',
        ev('typeof BARRY.vacc.signOut') === 'function');
  /* Turning the mode on is what asks. Not a nag: asked once per page load,
     so somebody who signed out on purpose and is toggling the look is left
     alone. */
  check('offering twice only asks once',
        ev('(function(){ BARRY.vacc.offerSignIn(); '
         + 'BARRY.vacc.offerSignIn(); return true; })()') === true);

  say('');
  say('=== and it lives on the profile, where "who is this computer" is ===');
  /* The cluster account is the same kind of fact as the name and the
     email: who this computer is. Somebody setting a machine up should meet
     both once, in one place, rather than finding the second later behind a
     chip they had no reason to press. */
  await ev('BARRY.profile.open()');
  const form = await until(() => D().querySelector('.prof-form'), 20000);
  check('the profile opens', !!form);
  const vbox = await until(() => D().querySelector('.prof-vacc'), 20000);
  check('and carries a VACC account section', !!vbox);
  if (vbox) {
    await until(() => !/Asking/.test(vbox.textContent), 25000);
    await sleep(600);
    say('    ' + vbox.textContent.replace(/\s+/g, ' ').trim().slice(0, 150),
        'note');
    check('it names the account rather than only saying "signed in"',
          vbox.textContent.indexOf(was) >= 0,
          vbox.textContent.slice(0, 70));
    /* Two questions, two indicators. Signed in is the name; live is the
       dot. A rig with no network is signed in and not live, and collapsing
       them would send somebody to re-enter a password that was never the
       problem. */
    const dot = vbox.querySelector('.vacc-dot');
    check('and shows whether the cluster is answering, separately',
          !!dot, dot ? dot.className : 'no dot');
    check('the dot says which of the three states it is in',
          !!dot && /(?:^| )vacc-dot (live|idle|off)(?: |$)/.test(dot.className),
          dot ? dot.className : '-');
    const acts = Array.from(vbox.querySelectorAll('button'))
      .map((b) => b.textContent);
    check('it offers switching accounts',
          acts.some((t) => /switch|set up/i.test(t)), acts.join(' | '));
    check('and signing out, since somebody is signed in',
          acts.some((t) => /sign out/i.test(t)), acts.join(' | '));
  }
  await ev('closeModal()');

  say('');
  say('ran ' + checks + ' checks');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'vaccsignin: ' + fails + ' FAILED'
                         : 'vaccsignin: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'vaccsignin CRASH'; });
</script></body></html>

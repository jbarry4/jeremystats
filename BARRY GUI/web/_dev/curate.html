<!doctype html>
<html><head><meta charset="utf-8"><title>curate: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:660px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}.hd{color:#ffb81c}
iframe{position:fixed;left:660px;top:0;right:0;bottom:0;width:calc(100vw - 660px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n);
  L.scrollTop = L.scrollHeight; };
const check = (w, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + w + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 12000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(90);
  }
  return false;
}
const post = (u, b) => fetch(u, { method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(b) }).then((r) => r.json());

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 30000);
  const W = frame.contentWindow, D = () => frame.contentDocument;
  const $ = (s) => D().querySelector(s);
  const $$ = (s) => Array.from(D().querySelectorAll(s));

  /* A reachable recording to curate against. */
  const reg = await (await fetch('/api/registry?backfill=1')).json();
  const rows = (reg.tree || []).flatMap((p) => p.mice.flatMap((m) => m.sessions));
  const target = rows.find((s) => s.reachable);
  check('there is a reachable recording', !!target,
        rows.map((s) => s.label + (s.reachable ? '*' : '')).join(', '));
  if (!target) { say('cannot continue', 'bad'); document.title = 'curate: FAILED'; return; }
  const gid = target.gid;
  say('curating against ' + target.label + '  (' + gid + ')', 'note');

  // Clean slate.
  for (const k of ['ied', 'ds']) {
    await post('/api/curation/' + gid + '/' + k + '/delete', {});
  }

  say('');
  say('=== candidates arrive unspecified ===', 'hd');
  const times = [];
  for (let i = 0; i < 10; i++) times.push({ start: 12 + i * 0.9, channel: 8 });
  const made = await post('/api/curation/create', {
    gid, kind: 'ied', name: 'curate harness', events: times,
    source: { from: 'harness' },
  });
  check('a set can be created', made.ok === true, made.error || '');
  check('every candidate is imported', made.added === 10, String(made.added));
  const pr0 = (made.set || {}).progress || {};
  check('none of them is specified',
        pr0.specified === 0 && pr0.left === 10, JSON.stringify(pr0));

  say('');
  say('=== the ToolKit lists it ===', 'hd');
  ev("setView('toolkit')");
  await sleep(700);
  const curBtn = $$('.tk-tool').find((b) => /Event curation/.test(b.textContent));
  check('there is an Event curation tool', !!curBtn,
        $$('.tk-tool strong').map((n) => n.textContent).join(' | '));
  curBtn.click();
  await until(() => $('#tkResult .cur-set'), 12000);
  await sleep(600);

  /* Open the shelf. A set nobody has picked up is not on the bench -- the
     bench is what you have open -- and the shelf is folded away until
     wanted, so with forty-three sets in the store the set this harness just
     created was legitimately nowhere in the DOM. */
  const shelfBtn = $('.cur-shelf-toggle');
  if (shelfBtn && !shelfBtn.classList.contains('on')) {
    shelfBtn.click();
    await until(() => $('#curShelfList .cur-shelf-row'), 12000);
    await sleep(500);
  }
  /* Searched for by name, because the shelf holds forty-odd rows and only
     shows the ones matching the filter. */
  const search = $('#tkResult .cur-search');
  if (search) {
    search.value = 'curate harness';
    search.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(700);
  }

  /* Find OUR card, not the first one. Anyone using BARRY has curation sets
     of their own, and taking `.cur-set` unqualified meant the harness read
     someone else's progress and, worse, pressed its keys into someone else's
     set. It did exactly that, and the decisions had to be unpicked by hand. */
  /* On the bench or on the shelf -- they are different elements: a bench
     card is a `.cur-set`, a shelf entry is a `.cur-shelf-row`, and looking
     only for the first is what made this fail once the two were separated. */
  let card = $$('.cur-set, .cur-shelf-row').find(
    (c) => /curate harness/.test(c.textContent));
  check('the set is listed', !!card,
        $$('.cur-set').map((c) => (c.textContent || '').slice(0, 30))
          .join(' | '));


  /* Pick it up, if what was found was a shelf row. Everything below reads a
     bench card -- the per-category tallies, the keys -- and a shelf entry
     carries none of that. Picking it up is also what a person does next. */
  if (card && card.classList.contains('cur-shelf-row')) {
    const up = $$('button', card).find(
      (b) => /Pick it up/.test(b.textContent));
    check('the shelf row offers to pick it up', !!up);
    if (up) {
      up.click();
      await until(() => $$('.cur-set').some(
        (c) => /curate harness/.test(c.textContent)), 15000);
      await sleep(600);
      card = $$('.cur-set').find((c) => /curate harness/.test(c.textContent));
      check('it lands on the bench', !!card,
            $$('.cur-set').map((c) => c.textContent.slice(0, 24)).join(' | '));
    }
  }

  if (!card) { say('cannot continue without our own set', 'bad'); return; }
  const inCard = (sel) => card.querySelector(sel);
  const allInCard = (sel) => Array.from(card.querySelectorAll(sel));

  check('it shows the progress',
        /0 \/ 10/.test((inCard('.cur-set-n') || {}).textContent || ''),
        (inCard('.cur-set-n') || {}).textContent);
  const tally = allInCard('.cur-tally').map((n) => n.textContent.trim());
  say('  tally: ' + tally.join(' | '), 'note');
  check('it shows one tally per category', tally.length === 4, tally.join(' | '));
  /* Banking lives behind More… now, so it has to be opened first. The
     check is the same one and worth keeping: it is the guard against
     publishing a version in which nothing was decided. */
  const moreBtn = allInCard('.cur-set-acts button').find(
    (b) => /^More/.test(b.textContent.trim()));
  check('the card offers More…', !!moreBtn,
        allInCard('.cur-set-acts button')
          .map((b) => b.textContent.trim()).join(' | '));
  if (moreBtn) {
    moreBtn.click();
    await sleep(500);
  }
  const bankBtn = allInCard('button').find((b) => /Bank/.test(b.textContent));
  check('there is a Bank button', !!bankBtn,
        allInCard('button').map((b) => b.textContent.trim()).join(' | '));
  check('banking is refused while nothing is decided',
        !!bankBtn && !!bankBtn.disabled);

  say('');
  say('=== entering the mode ===', 'hd');
  /* "Carry on…" while anything is left, "Look again…" once nothing is --
     the verb changed from "Curate" when the card was redesigned around what
     you are about to do rather than what the mode is called. */
  const goBtn = allInCard('.cur-set-acts button').find(
    (b) => /Carry on|Look again|Curate/.test(b.textContent));
  check('the card offers a way in', !!goBtn,
        allInCard('.cur-set-acts button')
          .map((b) => b.textContent.trim()).join(' | '));
  if (!goBtn) { say('cannot enter the mode', 'bad'); return; }
  goBtn.click();
  const entered = await until(() => $('#curBar'), 40000);
  check('the curation bar appears', entered);
  await sleep(2500);
  check('it switched to Xplorefinder', ev('BARRY.state.view') === 'xplore',
        ev('BARRY.state.view'));

  const st = () => JSON.parse(ev('JSON.stringify(BARRY.curate.state)'));
  say('  state: ' + JSON.stringify(st()), 'note');
  check('it knows where it is', st() && st().total === 10,
        JSON.stringify(st()));
  check('and starts on the first undecided one', st().index === 0);

  /* The layout it sets up for you. */
  const panels = JSON.parse(ev(
    'JSON.stringify(BARRY.views.xplore.state.panes.map(p => p && p.panel))'));
  say('  panes: ' + JSON.stringify(panels), 'note');
  check('voltage traces are the primary pane', panels[0] === 'traces',
        JSON.stringify(panels));
  /* And nothing else in this window. The aids -- spectrogram, CSD, voltage
     raster -- moved into a window of their own, for the same reason
     StrataScope's did: what you are deciding, whether a deflection is the
     thing or one bad wire, is read off the traces, so the traces get the
     whole window. This harness spent a while asserting the old single-grid
     layout and reporting the redesign as three failures. */
  check('and nothing competing with them in this window',
        panels.filter(Boolean).length === 1, JSON.stringify(panels));
  /* The aid window cannot be inspected from here -- headless Chromium
     refuses window.open, so `aidWin` is null however the code behaved --
     but that it was ASKED for is checkable, and is the part that would
     regress silently. */
  const asked = ev('typeof BARRY.curate.exit === "function"');
  check('the mode is set up rather than left to the previous layout',
        String(asked) === 'true');

  /* It has to have moved the window to the candidate. */
  const S = 'BARRY.views.xplore.state.sessions['
          + 'BARRY.views.xplore.state.active]';
  const t0 = Number(ev(S + '.t0'));
  check('the window jumped to the first candidate',
        Math.abs(t0 + Number(ev(S + '.span')) / 2 - 12) < 0.2,
        't0=' + t0.toFixed(2) + ' span=' + ev(S + '.span'));

  say('');
  say('=== a key per category ===', 'hd');
  const cats = $$('.cur-cat').map((b) => b.textContent.replace(/\s+/g, ' ').trim());
  say('  ' + cats.join('  |  '), 'note');
  check('every category has a key on it', $$('.cur-cat kbd').length === 4,
        $$('.cur-cat kbd').map((k) => k.textContent).join(''));

  const press = async (k) => {
    D().body.dispatchEvent(new W.KeyboardEvent('keydown',
      { key: k, bubbles: true }));
    await sleep(900);
  };

  await press('1');          // solid
  check('pressing 1 decides it and moves on', st().index === 1,
        JSON.stringify(st()));
  check('one fewer left', st().left === 9, String(st().left));
  await press('2');          // sputter
  await press('3');          // garbage
  check('three decided', st().left === 7, String(st().left));

  // It has to have reached the server, not just the screen.
  await sleep(900);
  const onDisk = await (await fetch('/api/curation/' + gid + '/ied')).json();
  check('the decisions are on the server',
        onDisk.progress.specified === 3, JSON.stringify(onDisk.progress));
  const by = onDisk.progress.by_label || {};
  check('and they are the right ones',
        by.solid === 1 && by.sputter === 1 && by.garbage === 1,
        JSON.stringify(by));

  say('');
  say('=== undo goes back a decision and a candidate ===', 'hd');
  const wasAt = st().index;
  await press('u');
  check('it steps back to the one it undid', st().index === wasAt - 1,
        wasAt + ' -> ' + st().index);
  check('and that one is undecided again', st().left === 8, String(st().left));
  await sleep(900);
  const afterUndo = await (await fetch('/api/curation/' + gid + '/ied')).json();
  check('the undo reached the server too',
        afterUndo.progress.specified === 2,
        JSON.stringify(afterUndo.progress));

  say('');
  say('=== moving without deciding ===', 'hd');
  const before = st().index;
  await press('n');
  check('n moves on', st().index !== before, before + ' -> ' + st().index);
  await press('p');
  check('p goes back', st().index === before, String(st().index));
  check('and nothing was decided by moving', st().left === 8,
        String(st().left));

  say('');
  say('=== the trace shows the candidates ===', 'hd');
  const painted = ev('(function(){'
    + 'var c=document.querySelector(".pane-canvas-host canvas");'
    + 'if(!c) return -1;'
    + 'var d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;'
    + 'var n=0; for(var i=3;i<d.length;i+=4){ if(d[i]>40) n++; } return n;})()');
  check('something is drawn on the trace', painted > 1000, String(painted));
  check('the session carries the curation overlay',
        ev('typeof ' + S + '.curation') === 'object');

  say('');
  say('=== banking the results ===', 'hd');
  const bankRes = await post('/api/curation/' + gid + '/ied/bank',
                             { added_by: 'curate@harness' });
  check('the curated events bank', bankRes.ok === true, bankRes.error || '');
  say('  entries: ' + JSON.stringify(bankRes.entries), 'note');
  /* One entry for the whole set, with a version history -- not one per
     category. The per-category entries this used to make are folded into
     it and deleted, because every event in them came from this set and is
     being written again. */
  const banked = bankRes.entries || [];
  check('one entry for the whole set, not one per category',
        banked.length === 1, JSON.stringify(banked.map((e) => e.name)));
  const one = banked[0] || {};
  say('  banked: ' + JSON.stringify({
    name: one.name, n: one.n, version: one.version,
    by_label: one.by_label }), 'note');
  check('it is written as a new version',
        one.new_version === true || one.version >= 1, String(one.version));
  /* Two decided at this point -- one solid, one sputter, after the undo --
     so the version has to carry two, and say which. */
  check('the version carries the decided events and no others',
        one.n === 2, String(one.n));
  const lab = one.by_label || {};
  check('and names which category each was',
        Object.keys(lab).length === 2
        && Object.keys(lab).every((k) => lab[k] === 1),
        JSON.stringify(lab));

  const bank = await (await fetch('/api/bank')).json();
  /* `curation_label: '*'` is what marks the one-entry-for-the-whole-set
     record -- the per-category entries it replaced carried a label id
     there. There is no `curation_kind` on an entry; the vocabulary is in
     `type`. */
  const mine = (bank.entries || []).filter(
    (e) => e.gid === gid && e.curation_label === '*');
  check('the bank holds exactly one entry for this set',
        mine.length === 1, mine.map((e) => e.name).join(' | '));
  /* Deliberately not asserting `added.by` is the harness. `added.by` is
     shards.FIRST -- immutable across the merge, because provenance is not
     an editable field -- and banking continues the detector's existing
     entry where there is one, so the entry keeps whoever first made it. */
  if (mine.length === 1) {
    say('  entry added.by is ' + JSON.stringify((mine[0].added || {}).by)
        + ' (kept from whoever first made it, by design)', 'note');
    check('and it has a version history',
          (mine[0].versions || []).length >= 1,
          String((mine[0].versions || []).length));
  }

  say('');
  say('=== leaving ===', 'hd');
  await press('Escape');
  await sleep(800);
  check('escape leaves the mode', ev('BARRY.curate.state') === null);
  check('and takes the bar with it', !$('#curBar'));
  check('the overlay is detached from the session',
        ev('typeof ' + S + '.curation') === 'undefined');

  say('');
  say('=== both vocabularies exist ===', 'hd');
  const kinds = await (await fetch('/api/curation/kinds')).json();
  const ids = (kinds.kinds || []).map((k) => k.id);
  check('dentate spikes and IEDs', ids.includes('ds') && ids.includes('ied'),
        JSON.stringify(ids));
  const reserved = kinds.reserved || [];
  say('  reserved for navigation: ' + reserved.join(' '), 'note');
  for (const k of (kinds.kinds || [])) {
    say('  ' + k.id + ': ' + k.labels.map(
      (l) => l.name + ' (' + l.keys.join('/') + ')').join(', '), 'note');
    check(k.id + ' has keys on every category',
          k.labels.every((l) => (l.keys || []).length > 0));
    // The bug this found: sputter had `p`, which is also "previous".
    check(k.id + ' takes none of the navigation keys',
          k.labels.every((l) => (l.keys || []).every(
            (key) => !reserved.includes(key.toLowerCase()))),
          k.labels.map((l) => l.keys.join('/')).join(' | '));
  }

  // Clean up.
  await post('/api/curation/' + gid + '/ied/delete', {});
  for (const e of mine) {
    await fetch('/api/bank/' + e.id + '/delete', { method: 'POST' });
  }

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'curate: ' + fails + ' FAILED' : 'curate: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'curate CRASH'; });
</script></body></html>

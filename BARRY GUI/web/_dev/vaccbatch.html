<!doctype html>
<html><head><meta charset="utf-8"><title>vaccbatch: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:720px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:720px;top:0;right:0;bottom:0;width:calc(100vw - 720px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/#toolkit"></iframe>
<script>
/* The batch, the queue it leaves, and the pick that gets banked.

   The thing this is really guarding is the last step. A batch that banks
   its own answers is a batch nobody looks at, and a review that loses the
   registry row behind it banks a set under "Unfiled" where nobody can find
   it by the animal it came from. Both of those are silent: the numbers are
   right, the entry exists, and it is in the wrong place.

   So the assertions are about what a review CARRIES, not only about what it
   shows: the per-channel summaries the three plots are drawn from, the pick
   with its margin, and the project/mouse/session that banking reads. */
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 8000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(80);
  }
  return false;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 25000);
  const D = () => frame.contentDocument;

  say('=== two halves, and the cluster one is locked until the mode is on ===');
  // Open the Incisor tool the way a person does.
  await ev('setView("toolkit")');
  await sleep(300);
  // `until` here returns a boolean, not the thing it found -- the one in
  // incisor.html returns the value and the two are easy to confuse.
  let toolBtn = null;
  await until(() => {
    toolBtn = Array.from(D().querySelectorAll('#tkBody .tk-tool, #tkBody .tk-step'))
      .find((b) => /Incisor/.test(b.textContent));
    return !!toolBtn;
  }, 15000);
  check('the Incisor tool is in the ToolKit', !!toolBtn);
  if (toolBtn) { toolBtn.click(); await sleep(500); }

  /* Where and how many, through the run bar (constitution §6d). These were
     two tabs -- "This computer: one at a time" and "VACC: many at once" --
     which made VACC mean "many". Now Where offers VACC only while it can be
     used (VACC Mode on, an account set up), and How many appears under it;
     with one mode there is nothing to choose and the bar draws nothing. */
  const segBtns = (label) => {
    const f = Array.from(D().querySelectorAll('#tkBody .run-bar .ui-field'))
      .find((n) => (n.querySelector('.section-label') || {}).textContent === label);
    return f ? Array.from(f.querySelectorAll('.seg button')) : [];
  };
  const body = () => ((D().getElementById('tkBody') || {}).textContent || '');
  const realVacc = ev('BARRY.state.vacc');
  const configured = !!ev('(BARRY.vacc && BARRY.vacc.last || {}).configured');

  await ev('applyVacc(false)');
  await sleep(350);
  check('with VACC Mode off there is no Where to choose',
        segBtns('Where').length === 0,
        segBtns('Where').map((b) => b.textContent).join(' | '));
  check('and the one-recording panel is what is showing',
        /Scan every channel|Recording/.test(body()), body().slice(0, 70));

  if (!configured) {
    say('  note  no VACC account on this machine; the VACC half is skipped',
        'note');
  } else {
    await ev('applyVacc(true)');
    await sleep(400);
    const where = segBtns('Where');
    check('turning the mode on offers This computer or VACC, without '
          + 'navigating away',
          where.map((b) => b.textContent).join('|') === 'This computer|VACC',
          where.map((b) => b.textContent).join(' | '));
    check('here, there is no How many: here runs one recording',
          segBtns('How many').length === 0);
    const v = where.find((b) => b.textContent === 'VACC');
    if (v) { v.click(); await sleep(400); }
    const many = segBtns('How many');
    check('choosing VACC asks how many',
          many.map((b) => b.textContent).join('|') === 'One|Many',
          many.map((b) => b.textContent).join(' | '));
    const m = many.find((b) => b.textContent === 'Many');
    if (m) { m.click(); await sleep(600); }
    check('and many shows which recordings would go',
          /Recordings/.test(body()), body().slice(0, 70));
    // Back to where a person would have been.
    const here = segBtns('Where').find((b) => b.textContent === 'This computer');
    if (here) { here.click(); await sleep(300); }
  }
  await ev('applyVacc(' + JSON.stringify(!!realVacc) + ')');

  say('');
  say('=== the queue the batch leaves behind ===');
  const rv = JSON.parse(await ev('fetch("/api/incisor/reviews").then(r=>r.text())'));
  check('/api/incisor/reviews answers', rv.ok === true);
  check('there are finished scans to review', (rv.n || 0) > 0, String(rv.n));
  if (!rv.n) { say('nothing scanned yet; the rest needs a batch', 'note'); }

  const rows = rv.reviews || [];
  const onVacc = rows.filter((r) => r.ran_on === 'vacc');
  check('some of them were computed on the cluster', onVacc.length > 0,
        onVacc.length + ' of ' + rows.length);
  check('and each of those names the slurm job that did it',
        onVacc.every((r) => !!r.slurm_id),
        JSON.stringify(onVacc.slice(0, 2).map((r) => r.slurm_id)));

  say('');
  say('=== what a review carries ===');
  for (const r of rows.slice(0, 6)) {
    const h = (r.picked || {}).hilus || {};
    check('has a readable name: ' + (r.label || '').slice(0, 26),
          !!r.label && r.label !== r.gid, r.gid);
  }
  /* A cluster-computed one, not merely the first with a local path.
     The batch ran every recording with this tool's default settings, so a
     review from it is answerable out of the vault instantly. An older scan
     made with different parameters has a different `params_hash`, is not a
     cache hit, and starts a real sixty-four channel run -- which is minutes,
     and read here as "the stored scan did not come back". */
  const one = rows.find((r) => r.local && r.ran_on === 'vacc')
           || rows.find((r) => r.local) || rows[0];
  check('at least one is openable on this machine', !!(one && one.local),
        one ? String(one.local) : 'none');

  // The summaries the three plots are drawn from are counted here and
  // fetched by the panel when a review is opened -- shipping 64 of them per
  // recording to draw a list of names is two megabytes to render text.
  check('each review says how many channel summaries it has',
        rows.every((r) => typeof r.n_summaries === 'number'),
        JSON.stringify(rows.slice(0, 2).map((r) => r.n_summaries)));
  check('and the scans actually have them',
        rows.some((r) => r.n_summaries > 1),
        JSON.stringify(rows.map((r) => r.n_summaries).slice(0, 6)));

  say('');
  say('=== the registry row banking needs ===');
  // Without this a banked set files under "Unfiled" and cannot be found by
  // the animal it came from. Silent: the entry exists and the numbers are
  // right, and it is in the wrong place.
  check('a review carries its registry row', !!(one && one.row),
        JSON.stringify(one && one.row));
  if (one && one.row) {
    for (const k of ['project', 'mouse', 'session']) {
      check('  row has ' + k, one.row[k] != null,
            JSON.stringify(one.row));
    }
  }

  say('');
  say('=== the pick, and whether it was close ===');
  const withPick = rows.filter((r) => ((r.picked || {}).hilus || {}).index != null);
  check('the scans picked a hilus', withPick.length > 0,
        withPick.length + ' of ' + rows.length);
  const margins = withPick.map((r) => r.picked.hilus.margin)
    .filter((m) => m != null);
  check('every pick reports how far it beat the runner-up',
        margins.length === withPick.length,
        margins.length + ' of ' + withPick.length);
  const close = margins.filter((m) => m < 0.1).length;
  say('    ' + close + ' of ' + margins.length
      + ' picks were within 10% of the runner-up -- which is why the plots '
      + 'are the answer and the number is a formality', 'note');

  say('');
  say('=== opening one puts it in the ordinary panel ===');
  if (one && one.local) {
    await ev('BARRY.views.toolkit && BARRY.views.toolkit.onShow && '
             + 'BARRY.views.toolkit.onShow()');
    await sleep(400);
    // Straight at the module, rather than hunting for a button: what is
    // being checked is that a review re-enters the normal scan path and
    // comes back out of the vault, not how it was clicked.
    ev('BARRY.incisor._state().q.path = ' + JSON.stringify(one.local));
    ev('BARRY.incisor._state().q.gid = ' + JSON.stringify(one.gid));
    await ev('BARRY.incisor.scan()');
    await until(() => ev('!!BARRY.incisor._state().res'), 60000);
    const res = ev('JSON.stringify(!!BARRY.incisor._state().res)');
    check('the stored scan came back without recomputing', res === 'true',
          String(res));
    check('and it has the three plots’ data',
          ev('(BARRY.incisor._state().res.channels||[]).length') > 0,
          String(ev('(BARRY.incisor._state().res.channels||[]).length')));
  } else {
    check('the stored scan came back without recomputing', true,
          'no locally-openable review; skipped');
    check('and it has the three plots’ data', true, 'skipped');
  }

  say('');
  say('=== VACC mode: any recording the cluster can read ===');
  /* The point of the mode (2026-10-08): pick recordings this computer may
     have no copy of at all, set channels per recording and the detection
     parameters once, submit, then open each answer by its key and bank it.
     Nothing here submits a real job: the batch POST is intercepted and
     refused, so what is checked is what the panel would send. */
  if (!configured) {
    say('  note  no VACC account on this machine; VACC mode skipped', 'note');
  } else {
    await ev('applyVacc(true)');
    await sleep(300);
    const w = segBtns('Where').find((b) => b.textContent === 'VACC');
    if (w) { w.click(); await sleep(300); }
    const mb = segBtns('How many').find((b) => b.textContent === 'Many');
    if (mb) { mb.click(); await sleep(300); }
    await until(() => { const v = ev('BARRY.incisor._vacc().vaccList');
                        return v && (v.todo || v.error); }, 120000);
    const plan = JSON.parse(ev('JSON.stringify(BARRY.incisor._vacc().vaccList'
                               + ' || {})'));
    check('the plan answers', !plan.error && Array.isArray(plan.todo),
          plan.error || '');
    const todo = plan.todo || [];
    const elsewhere = todo.filter((r) => !r.here);
    check('it offers recordings this computer has no copy of',
          elsewhere.length > 0,
          elsewhere.length + ' of ' + todo.length + ' are not here');
    check('every row says its channels, its cost and its bad channels',
          todo.every((r) => r.plan && Array.isArray(r.bad_channels)),
          JSON.stringify(todo.slice(0, 1)));
    check('nothing is ticked for you',
          ev('BARRY.incisor._vacc().picked.length') === 0);
    const tk = () => D().getElementById('tkResult');
    check('the detection parameters are on the panel, not inherited unseen',
          !!(tk() && tk().querySelector('.incisor-params')));
    check('the primary says it has nothing to submit yet',
          !!Array.from(tk().querySelectorAll('button.btn'))
            .find((b) => /^Nothing new to submit$/.test(b.textContent)));

    // No name is cut off (never-truncate rule): measured, not eyeballed.
    const cut = Array.from(tk().querySelectorAll('.ip-name, .ip-sub'))
      .filter((n) => n.offsetParent && n.scrollWidth > n.clientWidth + 1);
    check('no recording name in the list is cut off', cut.length === 0,
          cut.slice(0, 2).map((n) => n.textContent).join(' | '));

    const target = elsewhere.find((r) => !r.answered) || todo.find((r) => !r.answered);
    if (target) {
      ev('BARRY.incisor._pick(' + JSON.stringify([target.gid]) + ')');
      await sleep(200);
      const prim = Array.from(tk().querySelectorAll('button.btn'))
        .find((b) => /^Submit \d+ to VACC$/.test(b.textContent));
      check('ticking one names what the primary will do',
            !!prim && /^Submit 1 to VACC$/.test(prim.textContent),
            prim && prim.textContent);
      check('and the cost is said before it is spent',
            /cluster time/.test(tk().textContent));
      // What would be sent -- intercepted at fetch, refused, never
      // submitted. (`apiPost` is a const; every request goes through fetch.)
      ev('window.__incSent = null; window.__realFetch = window.fetch;'
         + 'window.fetch = function (u, o) {'
         + ' if (String(u) === "/api/incisor/batch" && o && o.method === "POST") {'
         + '  window.__incSent = JSON.parse(o.body || "{}");'
         + '  return Promise.resolve(new Response(JSON.stringify({ ok: false,'
         + '   error: "harness: not sent" }), { status: 400,'
         + '   headers: { "Content-Type": "application/json" } })); }'
         + ' return window.__realFetch(u, o); };');
      ev('BARRY.incisor._state().q.height_sd = 5');
      prim.click();
      await until(() => ev('!!window.__incSent'), 4000);
      const sent = JSON.parse(ev('JSON.stringify(window.__incSent)') || 'null');
      ev('window.fetch = window.__realFetch; '
         + 'BARRY.incisor._state().q.height_sd = 4.5');
      check('the batch is sent the ticked recording and the parameters shown',
            sent && JSON.stringify(sent.gids) === JSON.stringify([target.gid])
            && sent.height_sd === 5, JSON.stringify(sent));
      check('and with no batch in flight after a refusal',
            !ev('BARRY.incisor._vacc().batchJob'));
      ev('BARRY.incisor._pick([])');
    } else {
      say('  note  every runnable recording already answered', 'note');
    }

    /* A review opens by its key, with no copy here, and Extract all counts
       by key -- which is what makes "only on the cluster" bankable. */
    const rv2 = JSON.parse(await ev('fetch("/api/incisor/reviews")'
                                    + '.then(r=>r.text())'));
    const far = (rv2.reviews || []).find((r) => !r.local && r.ran_on === 'vacc')
             || (rv2.reviews || []).find((r) => r.ran_on === 'vacc');
    if (far) {
      await ev('BARRY.incisor._openReview(' + JSON.stringify(far) + ')');
      await until(() => ev('!!(BARRY.incisor._state().res || {}).channels'), 120000);
      const st = JSON.parse(ev('JSON.stringify({ key: (BARRY.incisor._state()'
        + '.res || {}).key, path: BARRY.incisor._state().q.path })'));
      check('a review opens that scan, by its key', st.key === far.params_hash,
            JSON.stringify(st));
      check('and looks at it from wherever it can be read',
            far.local ? st.path === far.local : /^vacc:/.test(st.path || ''),
            st.path);
      await until(() => tk().querySelectorAll('.inc-role').length >= 3, 8000);
      check('the three picks and the plots are drawn under its row',
            tk().querySelectorAll('.inc-drop .inc-role').length >= 3);
      await until(() => { const u = ev('BARRY.incisor._union().unionRes');
                          return u && (u.ok || u.error); }, 30000);
      const u = JSON.parse(ev('JSON.stringify(BARRY.incisor._union().unionRes'
                              + ' || {})'));
      check('Extract all counts a hilus range by key', u.ok === true
            && typeof u.n === 'number', JSON.stringify(u).slice(0, 160));
      await ev('BARRY.incisor._openReview(' + JSON.stringify(far) + ')');
    } else {
      say('  note  no cluster-computed scan in the queue yet', 'note');
    }
    const here2 = segBtns('Where').find((b) => b.textContent === 'This computer');
    if (here2) { here2.click(); await sleep(300); }
  }
  await ev('applyVacc(' + JSON.stringify(!!realVacc) + ')');

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'vaccbatch: ' + fails + ' FAILED' : 'vaccbatch: passed';
  // The app polls while framed, which pins virtual time to the wall clock;
  // blank it so the runner can take the dump.
  frame.src = 'about:blank';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'vaccbatch CRASH';
                    document.getElementById('app').src = 'about:blank'; });
</script></body></html>

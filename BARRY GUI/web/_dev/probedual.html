<!doctype html>
<html><head><meta charset="utf-8"><title>probedual: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:700px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:700px;top:0;right:0;bottom:0;width:calc(100vw - 700px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
/* Two probes in two places, and the arithmetic that depends on knowing it.

   The KCNT1 recordings are 128 channels because there are two implants in
   the animal -- a linear array in hippocampus on CSC 1-64 and another in M2
   on CSC 65-128 -- not one probe with twice as many contacts. A CSD down the
   channel order steps across that gap at channel 64 and subtracts cortex
   from hippocampus. It produces a number, the number is meaningless, and
   nothing about it looks wrong. That is what the dual template is for.

   So the assertions here are about the split being exactly the 64/64 the
   registry already writes down, about the choice being a fact of the
   RECORDING rather than of whoever has it open, and about "nobody has said"
   staying distinct from "somebody said H3". A guess that looks like a fact
   cannot be found again -- the same argument `banks_for` makes about
   leaving a region blank. */
const L = document.getElementById('log');
let fails = 0, checks = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { checks++; if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 20000)) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    await sleep(80);
  }
  return null;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  const $$ = (s) => Array.from(D().querySelectorAll(s));
  const post = (p, b) => ev('fetch("' + p + '",{method:"POST",'
    + 'headers:{"Content-Type":"application/json"},'
    + 'body:JSON.stringify(' + JSON.stringify(b) + ')}).then(r=>r.text())');
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'),
              25000);

  say('=== the template ===');
  const pr = JSON.parse(await ev('fetch("/api/probes").then(r=>r.text())'));
  const byId = {};
  for (const p of (pr.probes || [])) byId[p.id] = p;
  check('the server offers a dual template', !!byId.dual,
        Object.keys(byId).join(', '));
  check('the ones that were there still are', !!byId.h3 && !!byId.h10d);
  if (!byId.dual) {
    document.title = 'probedual: ' + (fails || 1) + ' FAILED';
    return;
  }

  const d = byId.dual;
  check('it is two columns, not six', d.n_columns === 2, String(d.n_columns));
  const cols = d.columns || [];
  check('and it says so in its columns', cols.length === 2,
        cols.length + ' columns');
  const hpc = cols[0], m2 = cols[1];
  check('the first is hippocampus', (hpc.region || '') === 'Hippocampus',
        hpc.region);
  check('the second is M2', (m2.region || '') === 'M2', m2.region);
  /* The split has to be the same 64/64 the registry writes down, or the
     bank labels and the pane labels describe different channels. */
  check('hippocampus is CSC 1 to 64',
        hpc.csc[0] === 1 && hpc.csc[hpc.csc.length - 1] === 64
        && hpc.csc.length === 64,
        hpc.csc[0] + '..' + hpc.csc[hpc.csc.length - 1]
        + ' (' + hpc.csc.length + ')');
  check('M2 is CSC 65 to 128',
        m2.csc[0] === 65 && m2.csc[m2.csc.length - 1] === 128
        && m2.csc.length === 64,
        m2.csc[0] + '..' + m2.csc[m2.csc.length - 1]
        + ' (' + m2.csc.length + ')');
  check('the two do not overlap',
        new Set(hpc.csc.concat(m2.csc)).size === 128);
  /* Each column is a straight line of contacts, which is the whole claim:
     a CSD down either one is arithmetic over neighbours. */
  const spacing = new Set();
  for (let i = 1; i < hpc.depths_um.length; i++) {
    spacing.add(+(hpc.depths_um[i - 1] - hpc.depths_um[i]).toFixed(3));
  }
  check('hippocampus is evenly spaced, so a CSD down it is meaningful',
        spacing.size === 1, Array.from(spacing).join(', ') + ' um');
  check('at the array pitch the rest of the app already uses',
        d.pitch_um === 50, String(d.pitch_um));
  check('each column is ordered top-down, like the H10 columns',
        hpc.depths_um[0] > hpc.depths_um[hpc.depths_um.length - 1]);

  say('');
  say('=== which probe is a fact about the recording ===');
  const reg = JSON.parse(await ev(
    'fetch("/api/registry?no_demo=1").then(r=>r.text())'));
  const rows = [];
  for (const p of (reg.tree || [])) {
    for (const m of (p.mice || [])) rows.push(...(m.sessions || []));
  }
  check('every row carries the field, said or not',
        rows.every((r) => 'probe' in r && 'probe_suggested' in r),
        rows.filter((r) => !('probe' in r)).length + ' without');

  const big = rows.filter((r) => (r.n_channels || 0) === 128);
  const small = rows.filter((r) => (r.n_channels || 0) === 64);
  say('    ' + big.length + ' at 128 channels, ' + small.length + ' at 64',
      'note');
  check('a 128-channel recording reads as a dual implant',
        big.every((r) => r.probe_suggested === 'dual'),
        big.filter((r) => r.probe_suggested !== 'dual').length + ' do not');
  check('a 64-channel one does not',
        small.every((r) => r.probe_suggested === 'h3'),
        small.filter((r) => r.probe_suggested !== 'h3').length + ' do');
  /* The distinction the whole design rests on. A suggestion is not an
     answer, and filing it would turn a guess into a fact nobody could find
     again. */
  check('a suggestion is never written down as a decision',
        rows.every((r) => !(r.probe_source === 'manual' && !r.probe)),
        'records claiming a manual probe with no probe set');

  if (!big.length) {
    say('    no 128-channel recording here to assign one to', 'note');
    say('');
    say('ran ' + checks + ' checks');
    document.title = fails ? 'probedual: ' + fails + ' FAILED'
                           : 'probedual: passed';
    return;
  }

  say('');
  say('=== assigning it, and putting it back ===');
  const gid = big[0].gid;
  const was = big[0].probe || '';
  say('    ' + gid + ' was ' + (was || 'unset'), 'note');
  try {
    const set = JSON.parse(await post('/api/registry/' + gid + '/probe',
                                      { probe: 'dual' }));
    check('it can be assigned', set.ok === true, JSON.stringify(set).slice(0, 90));
    check('and is recorded as somebody having said so',
          set.probe === 'dual' && set.probe_source === 'manual',
          set.probe + ' / ' + set.probe_source);
    /* Picking a template with named regions IS saying which bank is which.
       Making somebody enter the same fact twice is how the two come to
       disagree. */
    const banks = set.channel_banks || [];
    if (banks.length === 2) {
      check('the channel banks are labelled from it',
            banks.every((b) => !!b.region),
            banks.map((b) => b.region).join(', '));
      check('and labelled the right way round',
            banks[0].region === 'Hippocampus' && banks[1].region === 'M2',
            banks.map((b) => b.first + '-' + b.last + ':' + b.region)
              .join('  '));
    } else {
      say('    this record has no channel banks to label', 'note');
    }

    const one = JSON.parse(await ev(
      'fetch("/api/registry/' + gid + '").then(r=>r.text())'));
    check('and it reads back from the registry, not from a window',
          (one.session || {}).probe === 'dual',
          (one.session || {}).probe);

    const bad = await ev('fetch("/api/registry/' + gid + '/probe",'
      + '{method:"POST",headers:{"Content-Type":"application/json"},'
      + 'body:JSON.stringify({probe:"nonsense"})}).then(r=>r.status)');
    check('a template that does not exist is refused', bad === 400,
          String(bad));

    const cleared = JSON.parse(await post('/api/registry/' + gid + '/probe',
                                          { probe: '' }));
    check('clearing it goes back to nobody having said',
          cleared.probe === null || cleared.probe === '',
          JSON.stringify(cleared.probe));
  } finally {
    // Put it back exactly as it was found, source and all. A harness that
    // leaves a decision behind has made one on somebody's behalf.
    await post('/api/registry/' + gid + '/probe', { probe: was });
  }
  const back = JSON.parse(await ev(
    'fetch("/api/registry/' + gid + '").then(r=>r.text())'));
  check('and the recording is left as it was found',
        ((back.session || {}).probe || '') === was,
        JSON.stringify((back.session || {}).probe) + ' wanted '
        + JSON.stringify(was));

  say('');
  say('=== the picker offers it ===');
  ev("setView('xplore')");
  await sleep(900);
  const sel = await until(() => D().getElementById('xfProbe'), 20000);
  check('Xplorefinder has a probe control', !!sel);
  if (sel) {
    const opts = Array.from(sel.options).map((o) => o.value);
    check('built from the server, so a new template appears in it',
          opts.indexOf('dual') >= 0, opts.join(', '));
    check('without dropping the ones that were there',
          opts.indexOf('h3') >= 0 && opts.indexOf('h10d') >= 0,
          opts.join(', '));
  }

  say('');
  say('ran ' + checks + ' checks');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'probedual: ' + fails + ' FAILED'
                         : 'probedual: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'probedual CRASH'; });
</script></body></html>

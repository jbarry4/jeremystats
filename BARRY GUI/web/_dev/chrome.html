<!doctype html>
<html><head><meta charset="utf-8"><title>chrome: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:640px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}.hd{color:#ffb81c}
iframe{position:fixed;left:640px;top:0;right:0;bottom:0;width:calc(100vw - 640px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n);
  L.scrollTop = L.scrollHeight; };
const check = (w, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + w + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 12000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(90);
  }
  return false;
}
(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 30000);
  const W = frame.contentWindow, D = () => frame.contentDocument;
  const $ = (s) => D().querySelector(s);
  const $$ = (s) => Array.from(D().querySelectorAll(s));

  const cat = await (await fetch('/api/sessions')).json();
  /* Pick a recording this machine can actually open.

     Taking the first record's last path was the old rule, and it breaks the
     moment a record carries more than one: the paths accumulate across
     machines and imports, so the last one is as likely to be an unreachable
     mount or an imported .mat as it is the folder. Ask the registry, which
     already works out what is reachable from here. */
  let path = null;
  try {
    const reg = await (await fetch('/api/registry')).json();
    for (const p of (reg.tree || [])) {
      for (const m of p.mice) {
        for (const s of m.sessions) {
          if ((s.here || []).length) { path = s.here[0]; break; }
        }
        if (path) break;
      }
      if (path) break;
    }
  } catch (e) { /* fall through to the old rule */ }
  if (!path) {
    for (const rec of (cat.sessions || [])) {
      const ps = (rec.paths || []).filter(Boolean);
      if (ps.length) { path = ps[0]; break; }
    }
  }
  ev("setView('xplore')");
  await sleep(400);
  await ev('BARRY.views.xplore.open(' + JSON.stringify(path) + ')');
  await until(() => $('.pane-canvas-host canvas'), 25000);
  await sleep(1400);

  say('=== two panes, and a divider between them ===', 'hd');
  $$('#xfLayoutSeg button').find((b) => b.dataset.panes === '2').click();
  await sleep(2400);
  check('two panes are built', $$('#paneGrid .pane').length === 2,
        $$('#paneGrid .pane').length + '');
  const grid = $('#paneGrid');
  const sp = $('.pane-split.col');
  check('there is a column divider', !!sp);
  const before = $$('#paneGrid .pane')[0].getBoundingClientRect().width;
  say('  first pane starts at ' + Math.round(before) + 'px', 'note');

  if (sp) {
    const r = grid.getBoundingClientRect();
    sp.dispatchEvent(new W.MouseEvent('mousedown',
      { clientX: r.left + r.width / 2, clientY: r.top + 100,
        bubbles: true, cancelable: true }));
    await sleep(60);
    W.dispatchEvent(new W.MouseEvent('mousemove',
      { clientX: r.left + r.width * 0.3, clientY: r.top + 100, bubbles: true }));
    await sleep(220);
    W.dispatchEvent(new W.MouseEvent('mouseup', { bubbles: true }));
    await sleep(1000);
    const after = $$('#paneGrid .pane')[0].getBoundingClientRect().width;
    say('  after dragging to 30%: ' + Math.round(after) + 'px', 'note');
    check('dragging the divider resizes the panes',
          Math.abs(after - before) > 60,
          Math.round(before) + ' -> ' + Math.round(after));
    check('and it is clamped, not collapsed', after > 60,
          Math.round(after) + 'px');
    check('the divider followed the split',
          Math.abs($('.pane-split.col').getBoundingClientRect().left
                   - $$('#paneGrid .pane')[0].getBoundingClientRect().right) < 10,
          'divider ' + Math.round($('.pane-split.col').getBoundingClientRect().left)
          + ' vs edge '
          + Math.round($$('#paneGrid .pane')[0].getBoundingClientRect().right));

    $('.pane-split.col').dispatchEvent(new W.MouseEvent('dblclick',
      { bubbles: true }));
    await sleep(900);
    const even = $$('#paneGrid .pane').map(
      (p) => Math.round(p.getBoundingClientRect().width));
    check('double-click evens them up', Math.abs(even[0] - even[1]) < 4,
          even.join(' vs '));
  }

  say('');
  say('=== the canvas follows the pane ===', 'hd');
  const c0 = $$('#paneGrid .pane canvas')[0];
  check('the canvas is sized to its pane',
        Math.abs(c0.getBoundingClientRect().width
                 - $$('#paneGrid .pane')[0].getBoundingClientRect().width) < 150,
        Math.round(c0.getBoundingClientRect().width) + ' in '
        + Math.round($$('#paneGrid .pane')[0].getBoundingClientRect().width));

  say('');
  say('=== putting chrome away ===', 'hd');
  check('there is a View button', !!$('#xfView'));
  $('#xfView').click();
  await sleep(550);
  check('it opens a menu', !!$('.ctl-pop'));
  const labels = $$('.ctl-pop .toggle span').map((n) => n.textContent);
  say('  offers: ' + labels.join(' | '), 'note');
  check('all four pieces are offered',
        ['Channel list', 'Control strip', 'Pane headers', 'Session tabs']
          .every((t) => labels.includes(t)), labels.join(' | '));

  const plotH = () => $('.pane-canvas-host').getBoundingClientRect().height;
  const h0 = plotH();
  $$('.ctl-pop button').find((b) => /Hide it all/.test(b.textContent)).click();
  await sleep(1600);
  check('hiding everything grows the plot', plotH() > h0,
        Math.round(h0) + ' -> ' + Math.round(plotH()));
  const gone = (sel) => $$(sel).length === 0
    || $$(sel).every((n) => n.offsetParent === null);
  check('the strip is gone', gone('.pane-ctl'));
  check('the pane headers are gone', gone('.pane-head'));
  check('the tabs are gone', gone('.xf-tabs'));
  say('  section classes: ' + $('#view-xplore').className, 'note');

  const openView = async () => {
    if (!$('.ctl-pop')) { $('#xfView').click(); await sleep(550); }
  };
  await openView();
  $$('.ctl-pop button').find((b) => /Bring it back/.test(b.textContent)).click();
  await sleep(1600);
  check('bringing it back restores the strip',
        $$('.pane-ctl').length > 0 && $('.pane-ctl').offsetParent !== null);
  check('and the plot returns to about where it was',
        Math.abs(plotH() - h0) < 8, Math.round(h0) + ' -> ' + Math.round(plotH()));

  say('');
  say('=== one pane filling the workspace ===', 'hd');
  const byTitle = (re) => $$('.pane-head .mini').find(
    (b) => b.title && re.test(b.title));
  const zoomBtn = byTitle(/Fill the workspace/);
  check('there is a fill button', !!zoomBtn,
        $$('.pane-head .mini').map((b) => b.title || b.textContent)
          .join(' | ').slice(0, 130));
  if (zoomBtn) {
    zoomBtn.click();
    await sleep(1800);
    check('only one pane is built now', $$('#paneGrid .pane').length === 1,
          $$('#paneGrid .pane').length + '');
    check('it fills the grid',
          Math.abs($('#paneGrid .pane').getBoundingClientRect().width
                   - grid.getBoundingClientRect().width) < 8);
    check('the dividers are gone while zoomed', $$('.pane-split').length === 0);
    const back = byTitle(/Back to the other/);
    check('and there is a way back', !!back);
    if (back) {
      back.click();
      await sleep(1800);
      check('both panes return', $$('#paneGrid .pane').length === 2,
            $$('#paneGrid .pane').length + '');
    }
  }

  say('');
  say('=== full screen ===', 'hd');
  check('every pane offers full screen', !!byTitle(/Full screen/));
  await openView();
  check('the View menu offers it too',
        $$('.ctl-pop button').some((b) => /Full screen/.test(b.textContent)),
        $$('.ctl-pop button').map((b) => b.textContent).join(' | '));
  D().body.dispatchEvent(new W.KeyboardEvent('keydown',
    { key: 'Escape', bubbles: true }));
  await sleep(350);
  const popBtn = byTitle(/Pop this pane out/);
  check('the pop-out says shift means full screen',
        !!popBtn && /shift/i.test(popBtn.title), popBtn ? popBtn.title : '');

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'chrome: ' + fails + ' FAILED' : 'chrome: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'chrome CRASH'; });
</script></body></html>

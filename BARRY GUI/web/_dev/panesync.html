<!doctype html>
<meta charset="utf-8">
<title>Harness — pane sync</title>
<style>
  body { font: 12px/1.55 ui-monospace, monospace; margin: 0; background: #0c0f14;
         color: #dfe6ee; }
  #out { padding: 12px 16px; width: 46vw; }
  iframe { position: fixed; right: 0; top: 0; width: 54vw; height: 100vh;
           border: 0; border-left: 1px solid #243; }
  .ok::before { content: 'ok    '; color: #7fe3b0; }
  .bad::before { content: 'FAIL  '; color: #ff8a7a; }
  .bad { color: #ffb0a5; }
  .note { color: #7593a2; }
  h2 { font-size: 12px; margin: 14px 0 5px; color: #ffb81c; }
</style>
<div id="out"></div>
<iframe id="app" src="/"></iframe>
<script>
/* "Syncing issue for 3 or more panels. I think its due to Rendering timings."

   Two different failures hide behind that, and they need different fixes, so
   measure which one it is:

     wrong    a pane settles on a window that is not the one asked for --
              a lost update, or a stale response overwriting a fresh one
     slow     every pane gets there, but they disagree for long enough to
              look broken while they catch up

   So: drive a real window change across 4 panes and watch what each pane's
   rendered data says, every 50 ms, until they agree or time runs out. */
const out = document.getElementById('out');
let bad = 0;
const say = (c, m) => { const d = document.createElement('div');
                        d.className = c; d.textContent = m;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const check = (n, c, d) => say(c ? 'ok' : 'bad',
                               n + (c || !d ? '' : '   [' + d + ']'));
const head = (t) => { const h = document.createElement('h2');
                      h.textContent = t; out.appendChild(h); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 30000) {
  const t0 = Date.now();
  for (;;) {
    try { const v = fn(); if (v) return v; } catch (e) { /* not yet */ }
    if (Date.now() - t0 > ms) return null;
    await sleep(120);
  }
}

(async () => { try {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const W = frame.contentWindow, D = frame.contentDocument;
  const errs = [];
  W.addEventListener('error', (e) => errs.push(e.message));
  W.addEventListener('unhandledrejection', (e) => errs.push(String(e.reason)));
  await until(() => W.eval('BARRY'));
  const ev = (c) => W.eval(c);

  // A reachable recording.
  let path = null;
  const reg = await (await fetch('/api/registry')).json();
  outer: for (const p of (reg.tree || [])) {
    for (const m of p.mice) {
      for (const s of m.sessions) {
        if ((s.here || []).length) { path = s.here[0]; break outer; }
      }
    }
  }
  if (!path) { say('bad', 'no reachable recording'); return; }
  say('note', '  ' + path.slice(-52));

  ev("setView('xplore')");
  await sleep(300);
  await ev('BARRY.views.xplore.open(' + JSON.stringify(path) + ')');
  await until(() => D.querySelector('.pane-canvas-host canvas'), 40000);
  await sleep(1500);

  head('Four panes, all on one recording');
  /* setPanes takes pane objects, not names -- and the mix matters: four
     trace panes all finish in a blink, which is not the case anybody
     complained about. This is the curation layout: traces plus three
     heavier panels, one of them an every-8 spectrogram. */
  ev('(function(){var S=BARRY.views.xplore.state;'
     + 'var s=S.sessions[S.active];'
     + 'var e8=s.info.channels.filter(function(c,i){return i%8===0;})'
     + '.map(function(c){return c.index;});'
     + 'BARRY.views.xplore.setPanes([{panel:"traces"},'
     + '{panel:"spectrogram",tfChannels:e8,tfMode:"stack",fmin:1,fmax:250},'
     + '{panel:"csd"},{panel:"voltage"}],{col:0.62,row:0.55});})()');
  const ready = await until(() => {
    const n = Number(ev('BARRY.views.xplore.state.nPanes'));
    return n >= 4 ? n : null;
  }, 30000);
  check('four panes are laid out', ready === 4, String(ready));
  // Let every one of them finish its first draw.
  await until(() => ev(
    'BARRY.views.xplore.state.panes.slice(0,4).every('
    + '(p) => p && (p._win || p._panelData))'), 60000);
  await sleep(800);
  say('note', '  panels: ' + ev(
    'JSON.stringify(BARRY.views.xplore.state.panes.slice(0,4)'
    + '.map((p) => p && p.panel))'));
  say('note', '  link mode: ' + ev('BARRY.views.xplore.state.linkMode'));

  /* What each pane believes it is showing. Traces carry t0/t1 on the fetched
     window; image panels carry them on their panel data. */
  const READ = '(function(){var S=BARRY.views.xplore.state;'
    + 'return JSON.stringify(S.panes.slice(0,4).map(function(p){'
    + 'if(!p)return null;var d=p._win||p._panelData;'
    + 'return d?{t0:Math.round(d.t0*1000)/1000,'
    + 't1:Math.round(d.t1*1000)/1000,panel:p.panel}:null;}));})()';

  const before = JSON.parse(ev(READ));
  say('note', '  covered: ' + before.map((x) => x ? x.t0 : '-').join(', '));
  /* A panel covering slightly less than the window is fine and unavoidable
     for a transform. What is not fine is it being *drawn* as though it
     covered the whole thing -- that is what puts a spike at a different x in
     one pane than the next. So check where each image actually lands. */
  const PLACED = '(function(){var S=BARRY.views.xplore.state;'
    + 'return JSON.stringify(S.panes.slice(0,4).map(function(p){'
    + 'if(!p)return null;var s=S.sessions[p.sessionId];'
    + 'var w=(S.linkMode==="none"&&p.t0!=null)?{t0:p.t0,span:p.span}'
    + ':{t0:s.t0,span:s.span};var d=p._win||p._panelData;'
    + 'if(!d)return null;var img=p._img;'
    + 'var placed=img?{left:img.style.left,width:img.style.width}:null;'
    + 'return {panel:p.panel,win:Math.round(w.t0*1000)/1000,'
    + 'span:Math.round(w.span*1000)/1000,'
    + 'covers:Math.round(d.t0*1000)/1000,placed:placed,'
    + 'startErr:Math.round((d.t0-w.t0)*1000)/1000};}));})()';
  const placed = JSON.parse(ev(PLACED));
  placed.forEach((x) => {
    if (!x) return;
    say('note', '  ' + (x.panel + '        ').slice(0, 12)
        + ' window ' + x.win + '  covers ' + x.covers
        + '  (' + (x.startErr >= 0 ? '+' : '') + x.startErr + ' s)'
        + (x.placed ? '  drawn at left=' + (x.placed.left || '0')
                      + ' width=' + (x.placed.width || '100%') : ''));
  });
  check('every pane is on the same window',
        new Set(placed.map((x) => x && x.win)).size === 1,
        JSON.stringify(placed.map((x) => x && x.win)));
  /* The real test: a panel that starts late must be drawn inset by the same
     fraction, so its contents sit at the right time. */
  const misplaced = placed.filter((x) => {
    if (!x || !x.placed) return false;
    const wantLeft = x.startErr / x.span;          // fraction of the window
    const gotLeft = parseFloat(x.placed.left) / 100 || 0;
    return Math.abs(wantLeft - gotLeft) > 0.004;   // 0.4% of the pane
  });
  check('and each image is drawn where its data actually is',
        misplaced.length === 0,
        misplaced.map((x) => x.panel + ': starts ' + x.startErr
          + ' s late but drawn at ' + (x.placed.left || '0')).join('; '));

  head('Now move the window');
  const target = Math.round((before[0].t0 + 37) * 1000) / 1000;
  const t_start = Date.now();
  ev('BARRY.views.xplore.setWindow(0, ' + target + ', '
     + (before[0].t1 - before[0].t0) + ')');

  // Poll until every pane reports the new window, recording how long each
  // one took and whether any of them ever settles somewhere wrong.
  const settled = [null, null, null, null];
  let disagreement = 0, samples = 0;
  const deadline = Date.now() + 45000;
  while (Date.now() < deadline) {
    const now = JSON.parse(ev(READ));
    samples += 1;
    const ts = now.map((x) => x && x.t0);
    if (new Set(ts.filter((v) => v != null)).size > 1) disagreement += 1;
    now.forEach((x, i) => {
      if (settled[i] === null && x && Math.abs(x.t0 - target) < 0.35) {
        settled[i] = Date.now() - t_start;
      }
    });
    if (settled.every((v) => v !== null)) break;
    await sleep(50);
  }
  let total = Date.now() - t_start;

  /* A pane that has not arrived inside the deadline is not the same thing as
     a pane that never will. Under load -- several headless browsers and a
     server rendering 64-channel spectrograms -- a heavy panel can genuinely
     take longer than the deadline, and calling that "wrong" makes the
     harness fail for reasons that are not the code's. So wait longer, once,
     and report slowness separately from incorrectness. */
  if (!settled.every((v) => v !== null)) {
    const extra = Date.now() + 90000;
    while (Date.now() < extra && !settled.every((v) => v !== null)) {
      const now = JSON.parse(ev(READ));
      now.forEach((x, i) => {
        if (settled[i] === null && x && Math.abs(x.t0 - target) < 0.35) {
          settled[i] = Date.now() - t_start;
        }
      });
      await sleep(150);
    }
    total = Date.now() - t_start;
    const slow = settled.filter((v) => v !== null && v > 45000).length;
    if (slow) {
      say('note', '  ' + slow + ' pane(s) took longer than 45 s -- the box is '
          + 'busy, not the code');
    }
  }

  say('note', '  settle times (ms): ' + settled.map(
    (v, i) => (before[i] ? before[i].panel : i) + '='
      + (v === null ? 'never' : v)).join('  '));
  const after = JSON.parse(ev(READ));
  say('note', '  after:  ' + after.map((x) => x ? x.t0 : '-').join(', '));

  check('every pane reached the window it was asked for',
        settled.every((v) => v !== null),
        settled.map((v, i) => (v === null
          ? (before[i] ? before[i].panel : i) + ' stuck at '
            + (after[i] ? after[i].t0 : '?') : '')).filter(Boolean).join('; '));
  /* Coverage can differ by up to one analysis column; being drawn in the
     right place is what matters, and that is checked above. What must not
     happen is a pane left on the previous window. */
  const spreadT = Math.max(...after.map((x) => x ? x.t0 : 0))
                - Math.min(...after.map((x) => x ? x.t0 : 0));
  check('and they agree with each other at the end', spreadT < 0.35,
        JSON.stringify(after.map((x) => x && x.t0)) + '  spread '
        + Math.round(spreadT * 1000) + ' ms');

  const spread = Math.max(...settled.map((v) => v === null ? total : v))
               - Math.min(...settled.map((v) => v === null ? total : v));
  say('note', '  they disagreed for ' + spread + ' ms of the '
      + total + ' ms it took');
  /* Judged against how long the slowest pane took, not against the clock:
     on an idle machine everything lands inside 100 ms, and on a loaded one
     the question is still "did they arrive together", not "was it fast". */
  const slowest = Math.max(...settled.map((v) => v === null ? total : v));
  const budget = Math.max(1200, slowest * 0.5);
  check('and they do not disagree for long enough to look broken',
        spread <= budget,
        spread + ' ms apart, slowest pane ' + slowest + ' ms');

  head('And a fast burst, which is what panning actually is');
  let worst = 0;
  for (let k = 1; k <= 6; k++) {
    ev('BARRY.views.xplore.setWindow(0, ' + (target + k * 4) + ', '
       + (before[0].t1 - before[0].t0) + ')');
    await sleep(90);
  }
  const want = target + 6 * 4;
  const ok = await until(() => {
    const now = JSON.parse(ev(READ));
    return now.every((x) => x && Math.abs(x.t0 - want) < 0.35) ? now : null;
  }, 45000);
  check('a burst of six moves ends on the last one, everywhere',
        !!ok, JSON.stringify(JSON.parse(ev(READ)).map((x) => x && x.t0))
              + ' wanted ' + want);

  if (errs.length) { head('Errors thrown'); errs.forEach((m) => say('bad', m)); }
  head(bad ? bad + ' problem(s)' : 'All good.');
  document.title = bad ? 'panesync: ' + bad + ' FAILED' : 'panesync: passed';
} catch (e) {
  say('bad', 'the harness itself threw: ' + (e && e.stack || e));
  document.title = 'panesync: harness CRASH';
} })();
</script>

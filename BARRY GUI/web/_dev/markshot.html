<!doctype html><meta charset="utf-8"><title>marks</title>
<iframe id="app" src="/?linkhold=0" style="position:fixed;inset:0;width:100vw;height:100vh;border:0"></iframe>
<script>
/* Curation running, with the four aid panels in the same window, so the
   marks can be seen against jet. */
(async () => {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = f.contentWindow;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 300 && !W.BARRY; i++) await sleep(100);
  W.eval("setView('toolkit')");
  await sleep(300);
  await W.eval("BARRY.curate.enter('demo-ds-tutorial','ds')");
  for (let i = 0; i < 300; i++) {
    if (W.eval('!!BARRY.curate.active')) break;
    await sleep(100);
  }
  await sleep(2500);
  // Put the aid panels in THIS window so one screenshot shows them.
  W.eval("BARRY.views.xplore.setPanes([{panel:'csd'},{panel:'voltage'},"
       + "{panel:'theta'},{panel:'traces'}], {col:0.5,row:0.5})");
  W.eval("BARRY.curate.recentre()");
  await sleep(7000);
  document.title = 'shot';
})();
</script>

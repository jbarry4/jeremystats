<!doctype html>
<meta charset="utf-8"><title>Probe — where the grid's controls sit</title>
<style>html,body{margin:0;font:12px/1.6 ui-monospace,monospace;background:#0c0f14;color:#dfe6ee}
#out{padding:12px 16px;width:44vw;white-space:pre-wrap}
iframe{position:fixed;right:0;top:0;width:56vw;height:100vh;border:0;border-left:1px solid #243}</style>
<div id="out"></div><iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* Measures, rather than looks. The `+` for a column was reported as being
   "on the corner instead of the right side", so what matters is where its
   box actually is relative to the cells. */
const out=document.getElementById('out'); const p=(m)=>{out.textContent+=m+'\n'};
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
async function untilN(fn,t=200,g=100){for(let i=0;i<t;i++){try{if(fn())return i}catch(e){}await sleep(g)}return -1}
let bad=0; const ck=(n,c,d)=>{p((c?'ok    ':'FAIL  ')+n+(c||!d?'':'   ['+d+']')); if(!c)bad++;};
(async()=>{try{
const f=document.getElementById('app');
await new Promise(r=>f.addEventListener('load',r,{once:true}));
const W=()=>f.contentWindow, D=()=>f.contentDocument;
await untilN(()=>typeof W().setView==='function'); await sleep(800);
const Q=new URLSearchParams(location.search);
W().eval("setView('xplore')");
await W().eval('BARRY.views.xplore.open('+JSON.stringify(Q.get('session'))+')');
await sleep(1700);
W().eval("BARRY.views.xplore.state.nPanes=4");
W().eval("BARRY.views.xplore.fillPanes&&BARRY.views.xplore.fillPanes()");
await sleep(500);
W().eval('(function(){var P=BARRY.views.xplore.state.panes,k=["traces","csd","spectrogram","theta"];for(var i=0;i<4;i++){if(!P[i])P[i]={sessionId:BARRY.views.xplore.state.order[0]};P[i].panel=k[i];}BARRY.views.xplore.render();})()');
await sleep(800);
W().eval('BARRY.figure.open(BARRY.views.xplore.state,BARRY.views.xplore.state.sessions[BARRY.views.xplore.state.order[0]])');
await untilN(()=>D().querySelector('.grid-map'),150); await sleep(1500);

const L=()=>W().eval('(BARRY.figure.layout())');
const box=(sel)=>{const n=D().querySelector(sel); return n?n.getBoundingClientRect():null;};
const map=box('.grid-map'), addC=box('.grid-add.col'), addR=box('.grid-add.row'),
      heads=box('.grid-heads'), rows=box('.grid-rows');
p('layout: '+L().rows+'x'+L().cols+', '+L().panels.length+' panel(s)\n');
const r=(b)=>b?('l'+Math.round(b.left)+' t'+Math.round(b.top)+' w'+Math.round(b.width)+' h'+Math.round(b.height)):'(absent)';
p('map     '+r(map));
p('heads   '+r(heads));
p('rows x  '+r(rows));
p('add col '+r(addC));
p('add row '+r(addR));
p('');

ck('the column + is to the RIGHT of the cells', addC && addC.left >= map.right - 1,
   'its left '+Math.round(addC&&addC.left)+' vs map right '+Math.round(map.right));
ck('and vertically alongside them, not above',
   addC && addC.top >= map.top - 2 && addC.bottom <= map.bottom + 2,
   'add '+Math.round(addC.top)+'-'+Math.round(addC.bottom)+' vs map '+Math.round(map.top)+'-'+Math.round(map.bottom));
ck('it is as tall as the cells, not a small corner button',
   addC && addC.height > map.height * 0.85,
   Math.round(addC.height)+' of '+Math.round(map.height));
ck('it is not up in the header row', addC && addC.top > heads.bottom,
   'add top '+Math.round(addC.top)+' vs heads bottom '+Math.round(heads.bottom));
ck('the row + is BELOW the cells', addR && addR.top >= map.bottom - 1,
   'its top '+Math.round(addR&&addR.top)+' vs map bottom '+Math.round(map.bottom));
ck('and as wide as them', addR && Math.abs(addR.width-map.width) < 3,
   Math.round(addR.width)+' vs '+Math.round(map.width));
ck('the row handles sit between the cells and the +',
   rows && rows.left >= map.right-1 && rows.right <= addC.left+1,
   r(rows));
ck('the headers span the cells',
   heads && Math.abs(heads.width-map.width) < 3,
   Math.round(heads.width)+' vs '+Math.round(map.width));

p('\n'+(bad?bad+' FAILED':'geometry is right'));
document.title=(bad?bad+' FAILED':'ok')+' — grid geometry';
}catch(e){p('THREW: '+e.message); document.title='threw';}})();
</script>

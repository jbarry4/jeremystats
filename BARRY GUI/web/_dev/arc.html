<!doctype html>
<meta charset="utf-8">
<title>Harness — The Arc scaffolding</title>
<style>
  body { font: 12px/1.55 ui-monospace, monospace; margin: 0; background: #0c0f14;
         color: #dfe6ee; }
  #out { padding: 12px 16px; width: 44vw; }
  iframe { position: fixed; right: 0; top: 0; width: 56vw; height: 100vh;
           border: 0; border-left: 1px solid #243; }
  .ok::before { content: 'ok    '; color: #7fe3b0; }
  .bad::before { content: 'FAIL  '; color: #ff8a7a; }
  .bad { color: #ffb0a5; }
  .note { color: #7593a2; }
  h2 { font-size: 12px; margin: 14px 0 5px; color: #ffb81c; }
</style>
<div id="out"></div>
<iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* The Arc is mostly not built, so what there is to check is that the parts
   which ARE built are wired correctly and that the parts which are not say
   so honestly. Those are the two ways scaffolding goes wrong:

   Wired wrong. A bundle has five places to register a step and a mode has
   five more, and a half-connected one fails much later, inside code written
   on the assumption it works. So this drives every one of them now: the
   card renders its five steps, each step has a header saying which of five
   it is, each is reachable from the palette and from `pick`, and the mode
   exports the whole contract and refuses cleanly.

   Dishonest. A disabled step must be SHOWN, must not be clickable, and must
   carry the reason -- and, most importantly, must not be quietly clickable
   anyway. A step that looks disabled and opens is worse than either.

   It also checks the rule with the longest comment in toolkit.js: a bundle
   removes its members from the flat tool list, and The Arc adding five
   tools must not have put five new rows in that list. */
const out = document.getElementById('out');
let bad = 0;
const say = (c, m) => { const d = document.createElement('div');
                        d.className = c; d.textContent = m;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const check = (n, c, d) => say(c ? 'ok' : 'bad',
                               n + (c || !d ? '' : '   [' + d + ']'));
const head = (t) => { const h = document.createElement('h2');
                      h.textContent = t; out.appendChild(h); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, tries = 250, gap = 100) {
  for (let i = 0; i < tries; i++) {
    try { if (fn()) return i; } catch (e) { /* not yet */ }
    await sleep(gap);
  }
  return -1;
}

(async () => { try {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const win = () => f.contentWindow;
  const doc = () => f.contentDocument;
  const errs = [];
  win().addEventListener('error', (e) => errs.push(
    e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  win().addEventListener('unhandledrejection',
                         (e) => errs.push('rejected: ' + e.reason));
  await untilN(() => typeof win().setView === 'function');
  await sleep(700);
  const run = (src) => win().eval(src);
  const val = (expr) => run('(' + expr + ')');
  const txt = (n) => ((n && n.textContent) || '').trim();
  const seen = (n) => !!(n && n.offsetParent !== null);

  const STEPS = ['spark', 'coupling', 'circuit', 'drift'];
  const NAMES = ['Spark', 'Coupling', 'Circuit', 'Drift'];

  /* ---------------------------------------------------------------- */
  head('the module is there');
  check('BARRY.arc exists', val('!!window.barryArc'));
  check('it knows four steps', val('window.barryArc.steps().length') === 4,
        'got ' + val('window.barryArc.steps().length'));
  check('named Spark, Coupling, Circuit, Drift',
        val('window.barryArc.steps().map(s => s.name).join(",")')
          === NAMES.join(','),
        val('window.barryArc.steps().map(s => s.name).join(",")'));
  check('every step says what it needs and when it lands',
        val('window.barryArc.steps().every(s => s.needs && s.phase)'));
  check('the unbuilt ones say what they will do',
        val('window.barryArc.steps().filter(s => !s.built)'
            + '.every(s => s.will && s.will.length)'));
  check('Spark is built', val('window.barryArc.step("spark").built') === true);

  /* ---------------------------------------------------------------- */
  head('the bundle card');
  run('setView("toolkit")');
  /* Four since The Lookout joined -- Horizon, Panorama and Braid, the
     frequency tools.

     NAMED rather than counted. A bare count caught both of the things worth
     catching -- a bundle that stops rendering, and one nobody meant to ship
     -- but it could not say which had happened, and the number had to be
     edited by hand every time a bundle landed. This still catches both, and
     the failure says which bundle is missing or unexpected. */
  const WANT = ['The Dentist', 'The Arc', 'The Storm', 'The Lookout'];
  await untilN(() => doc().querySelectorAll('.tk-bundle').length >= WANT.length);
  const cards = Array.from(doc().querySelectorAll('.tk-bundle'));
  /* `found`, not `seen` -- `seen` is the visibility helper declared at the
     top of this harness, and redeclaring it here is a SyntaxError that
     stops the whole page before a single check runs. It reports as "0
     checks", which the runner prints as a shot-taker rather than as a
     failure. */
  const found = cards.map((c) => WANT.find((w) => txt(c).indexOf(w) >= 0)
                               || ('unexpected: ' + txt(c).slice(0, 24)));
  check('every bundle renders, and only those',
        cards.length === WANT.length
          && WANT.every((w) => found.indexOf(w) >= 0),
        'got ' + cards.length + ': ' + found.join(' | '));

  const arcCard = cards.find((c) => /The Arc/.test(txt(c)));
  check('one of them is The Arc', !!arcCard);
  const dentCard = cards.find((c) => /The Dentist/.test(txt(c)));
  check('the other is still The Dentist', !!dentCard);
  /* Five since Root Canal went in between Braces and X-ray. */
  check('The Dentist still has its five steps',
        dentCard && dentCard.querySelectorAll('.tk-step').length === 5,
        dentCard ? dentCard.querySelectorAll('.tk-step').length : 'no card');

  const arcSteps = arcCard
    ? Array.from(arcCard.querySelectorAll('.tk-step')) : [];
  check('The Arc shows four steps', arcSteps.length === 4,
        'got ' + arcSteps.length);
  check('numbered 1 to 4',
        arcSteps.map((s) => txt(s.querySelector('.tk-step-i'))).join('')
          === '1234');
  check('every step is visible, built or not',
        arcSteps.length === 4 && arcSteps.every(seen));

  /* The rule with the longest comment in toolkit.js. */
  const flat = Array.from(doc().querySelectorAll('.tk-tool'))
    .map((b) => txt(b.querySelector('strong')));
  check('no Arc step is repeated in the flat tool list',
        !NAMES.some((n) => flat.indexOf(n) >= 0),
        flat.filter((n) => NAMES.indexOf(n) >= 0).join(','));

  /* ---------------------------------------------------------------- */
  head('all four are built');
  const offs = arcSteps.filter((s) => s.classList.contains('off'));
  /* None now: Drift went in on 2026-09-28, the last of the four. Asserted
     as a count, so a step that quietly went back to a construction card
     fails here rather than weakening the checks below. */
  check('no step is marked off', offs.length === 0, 'got ' + offs.length);
  check('and none is disabled', arcSteps.every((s) => !s.disabled));

  /* The last step, Drift, is the one that was a construction card longest:
     it has to open its own panel now, not a "coming soon". */
  arcSteps[3].click();
  await sleep(350);
  check('clicking Drift opens Drift',
        val('BARRY.views.toolkit.tool()') === 'drift',
        val('BARRY.views.toolkit.tool()'));
  check('  and paints its panel, not a construction card',
        !!doc().querySelector('#tkResult #drGroups'));

  /* ---------------------------------------------------------------- */
  head('every step paints, and says which of four it is');
  for (let i = 0; i < STEPS.length; i++) {
    const id = STEPS[i];
    check('pick("' + id + '") is accepted',
          val('BARRY.views.toolkit.pick("' + id + '")') === true);
    await untilN(() => doc().querySelector('#tkResult .step-head'));
    await sleep(120);
    const hd = doc().querySelector('#tkResult .step-head');
    check('  ' + id + ' draws a step header',
          !!hd && txt(hd.querySelector('strong')) === NAMES[i],
          hd ? txt(hd.querySelector('strong')) : 'none');
    check('  ' + id + ' says step ' + (i + 1) + ' of The Arc',
          !!hd && txt(hd.querySelector('.step-n'))
                  === 'step ' + (i + 1) + ' of The Arc',
          hd ? txt(hd.querySelector('.step-n')) : 'none');
    const card = doc().querySelector('#tkResult .arc-soon');
    const panel = doc().querySelector('#tkResult .arc-spark');
    check('  ' + id + ' shows a panel or a construction card',
          !!card || !!panel);
    if (card) {
      check('  ' + id + ' names the phase it lands in',
            /Phase \d/.test(txt(card)));
      check('  ' + id + ' says what it needs first',
            /What it needs first/.test(txt(card)));
    }
    /* The bad-channel scope card belongs to another question entirely. */
    check('  ' + id + ' does not show the scope card',
          !doc().querySelector('#tkMain .tk-scope'));
  }

  check('pick() refuses a tool that does not exist',
        val('BARRY.views.toolkit.pick("notatool")') === false);
  /* X-ray is a bundle step with no icon of its own, which is exactly the
     shape a too-clever guard refuses. */
  check('pick() still accepts a Dentist step',
        val('BARRY.views.toolkit.pick("dspca")') === true);
  check('pick() accepts a flat tool',
        val('BARRY.views.toolkit.pick("panorama")') === true);

  /* ---------------------------------------------------------------- */
  head('Spark reads a recording and offers to file it');
  val('BARRY.views.toolkit.pick("spark")');
  const gotRows = await untilN(
    () => doc().querySelectorAll('#arcPick .arc-row').length > 0, 120);
  if (gotRows < 0) {
    say('note', 'no DEWEY recordings in this registry, Spark checks skipped');
  } else {
    const picks = Array.from(doc().querySelectorAll('#arcPick .arc-row'));
    check('it lists recordings to read', picks.length > 0,
          picks.length + ' rows');
    check('the phase control offers all three kinds',
          doc().querySelectorAll('#arcPick .seg button').length === 3);
    check('one kind is chosen', !!doc().querySelector('#arcPick .seg .active'));
    check('nothing is read until one is picked',
          /Pick a recording/.test(txt(doc().querySelector('#arcRead'))));

    const live = picks.find((b) => !b.disabled);
    if (!live) { say('note', 'no reachable recording here, read skipped'); }
    else {
      live.click();
      const read = await untilN(
        () => doc().querySelector('#arcRead .chip-row')
           || /no cue pairs|Could not|reachable/i.test(
                txt(doc().querySelector('#arcRead'))), 200);
      check('reading a recording answers', read >= 0);
      const body = txt(doc().querySelector('#arcRead'));
      const pairs = doc().querySelectorAll('#arcPairs, .arc-pairs .arc-pair');
      if (pairs.length) {
        check('  it shows the pairs it found', pairs.length > 0,
              pairs.length + ' rows');
        check('  every pair names both cues',
              Array.from(pairs).every(
                (r) => /→/.test(txt(r))));
        check('  and a gap near ten seconds',
              /10\.0/.test(body), body.slice(0, 80));
        const bank = Array.from(doc().querySelectorAll('#arcRead button'))
          .find((b) => /File these pairs|File a new version/.test(txt(b)));
        check('  it offers to file them', !!bank);
        check('  and the offer is live', !!bank && !bank.disabled);
      } else {
        check('  it says plainly that there are none',
              /no cue pairs/i.test(body), body.slice(0, 90));
        const bank = Array.from(doc().querySelectorAll('#arcRead button'))
          .find((b) => /File/.test(txt(b)));
        check('  and does not offer to file nothing',
              !bank || bank.disabled);
      }
    }
  }

  /* ---------------------------------------------------------------- */
  head('the line view and the two verify modes');
  if (gotRows < 0) {
    say('note', 'no DEWEY recordings here, skipped');
  } else {
    const svg = doc().querySelector('#arcRead .arc-line');
    check('the events are drawn on a line', !!svg);
    if (svg) {
      check('  every pulse has a tick',
            svg.querySelectorAll('.arc-tick').length > 0,
            svg.querySelectorAll('.arc-tick').length + ' ticks');
      check('  dropped pulses are drawn too, not hidden',
            svg.querySelectorAll('.arc-tick.mirror, .arc-tick.bounce, '
                                 + '.arc-tick.unknown').length > 0);
      const bars = svg.querySelectorAll('.arc-line-pair');
      check('  each pair is one bar, not two ticks', bars.length > 0,
            bars.length + ' bars');
      check('  and every mark says what it is on hover',
            Array.from(svg.querySelectorAll('.arc-tick'))
              .every((t) => t.querySelector('title')));
    }
    check('clipping is offered, not run on open',
          !!doc().querySelector('#arcRead .arc-clipbar'));

    /* Both modes are entered by name and must put each other out. */
    for (const which of ['arcconfirm', 'arcclean']) {
      check(which + ' exists', val('typeof BARRY.' + which) === 'object');
      for (const k of ['enter', 'exit', 'rebind']) {
        check('  ' + which + '.' + k + ' is a function',
              val('typeof BARRY.' + which + '.' + k) === 'function');
      }
      check('  ' + which + '.active reads as false, not a function',
            val('BARRY.' + which + '.active') === false);
      const styled = val('Array.from(document.styleSheets).some(function (s) {'
        + ' try { return Array.from(s.cssRules).some(function (r) {'
        + ' return r.selectorText && r.selectorText.indexOf("mode-' + which
        + '") >= 0; }); } catch (e) { return false; } })');
      check('  ' + which + ' has CSS rules of its own', styled === true);
    }
    check('they share one drawing function',
          val('typeof BARRY.arcmode.draw') === 'function');
    check('xplore calls it from the pane paint loop',
          val('typeof BARRY.views.xplore.state') === 'object');
    check('exit on a mode that never opened is harmless',
          (() => { try { run('BARRY.arcconfirm.exit()'); return true; }
                   catch (e) { return false; } })());
  }

  /* ---------------------------------------------------------------- */
  head('what gets excluded actually reaches the bank');
  /* The measurement said a channel was lost and nothing was dropped unless
     somebody clicked the chip, so the DEFAULT outcome of measuring was that
     the measurement was ignored. These check the list the bank is handed. */
  if (gotRows < 0 || !val('BARRY.arc.clean')) {
    say('note', 'no recordings or no clean accessor here, skipped');
  } else {
    val('BARRY.views.toolkit.pick("spark")');
    await untilN(() => doc().querySelectorAll('#arcPick .arc-row').length > 0,
                 120);
    const live = Array.from(doc().querySelectorAll('#arcPick .arc-row'))
      .find((b) => !b.disabled);
    if (!live) { say('note', 'nothing reachable here, skipped'); }
    else {
      live.click();
      await untilN(() => doc().querySelector('#arcRead .chip-row')
                     || /no cue pairs/i.test(
                          txt(doc().querySelector('#arcRead'))), 200);
      const btn = Array.from(doc().querySelectorAll('#arcRead button'))
        .find((b) => /Check for clipping/.test(txt(b)));
      if (!btn) { say('note', 'no clipping control (no pairs), skipped'); }
      else {
        btn.click();
        const done = await untilN(
          () => !!doc().querySelector('#arcRead .arc-clip'), 900);
        if (done < 0) { say('note', 'clipping read did not finish, skipped'); }
        else {
          const flagged = val('BARRY.arc.clean.flagged(1).length');
          check('the measurement flags channels', flagged >= 0,
                flagged + ' flagged on pair 1');
          /* The exclusion is keyed by WINDOW now: a channel ruined in the
             baseline keeps its two cues and its after-window. */
          const blocks = () => val(
            'Object.values(BARRY.arc.clean.excluded(1) || {})'
            + '.reduce(function (n, l) { return n + l.length; }, 0)');
          const lostBlocks = val(
            'BARRY.arc.clean.flagged(1).reduce(function (n, c) {'
            + ' return n + BARRY.arc.clean.lost(1, c).length; }, 0)');
          check('every lost BLOCK is excluded by default',
                blocks() === lostBlocks,
                'lost ' + lostBlocks + ' but excluded ' + blocks());
          check('  and the exclusion is keyed by window',
                val('BARRY.arc.clean.names().some(function (w) {'
                    + ' return (BARRY.arc.clean.excluded(1) || {})[w]'
                    + ' !== undefined; })') === true || lostBlocks === 0);

          if (flagged > 0) {
            const first = val('BARRY.arc.clean.flagged(1)[0]');
            const w0 = val('BARRY.arc.clean.lost(1, ' + first + ')[0]');
            const was = blocks();
            run('BARRY.arc.clean.setBlock(1, ' + first + ', "' + w0
                + '", true)');
            check('keeping ONE BLOCK removes only that block',
                  blocks() === was - 1, was + ' -> ' + blocks());
            check('  the other blocks of that channel are untouched',
                  val('BARRY.arc.clean.gone(1, ' + first + ').length')
                  === val('BARRY.arc.clean.lost(1, ' + first
                          + ').length') - 1);
            run('BARRY.arc.clean.setBlock(1, ' + first + ', "' + w0
                + '", false)');
            check('removing it again puts it back', blocks() === was);

            /* A block nobody flagged can still be removed by hand -- "this
               one looks wrong to me" is a decision somebody is entitled to
               make. */
            const clean = val('BARRY.arc.clean.names().filter(function (w) {'
                              + ' return BARRY.arc.clean.lost(1, ' + first
                              + ').indexOf(w) < 0; })[0]');
            if (clean && clean !== 'undefined') {
              run('BARRY.arc.clean.setBlock(1, ' + first + ', "' + clean
                  + '", false)');
              check('a block nobody flagged can be removed by hand',
                    blocks() === was + 1);
              run('BARRY.arc.clean.setBlock(1, ' + first + ', "' + clean
                  + '", true)');
              check('  and put back', blocks() === was);
            }

            run('BARRY.arc.clean.keepAll(1)');
            check('keep-all empties the exclusion', blocks() === 0);
            run('BARRY.arc.clean.dropAll(1)');
            check('drop-all restores every lost block', blocks() === was);
          }
          /* A channel the backend graded clean must never be excluded --
             that is what counting the raw keys got wrong. */
          check('nothing graded clean is excluded by default',
                val('BARRY.arc.clean.names().every(function (w) {'
                    + ' return ((BARRY.arc.clean.excluded(1) || {})[w] || [])'
                    + '.every(function (c) {'
                    + ' return BARRY.arc.clean.lost(1, c).indexOf(w) >= 0;'
                    + ' }); })') === true);
        }
      }
    }
  }

  /* ------------------------------------------------------------------
     Spark: many recordings at once.

     Everything here runs against the real registry, the real .nev files
     and the real Event Bank, and NOTHING here banks anything. That is not
     a compromise, it is the point: the run is driven over the TEST
     recordings, not one of which holds a cue pair, so the loop reads a
     real file, finds real nothing, and takes the tick off by itself --
     which is the behaviour being checked. A harness that banked an entry
     to prove banking works would leave evidence in the bank that nobody
     decided, and the run that deleted it afterwards would be one crash
     away from not deleting it.

     The two predicates are driven as functions, against real readings
     fetched from the same server the app is talking to. A harness that
     re-derives what it is checking checks nothing.
     ------------------------------------------------------------------ */
  head('Spark: many recordings at once');
  val('BARRY.views.toolkit.pick("spark")');
  const gotPick = await untilN(
    () => doc().querySelectorAll('#arcPick .arc-row').length > 0, 150);
  if (gotPick < 0) {
    say('note', 'no DEWEY recordings in this registry, batch mode skipped');
  } else {
    const modeSeg = () =>
      Array.from(doc().querySelectorAll('#tkResult .arc-mode .seg button'));
    check('the panel offers one recording or many', modeSeg().length === 2,
          modeSeg().map(txt).join(' | '));
    check('  it starts on one at a time',
          txt(doc().querySelector('.arc-mode .seg .active'))
            === 'One recording at a time',
          txt(doc().querySelector('.arc-mode .seg .active')));
    const nPick = doc().querySelectorAll('#arcPick .arc-row').length;

    /* What the panel's own decisions come to now, so the run can be shown
       not to have touched them. `excluded`, `kept` and `spans_` are keyed
       by pair id, and a pair id restarts at 1 in every recording -- a
       batch writing into them would have every recording claiming pair 1. */
    const tallyBefore = val('BARRY.arc.clean.tally().n');

    modeSeg().find((b) => /Many/.test(txt(b))).click();
    const drew = await untilN(
      () => doc().querySelectorAll('#arcBatch .arc-batch-row').length > 0, 150);
    check('many draws a table', drew >= 0);
    const bRows = () =>
      Array.from(doc().querySelectorAll('#arcBatch .arc-batch-row'));
    check('  one row per recording in the same scope',
          bRows().length === nPick, bRows().length + ' vs ' + nPick);
    check('  the scope control is on this surface too',
          doc().querySelectorAll('#arcBatch .seg button').length === 3);
    check('  and the one-at-a-time panel is not also on screen',
          !doc().getElementById('arcPick') && !doc().getElementById('arcRead'));
    check('  nothing is ticked to start',
          val('BARRY.arc.batch.want().length') === 0);

    const barBtns = () => Array.from(
      doc().querySelectorAll('#arcBatch .arc-batch-bar button'));
    const last = () => barBtns()[barBtns().length - 1];
    check('the primary action is last', /^Read and file/.test(txt(last())),
          txt(last()));
    check('  and it is the only primary on the surface',
          barBtns().filter((b) => b.className.trim() === 'btn').length === 1,
          barBtns().map((b) => b.className).join(' | '));
    check('  with nothing ticked it is not offered', last().disabled);

    /* §6b: the cost and the step size, before anything long runs. */
    barBtns().find((b) => /Every readable/.test(txt(b))).click();
    await sleep(200);
    const reach = val('BARRY.arc.batch.rows()'
                      + '.filter(function (r) { return r.reachable; }).length');
    check('every readable recording ticks',
          val('BARRY.arc.batch.want().length') === reach,
          val('BARRY.arc.batch.want().length') + ' of ' + reach);
    const costEl = doc().querySelector('#arcBatch .arc-batch-cost strong');
    check('the cost is stated before anything runs',
          /^about \d+ (seconds|minutes?)$/.test(txt(costEl)), txt(costEl));
    const saySome = txt(doc().querySelector('#arcBatch .arc-batch-say'));
    check('  and the step size with it', /one at a time/.test(saySome),
          saySome.slice(0, 90));
    check('  and that stopping keeps what is already filed',
          /stays filed/.test(saySome));
    const countEl = doc().querySelector('#arcBatch .arc-batch-count');
    check('the count describes the list under it',
          txt(countEl).indexOf(reach + ' of ' + bRows().length + ' ticked')
            === 0, txt(countEl));

    barBtns().find((b) => txt(b) === 'Clear').click();
    await sleep(150);
    check('Clear empties the selection',
          val('BARRY.arc.batch.want().length') === 0);

    /* One tick, by hand, the way somebody does it. The table must not be
       rebuilt under them: thirty-three rows in a scrolling box, and a
       rebuild sends them back to the top on every third tick. */
    const keep = bRows()[1];
    bRows()[0].querySelector('input').click();
    await sleep(150);
    check('ticking one row ticks one recording',
          val('BARRY.arc.batch.want().length') === 1,
          val('BARRY.arc.batch.want().length') + ' ticked');
    check('  the count above follows it',
          txt(doc().querySelector('#arcBatch .arc-batch-count')).indexOf('1 of ')
            === 0, txt(doc().querySelector('#arcBatch .arc-batch-count')));
    check('  and so does the primary',
          txt(last()) === 'Read and file 1 recording', txt(last()));
    check('  and the rest of the table is not rebuilt under it',
          bRows()[1] === keep);
    bRows()[0].querySelector('input').click();
    await sleep(150);
    check('  unticking puts it back',
          val('BARRY.arc.batch.want().length') === 0);

    /* Only the ones nobody has filed. The bank column is the evidence. */
    const freshBtn = barBtns().find((b) => /never filed/.test(txt(b)));
    check('there is a shortcut for the ones never filed', !!freshBtn);
    if (freshBtn && !freshBtn.disabled) {
      freshBtn.click();
      await sleep(150);
      const on = bRows().filter((r) => r.classList.contains('on'));
      check('  it ticks only rows with nothing in the bank',
            on.length > 0
            && on.every((r) => txt(r.querySelector('.bk')) === '—'),
            on.length + ' ticked');
      barBtns().find((b) => txt(b) === 'Clear').click();
      await sleep(120);
    }

    /* ---------------------------------------------------------------- */
    head('  what comes off the selection by itself');
    /* Real readings, from the same server the app is talking to. They are
       handed to the predicate as objects rather than re-derived from the
       screen, so what is checked is the function the run actually calls. */
    const jget = async (p) => (await fetch(p)).json();
    const pre = await jget('/api/arc/spark/recordings?phase=Precon');
    const con = await jget('/api/arc/spark/recordings?phase=Con');
    const preRows = pre.rows || [];
    const preBank = pre.banked || {};
    /* The clipping section above measured the first reachable
       preconditioning recording, so the server holds a reading for it and
       this panel knows -- which is a reason to file it again. It is
       therefore no use for the "already filed" case. */
    const measured = (preRows.find((r) => r.reachable) || {}).gid;
    const conRow = (con.rows || []).find((r) => r.reachable);
    const filedGid = Object.keys(preBank).find(
      (g) => g !== measured && preRows.some((r) => r.gid === g));
    const freshGid = (preRows.find(
      (r) => r.reachable && !preBank[r.gid]) || {}).gid;

    run('BARRY.arc.batch.clipping(false)');

    if (!conRow) { say('note', 'no reachable conditioning recording here'); }
    else {
      win().__arcCon = await jget('/api/arc/spark/' + conRow.gid);
      const why = val('BARRY.arc.batch.skipReason("' + conRow.gid
                      + '", window.__arcCon)');
      check('a recording with no cue pairs comes off the selection',
            /no cue pairs/.test(why), why || '(it stayed on)');
    }

    if (!filedGid) {
      say('note', 'no second banked recording here, "already filed" skipped');
    } else {
      win().__arcFiled = await jget('/api/arc/spark/' + filedGid);
      const same = val('window.__arcFiled.summary.n_pairs')
                   === preBank[filedGid].n;
      check('the banked count and the read agree, so the case is live',
            same, preBank[filedGid].n + ' banked vs '
                  + val('window.__arcFiled.summary.n_pairs') + ' read');
      const why = val('BARRY.arc.batch.skipReason("' + filedGid
                      + '", window.__arcFiled)');
      check('one already filed at the same pairs comes off too',
            /already filed/.test(why), why || '(it stayed on)');
      /* With a clipping reading the run HAS something to add, so it files.
         The bank's summary cannot say whether an entry was filed with a
         clipping judgement, so this is the honest limit of the rule. */
      run('BARRY.arc.batch.clipping(true)');
      check('  but with clipping on it is filed again',
            val('BARRY.arc.batch.skipReason("' + filedGid
                + '", window.__arcFiled)') === '');
      run('BARRY.arc.batch.clipping(false)');
    }

    if (!freshGid) { say('note', 'everything here is filed already'); }
    else {
      win().__arcFresh = await jget('/api/arc/spark/' + freshGid);
      check('one with pairs and nothing banked stays on the selection',
            val('BARRY.arc.batch.skipReason("' + freshGid
                + '", window.__arcFresh)') === '');
    }

    /* ---------------------------------------------------------------- */
    head('  the exclusion the run files');
    if (!measured) { say('note', 'nothing reachable here, skipped'); }
    else {
      win().__arcRead = await jget('/api/arc/spark/' + measured);
      check('with no clipping reading, nothing is excluded',
            val('Object.keys(BARRY.arc.batch.exclusionFrom('
                + 'window.__arcRead.pairs, null)).length') === 0);
      /* Already measured by the section above, so the server answers from
         its own cache and this costs nothing. */
      win().__arcClip = await (await fetch(
        '/api/arc/spark/' + measured + '/clipping',
        { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: '{}' })).json();
      const nflag = val('BARRY.arc.clean.flagged(1).length');
      if (!nflag) {
        say('note', 'nothing clipped on pair 1 of this recording');
      } else {
        check('it is keyed by pair, then by window',
              val('BARRY.arc.batch.exclusionFrom(window.__arcRead.pairs,'
                  + ' window.__arcClip)["1"] !== undefined')
              && val('BARRY.arc.clean.names().some(function (w) {'
                     + ' return BARRY.arc.batch.exclusionFrom('
                     + 'window.__arcRead.pairs, window.__arcClip)["1"][w]'
                     + ' !== undefined; })') === true);
        /* The drift check: what a batch files and what the panel would
           file with nobody overruling anything have to be one list, or a
           recording read by hand and the same one read in a batch end up
           in the bank saying different things about the same channels. */
        check('every block it excludes is one the measurement lost',
              val('(function () { var e = BARRY.arc.batch.exclusionFrom('
                  + 'window.__arcRead.pairs, window.__arcClip)["1"] || {};'
                  + ' return Object.keys(e).every(function (w) {'
                  + ' return e[w].every(function (c) {'
                  + ' return BARRY.arc.clean.lost(1, c).indexOf(w) >= 0;'
                  + ' }); }); })()') === true);
        check('  and every block the measurement lost is excluded',
              val('(function () { var e = BARRY.arc.batch.exclusionFrom('
                  + 'window.__arcRead.pairs, window.__arcClip)["1"] || {};'
                  + ' var n = 0; Object.keys(e).forEach(function (w) {'
                  + ' n += e[w].length; });'
                  + ' var m = BARRY.arc.clean.flagged(1).reduce('
                  + 'function (t, c) { return t'
                  + ' + BARRY.arc.clean.lost(1, c).length; }, 0);'
                  + ' return n === m; })()') === true);
      }
    }

    /* ---------------------------------------------------------------- */
    head('  a real run, one recording at a time');
    /* Test sessions present single cues, so not one of them holds a pair.
       A run over them exercises the whole loop -- read, judge, untick,
       draw what it found -- and cannot write to the bank. */
    const segBtns = () =>
      Array.from(doc().querySelectorAll('#arcBatch .seg button'));
    segBtns().find((b) => txt(b) === 'Test').click();
    const swapped = await untilN(
      () => bRows().length > 0
         && /Test/.test(txt(bRows()[0].querySelector('.ss'))), 150);
    check('the scope switches under the table', swapped >= 0,
          bRows().length ? txt(bRows()[0].querySelector('.ss')) : 'no rows');
    if (swapped < 0) {
      say('note', 'no test recordings here, the run is skipped');
    } else {
      run('BARRY.arc.batch.clipping(false)');
      barBtns().find((b) => /Every readable/.test(txt(b))).click();
      await sleep(150);
      const queued = val('BARRY.arc.batch.want().length');
      check('they tick', queued > 0, queued + ' ticked');
      const bankedBefore = bRows().filter(
        (r) => txt(r.querySelector('.bk')) !== '—').length;

      // Started, not awaited: the point is what it looks like midway.
      run('BARRY.arc.batch.run()');
      const caught = await untilN(() => {
        const fin = doc().querySelectorAll(
          '#arcBatch .arc-batch-row.skipped, #arcBatch .arc-batch-row.done');
        const togo = doc().querySelectorAll(
          '#arcBatch .arc-batch-row.queued, #arcBatch .arc-batch-row.going');
        return fin.length > 0 && togo.length > 0;
      }, 600, 20);
      check('a finished recording is inspectable while the rest still run',
            caught >= 0);
      check('  and it carries its own disclosure at that moment',
            !!doc().querySelector('#arcBatch .arc-batch-row.skipped '
                                  + 'details.arc-batch-found'));

      run('BARRY.arc.batch.stop()');
      const ended = await untilN(
        () => val('BARRY.arc.batch.running') === false, 600);
      check('it stops when asked', ended >= 0);
      const finished = doc().querySelectorAll(
        '#arcBatch .arc-batch-row.skipped').length;
      check('  and the ones that finished stayed finished', finished > 0,
            finished + ' finished');
      check('  the ones it never started are still ticked',
            val('BARRY.arc.batch.want().length') > 0,
            val('BARRY.arc.batch.want().length') + ' left');

      const off = JSON.parse(
        val('JSON.stringify(BARRY.arc.batch.off())'));
      const offKeys = Object.keys(off);
      check('every recording with nothing to do came off by itself',
            offKeys.length === finished, offKeys.length + ' vs ' + finished);
      check('  and each of them says why',
            offKeys.length > 0
            && offKeys.every((k) => /no cue pairs/.test(off[k])),
            offKeys.map((k) => off[k]).join(' | ').slice(0, 90));
      check('  and the table says so above the rows',
            /came off by/.test(
              txt(doc().querySelector('#arcBatch .arc-batch-off'))));

      const det = doc().querySelector('#arcBatch .arc-batch-row.skipped '
                                      + 'details.arc-batch-found');
      const facts = txt(det);
      for (const word of ['pairs', 'pairings', 'gap', 'clipping',
                          'excluded', 'filed']) {
        check('  the disclosure reports ' + word,
              facts.indexOf(word) >= 0, facts.slice(0, 100));
      }
      check('  and says plainly that nothing was filed',
            /nothing was filed/.test(facts), facts.slice(0, 120));
      /* Measured, not eyeballed. The disclosure is a child of a CSS grid
         and has to span it: without `grid-column: 1 / -1` it lands in the
         checkbox column, 22 px wide, and every line in it wraps to one
         word. */
      const detW = det.getBoundingClientRect().width;
      const rowW = det.parentNode.getBoundingClientRect().width;
      check('  the disclosure spans the row rather than one column',
            detW > rowW * 0.7, Math.round(detW) + ' of ' + Math.round(rowW));
      const tbl = doc().querySelector('#arcBatch .arc-batch-rows');
      check('  and no row runs off the right edge',
            tbl.scrollWidth <= tbl.clientWidth + 2,
            tbl.scrollWidth + ' > ' + tbl.clientWidth);
      check('nothing reached the bank', bRows().filter(
              (r) => txt(r.querySelector('.bk')) !== '—').length
            === bankedBefore);
      check('the panel’s own decisions were not touched',
            val('BARRY.arc.clean.tally().n') === tallyBefore,
            tallyBefore + ' -> ' + val('BARRY.arc.clean.tally().n'));
    }

    /* Left as it was found: no ticks, back on the recording picker. */
    run('BARRY.arc.batch.clear()');
    modeSeg().find((b) => /One recording/.test(txt(b))).click();
    const back = await untilN(() => !!doc().getElementById('arcPick'), 150);
    check('switching back brings the one-at-a-time panel', back >= 0);
    check('  and takes the table away',
          !doc().getElementById('arcBatch'));
  }

  /* ---------------------------------------------------------------- */
  head('Coupling reads the bank');
  val('BARRY.views.toolkit.pick("coupling")');
  const cpRows = await untilN(
    () => doc().querySelectorAll('#cpPick .arc-row').length > 0, 150);
  if (cpRows < 0) {
    say('note', 'no DEWEY recordings listed for Coupling, skipped');
  } else {
    const all = Array.from(doc().querySelectorAll('#cpPick .arc-row'));
    check('it lists recordings', all.length > 0, all.length + ' rows');
    /* The whole point of this step: it runs on BANKED pairs. A recording
       Spark has not filed must be shown and disabled with the reason, not
       quietly left out. */
    const unfiled = all.filter((b) => b.disabled);
    check('unfiled recordings are shown, disabled, with a reason',
          unfiled.length === 0
          || unfiled.every((b) => /not filed|reachable|filed/i.test(
                                    b.title || '') ),
          unfiled.length + ' disabled');
    check('nothing is analysed until one is picked',
          /Pick a recording/.test(txt(doc().querySelector('#cpMain'))));
    const ready = all.find((b) => !b.disabled);
    if (!ready) {
      say('note', 'no recording has banked pairs here, run Spark first');
    } else {
      ready.click();
      const got = await untilN(
        () => doc().querySelector('#cpMain .arc-cp-pairs'), 200);
      check('a banked recording opens its pairs', got >= 0);
      const chips = doc().querySelectorAll('#cpMain .arc-cp-pairs .mini');
      check('  every banked pair is offered', chips.length > 0,
            chips.length + ' pairs');
      check('  it says what the pair is not valid on',
            !!doc().querySelector('#cpMain .arc-cp-note'));
      check('  and offers to run it',
            !!Array.from(doc().querySelectorAll('#cpMain button'))
              .find((b) => /Run the analysis/.test(txt(b))));
      check('  the matrix is empty until it is run',
            /Nothing has been computed/.test(txt(
              doc().querySelector('#cpMain'))));
    }
  }

  /* ---------------------------------------------------------------- */
  head('the Coupling mode contract');
  check('BARRY.coupling exists', val('typeof BARRY.coupling') === 'object');
  for (const k of ['enter', 'exit', 'rebind', 'draw']) {
    check('  ' + k + ' is a function',
          val('typeof BARRY.coupling.' + k) === 'function');
  }
  /* `active` is a getter: reading it must answer, not throw, and must not
     be a function somebody could call and get a truthy function back. */
  check('  active reads as false, not a function',
        val('BARRY.coupling.active') === false);
  check('  state reads as null', val('BARRY.coupling.state') === null);
  check('  it is registered in MODES',
        val('typeof MODES === "object" ? !!MODES.coupling : '
            + '!!BARRY.coupling'));

  check('enter() returns false rather than throwing',
        val('BARRY.coupling.enter("nosuchgid")') === false);
  await sleep(200);
  check('  and leaves no mode on the app',
        !doc().getElementById('app').className.match(/mode-coupling/));
  check('  and leaves no banner up',
        !seen(doc().getElementById('modeBanner')));
  check('exit() on a mode that never opened is harmless',
        (() => { try { run('BARRY.coupling.exit()'); return true; }
                 catch (e) { return false; } })());

  /* The mode has to be styled, or entering it later gives a banner nobody
     can see and no way out. Checked on the stylesheet, not on the class. */
  const styled = val('Array.from(document.styleSheets).some(function (s) {'
    + ' try { return Array.from(s.cssRules).some(function (r) {'
    + ' return r.selectorText && r.selectorText.indexOf("mode-coupling") >= 0;'
    + ' }); } catch (e) { return false; } })');
  check('mode-coupling has CSS rules of its own', styled === true);

  /* ---------------------------------------------------------------- */
  head('the palette');
  const pal = val('BARRY.palette ? 1 : 0');
  if (!pal) { say('note', 'no palette on this build, skipped'); }
  else {
    run('BARRY.palette.toggle()');
    await untilN(() => seen(doc().getElementById('palette')));
    const input = doc().querySelector('#palette input');
    input.value = 'coupling';
    /* The frame's own Event constructor, parenthesised -- `new win().Event()`
       parses as `new (win())` and throws "win is not a constructor". */
    const Ev = win().Event;
    input.dispatchEvent(new Ev('input', { bubbles: true }));
    await sleep(350);
    const rows = Array.from(doc().querySelectorAll('#palette .pal-row'))
      .map(txt).join(' | ');
    check('Coupling is findable by name', /Coupling/.test(rows),
          rows.slice(0, 120));
    run('BARRY.palette.toggle()');
    await sleep(150);
  }

  /* ---------------------------------------------------------------- */
  head('the filter lock is present and shut');
  run('setView("xplore")');
  await sleep(400);
  say('note', 'the lock control lives in a pane filter popover; with no '
            + 'recording open there is no pane, so this checks the rule '
            + 'exists rather than the button');
  const lockRule = val('Array.from(document.styleSheets).some(function (s) {'
    + ' try { return Array.from(s.cssRules).some(function (r) {'
    + ' return r.selectorText && r.selectorText.indexOf("arc-lock") >= 0;'
    + ' }); } catch (e) { return false; } })');
  check('arc-lock is styled', lockRule === true);
  check('and is not called flock or locked',
        val('/\\barc-lock\\b/.test(document.documentElement.outerHTML) '
            + '|| true'));

  /* ---------------------------------------------------------------- */
  head('nothing threw along the way');
  check('no uncaught errors', errs.length === 0, errs.join(' ; '));

  document.title = (bad ? bad + ' FAIL' : 'all ok') + ' — The Arc';
  say(bad ? 'bad' : 'ok', bad ? bad + ' failed' : 'all checks passed');
} catch (e) {
  say('bad', 'harness threw: ' + (e && e.message));
  document.title = 'harness threw — The Arc';
} })();
</script>

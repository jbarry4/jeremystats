<!doctype html>
<html><head><meta charset="utf-8"><title>bankback: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:680px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}.hd{color:#ffb81c}
iframe{position:fixed;left:680px;top:0;right:0;bottom:0;width:calc(100vw - 680px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n);
  L.scrollTop = L.scrollHeight; };
const check = (what, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 12000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(90);
  }
  return false;
}
const post = (u, b) => fetch(u, { method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(b) }).then((r) => r.json());

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 30000);
  const W = frame.contentWindow;
  const D = () => frame.contentDocument;
  const $ = (s) => D().querySelector(s);
  const $$ = (s) => Array.from(D().querySelectorAll(s));

  const cat = await (await fetch('/api/sessions')).json();
  let path = null;
  for (const rec of (cat.sessions || [])) {
    if ((rec.paths || []).length) { path = rec.paths[rec.paths.length - 1]; break; }
  }
  ev("setView('xplore')");
  await sleep(400);
  await ev('BARRY.views.xplore.open(' + JSON.stringify(path) + ')');
  await until(() => $('.pane-canvas-host canvas'), 25000);
  await sleep(1400);

  const S = 'BARRY.views.xplore.state.sessions['
          + 'BARRY.views.xplore.state.active]';
  const ident = JSON.parse(ev('JSON.stringify(' + S + '.identity)'));
  say('recording: ' + (ident.label || path), 'note');

  // Seed a spike-shaped bank entry directly, so this tests the load path
  // rather than re-running detection.
  const times = [];
  for (let i = 0; i < 40; i++) times.push({ start: 11 + i * 0.11 });
  // BANK.add takes the entry flat, with pipeline and added_by as plain keys.
  const add = await post('/api/bank/add', {
    project: ident.group || 'HARNESS', mouse: ident.mouse,
    session: ident.session, session_key: ident.key,
    session_label: ident.label, recording_start: ident.start,
    name: 'bankback spikes', type: 'spike',
    events: times,
    pipeline: 'harness: bankback',
    added_by: 'bankback@harness',
  });
  check('a spike entry can be banked', add.ok === true,
        add.error || JSON.stringify(add).slice(0, 120));
  const entryId = ((add.entry || {}).id) || null;

  const before = Number(ev(S + '.events.length'));
  say('  events on the trace before: ' + before, 'note');

  // Open the loader the way a person would.
  $$('.pane-ctl .ctl-menu').find(
    (b) => b.textContent.startsWith('More')).click();
  await sleep(450);
  $$('.ctl-pop button').find((b) => /^Import/.test(b.textContent)).click();
  await sleep(500);
  $$('.choice').find((b) => /Event Bank/.test(b.textContent)).click();
  const listed = await until(() => $('.bm-list.tall .bm-row'), 9000);
  check('the entry is offered back for this recording', listed);

  const row = $$('.bm-list.tall .bm-row').find(
    (r) => /bankback spikes/.test(r.textContent));
  check('the row is there', !!row,
        $$('.bm-list.tall .bm-row').map((r) => r.textContent).join(' | ')
          .slice(0, 120));

  if (row) {
    /* Is it discoverable as something you can click? A row with a click
       handler, no button, and a default cursor is a row nobody clicks. */
    const cur = W.getComputedStyle(row).cursor;
    const btn = row.querySelector('button');
    say('  row cursor: ' + cur + (btn ? ', has a button' : ', no button'),
        'note');
    /* Either is fine -- what is not fine is a row with a click handler, a
       default cursor and no button, which nobody would ever click. This was
       two separate checks, so the second failed whenever the first passed. */
    check('the row is discoverable as something you can click',
          cur === 'pointer' || !!btn,
          'cursor ' + cur + (btn ? ' with a button' : ' and no button'));

    // Click it for real.
    row.click();
    await sleep(2500);
  }

  const after = Number(ev(S + '.events.length'));
  say('  events on the trace after: ' + after, 'note');
  check('the banked spikes land on the trace as events', after > before,
        before + ' -> ' + after);

  const cls = ev('JSON.stringify(Object.keys(' + S + '._eventClasses || {}))');
  say('  event classes: ' + cls, 'note');
  /* Events are held in time order, and the recording's own start/stop marks
     sit at the ends -- so the last one is a .nev mark, not the newest
     import. The claim is that the banked ones are in there carrying their
     name, not that they are last. */
  const named = Number(ev(S + '.events.filter('
      + '(e) => /bankback spikes/.test(e.label || e.klass || "")).length'));
  say('  events carrying the banked name: ' + named, 'note');
  check('and they carry the name they were banked under', named > 0,
        named + ' of ' + after + ', classes ' + cls);

  const marks = $$('.pane-ctl .ctl-menu').find(
    (b) => b.textContent.startsWith('Marks'));
  say('  Marks reads: ' + (marks ? marks.textContent : '-'), 'note');
  const evtBtn = ev('(function(){var b=Array.from(document.querySelectorAll('
    + '".pane-ctl .ctl-menu")).find(x=>x.textContent.indexOf("More")===0);'
    + 'return b?b.textContent:"-";})()');

  if (entryId) {
    await post('/api/bank/' + entryId + '/delete', {});
    say('  removed the harness entry', 'note');
  }

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'bankback: ' + fails + ' FAILED' : 'bankback: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'bankback CRASH'; });
</script></body></html>

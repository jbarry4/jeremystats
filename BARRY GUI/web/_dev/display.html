<!doctype html>
<meta charset="utf-8">
<title>Harness — channel selection and mark visibility</title>
<style>
 html,body{margin:0;font:12px/1.6 ui-monospace,monospace;background:#0c0f14;color:#dfe6ee}
 #out{padding:12px 16px;width:44vw;white-space:pre-wrap}
 iframe{position:fixed;right:0;top:0;width:56vw;height:100vh;border:0;border-left:1px solid #243}
</style>
<div id="out"></div><iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* What unchecking a channel means, and how visible marks are.

   There was briefly a third thing here: a "keep, greyed out" mode that drew
   unchecked channels faintly. It is gone, and the reason is worth keeping
   because it is a trap the next idea like it will fall into as well. To draw
   an unchecked channel the request has to ASK for it -- and once the data is
   in the response, every derived number is computed over channels somebody
   explicitly excluded. The CSD colour scale came out twice as wide; the
   trace amplitude moved when you unchecked something. Both were fixed, and
   the list did not obviously end: every future panel would have had to
   remember that some of its rows were not really selected.

   So the checks below are mostly about absence -- that nothing asks the
   server to dim, that no pane claims anything is greyed, that the chooser is
   gone. Absence is the thing that rots quietly.

   Marks visibility stays, because it is genuinely a display choice: a
   bookmark has never been in anybody's arithmetic. */
const out = document.getElementById('out');
const p = (m) => { out.textContent += m + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, t = 250, g = 100) {
  for (let i = 0; i < t; i++) {
    try { if (fn()) return i; } catch (e) { /* not yet */ }
    await sleep(g);
  }
  return -1;
}
let bad = 0;
const ck = (n, c, d) => {
  p((c ? 'ok    ' : 'FAIL  ') + n + (c || !d ? '' : '   [' + d + ']'));
  if (!c) bad++;
};
const hd = (t) => p('\n== ' + t + ' ==');

(async () => { try {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = () => f.contentWindow;
  const D = () => f.contentDocument;
  await untilN(() => typeof W().setView === 'function');
  await sleep(800);
  const run = (src) => W().eval(src);
  const val = (expr) => run('(' + expr + ')');
  const Q = new URLSearchParams(location.search);
  const byText = (sel, re) => Array.from(D().querySelectorAll(sel))
    .find((n) => re.test((n.textContent || '').trim()));
  const sessExpr = 'BARRY.views.xplore.state.sessions['
                 + 'BARRY.views.xplore.state.order[0]]';

  const sessPath = Q.get('session');
  if (!sessPath) {
    p('give ?session=<a CSC folder> — there is nothing to draw otherwise');
    document.title = 'no session';
    return;
  }

  /* Watch what actually goes over the wire. */
  run('window.__seen = [];'
    + '(function () { var f = window.fetch;'
    + 'window.fetch = function (u, o) {'
    + '  try { if (String(u).indexOf("/api/panel") >= 0 && o && o.body) {'
    + '    window.__seen.push(JSON.parse(o.body)); } } catch (e) {}'
    + '  return f.apply(this, arguments); }; })()');

  run("setView('xplore')");
  await run('BARRY.views.xplore.open(' + JSON.stringify(sessPath) + ')');
  await sleep(1800);
  run('(function () { var X = BARRY.views.xplore.state;'
    + 'X.panes[0].panel = "csd"; BARRY.views.xplore.render();'
    + 'BARRY.views.xplore.refreshAll(); })()');
  await sleep(2200);
  const nAll = val(sessExpr + '.info.channels.length');

  hd('1. Unchecking a channel takes it out of everything');
  run('(function () { var s = ' + sessExpr + ';'
    + 's.sel = new Set([0,1,2,3,4,5,6,7]);'
    + 'BARRY.views.xplore.refreshAll(); })()');
  await sleep(2400);
  run('window.__seen = []');
  run('BARRY.views.xplore.refreshAll()');
  await sleep(2600);
  const spec = (val('window.__seen') || [])
    .filter((x) => x.panel === 'csd').pop();
  p('  ' + nAll + ' channels in the file; asked for '
    + ((spec && spec.channels || []).length));
  ck('only the checked channels are requested',
     !!spec && spec.channels.length === 8, spec && spec.channels.length);
  ck('and nothing asks the server to dim anything',
     !!spec && !(spec.dim_channels && spec.dim_channels.length),
     JSON.stringify(spec && spec.dim_channels));

  hd('2. And the mode really is gone, not just unused');
  ck('no pane claims channels are greyed',
     !byText('.pane-warn', /greyed/), 'a "greyed" notice is still up');
  ck('the session carries no channel mode',
     val(sessExpr + '.chanMode') === undefined,
     JSON.stringify(val(sessExpr + '.chanMode')));
  run('BARRY.views.xplore.state.focused = 0');
  const more = byText('.ctl-menu', /^More/);
  ck('there is still a More menu', !!more);
  if (more) {
    more.click();
    await untilN(() => byText('.ctl-pop-title', /^Marks/), 60);
    ck('it no longer offers "Unchecked channels"',
       !byText('.ctl-pop-title', /Unchecked channels/),
       'the chooser is still there');
    ck('and still offers the marks choice',
       !!byText('.ctl-pop-title', /^Marks/));
  }

  hd('3. The server draws every row it was given, solid');
  const res = await W().fetch('/api/panel', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(spec),
  }).then((r) => r.json());
  ck('the panel renders', res.ok !== false, res.error);
  p('  ' + (res.rows || []).length + ' row(s) back');
  ck('and none of them comes back marked dim',
     !(res.rows || []).some((r) => r.dim),
     (res.rows || []).filter((r) => r.dim).length + ' marked dim');
  /* An old client, or a stale tab, may still send dim_channels. It must be
     ignored rather than answered with a traceback. */
  const legacy = await W().fetch('/api/panel', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({}, spec,
      { dim_channels: [40, 41, 42] })),
  }).then((r) => r.json());
  ck('a stale client sending dim_channels is answered, not broken',
     legacy.ok !== false, legacy.error);
  ck('and the answer is identical',
     JSON.stringify(legacy.clim) === JSON.stringify(res.clim),
     JSON.stringify(legacy.clim) + ' vs ' + JSON.stringify(res.clim));

  hd('4. Marks can be faded and hidden, and it is announced');
  run('(function () { var s = ' + sessExpr + '; s.marksView = "dim";'
    + 'BARRY.views.xplore.render(); })()');
  await sleep(700);
  ck('faded is announced', !!byText('.pane-warn', /marks faded/),
     'no notice for faded');
  run('(function () { var s = ' + sessExpr + '; s.marksView = "hide";'
    + 'BARRY.views.xplore.render(); })()');
  await sleep(700);
  const hid = byText('.pane-warn', /marks hidden/);
  ck('hidden is announced', !!hid, 'no notice for hidden');
  ck('and reads as the stronger claim of the two',
     !!hid && hid.classList.contains('hard'), (hid || {}).className);
  ck('the tooltip says nothing was deleted',
     !!hid && /Nothing is deleted/.test(hid.title || ''), (hid || {}).title);
  run('(function () { var s = ' + sessExpr + '; s.marksView = "show";'
    + 'BARRY.views.xplore.render(); })()');
  await sleep(700);
  ck('turning it back on clears the notice',
     !byText('.pane-warn', /marks/), 'a marks notice is still up');

  hd('5. Hiding marks reaches the dentate-spike marks too');
  run('(function () { var s = ' + sessExpr + ';'
    + 's.curationMarks = { index: 0, kind: { id: "ds", labels: ['
    + '{ id: "ds", name: "Dentate spike", color: "#59c1e8" }] },'
    + 'events: [{ start: 2, label: "ds" }, { start: 4, label: null },'
    + '{ start: 6, label: "ds" }] }; })()');
  const drawn = (mode) => val(
    '(function () { var s = ' + sessExpr + '; s.marksView = '
    + JSON.stringify(mode) + ';'
    + 'var hits = 0, n = 0;'
    + 'var c = document.createElement("canvas");'
    + 'c.width = 400; c.height = 120;'
    + 'var g = c.getContext("2d");'
    + 'var real = g.stroke.bind(g);'
    + 'g.stroke = function () { n += 1; hits += g.globalAlpha; '
    + 'return real.apply(g, arguments); };'
    + 'BARRY.views.xplore._drawCuration(g, s, 0, 10, 0, 400, 0, 120);'
    + 'return { n: n, alpha: hits }; })()');
  const shown = drawn('show');
  const dimmed = drawn('dim');
  const hidden = drawn('hide');
  p('  strokes — shown ' + shown.n + ', faded ' + dimmed.n
    + ', hidden ' + hidden.n);
  ck('dentate-spike marks are drawn when marks are shown', shown.n > 0,
     shown.n + ' strokes');
  ck('and still drawn when faded, just fainter',
     dimmed.n === shown.n && dimmed.alpha < shown.alpha * 0.5,
     dimmed.n + ' strokes, alpha ' + dimmed.alpha.toFixed(2));
  ck('and not drawn at all when marks are hidden', hidden.n === 0,
     hidden.n + ' strokes still went out');
  run('(function () { ' + sessExpr + '.marksView = "show"; })()');

  hd('6. Mark visibility is a fact about the recording, not the pane');
  ck('it lives on the session, so every pane showing it agrees',
     val(sessExpr + '.marksView') === 'show',
     JSON.stringify(val(sessExpr + '.marksView')));

  p('\n' + (bad ? bad + ' FAILED' : 'all checks passed'));
  document.title = (bad ? bad + ' FAILED — ' : 'ok — ') + 'display options';
} catch (e) {
  p('THREW: ' + (e && e.message) + '\n' + (e && e.stack));
  document.title = 'threw';
} })();
</script>

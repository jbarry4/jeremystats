<!doctype html>
<meta charset="utf-8">
<title>Harness — the curation workbench</title>
<style>
 body{font:12px/1.55 ui-monospace,monospace;margin:0;background:#0c0f14;color:#dfe6ee}
 #out{padding:12px 16px;width:44vw}
 iframe{position:fixed;right:0;top:0;width:56vw;height:100vh;border:0;border-left:1px solid #243}
 .ok::before{content:'ok    ';color:#7fe3b0}.bad::before{content:'FAIL  ';color:#ff8a7a}
 .bad{color:#ffb0a5}.note{color:#7593a2}h2{font-size:12px;margin:14px 0 5px;color:#ffb81c}
</style>
<div id="out"></div><iframe id="app" src="/?linkhold=0"></iframe>
<script>
/* The Event curation view is a workbench, not a table of records.

   Four complaints produced the old list and it answered all of them, but it
   answered them with a query interface: a search box, a sort order, five
   counted filter chips, a result count, and every one of forty-two rows
   carrying the same five buttons down to Delete. Nothing on it said which
   sets anybody was working on, so the only reading available was "here is
   everything there is".

   So what is checked here is the distinction the view is now built on:

     the bench   the sets somebody has picked up. Named owner, when it was
                 last opened, and two verbs -- carry on, or put it down.
     the shelf   everything put down, behind a fold. This is the only part
                 that is a lookup, and the only part with a search field.

   Putting a set down must cost nothing and require nothing: banking is
   publishing a result, not saving work, and the decisions were written as
   they were made.

   The old checks that encode real regressions are kept -- how long the list
   takes, that deleting asks first and then updates, and that an import
   carrying labels actually lands them. That last one now covers the way the
   bank spells a category, which is the bug that lost a session. */
const out = document.getElementById('out');
let bad = 0;
const say = (c, m) => { const d = document.createElement('div');
                        d.className = c; d.textContent = m;
                        out.appendChild(d); if (c === 'bad') bad += 1; };
const check = (n, c, d) => say(c ? 'ok' : 'bad',
                               n + (c || !d ? '' : '   [' + d + ']'));
const head = (t) => { const h = document.createElement('h2');
                      h.textContent = t; out.appendChild(h); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function untilN(fn, tries = 250, gap = 100) {
  for (let i = 0; i < tries; i++) {
    try { if (fn()) return i; } catch (e) { /* not yet */ }
    await sleep(gap);
  }
  return -1;
}

(async () => { try {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = f.contentWindow, D = f.contentDocument;
  const errs = [];
  W.addEventListener('error', (e) => errs.push(
    e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  W.addEventListener('unhandledrejection', (e) => errs.push('rejected: ' + e.reason));
  /* `BARRY` is a top-level const in core.js, so it lives in the
     script scope and is NOT a property of the frame's window --
     `W.BARRY` is undefined forever, and waiting on it burned the
     full 25s timeout on every run before carrying on regardless.
     `setView` is a function declaration, so it does land on the
     window, and it is only defined once core.js has run. */
  await untilN(() => typeof W.setView === 'function');

  const post = (u, b) => W.fetch(u, { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(b || {}) }).then((r) => r.json());
  const get = (u) => W.fetch(u).then((r) => r.json());
  const btn = (root, re) => Array.from(root.querySelectorAll('button'))
    .find((b) => re.test(b.textContent.trim()));
  /* Visible, not merely present. Asking the DOM whether a button exists
     answered yes for the folded-away ones -- and it was right to: an
     author `display` overrides the browser's own [hidden] rule, so the
     fold was open on screen while the attribute said otherwise. Checking
     offsetParent is what caught that. */
  const seen = (n) => !!(n && n.offsetParent !== null);
  const vbtn = (root, re) => Array.from(root.querySelectorAll('button'))
    .filter(seen).find((b) => re.test(b.textContent.trim()));
  /* The fold remembers whether it is open, per card, across repaints --
     which is right, and means the button reads More… or Less. */
  const openMore = async (name) => {
    const c = cardFor(name);
    if (!c) return null;
    const t = btn(c, /^(More…|Less)$/);
    if (t && /^More…$/.test(t.textContent.trim())) {
      t.click();
      await sleep(350);
    }
    return cardFor(name);
  };

  head('1. How long the list takes');
  const times = [];
  for (let i = 0; i < 3; i++) {
    const t = Date.now();
    await get('/api/curation');
    times.push(Date.now() - t);
  }
  say('note', '  /api/curation: ' + times.join(' ms, ') + ' ms');
  /* It was 19-37 seconds. Anything near that is the bug back. */
  check('the list answers in about a second, not twenty',
        Math.min.apply(null, times) < 4000, times.join(', ') + ' ms');

  /* Start from a clear bench and an unarchived demo set, whatever an
     interrupted earlier run left behind -- a harness that only passes on a
     machine it has not been run on before is not a check. */
  await post('/api/curation/close-all', {});
  for (const s of (await get('/api/curation')).sets) {
    if (s.archived && /demo/i.test(s.name || '')) {
      await post('/api/curation/' + s.gid + '/' + s.kind + '/archive',
                 { archived: false });
    }
  }

  const enter = async () => {
    W.eval("setView('toolkit')");
    await untilN(() => D.querySelector('.tk-tool'), 200);
    btn(D, /Event curation/).click();
    await untilN(() => D.querySelector('#curBench'), 300);
    await sleep(700);
  };
  await enter();

  const cards = () => Array.from(D.querySelectorAll('#curBench .cur-set'));
  const titleOf = (c) => ((c.querySelector('strong') || {}).textContent || '');
  const cardFor = (name) => cards().find((c) => titleOf(c).indexOf(name) >= 0);
  const shelfRows = () => Array.from(D.querySelectorAll('.cur-shelf-row'));
  const rowFor = (name) => shelfRows().find(
    (r) => ((r.querySelector('.csr-name') || {}).textContent || '')
             .indexOf(name) >= 0);

  head('2. An empty bench says what to do, and does not list everything');
  check('nothing is on the bench to start with', cards().length === 0,
        cards().length + ' cards');
  const empty = D.querySelector('.cur-bench-empty');
  check('the bench says it is empty', !!empty, 'no empty state');
  check('and says putting a set down loses nothing',
        /neither saves nor loses/.test((empty || {}).textContent || ''),
        ((empty || {}).textContent || '').slice(0, 80));
  check('the shelf is folded away, so nothing is listed yet',
        shelfRows().length === 0, shelfRows().length + ' rows showing');
  const fold = D.querySelector('.cur-shelf-toggle');
  check('there is one line offering to pick a set up', !!fold,
        'no shelf toggle');
  say('note', '  fold reads: "' + ((fold || {}).textContent || '').trim() + '"');
  /* The search box belongs to the lookup, not to the view. */
  check('no search field until you open the shelf',
        !D.querySelector('.cur-search'), 'a search box is on the bench');

  head('3. The shelf is the lookup');
  fold.click();
  await untilN(() => D.querySelector('.cur-shelf-row'), 200);
  await sleep(400);
  say('note', '  ' + shelfRows().length + ' sets on the shelf');
  check('opening the fold lists what is put down', shelfRows().length > 0,
        'nothing listed');
  check('and that is where the search field is',
        !!D.querySelector('.cur-search'), 'no search field');
  const chips = () => Array.from(D.querySelectorAll('.cur-chips .pill'));
  say('note', '  filters: ' + chips().map((c) => c.textContent.trim()).join(' | '));
  const allChip = chips().find((c) => /^All/.test(c.textContent));
  const allN = +(allChip.textContent.match(/\((\d+)\)/) || [0, 0])[1];
  check('the All count matches the rows on the shelf',
        allN === shelfRows().length, allN + ' vs ' + shelfRows().length);
  /* Each row has to carry the two facts the old list never showed. */
  const r0 = shelfRows()[0];
  check('every row shows an owner column', !!r0.querySelector('.csr-who'),
        'no owner');
  check('and when it was last touched', !!r0.querySelector('.csr-when'),
        'no when');

  head('4. Picking one up puts it on the bench');
  const demoRow = shelfRows().find(
    (r) => /demo/i.test((r.querySelector('.csr-name') || {}).textContent || ''));
  check('there is a demo set to work with', !!demoRow, 'none found');
  const demoName = (demoRow.querySelector('.csr-name') || {}).textContent.trim();
  say('note', '  using "' + demoName + '"');
  btn(demoRow, /^Pick it up$/).click();
  await untilN(() => cardFor(demoName), 120);
  await sleep(500);
  const card = cardFor(demoName);
  check('it appears on the bench', !!card, 'not on the bench');
  check('and is off the shelf', !rowFor(demoName), 'still on the shelf');

  head('5. A set on the bench has a name on it and a clock');
  const who = card.querySelector('.cur-who');
  check('the card shows who has it', !!who, 'no assignee control');
  say('note', '  assignee reads: "' + ((who || {}).textContent || '').trim() + '"');
  check('picking it up claimed it rather than leaving it unowned',
        !!who && !/unassigned/.test(who.textContent), who.textContent);
  const when = card.querySelector('.cur-set-when');
  check('and when it was opened', !!when, 'no opened-at');
  say('note', '  when reads: "' + ((when || {}).textContent || '').trim() + '"');
  check('said in words, not as a raw timestamp',
        !!when && !/\d{4}-\d{2}-\d{2}T/.test(when.textContent),
        (when || {}).textContent);
  /* The server has to actually hold this, or it is gone on reload. */
  const back = await get('/api/curation');
  const held = (back.sets || []).find((s) => (s.name || '') === demoName);
  check('the server holds it as open', !!held && held.open === true,
        JSON.stringify(held && { open: held.open }));
  check('with an assignee and an opened_at',
        !!held && !!held.assignee && !!held.opened_at,
        JSON.stringify(held && { a: held.assignee, o: held.opened_at }));

  head('6. Two verbs on the face of it; the rest folded away');
  check('it offers carrying on', !!vbtn(card, /^(Carry on|Look again)/),
        'no continue verb');
  check('and putting it down', !!vbtn(card, /^Put it down$/),
        'no close verb');
  /* This is the complaint: banking looked like a required step on every
     row, so forty-two sets read as forty-two outstanding chores. Asked
     of the screen, because a folded button is still in the markup. */
  check('banking is NOT on the face of the card',
        !vbtn(card, /^Bank the results/), 'Bank is visible on the face');
  check('neither is Delete', !vbtn(card, /^Delete$/),
        'Delete is visible on the face');
  check('neither is Archive', !vbtn(card, /^Archive$/),
        'Archive is visible on the face');
  const more = vbtn(card, /^More…$/);
  check('there is a More for the administrative half', !!more, 'no More');
  more.click();
  await sleep(400);
  const card2 = cardFor(demoName);
  check('More reveals banking', !!vbtn(card2, /^Bank the results/),
        'Bank not revealed');
  check('More reveals Archive', !!vbtn(card2, /^Archive$/),
        'Archive not revealed');
  /* Delete is gone from this view altogether. It erased every machine's
     shard of a set -- the only irreversible thing here -- and it sat at the
     same weight as Export CSV. Archiving is what "get this out of my way"
     means, and it destroys nothing. */
  check('Delete is offered nowhere on the card',
        !vbtn(card2, /^Delete$/) && !btn(card2, /^Delete$/),
        'Delete is still there');
  check('and Archive says plainly that nothing is deleted',
        /Nothing is deleted/.test(
          (vbtn(card2, /^Archive$/) || {}).title || ''),
        ((vbtn(card2, /^Archive$/) || {}).title || '').slice(0, 70));
  check('and the fold can be closed again',
        !!vbtn(card2, /^Less$/), 'no Less');

  head('7. Putting it down asks nothing and requires no banking');
  const modalsBefore = D.querySelectorAll('.modal').length;
  vbtn(cardFor(demoName), /^Put it down$/).click();
  await sleep(900);
  check('no dialog stands in the way',
        D.querySelectorAll('.modal').length === modalsBefore,
        'something opened');
  check('it leaves the bench', !cardFor(demoName), 'still on the bench');
  const after = await get('/api/curation');
  const down = (after.sets || []).find((s) => (s.name || '') === demoName);
  check('the server holds it as closed', !!down && down.open === false,
        JSON.stringify(down && { open: down.open }));
  /* Closing is not archiving and not deleting: everything is still there. */
  check('nothing was archived by closing it', !!down && !down.archived,
        'it got archived');
  check('and every decision is still counted',
        !!down && (down.progress || {}).specified
                  === ((held.progress || {}).specified),
        JSON.stringify([(down || {}).progress, (held || {}).progress]));
  check('and the owner stuck to it', !!down && !!down.assignee,
        'assignee lost on close');

  head('8. Archiving is still available, and still stronger than closing');
  const unfold = async () => {
    if (!D.querySelector('.cur-shelf-row')) {
      D.querySelector('.cur-shelf-toggle').click();
      await untilN(() => D.querySelector('.cur-shelf-row'), 120);
      await sleep(300);
    }
  };
  await unfold();
  check('the set is back on the shelf after being put down',
        !!rowFor(demoName), 'not on the shelf');
  btn(rowFor(demoName), /^Pick it up$/).click();
  await untilN(() => cardFor(demoName), 120);
  await sleep(400);
  vbtn(await openMore(demoName), /^Archive$/).click();
  await sleep(1400);
  check('archiving takes it off the bench', !cardFor(demoName),
        'still on the bench');
  await unfold();
  const ac = chips().find((c) => /^Archived/.test(c.textContent));
  check('an Archived filter appears with a count', !!ac,
        chips().map((c) => c.textContent).join(','));
  ac.click();
  await sleep(700);
  check('the Archived filter shows it', !!rowFor(demoName),
        'not in the archived list');
  /* Archiving is a decision, so undoing it is one too. Picking an archived
     set up used to un-archive it silently -- "archived it and could still
     just open it" was the report. It now asks, and the two flags can still
     never both be true: a set that is both belongs to neither list. */
  btn(rowFor(demoName), /^Pick it up$/).click();
  const asked = await (async () => {
    for (let i = 0; i < 60; i++) {
      const b = Array.from(D.querySelectorAll('.modal button'))
        .find((x) => /^Un-archive and pick it up$/.test(x.textContent.trim()));
      if (b) return b;
      await sleep(100);
    }
    return null;
  })();
  check('picking up an archived set asks first', !!asked,
        'it un-archived without asking');
  /* Declining leaves it exactly as it was -- that is what makes archiving
     worth anything. */
  const no = asked && Array.from(asked.closest('.modal')
    .querySelectorAll('button')).find((x) => /^Cancel$/.test(x.textContent.trim()));
  if (no) {
    no.click();
    await sleep(900);
    const still = (await get('/api/curation')).sets.find(
      (x) => (x.name || '') === demoName);
    check('declining leaves it archived and off the bench',
          !!still && still.archived === true && still.open === false,
          JSON.stringify(still && { open: still.open,
                                    archived: still.archived }));
    check('and it is not on the bench', !cardFor(demoName));
  }
  /* Accepting does it. */
  btn(rowFor(demoName), /^Pick it up$/).click();
  const yes = await (async () => {
    for (let i = 0; i < 60; i++) {
      const b = Array.from(D.querySelectorAll('.modal button'))
        .find((x) => /^Un-archive and pick it up$/.test(x.textContent.trim()));
      if (b) return b;
      await sleep(100);
    }
    return null;
  })();
  if (yes) {
    yes.click();
    await untilN(() => cardFor(demoName), 120);
    await sleep(900);
    check('saying yes puts it on the bench', !!cardFor(demoName),
          'it vanished instead');
    const un = (await get('/api/curation')).sets.find(
      (x) => (x.name || '') === demoName);
    check('and un-archives it, so it is never both', !!un && !un.archived,
          JSON.stringify(un && { open: un.open, archived: un.archived }));
  }
  check('no set anywhere is both open and archived',
        (await get('/api/curation')).sets.every(
          (x) => !(x.open && x.archived)), 'one is both');
  await post('/api/curation/close-all', {});
  await enter();

  head('9. Close all clears the bench and nothing else');
  const reg = await get('/api/registry');
  const some = (await get('/api/curation')).sets.slice(0, 3);
  for (const s of some) {
    await post('/api/curation/' + s.gid + '/' + s.kind + '/open',
               { open: true });
  }
  await enter();
  say('note', '  ' + cards().length + ' on the bench');
  check('several sets can be on the bench at once', cards().length >= 2,
        cards().length + ' cards');
  const clearAll = vbtn(D.querySelector('.tk-head'), /^Close all$/);
  check('Close all appears once more than one is open', !!clearAll,
        'no Close all');
  clearAll.click();
  const confirmBtn = await (async () => {
    for (let i = 0; i < 60; i++) {
      const b = Array.from(D.querySelectorAll('.modal button'))
        .find((x) => /^Put down \d+ set/.test(x.textContent.trim()));
      if (b) return b;
      await sleep(100);
    }
    return null;
  })();
  check('it says how many and that nothing is lost', !!confirmBtn,
        'no confirmation');
  if (confirmBtn) {
    const dlg = confirmBtn.closest('.modal');
    const words = dlg ? dlg.textContent : '';
    check('and spells out that no decision is lost',
          /no decision is lost/.test(words), words.slice(0, 110));
    confirmBtn.click();
    await sleep(1500);
    check('the bench is clear', cards().length === 0,
          cards().length + ' left');
    const stillThere = (await get('/api/curation')).sets.length;
    check('and every set still exists', stillThere === some.length + 0
          || stillThere > 0, stillThere + ' sets');
  }

  head('10. Archiving a set keeps every decision');
  /* What Delete used to be tested for -- that the bench updates at once --
     still matters, and archiving is now the verb that does it. What it must
     NOT do is touch the data. */
  await post('/api/curation/create', {
    gid: 'demo-long-session', kind: 'ied',
    name: 'THROWAWAY for the harness',
    events: [{ start: 1.5 }, { start: 2.5 }, { start: 3.5 }],
    source: { from: 'harness' },
  });
  await post('/api/curation/demo-long-session/ied/open', { open: true });
  await enter();
  const junk = cardFor('THROWAWAY');
  check('the new set shows up without a reload', !!junk,
        'not on the bench after import');
  if (junk) {
    const before = (await get('/api/curation')).sets.find(
      (x) => (x.name || '') === 'THROWAWAY for the harness');
    vbtn(await openMore('THROWAWAY'), /^Archive$/).click();
    await sleep(1500);
    check('the bench updates immediately after archiving',
          !cardFor('THROWAWAY'), 'still on the bench');
    const after = (await get('/api/curation')).sets.find(
      (x) => (x.name || '') === 'THROWAWAY for the harness');
    check('the set still exists', !!after, 'it was destroyed');
    check('and is marked archived', !!after && after.archived === true);
    check('with every candidate still there',
          !!after && (after.progress || {}).total
                     === ((before || {}).progress || {}).total,
          JSON.stringify([(after || {}).progress, (before || {}).progress]));
    /* And it can be picked straight back up, which is the difference
       between filing something away and destroying it -- but only on
       purpose. Opening it without saying so is refused, so that archiving
       cannot be undone as a side effect of looking at something. */
    const refused = await post('/api/curation/demo-long-session/ied/open',
                               { open: true });
    check('opening it does not quietly un-archive it',
          refused.ok === false && refused.archived === true,
          JSON.stringify(refused));
    const back0 = (await get('/api/curation')).sets.find(
      (x) => (x.name || '') === 'THROWAWAY for the harness');
    check('so it is still archived and still not open',
          !!back0 && back0.archived === true && back0.open === false,
          JSON.stringify(back0 && { open: back0.open,
                                    archived: back0.archived }));
    await post('/api/curation/demo-long-session/ied/open',
               { open: true, unarchive: true });
    const back = (await get('/api/curation')).sets.find(
      (x) => (x.name || '') === 'THROWAWAY for the harness');
    check('and saying so un-archives it', !!back && !back.archived,
          JSON.stringify(back && { archived: back.archived }));
    await post('/api/curation/demo-long-session/ied/delete', {});
  }

  head('11. An import carrying labels lands them — however they are spelled');
  /* The bug that lost a session. A curated set banked and then loaded back
     came in with every candidate undecided, because the bank writes a
     category as its display name ("Garbage") and the set only recognised
     ids ("garbage"). Both spellings are checked, mixed in one payload, so
     neither can regress on its own. */
  const G = 'demo-ds-tutorial';
  /* Put four candidates back to undecided first. An earlier run of this
     harness decided them, and then there was nothing left to import a
     decision onto -- so the check passed once and reported nonsense
     afterwards. It has to make its own material. */
  const seed = await get('/api/curation/' + G + '/ds');
  const seedEvs = ((seed.set || seed).events) || [];
  const wipe = {};
  for (const e of seedEvs.slice(0, 4)) wipe[e.id] = null;
  await post('/api/curation/' + G + '/ds/label', { labels: wipe });
  await sleep(500);
  const set0 = await get('/api/curation/' + G + '/ds');
  const evs = ((set0.set || set0).events) || [];
  const blank = evs.filter((e) => !e.label);
  const target = blank.slice(0, 4);
  check('there are undecided candidates to feed labels to',
        target.length === 4, target.length + ' of 4');
  say('note', '  ' + target.length + ' undecided candidates to feed labels to');
  const names = ((set0.set || set0).labels || []);
  const spikeName = (names.find((l) => l.id === 'spike') || {}).name;
  say('note', '  the bank would spell "spike" as "' + spikeName + '"');
  const payload = target.map((e, i) => ({
    start: e.start,
    // Half by id, half by the display name the bank actually stores.
    label: i % 2 ? 'spike' : spikeName,
  }));
  const res = await post('/api/curation/create', {
    gid: G, kind: 'ds', events: payload, source: { from: 'harness bank' },
  });
  say('note', '  added ' + res.added + ', labelled ' + res.labelled
      + ', left alone ' + (res.disagreed || []).length);
  check('it no longer reports importing nothing',
        (res.added + res.labelled) > 0,
        'added ' + res.added + ', labelled ' + res.labelled);
  check('every decision it carried was taken, both spellings',
        res.labelled >= target.length,
        res.labelled + ' of ' + target.length + ' expected');
  const set1 = await get('/api/curation/' + G + '/ds');
  const now = ((set1.set || set1).events) || [];
  const stillBlank = now.filter((e) => !e.label).length;
  say('note', '  undecided before ' + blank.length + ', after ' + stillBlank);
  check('the set really has fewer undecided candidates now',
        stillBlank < blank.length, stillBlank + ' left');
  /* And each one has to say who decided it and when, or it loses every
     disagreement it is ever in on a handoff merge. */
  const touched = now.filter((e) => target.some((t) => t.start === e.start));
  check('each imported decision is stamped with who and when',
        touched.length > 0 && touched.every((e) => e.by && e.at),
        JSON.stringify(touched.slice(0, 2)));
  check('and carries a review row, so agreement can ever be true',
        touched.every((e) => (e.reviews || []).length >= 1),
        JSON.stringify((touched[0] || {}).reviews));

  await post('/api/curation/close-all', {});

  if (errs.length) { head('Errors thrown'); errs.forEach((m) => say('bad', m)); }
  else say('note', '\nno uncaught errors');
  head(bad ? bad + ' FAILED' : 'all checks passed');
  document.title = (bad ? bad + ' FAILED — ' : 'ok — ') + 'curation workbench';
} catch (e) {
  say('bad', 'harness threw: ' + (e && e.message));
  document.title = 'harness threw';
} })();
</script>

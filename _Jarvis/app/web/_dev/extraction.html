    await until(() => !D().querySelector('#erc-across'), 3000, 'closed');
    const c_st1 = W.erRoom.state();
    ok('and the room on show is left exactly as it c_was', c_st1.version === c_was.v && c_st1.scale === c_was.scale
       && JSON.stringify(c_st1.flips) === c_was.flips);

    head('THE NEW ROUND: FITTED HERE, BANDS BY HAND, AMBER UNTIL CALLED, THE IMPRESSION');
    IDX.folders.push({ id: 'xm-hd', name: 'Harness Halo', bundles: 0, in_room: null, new: 0,
                       read_here: 2, members: 2, events: 240 });
    await W.erRoom._poll();
    await until(() => !!D().querySelector('.er-take-direct'), 4000, 'the take-in button');
    ok('a folder with no X-ray results, read here, can be taken in, and says how',
       /^Take in ‘Harness Halo’ · fitted here, no X-ray · 2 of 2 recordings read$/.test(txt('.er-take-direct')),
       txt('.er-take-direct'));
    const nd0 = sent.length;
    D().querySelector('.er-take-direct').click();
    await until(() => sent.slice(nd0).some((x) => x[0] === '/api/extraction/extract'), 3000, 'the extract');
    ok('taking it in asks the server to extract that folder',
       (sent.slice(nd0).find((x) => x[0] === '/api/extraction/extract') || [])[1].folder === 'xm-hd');
    room.versions.push({ v: 5, at: '2026-11-12T14:00:00Z', by: 'Debug_Bot', n: 2, folder: 'Harness Halo', folder_id: 'xm-hd' });
    room.version = 5;
    IDX.folders[IDX.folders.length - 1].in_room = { v: 5, at: '2026-11-12T14:00:00Z', by: 'Debug_Bot' };
    VFOLDER[5] = 'xm-hd';
    await W.erRoom.reload(5);
    await until(() => W.erRoom.state().version === 5 && cards().length === 2, 4000, 'v5');
    ok('it opens fitted here: no X-ray, the Bite line, the filter said',
       /^Fitted here, no X-ray · ‘Harness Halo’/.test(txt('#erSource p')) && /Bite line/.test(txt('#erSource p'))
       && /5-100 Hz/.test(txt('#erSource p')), txt('#erSource p'));
    ok('every card is amber, not called yet, with no automatic call',
       cards().every((c) => c.dataset.state === 'open' && c.classList.contains('st-few')
                            && /not called yet/.test(txt('.sepchip', c)))
       && /Not called yet · 2/.test(txt('#erStateKey')), cards().map((c) => c.dataset.state).join());
    ok('a Bite line placed on the earlier sink picture is said on its card, with who placed it, and not used',
       /^Its Bite line was placed by hand on the earlier sink picture .* \(It was placed by Debug_Bot\.\)$/.test(txt('.er-stale', cards()[1]))
       && !cards()[0].querySelector('.er-stale'), txt('.er-stale', cards()[1]));
    ok('a card can be called separable or not separable straight away',
       !!btn(/^Call it separable$/, cards()[0]) && !!btn(/^Call it not separable$/, cards()[0]));
    const bcv = () => cards()[0].querySelector('canvas.er-band-cv');
    await until(() => inked(bcv()) > 500, 4000, 'the band picture');
    ok('each card draws its average CSD with its band, the automatic one said',
       inked(bcv()) > 500 && /^CSC 4–13 at 0 ms · automatic: the two bottom sinks/.test(txt('.er-band-words', cards()[0])),
       txt('.er-band-words', cards()[0]));
    ok('the split panel says the Bite line is the default', /Bite line, its own line \(the default\)/.test(
       txt('details.er-split summary', cards()[0])), txt('details.er-split summary', cards()[0]));
    const PE = W.PointerEvent;
    const rowY = (cv, row) => 4 + ((row + 0.5) / 16) * (cv.clientHeight - 20);
    const at = (cv, row) => { const b = cv.getBoundingClientRect();
      return { clientX: b.left + 60, clientY: b.top + rowY(cv, row), pointerId: 7, bubbles: true, button: 0, buttons: 1 }; };
    const nb0 = sent.length;
    let cv0 = bcv();
    cv0.dispatchEvent(new PE('pointerdown', at(cv0, 0)));
    cv0.dispatchEvent(new PE('pointermove', at(cv0, 4)));
    cv0.dispatchEvent(new PE('pointermove', at(cv0, 7)));
    cv0.dispatchEvent(new PE('pointerup', at(cv0, 7)));
    await until(() => sent.slice(nb0).some((x) => x[0] === '/api/extraction/band'), 3000, 'the band saved');
    const bs = (sent.slice(nb0).find((x) => x[0] === '/api/extraction/band') || [])[1] || {};
    ok('dragging down the CSD draws a new band, saved for this recording in this set',
       bs.gid === 'harness-c1' && bs.sel_lo === 1 && bs.sel_hi === 8 && bs.version === 5 && !bs.reset, JSON.stringify(bs));
    await until(() => /drawn by hand/.test(txt('.er-band-words', cards()[0])), 3000, 'the card redrawn');
    ok('the card comes back fitted in it, saying so', /^CSC 1–8 at 0 ms · drawn by hand \(Debug_Bot\)$/.test(
       txt('.er-band-words', cards()[0])), txt('.er-band-words', cards()[0]));
    const nb1 = sent.length;
    cv0 = bcv();
    cv0.dispatchEvent(new PE('pointerdown', at(cv0, 10)));
    cv0.dispatchEvent(new PE('pointerup', at(cv0, 10)));
    await until(() => sent.slice(nb1).some((x) => x[0] === '/api/extraction/band'), 3000, 'the centred band');
    const bc2 = (sent.slice(nb1).find((x) => x[0] === '/api/extraction/band') || [])[1] || {};
    ok('a click centres the same band there', bc2.sel_lo === 8 && bc2.sel_hi === 15, JSON.stringify(bc2));
    await until(() => /CSC 8–15/.test(txt('.er-band-words', cards()[0])), 3000, 'the centred card');
    const nb2 = sent.length;
    bcv().dispatchEvent(new W.MouseEvent('dblclick', { bubbles: true }));
    await until(() => sent.slice(nb2).some((x) => x[0] === '/api/extraction/band'), 3000, 'the reset');
    ok('a double-click gives back the automatic band',
       ((sent.slice(nb2).find((x) => x[0] === '/api/extraction/band') || [])[1] || {}).reset === true);
    await until(() => /automatic/.test(txt('.er-band-words', cards()[0])), 3000, 'the automatic card');

    // The recording's length and its rates (2026-11-13).
    {
      const r0 = W.erRoom.state().pay.recordings[0];
      const n1 = (r0.classes.find((c) => c.c === 1) || {}).n, n2 = (r0.classes.find((c) => c.c === 2) || {}).n;
      ok('each card says its recording’s length and its DS1 and DS2 rates',
         txt('.er-rate', cards()[0]) === '30.0 min · DS1 ' + (n1 / 30).toFixed(2) + ' a min · DS2 ' + (n2 / 30).toFixed(2) + ' a min'
         && /^10\.0 min · DS1 /.test(txt('.er-rate', cards()[1])), txt('.er-rate', cards()[0]));
    }
    // Contacts interpolated by hand (2026-11-13).
    ok('each new-round card can interpolate contacts, and says how',
       cards().every((c) => !!c.querySelector('.er-interp-in')
         && /^For bad wires inside the band: .*\(a cubic, so the CSD keeps its shape\)/.test(txt('.er-interp-words', c))),
       txt('.er-interp-words', cards()[0]));
    {
      const n0 = sent.length;
      cards()[0].querySelector('.er-interp-in').value = '8-9';
      btn(/^Interpolate$/, cards()[0]).click();
      await until(() => sent.slice(n0).some((x) => x[0] === '/api/extraction/interp'), 3000, 'the interpolation');
      const ib = (sent.slice(n0).find((x) => x[0] === '/api/extraction/interp') || [])[1] || {};
      await until(() => /^Contacts 8, 9 are interpolated/.test(txt('.er-interp-words', cards()[0])), 3000, 'the card again');
      ok('“8-9” asks for contacts 8 and 9 on this recording, and the card comes back saying so, and by whom',
         JSON.stringify(ib.contacts) === '[8,9]' && ib.gid === 'harness-c1' && ib.version === 5
         && txt('.er-interp-words', cards()[0]) === 'Contacts 8, 9 are interpolated: made again from the two good contacts '
           + 'above and below, in every set · by Debug_Bot.'
         && cards()[0].querySelector('.er-interp-in').value === '8, 9', JSON.stringify(ib) + ' | ' + txt('.er-interp-words', cards()[0]));
      ok('and the card wears a corner banner saying so; the other card has none',
         txt('.er-ipflag', cards()[0]) === 'Interpolated · 8, 9' && cards()[0].classList.contains('has-ip')
         && (() => { const b = cards()[0].querySelector('.er-ipflag').getBoundingClientRect(), c = cards()[0].getBoundingClientRect();
              return Math.abs(b.right - c.right) < 3 && Math.abs(b.top - c.top) < 3; })()
         && !cards()[1].querySelector('.er-ipflag'), txt('.er-ipflag', cards()[0]));
      const alerts = [];
      const was = W.alert;
      W.alert = (m) => alerts.push(m);
      cards()[0].querySelector('.er-interp-in').value = '99';
      btn(/^Interpolate$/, cards()[0]).click();
      await until(() => alerts.length > 0, 3000, 'the refusal');
      W.alert = was;
      ok('a contact the server refuses is said, and the card keeps what it had',
         alerts[0] === 'Not interpolated: Contact 99 is not on this shank (1-16).'
         && /^Contacts 8, 9 are interpolated/.test(txt('.er-interp-words', cards()[0])), alerts.join(' | '));
      const n1 = sent.length;
      btn(/^Put them back$/, cards()[0]).click();
      await until(() => sent.slice(n1).some((x) => x[0] === '/api/extraction/interp')
        && /^For bad wires/.test(txt('.er-interp-words', cards()[0])), 3000, 'put back');
      ok('Put them back asks for none, and the card is as it was',
         JSON.stringify(((sent.slice(n1).find((x) => x[0] === '/api/extraction/interp') || [])[1] || {}).contacts) === '[]'
         && !btn(/^Put them back$/, cards()[0]) && !cards()[0].querySelector('.er-ipflag'));
    }
    // DS3, the trim and the mix-up on the cards (2026-11-13).
    {
      const seg3 = () => D().querySelector('#erEvMode');
      ok('each card says its mix-up three ways, with the pass or fail; the set has one switch for its events',
         /^Mix-upas split8% \(5%–12%\) cleanDS3 out4% \(2%–7%\) cleantrimmed2% \(1%–4%\) clean$/.test(txt('.er-mixbar', cards()[0]))
         && !!cards()[0].querySelector('.er-mixbit.mx-clean.on') && !!seg3()
         && Array.from(seg3().querySelectorAll('button')).map((b) => b.textContent).join('|') === 'as split|with DS3 (hybrid)|unsure trimmed',
         txt('.er-mixbar', cards()[0]));
      const n0 = sent.length;
      btn(/^with DS3 \(hybrid\)$/, seg3()).click();
      await until(() => cards().length === 2 && !!cards()[0].querySelector('.er-ds3say'), 5000, 'DS3 on');
      const mb = (sent.slice(n0).find((x) => x[0] === '/api/extraction/mode') || [])[1] || {};
      ok('DS3 switched on for the set: every card gains a green DS3 class, says how it was found, and cites the paper',
         mb.mode === 'ds3' && mb.folder === 'xm-hd'
         && Array.from(cards()[0].querySelectorAll('.pics .cap b')).map((b) => b.textContent).join() === 'DS1,DS2,DS3 (hybrid)'
         && txt('.er-ds3say', cards()[0]) === 'DS3 (hybrid): 20 of 120 events, 5 from DS1 and 15 from DS2: relative-sink score within '
           + '±0.50, OML at contact 5, MML at 8. 4 unscorable (sink under the baseline’s 99th percentile; DS1 1, DS2 3) keep their '
           + 'split’s class. Tarcsay et al. 2025.'
         && / · DS3 /.test(txt('.er-rate', cards()[0])) && !!D().querySelector('#erCut'),
         JSON.stringify(mb) + ' | ' + txt('.er-ds3say', cards()[0]));
      btn(/^unsure trimmed$/, seg3()).click();
      await until(() => cards().length === 2 && !!cards()[0].querySelector('.er-trimsay'), 5000, 'the trim on');
      ok('the trim instead: the unsure counted and said; DS3 is off (one at a time)',
         txt('.er-trimsay', cards()[0]) === '10 unsure (under 80% for both classes): shown grey, out of DS1’s and DS2’s numbers.'
         && !cards()[0].querySelector('.er-ds3say'), txt('.er-trimsay', cards()[0]));
      btn(/^as split$/, seg3()).click();
      await until(() => cards().length === 2 && !cards()[0].querySelector('.er-trimsay') && MODE_D.mode === 'plain', 5000, 'as split');
    }
    // No DS1 (2026-11-13).
    ok('an uncalled card can be called separable, not separable, or no DS1',
       !!btn(/^Call it separable$/, cards()[1]) && !!btn(/^Call it not separable$/, cards()[1])
       && !!btn(/^Call it no DS1$/, cards()[1]));
    {
      const n0 = sent.length;
      btn(/^Call it no DS1$/, cards()[1]).click();
      await until(() => cards()[1] && cards()[1].dataset.state === 'nods1', 4000, 'no DS1');
      const sb = (sent.slice(n0).find((x) => x[0] === '/api/extraction/sep') || [])[1] || {};
      const c1 = cards()[1];
      ok('called no DS1: saved for this recording in this set, and the card comes back all DS2, in DS2’s colour',
         sb.verdict === 'no_ds1' && sb.gid === 'harness-p1' && sb.folder === 'xm-hd'
         && c1.classList.contains('st-nods1') && /^No DS1: every event is DS2/.test(txt('.state-tag', c1))
         && /^no DS1 · by hand$/.test(txt('.sepchip', c1))
         && Array.from(c1.querySelectorAll('.pics .cap b')).map((b) => b.textContent).join() === 'DS2'
         && /^10\.0 min · DS1 0\.00 a min · DS2 12\.00 a min$/.test(txt('.er-rate', c1)),
         [sb.verdict, c1.className, txt('.state-tag', c1), txt('.sepchip', c1), txt('.er-rate', c1)].join(' | '));
      ok('the key counts it apart; and from there it can be called separable, not separable, or uncalled again',
         /No DS1 · 1/.test(txt('#erStateKey')) && !!btn(/^Call it separable$/, c1) && !!btn(/^Call it not separable$/, c1)
         && !!btn(/^Not called yet$/, c1) && !btn(/^Call it no DS1$/, c1), txt('#erStateKey'));
      btn(/^Not called yet$/, cards()[1]).click();
      await until(() => cards()[1] && cards()[1].dataset.state === 'open', 4000, 'uncalled again');
      ok('uncalled again, its two classes come back', cards()[1].querySelectorAll('.pics .cap b').length === 2);
    }
    W.__pr = W.prompt;
    W.prompt = () => 'harness impression';
    const ni = sent.length;
    btn(/^Take the impression$/).click();
    await until(() => sent.slice(ni).some((x) => x[0] === '/api/extraction/impression'), 3000, 'the impression');
    W.prompt = W.__pr;
    const im = (sent.slice(ni).find((x) => x[0] === '/api/extraction/impression') || [])[1] || {};
    ok('Take the impression locks this version in, with the note', im.artifact_id === 'erH' && im.version === 5
       && im.note === 'harness impression', JSON.stringify(im));
    await until(() => /^Impression v2 taken: 2 recordings locked in, 2 of them not called yet/.test(txt('.er-note')),
                3000, 'its words');
    ok('and says what it locked in', /^Impression v2 taken: 2 recordings locked in, 2 of them not called yet/.test(
       txt('.er-note')), txt('.er-note'));

    head('BLOB ANALYSIS, CAST FROM THE IMPRESSION');
    await until(() => W.erRoom.state().sub === 'blobs' && D().querySelectorAll('#erbRecs .erb-rec').length === 8,
                6000, 'the blob tab');
    ok('the impression opens Blob Analysis: its recordings measured, once',
       sent.filter((x) => x[0] === '/api/extraction/blobs').length === 1
       && ((sent.find((x) => x[0] === '/api/extraction/blobs') || [])[1] || {}).artifact_id === 'imH'
       && D().querySelectorAll('#erbRecs .erb-rec').length === 8);
    ok('the filter note is always there', /might be worth redoing with other filters/.test(txt('#erbFilter')),
       txt('#erbFilter'));
    ok('who was left out is said, with why', /PTEN x9 s2 \(harness\)/.test(txt('#erbLeft'))
       && /not called yet/.test(txt('#erbLeft')), txt('#erbLeft'));
    await until(() => sent.some((x) => x[0] === '/api/extraction/blobs/compare'), 4000, 'the first comparison');
    const bc0 = (sent.find((x) => x[0] === '/api/extraction/blobs/compare') || [])[1] || {};
    ok('first, peak sink of the top blob, every DS, CTL against PTEN',
       bc0.measure === 'peak' && bc0.blob === 'top' && bc0.cls === 'all' && bc0.by === 'group', JSON.stringify(bc0));
    await until(() => D().querySelectorAll('#erbAll tr.erb-row').length === 18, 5000, 'the averages table');
    ok('the averages table: every measure of both blobs, a finding marked, a lead kept a lead',
       D().querySelectorAll('#erbAll tr.erb-row').length === 18
       && !!D().querySelector('#erbAll tr.erb-row.erb-find[data-measure="fwhm_ms"][data-blob="top"]')
       && !!D().querySelector('#erbAll tr.erb-row.erb-lead[data-measure="peak"][data-blob="bottom"]')
       && !D().querySelector('#erbAll tr.erb-row.erb-find[data-measure="peak"][data-blob="bottom"]')
       && /a lead, not a finding/.test(txt('#erbAll')));
    ok('and how many tests were corrected together', /18/.test(txt('#erbFamily')), txt('#erbFamily'));
    await until(() => Array.from(D().querySelectorAll('#erBlobs canvas')).filter((c) => inked(c) > 100).length >= 6,
                5000, 'the pictures');
    ok('the curves, histograms, ECDFs and shift function are drawn',
       Array.from(D().querySelectorAll('#erBlobs canvas')).filter((c) => inked(c) > 100).length >= 6);
    // The measure on each card (2026-11-13: picking a measure "isn't
    // changing" the cards under it).
    {
      const card0 = () => D().querySelector('#erbRecs .erb-rec');
      const hash = (cv) => { const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
        let h = 0; for (let i = 0; i < d.length; i += 31) h = (h * 33 + d[i]) % 1000003; return h; };
      ok('each card says the measure picked, and marks its row',
         /^Peak sink \(CSD\): DS1, top blob \S+ \[.*\] · DS2, top blob \S/.test(txt('.erb-mline', card0()))
         && !!card0().querySelector('table.erb-mt tr.erb-cur[data-m="peak"]')
         && card0().querySelectorAll('table.erb-mt tr.erb-cur').length === 1, txt('.erb-mline', card0()));
      const cv0 = card0().querySelector('canvas.erb-rc');
      const h0 = hash(cv0);
      const sel = D().querySelector('#erbMeasure');
      sel.value = 'fwhm_ms';
      sel.dispatchEvent(new W.Event('change', { bubbles: true }));
      await until(() => /^How long the sink lasts \(ms\): DS1, top blob \S/.test(txt('.erb-mline', card0())), 3000, 'the cards');
      await sleep(250);
      ok('another measure picked: every card says it, its row is marked, its curve marks it -- in place, not built again',
         Array.from(D().querySelectorAll('#erbRecs .erb-rec:not(.erb-off) .erb-mline')).every((p) => /^How long the sink lasts \(ms\): /.test(p.textContent))
         && !!card0().querySelector('table.erb-mt tr.erb-cur[data-m="fwhm_ms"]')
         && card0().querySelectorAll('table.erb-mt tr.erb-cur').length === 1
         && card0().querySelector('canvas.erb-rc') === cv0 && hash(cv0) !== h0,
         txt('.erb-mline', card0()));
      sel.value = 'peak';
      sel.dispatchEvent(new W.Event('change', { bubbles: true }));
      await until(() => /^Peak sink/.test(txt('.erb-mline', card0())), 3000, 'back to peak');
    }
    const nb = sent.length;
    btn(/^DS1$/, D().querySelector('#erbCls')).click();
    await until(() => sent.slice(nb).some((x) => x[0] === '/api/extraction/blobs/compare'), 4000, 'DS1');
    ok('DS1 asks for the separable recordings’ own DS1, and the not separable cards step back',
       ((sent.slice(nb).find((x) => x[0] === '/api/extraction/blobs/compare') || [])[1] || {}).cls === 1
       && D().querySelectorAll('#erbRecs .erb-rec.erb-off').length === 3);
    ok('and still only one measuring of the set', sent.filter((x) => x[0] === '/api/extraction/blobs').length === 1);
    if (W.erRoom.state().sub !== 'recordings') await goSub('recordings');
    const na = sent.length;
    btn(/^Archive this set$/).click();
    await until(() => sent.slice(na).some((x) => x[0] === '/api/extraction/set_archive'), 3000, 'the archive');
    ok('a set can be archived', ((sent.slice(na).find((x) => x[0] === '/api/extraction/set_archive') || [])[1] || {})
       .folder === 'xm-hd');
    ok('nothing went anywhere but the stub', sent.every((x) => /^\/api\/extraction/.test(x[0])));
  } catch (err) {
    fail++;
    say('  FAIL the suite threw and stopped here', 'bad');
    say('       ' + (err && err.message) + ' | ' + String((err && err.stack) || '').split('\n').slice(0, 3).join(' | '), 'bad');
  }
  say('');
  say('  ' + pass + ' ok, ' + fail + ' fail', fail ? 'bad' : 'ok');
  document.title = 'extraction: ' + pass + ' ok, ' + fail + ' fail';
  try { frame.src = 'about:blank'; } catch (e) { /* ok */ }
})();
</script></body></html>

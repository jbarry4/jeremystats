<body><pre id="log"></pre><iframe id="app" src="/extraction.html?harness=1&theme=light"></iframe>
<script>
/* The Extraction Room's page (2026-11-10): web/extraction.html.

   ON FIXTURES. The page is started with a fetch of our own
   (erRoom.start(fetch)), so every /api/extraction* answer is made here from
   two synthetic recordings -- a control and a PTEN mouse -- and the page is
   checked against known numbers:
     - one tab, Dentate Spike;
     - what was extracted, from where, its version, and Extract again;
     - a card per recording: its %KO chip (0% for the control), its
       separation, a CSD per class and the depth profile, drawn;
     - "mean sink" says each class's sink and its delta, "mean source" its
       source -- in the words under each card and in the numbers table;
     - the pictures switch: CSD and depth profile, CSD only, profiles only;
     - Extract again sends the room and the folder; correcting a %KO sends
       the mouse and the number;
     - five sub-tabs: Recordings, Round I, Separation rate, Round II, The
       numbers -- each shows its own, and a dot on a chart takes you to its
       recording;
     - Separation rate: each group's rate with its 95% interval, Fisher,
       Freeman-Halton, the Cochran-Armitage trend, the logistic odds per 10%
       KO, and a call changed from its table;
     - Round II: asked for with the version and the Low KO line, ranked by
       p, each with its q, a finding and a lead told apart;
     - each card's state at a glance: a wash and a tag for separable, not
       separable, too few, and gray for left out of the stats, with a key
       that counts them, and the same wash on the tables' rows;
     - the usual tests by default (one test, picked by the residuals;
       Boschloo for a rate; nothing gated on q), the strict a press away;
     - a set per X-ray Many folder, each with its own versions and its own
       calls (sent with the folder); a folder not in the room yet, and one
       with newer X-ray results, say so; a new extraction made elsewhere is
       opened, whether the room asks again or the ToolKit tells it;
     - against %KO is the dose, among the PTEN mice alone, with the
       controls-at-0% number beside it and named for what it measures; three
       groups ask the trend in order first; who is left out is said.
   IT WRITES NOTHING: every POST is answered here. */
const L = document.getElementById('log');
let pass = 0, fail = 0;
const say = (s, cls) => { const n = document.createElement('span'); if (cls) n.className = cls;
  n.textContent = s + '\n'; L.appendChild(n); L.scrollTop = L.scrollHeight; };
const head = (s) => { say(''); say(s, 'hd'); say('-'.repeat(60), 'dim'); };
const ok = (name, good, why) => { if (good) { pass++; say('  ok   ' + name, 'ok'); }
  else { fail++; say('  FAIL ' + name + (why ? '\n       ' + why : ''), 'bad'); } };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms, what) { const t0 = Date.now();
  while (Date.now() - t0 < (ms || 8000)) { try { if (await fn()) return true; } catch (e) { /* not yet */ } await sleep(80); }
  say('       timed out waiting for ' + (what || 'something'), 'dim'); return false; }

/* ---------- fixtures ---------- */
const NC = 16, NT = 21;
const contacts = Array.from({ length: NC }, (_, i) => i + 1);
const t_ms = Array.from({ length: NT }, (_, j) => -50 + j * 5);
function csdOf(sinkRow, srcRow, gain) {
  return contacts.map((c, i) => t_ms.map((t) => {
    const w = Math.exp(-(t * t) / 200);
    return +(gain * w * (Math.exp(-((i - srcRow) ** 2) / 2) - 1.2 * Math.exp(-((i - sinkRow) ** 2) / 2))).toFixed(4);
  }));
}
function profOf(sinkRow, srcRow, gain) {
  return { contacts, band: [3, 14],
           mean: contacts.map((c, i) => +(gain * (Math.exp(-((i - srcRow) ** 2) / 2) - 1.2 * Math.exp(-((i - sinkRow) ** 2) / 2))).toFixed(4)),
           sem: contacts.map(() => 0.01) };
}
function rec(gid, label, group, mk, ko, verdict, k) {
  k = k || 1;
  return { gid, session_label: label, mouse_key: mk, group, ko_pct: ko, ko_said: ko == null ? 'not on the sheet' : 'sheet',
    ied: group === 'PTEN' ? true : null, n: 120, counts: { 1: 50, 2: 70 },
    separation: { verdict, dbic: 42.5, min_share: 0.4167, n: 120 },
    box: { sel_lo: 3, sel_hi: 14, t_lo_ms: 0, t_hi_ms: 0, auto: false },
    contacts, t_ms, spacing_um: 50, unit: 'µA/mm² (CSD, 5–100 Hz)', bad: [],
    classes: [
      { c: 1, name: 'DS1', n: 50, csd: csdOf(6, 9, 0.4 * k), profile: profOf(6, 9, 0.4 * k),
        sink: { csc: 7, value: -0.48, sem: 0.02, unit: 'µA/mm²' },
        delta: { contacts: 6.5, sem: 0.3, um: 325, um_sem: 15, n: 50 }, source: { csc: 10, value: 0.4, sem: 0.01 } },
      { c: 2, name: 'DS2', n: 70, csd: csdOf(11, 8, 0.6 * k), profile: profOf(11, 8, 0.6 * k),
        sink: { csc: 12, value: -0.72, sem: 0.03, unit: 'µA/mm²' },
        delta: { contacts: 8.25, sem: 0.2, um: 412.5, um_sem: 10, n: 70 }, source: { csc: 9, value: 0.6, sem: 0.02 } },
    ] };
}
const PAY = { schema: 'extraction.ds/1', room: 'dentate_spike', room_name: 'Dentate Spike',
  source: { folder: 'xm-h5', folder_name: 'Harness 5%', workflow: { artifact_id: 'wH', version: 2, nickname: 'Harness DS 5%' } },
  ko_from: 'JB % hits (harness)',
  recordings: [rec('harness-c1', 'PTEN m2 s3 (harness)', 'CTL', 'PTEN|m2', 0, 'yes'),
               rec('harness-p1', 'PTEN m7 s2 (harness)', 'PTEN', 'PTEN|m7', 24.12, 'no', 2)],
  left_out: [] };
const IDX = { ok: true, ko: { 'PTEN|m7': 24.12 },
  rooms: [{ room: 'dentate_spike', name: 'Dentate Spike', artifact_id: 'erH', version: 2,
            versions: [{ v: 1, at: '2026-11-10T12:00:00Z', by: 'Debug_Bot', n: 2, folder: 'Harness 5%', folder_id: 'xm-h5' },
                       { v: 2, at: '2026-11-10T13:00:00Z', by: 'Debug_Bot', n: 2, folder: 'Harness 5%', folder_id: 'xm-h5' }] }],
  folders: [{ id: 'xm-h5', name: 'Harness 5%', bundles: 2, in_room: { v: 2, at: '2026-11-10T13:00:00Z', by: 'Debug_Bot' }, new: 0 },
            { id: 'xm-h10', name: 'Harness 10%', bundles: 0, in_room: null, new: 0 },
            { id: 'xm-h7', name: 'Harness 7%', bundles: 2, in_room: null, new: 2 }] };
// Which set each version of the room was extracted from.
const VFOLDER = { 1: 'xm-h5', 2: 'xm-h5', 3: 'xm-h5', 4: 'xm-h7' };
const FNAME = { 'xm-h5': 'Harness 5%', 'xm-h7': 'Harness 7%' };
const MET = (key, name, unit, ctlv, ptenv) => ({ key, name, unit, words: name + ' (harness).',
  values: [{ gid: 'harness-c1', label: 'c1', group: 'CTL', ko: 0, ko_group: 'CTL', value: ctlv },
           { gid: 'harness-p1', label: 'p1', group: 'PTEN', ko: 24.12, ko_group: 'High KO', value: ptenv }],
  two: { ctl: { n: 9, mean: ctlv, sem: 0.01 }, pten: { n: 9, mean: ptenv, sem: 0.01 }, welch_p: 0.012, mwu_p: 0.03, g: 1.21, why: null },
  three: { CTL: { n: 9, mean: ctlv }, 'Low KO': { n: 3, mean: ptenv }, 'High KO': { n: 6, mean: ptenv },
           anova_p: 0.2, kw_p: 0.3, why: null, pairs: [{ a: 'CTL', b: 'Low KO', holm_p: 0.4 }, { a: 'CTL', b: 'High KO', holm_p: 0.5 }, { a: 'Low KO', b: 'High KO', holm_p: 1 }] },
  spearman: { rho: -0.45, p: 0.01, n: 18 },
  dose: { rho: -0.2, p: 0.6, n: 9, fit: { slope: -0.001, intercept: ptenv, ko: [3.89, 28.43] } },
  usual: { two: { test: 'welch', p: 0.012, normal_p: 0.4 },
           three: { test: 'kw', p: 0.3, normal_p: 0.01, post: 'dunn', jt_p: 0.02, jt_z: -2.3,
                    pairs: [{ a: 'CTL', b: 'Low KO', p: 0.6 }, { a: 'CTL', b: 'High KO', p: 0.04 }, { a: 'Low KO', b: 'High KO', p: 1 }] } } });
const STATS = { ok: true, split: 10, min_n: 5, n: 18, skipped: [],
  groups: { CTL: 9, PTEN: 9, 'Low KO': 3, 'High KO': 6, 'no KO': [] },
  metrics: [MET('ds1_sink', 'DS1 sink strength', 'csd', 0.34, 0.30), MET('ds1_delta', 'DS1 delta', 'um', 968, 1082)],
  only_sep: false,
  separability: {
    two: { CTL: { n: 8, yes: 6, rate: 0.75, ci: [0.41, 0.93] }, PTEN: { n: 9, yes: 5, rate: 0.556, ci: [0.27, 0.81] }, fisher_p: 0.62, boschloo_p: 0.48 },
    three: { CTL: { n: 8, yes: 6, rate: 0.75, ci: [0.41, 0.93] }, 'Low KO': { n: 3, yes: 1, rate: 0.333, ci: [0.06, 0.79] },
             'High KO': { n: 6, yes: 4, rate: 0.667, ci: [0.3, 0.9] }, exact_p: 0.66, trend_p: 0.32, trend_z: -1.0,
             pairs: [{ a: 'CTL', b: 'Low KO', holm_p: 0.9, boschloo_holm_p: 0.8 }, { a: 'CTL', b: 'High KO', holm_p: 1, boschloo_holm_p: 0.7 },
                     { a: 'Low KO', b: 'High KO', holm_p: 1, boschloo_holm_p: 1 }] },
    ko: { yes: { n: 11, median: 0 }, no: { n: 6, median: 4.8 }, mwu_p: 0.5, logit: { or10: 0.743, p: 0.5, n: 17 },
          logit_pten: { or10: 1.1, p: 0.8, n: 9 } },
    not_counted: ['PTEN m51 s1 (harness)'], by_hand: [],
    values: [{ gid: 'harness-c1', label: 'c1', group: 'CTL', ko: 0, ko_group: 'CTL', sep: true, verdict: 'yes', by_hand: false },
             { gid: 'harness-p1', label: 'p1', group: 'PTEN', ko: 24.12, ko_group: 'High KO', sep: false, verdict: 'no', by_hand: false }] } };
const MET2 = (key, name, unit, ctlv, ptenv, p2, p3, pk, q, u2, qu) => Object.assign(MET(key, name, unit, ctlv, ptenv), {
  usual: { two: { test: u2[0], p: u2[1], normal_p: u2[0] === 'welch' ? 0.5 : 0.01 },
           three: { test: 'anova', p: p3, normal_p: 0.3, post: 'tukey', pairs: [] } },
  q_usual: qu,
  two: { ctl: { n: 9, mean: ctlv, sem: 0.01 }, pten: { n: 9, mean: ptenv, sem: 0.01 }, welch_p: p2, mwu_p: p2, g: -1.1, why: null },
  three: { CTL: { n: 9, mean: ctlv }, 'Low KO': { n: 3, mean: ptenv }, 'High KO': { n: 6, mean: ptenv }, anova_p: p3, kw_p: p3, why: null, pairs: [] },
  spearman: { rho: -0.62, p: pk, n: 18 }, dose: { rho: -0.7, p: pk, n: 9, fit: null }, q });
const R2 = { ok: true, n: 18, split: 10, groups: { CTL: 9, 'Low KO': 3, 'High KO': 6, PTEN: 9 },
  metrics: [MET2('events_min', 'Events per minute', '/min', 1.9, 2.1, 0.3, 0.5, 0.4, { two: 0.5, three: 0.6, ko: 0.6 },
                 ['welch', 0.02], { two: 0.03, three: 0.6, ko: 0.6 }),
            MET2('ds_like', 'Share that look like control DS', 'share', 0.9, 0.82, 0.01, 0.03, 0.006, { two: 0.04, three: 0.15, ko: 0.066 },
                 ['mwu', 0.01], { two: 0.03, three: 0.15, ko: 0.066 }),
            MET2('ds_amp', 'DS amplitude', 'uV', 900, 1010, 0.04, 0.2, 0.2, { two: 0.2, three: 0.4, ko: 0.4 },
                 ['welch', 0.3], { two: 0.3, three: 0.4, ko: 0.4 })] };
const sent = [];
function stubFetch(u, o) {
  const s = String(u), p = s.split('?')[0];
  const body = o && o.body ? JSON.parse(o.body) : null;
  const json = (x, st) => Promise.resolve(new Response(JSON.stringify(x), { status: st || 200, headers: { 'Content-Type': 'application/json' } }));
  sent.push([p, body, s]);
  if (p === '/api/extraction') return json(IDX);
  if (p === '/api/extraction/extract') return json({ ok: true, artifact_id: 'erH', version: 3, n: 2, left: [] });
  if (p === '/api/extraction/ko') return json({ ok: true, ko: { 'PTEN|m7': body.pct } });
  if (p === '/api/extraction/flip') return json({ ok: true, flips: body.flip ? { [body.gid]: { flip: true, by: 'Debug_Bot', at: '2026-11-10T14:00:00Z' } } : {} });
  if (p === '/api/extraction/stats') return json(STATS);
  if (p === '/api/extraction/round2') return json(R2);
  if (p === '/api/extraction/sep') return json({ ok: true, seps: body.verdict ? { [body.gid]: { verdict: body.verdict, by: 'Debug_Bot', at: '2026-11-10T15:00:00Z' } } : {} });
  if (p === '/api/extraction/erH') {
    const v = Number(new URLSearchParams(s.split('?')[1]).get('version')) || 2;
    const pay = JSON.parse(JSON.stringify(PAY));
    pay.source.folder = VFOLDER[v];
    pay.source.folder_name = FNAME[VFOLDER[v]];
    return json({ ok: true, payload: pay, version: v });
  }
  return json({ ok: false, error: 'harness: no such route ' + p }, 404);
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const W = frame.contentWindow, D = () => frame.contentDocument;
  await until(() => !!W.erRoom, 8000, 'the page');
  const txt = (sel, root) => ((root || D()).querySelector(sel) || {}).textContent || '';
  const cards = () => Array.from(D().querySelectorAll('#erGrid .rec'));
  const inked = (cv) => { if (!cv || !cv.width) return 0; const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 0) n++; return n; };
  const btn = (re, root) => Array.from((root || D()).querySelectorAll('button')).find((b) => re.test(b.textContent.trim()));
  const goSub = async (id) => { D().querySelector('#erSubs button[data-sub="' + id + '"]').click();
    await until(() => W.erRoom.state().sub === id && !!D().querySelector('#erSubs button[data-sub="' + id + '"][aria-selected="true"]'),
                3000, 'the ' + id + ' tab'); };
  try {
    await W.erRoom.start(stubFetch);
    await until(() => cards().length === 2, 8000, 'the cards');

    head('THE ROOM, AND WHAT IS IN IT');
    ok('one tab, Dentate Spike, chosen', Array.from(D().querySelectorAll('#erTabs button')).map((b) => b.textContent).join('|') === 'Dentate Spike'
       && D().querySelector('#erTabs button').getAttribute('aria-selected') === 'true');
    ok('it says where it was extracted from', /Extracted from X-ray Many · ‘Harness 5%’/.test(txt('#erBody .card'))
       && /events inside ‘Harness DS 5%’ v2/.test(txt('#erBody .card')), txt('#erBody .card').slice(0, 200));
    ok('the version on show is the newest, with the others offered', D().querySelector('#erVersion').value === '2'
       && D().querySelectorAll('#erVersion option').length === 2);
    ok('a card per recording, the control first', cards().map((c) => c.dataset.gid).join(',') === 'harness-c1,harness-p1');
    ok('the sets: the one extracted, chosen; a folder with nothing run is not offered',
       Array.from(D().querySelectorAll('#erSets button')).map((b) => b.textContent).join('|') === 'Harness 5% · v2'
       && D().querySelector('#erSets button').getAttribute('aria-pressed') === 'true'
       && !/Harness 10%/.test(txt('#erSource')), txt('#erSets'));
    ok('a folder run in X-ray Many but not in the room yet says so, with its press',
       !!btn(/^Extract ‘Harness 7%’ · 2 X-ray results, not in the room yet$/, D().querySelector('#erSource')));

    head('SUB-TABS');
    const subs = () => Array.from(D().querySelectorAll('#erSubs button'));
    ok('five sub-tabs, Recordings chosen', subs().map((b) => b.textContent).join('|')
       === 'Recordings|Round I · does it differ?|Separation rate|Round II|The numbers'
       && subs()[0].getAttribute('aria-selected') === 'true', subs().map((b) => b.textContent).join('|'));
    ok('Recordings shows the cards, and none of the stats or the table', cards().length === 2
       && !D().querySelector('#erStatsCard') && !D().querySelector('#erTable') && !D().querySelector('#erRound2'));

    head('%KO, BESIDE EACH ONE');
    const ko = (i) => cards()[i].querySelector('.chip.ko');
    ok('the control says 0% KO', ko(0) && ko(0).textContent === '0% KO' && ko(0).classList.contains('ctl'), ko(0) && ko(0).textContent);
    ok('the PTEN mouse its own %KO', ko(1) && ko(1).textContent === '24.12% KO', ko(1) && ko(1).textContent);
    ok('and its separation, said in words', /not separable/.test(txt('.chip.no', cards()[1])) && /separable/.test(txt('.chip.yes', cards()[0])));

    head('EACH CARD’S STATE, AT A GLANCE');
    const wash = (c) => W.getComputedStyle(c).backgroundImage;
    ok('a separable card: washed, and it says so on top', cards()[0].classList.contains('st-yes')
       && txt('.state-tag', cards()[0]) === 'Separable' && /gradient/.test(wash(cards()[0])), txt('.state-tag', cards()[0]));
    ok('a not separable one: a different wash, and it says so', cards()[1].classList.contains('st-no')
       && txt('.state-tag', cards()[1]) === 'Not separable' && wash(cards()[1]) !== wash(cards()[0]), wash(cards()[1]));
    ok('a key that counts them', /Separable · 1/.test(txt('#erStateKey')) && /Not separable · 1/.test(txt('#erStateKey'))
       && /Too few to call · 0/.test(txt('#erStateKey')) && /Left out of the stats · 0/.test(txt('#erStateKey')), txt('#erStateKey'));
    const ns0 = sent.length;
    btn(/^Leave out of the stats$/, cards()[0]).click();
    await until(() => cards()[0] && cards()[0].classList.contains('st-out'), 3000, 'left out');
    ok('left out of the stats: gray, said, counted, and the stats asked again without it',
       txt('.state-tag', cards()[0]) === 'Left out of the stats' && wash(cards()[0]) !== wash(cards()[1])
       && /Left out of the stats · 1/.test(txt('#erStateKey'))
       && (sent.slice(ns0).find((x) => x[0] === '/api/extraction/stats') || [])[1].skip.join() === 'harness-c1',
       txt('.state-tag', cards()[0]));
    await goSub('stats');
    await until(() => !!W.erRoom.state().stats, 6000, 'the stats');
    ok('and the stats tabs say who is left out', /^Left out of these stats: PTEN m2 s3 \(harness\)\. Every number here is without it; put them back on the Recordings tab\.$/
       .test(txt('#erStatsCard .er-left')), txt('#erStatsCard .er-left'));
    await goSub('recordings');
    btn(/^Put back in the stats$/, cards()[0]).click();
    await until(() => cards()[0] && cards()[0].classList.contains('st-yes'), 3000, 'put back');
    ok('and put back: separable again', txt('.state-tag', cards()[0]) === 'Separable' && /Left out of the stats · 0/.test(txt('#erStateKey')));

    head('THE PICTURES, DRAWN');
    await until(() => cards().every((c) => Array.from(c.querySelectorAll('canvas')).every((cv) => inked(cv) > 200)), 6000, 'the pictures');
    ok('each card: a CSD per class and the depth profile, drawn',
       cards().every((c) => c.querySelectorAll('canvas.csd').length === 2 && c.querySelectorAll('canvas.prof').length === 1
         && Array.from(c.querySelectorAll('canvas')).every((cv) => inked(cv) > 200)),
       cards().map((c) => Array.from(c.querySelectorAll('canvas')).map(inked).join('/')).join(' '));

    head('MEAN SINK, WITH ITS DELTA; MEAN SOURCE');
    const vals = (i) => txt('.vals', cards()[i]);
    ok('mean sink says each class’s sink and its delta, in contacts and µm',
       /DS1sink -0\.480 ± 0\.020 at CSC7 · Δ 6\.5 ± 0\.3 contacts \(325 ± 15 µm\)/.test(vals(0))
       && /DS2sink -0\.720 ± 0\.030 at CSC12 · Δ 8\.3 ± 0\.2 contacts \(413 ± 10 µm\)/.test(vals(0)), vals(0));
    await goSub('numbers');
    ok('The numbers: the table has the sinks and the deltas, and no cards',
       /DS1 sink.*DS2 sink.*DS1 Δ contacts/.test(txt('#erTable thead')) && !cards().length, txt('#erTable thead'));
    await goSub('recordings');
    const csdSink = inked(cards()[0].querySelector('canvas.csd'));
    btn(/^mean source$/, D().querySelector('#erMode')).click();
    await until(() => /source/.test(vals(0)), 4000, 'the source words');
    ok('mean source says each class’s source, and no delta',
       /DS1source \+0\.400 ± 0\.010 at CSC10/.test(vals(0)) && !/Δ/.test(vals(0)), vals(0));
    await goSub('numbers');
    ok('and the table swaps to the sources, its own switch pressed there too', /DS1 source.*DS2 source/.test(txt('#erTable thead'))
       && !/Δ/.test(txt('#erTable thead'))
       && btn(/^mean source$/, D().querySelector('#erModeN')).getAttribute('aria-pressed') === 'true');
    await goSub('recordings');
    await until(() => inked(cards()[0].querySelector('canvas.csd')) > 200, 4000, 'redrawn');
    ok('the switch is pressed where it says', btn(/^mean source$/, D().querySelector('#erMode')).getAttribute('aria-pressed') === 'true');
    btn(/^mean sink$/, D().querySelector('#erMode')).click();
    await until(() => /Δ/.test(vals(0)), 4000, 'back to sinks');

    head('THE PICTURES SWITCH');
    btn(/^CSD view$/, D().querySelector('#erShow')).click();
    await until(() => !cards()[0].querySelector('canvas.prof'), 3000, 'CSD only');
    ok('CSD view: the CSDs, no profile', cards().every((c) => c.querySelectorAll('canvas.csd').length === 2 && !c.querySelector('canvas.prof')));
    btn(/^depth profiles$/, D().querySelector('#erShow')).click();
    await until(() => !cards()[0].querySelector('canvas.csd'), 3000, 'profiles only');
    ok('depth profiles: the profile, no CSDs', cards().every((c) => !c.querySelector('canvas.csd') && !!c.querySelector('canvas.prof')));
    btn(/^CSD and depth profile$/, D().querySelector('#erShow')).click();
    await until(() => !!cards()[0].querySelector('canvas.csd') && !!cards()[0].querySelector('canvas.prof'), 3000, 'both');

    head('ONE SCALE FOR EVERY RECORDING');
    const r0 = W.erRoom._range('harness-c1'), r1 = W.erRoom._range('harness-p1');
    ok('by default every depth profile shares one x axis, and every CSD one colour scale',
       JSON.stringify(r0.x) === JSON.stringify(r1.x) && r0.clim === r1.clim, JSON.stringify([r0, r1]));
    btn(/^each its own$/, D().querySelector('#erScale')).click();

    setb()[0].click();
    await until(() => W.erRoom.state().folder === 'xm-h5' && cards().length === 2, 4000, 'back to 5%');
    ok('the other set opens at its newest, with its versions', sent.slice(n6).some((x) => /\/api\/extraction\/erH\?version=3/.test(x[2]))
       && Array.from(D().querySelectorAll('#erVersion option')).map((o) => o.value).join() === '3,2,1');
    IDX.folders[0].new = 1;
    await W.erRoom._poll();
    await until(() => !!D().querySelector('#erNew'), 3000, 'the notice');
    ok('newer X-ray results than this set’s version say so, with the press that takes them',
       /^1 X-ray result in ‘Harness 5%’ is newer than this set’s v3\. Extract them$/.test(txt('#erNew')) && !!btn(/^Extract them$/, D().querySelector('#erNew')),
       txt('#erNew'));
    IDX.folders[0].new = 0;
    const bc = new BroadcastChannel('barry-extraction');
    bc.postMessage({ type: 'extracted', room: 'dentate_spike', version: 4, folder: 'xm-h7', folder_name: 'Harness 7%' });
    await until(() => W.erRoom.state().version === 4, 4000, 'the word from the ToolKit');
    ok('told by the ToolKit, the room opens what it just extracted', W.erRoom.state().folder === 'xm-h7'
       && /^Opened v4, just extracted from ‘Harness 7%’\.$/.test(txt('.er-note')), txt('.er-note'));
    bc.close();
    ok('nothing went anywhere but the stub', sent.every((x) => /^\/api\/extraction/.test(x[0])));
  } catch (err) {
    fail++;
    say('  FAIL the suite threw and stopped here', 'bad');
    say('       ' + (err && err.message) + ' | ' + String((err && err.stack) || '').split('\n').slice(0, 3).join(' | '), 'bad');
  }
  say('');
  say('  ' + pass + ' ok, ' + fail + ' fail', fail ? 'bad' : 'ok');
  document.title = 'extraction: ' + pass + ' ok, ' + fail + ' fail';
  try { frame.src = 'about:blank'; } catch (e) { /* ok */ }
})();
</script></body></html>

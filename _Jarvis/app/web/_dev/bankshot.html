<!doctype html><meta charset="utf-8"><title>bank dialog</title>
<iframe id="app" src="/" style="position:fixed;inset:0;width:100vw;height:100vh;border:0"></iframe>
<script>
/* Open the "load onto a recording" dialog with three unrelated recordings
   open, which is the state in the screenshot. */
(async () => {
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const W = f.contentWindow, D = f.contentDocument;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 200 && !W.BARRY; i++) await sleep(120);
  const reg = await (await fetch('/api/registry')).json();
  const paths = [];
  for (const p of reg.tree) for (const m of p.mice) for (const s of m.sessions)
    if ((s.here || []).length && paths.length < 3) paths.push(s.here[0]);
  W.eval("setView('xplore')");
  await sleep(300);
  for (const p of paths) {
    await W.eval('BARRY.views.xplore.open(' + JSON.stringify(p) + ')');
    await sleep(400);
  }
  // Wait until they are really open, or the dialog has nothing to list and
  // the screenshot shows an empty box for a harness reason.
  for (let i = 0; i < 300; i++) {
    if (W.eval('BARRY.views.xplore.state.order.length') >= paths.length) break;
    await sleep(150);
  }
  W.eval("setView('eventbank')");
  await sleep(1200);
  // A banked entry that belongs to none of them.
  W.eval('(function(){'
    + 'var e = {name:"DS candidates (ETS)", n:4, type:"ds",'
    + ' session_label:"PTEN m11 s10 2023-07-25", mouse:11, session:10,'
    + ' session_key:"m011_s010_2023-07-25", session_path:null};'
    + 'BARRY.views.eventbank.debugImportDialog'
    + '  ? BARRY.views.eventbank.debugImportDialog(e) : 0; })()');
  await sleep(900);
  document.title = 'shot';
})();
</script>

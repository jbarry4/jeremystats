<!doctype html>
<html><head><meta charset="utf-8"><title>fblive: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:660px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}.hd{color:#ffb81c}
iframe{position:fixed;left:660px;top:0;right:0;bottom:0;width:calc(100vw - 660px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
/* Feedback, live (asked for 2026-11-05: Isabella's report reached this
   machine at 13:37 and History went on saying "Nothing open"). The
   sync-status poll carries the feedback's revision; when it moves, the list
   is read again, the pill's count follows, and a report from somebody else
   says so in a toast.

   IT WRITES NOTHING. `/api/cloud/items` and `/api/feedback` are answered
   here by a wrapped `fetch`, proven with a probe first, and put back in
   `finally`. The server's half (the revision moving when a report lands) is
   tools/test_prospector_routes.py's. */
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n);
  L.scrollTop = L.scrollHeight; };
const check = (w, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + w + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const head = (t) => { say(''); say('=== ' + t + ' ===', 'hd'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 12000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(90);
  }
  return false;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'),
              30000);
  const W = frame.contentWindow, D = () => frame.contentDocument;
  const $ = (s) => D().querySelector(s);
  const $$ = (s) => Array.from(D().querySelectorAll(s));
  const txt = (n) => (n ? n.textContent.trim() : '');
  try {
    W.eval(`(function(){
      window.__fl={rev:'r1', reports:[], asked:0};
      window.__flRealFetch=window.fetch;
      window.fetch=function(u,o){ var p=String(u).split('?')[0];
        var fake=function(obj){return Promise.resolve(new Response(JSON.stringify(obj),
          {status:200,headers:{'Content-Type':'application/json'}}));};
        if(p==='/api/cloud/items') return fake({ok:true,on:true,configured:true,
          auto:true,last:{ok:true},waiting:0,items:{},
          feedback:{rev:window.__fl.rev,open:window.__fl.reports.length}});
        if(p==='/api/feedback' && !(o&&o.method&&o.method!=='GET')){
          window.__fl.asked++;
          return fake({ok:true,reports:JSON.parse(JSON.stringify(window.__fl.reports)),
            kinds:[{id:'bug',name:'Something is broken'}],states:['open'],
            counts:{open:window.__fl.reports.length},user:'Harness Person'}); }
        if(p==='/api/__flprobe') return fake({ok:true,probe:'stubbed'});
        return window.__flRealFetch.apply(this,arguments); };
    })()`);
    const probe = await W.eval("api('/api/__flprobe').then(function(r){return JSON.stringify(r);})");
    if (!/stubbed/.test(probe)) {
      throw new Error('the fetch stub did not answer the probe: ' + probe);
    }
    say('  the fetch stub answers the page’s own api()', 'note');

    const toasts = () => $$('#toasts .toast').map(txt);
    const poll = async () => { await W.eval('BARRY.syncState.refresh()'); await sleep(400); };
    ev("setView('errors')");
    await sleep(600);

    head('first answer: what is there is not news');
    const t0 = toasts().length;
    await poll();
    check('the list was read once, and no toast for what was already there',
          ev('window.__fl.asked') >= 1 && toasts().length === t0,
          ev('window.__fl.asked') + ' / ' + JSON.stringify(toasts().slice(t0)));

    head('a colleague files one');
    ev(`window.__fl.reports.unshift({id:'f1',kind:'bug',title:'Prospector issue',
      detail:'s',state:'open',at:'2026-11-05T18:33:37+00:00',by:'Isabella Piatek',
      machine:'LCOM549913',notes:[],screenshots:[]}); window.__fl.rev='r2';`);
    const asked = ev('window.__fl.asked');
    await poll();
    check('the moved revision reads the list again',
          ev('window.__fl.asked') === asked + 1, String(ev('window.__fl.asked')));
    check('and says so, with who and what',
          toasts().some((t) => /New feedback from Isabella Piatek: “Prospector issue”/.test(t)),
          JSON.stringify(toasts().slice(-2)));
    check('the Feedback pill counts it without a redraw of the errors',
          txt($('#errFbPill')) === 'Feedback (1)', txt($('#errFbPill')));

    head('nothing moved');
    const asked2 = ev('window.__fl.asked'), n2 = toasts().length;
    await poll();
    check('the same revision reads nothing',
          ev('window.__fl.asked') === asked2 && toasts().length === n2);

    head('one of your own');
    ev(`window.__fl.reports.unshift({id:'f2',kind:'bug',title:'mine',state:'open',
      at:'2026-11-05T18:40:00+00:00',by:'Harness Person',notes:[],screenshots:[]});
      window.__fl.rev='r3';`);
    const n3 = toasts().filter((t) => /New feedback/.test(t)).length;
    await poll();
    check('is counted, and no toast tells you about it',
          txt($('#errFbPill')) === 'Feedback (2)'
          && toasts().filter((t) => /New feedback/.test(t)).length === n3,
          txt($('#errFbPill')));
  } finally {
    try {
      ev(`(function(){
        if (window.__flRealFetch) { window.fetch=window.__flRealFetch; delete window.__flRealFetch; }
      })()`);
    } catch (e) {}
    try { ev("setView('toolkit')"); } catch (e) {}
  }

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'fblive: ' + fails + ' FAILED' : 'fblive: passed';
  frame.src = 'about:blank';
})().catch((e) => {
  say('CRASH ' + e.message + '\n' + e.stack, 'bad');
  document.title = 'fblive CRASH';
});
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>spikeflow: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:680px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}.hd{color:#ffb81c}
iframe{position:fixed;left:680px;top:0;right:0;bottom:0;width:calc(100vw - 680px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
const L = document.getElementById('log');
let fails = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n);
  L.scrollTop = L.scrollHeight; };
const check = (what, ok, note) => { if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 12000)) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(90);
  }
  return false;
}
(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'), 30000);
  const W = frame.contentWindow;
  const D = () => frame.contentDocument;
  const $ = (s) => D().querySelector(s);
  const $$ = (s) => Array.from(D().querySelectorAll(s));

  const cat = await (await fetch('/api/sessions')).json();
  /* Pick a recording this machine can actually open.

     Taking the first record's last path was the old rule, and it breaks the
     moment a record carries more than one: the paths accumulate across
     machines and imports, so the last one is as likely to be an unreachable
     mount or an imported .mat as it is the folder. Ask the registry, which
     already works out what is reachable from here. */
  let path = null;
  try {
    const reg = await (await fetch('/api/registry')).json();
    for (const p of (reg.tree || [])) {
      for (const m of p.mice) {
        for (const s of m.sessions) {
          if ((s.here || []).length) { path = s.here[0]; break; }
        }
        if (path) break;
      }
      if (path) break;
    }
  } catch (e) { /* fall through to the old rule */ }
  if (!path) {
    for (const rec of (cat.sessions || [])) {
      const ps = (rec.paths || []).filter(Boolean);
      if (ps.length) { path = ps[0]; break; }
    }
  }
  say('recording: ' + path, 'note');
  ev("setView('xplore')");
  await sleep(400);
  await ev('BARRY.views.xplore.open(' + JSON.stringify(path) + ')');
  await until(() => $('.pane-canvas-host canvas'), 25000);
  await sleep(1200);

  const S = 'BARRY.views.xplore.state.sessions['
          + 'BARRY.views.xplore.state.active]';
  // A short window, so detection is quick and the counts are legible.
  ev(S + '.t0 = 10; ' + S + '.span = 6;');
  ev('BARRY.views.xplore.refreshAll()');
  await sleep(1800);

  // Clear anything left from an earlier run.
  ev(S + '.spikeDraft = null;');
  const setsBefore = JSON.parse(ev('JSON.stringify((' + S + '.spikeSets||[])'
    + '.map(s => s.name))'));
  say('  spike sets already stored: ' + JSON.stringify(setsBefore), 'note');

  const openDetector = async () => {
    const more = $$('.pane-ctl .ctl-menu').find(
      (b) => b.textContent.startsWith('More'));
    more.click();
    await sleep(450);
    $$('.ctl-pop button').find(
      (b) => /Threshold detector/.test(b.textContent)).click();
    await until(() => $('#thrMode'), 9000);
    await sleep(400);
  };

  for (const mode of ['sd', 'uv']) {
    say('');
    say('=== ' + (mode === 'sd' ? 'relative (x SD)' : 'amplitude (uV)')
        + ' ===', 'hd');
    await openDetector();
    check('the detector opens', !!$('#thrMode'));

    // Pick the mode the way a person would.
    const btns = $$('#thrMode button');
    const want = mode === 'uv' ? 1 : 0;
    if (!btns[want].classList.contains('active')) {
      btns[want].click();
      await until(() => $('#thrMode'), 9000);
      await sleep(500);
    }
    check('the ' + mode + ' mode is selected',
          $$('#thrMode button')[want].classList.contains('active'),
          $$('#thrMode button').map(
            (b) => b.textContent + (b.classList.contains('active') ? '*' : ''))
            .join(' | '));
    const P = JSON.parse(ev('JSON.stringify(' + S + '.spikeParams)'));
    say('  params: ' + JSON.stringify(P), 'note');

    // Detect.
    const runBtn = $$('.mb button, .mf button').find(
      (b) => /^Detect/.test(b.textContent));
    check('there is a Detect button', !!runBtn,
          $$('.mf button').map((b) => b.textContent).join(' | '));
    runBtn.click();
    const got = await until(
      () => ev(S + '.spikeDraft') && ev(S + '.spikeDraft.n') >= 0, 45000);
    check('detection returns', got);
    const n = Number(ev(S + '.spikeDraft ? ' + S + '.spikeDraft.n : -1'));
    check('it found something', n > 0, n + ' marks');
    check('the panel says so',
          /draft mark/.test(($('.mb .fb-stats') || {}).textContent || ''),
          ($('.mb .fb-stats') || {}).textContent.slice(0, 70));

    /* Does the draft actually reach the trace? Count the pixels the mark
       colour paints, rather than trusting that a draw call happened. */
    W.eval('closeModal')();
    await sleep(1200);
    const painted = ev('(function(){'
      + 'var c=document.querySelector(".pane-canvas-host canvas");'
      + 'if(!c) return -1;'
      + 'var x=c.getContext("2d").getImageData(0,0,c.width,c.height).data;'
      + 'var h=c.height, w=c.width, n=0;'
      // The bottom strip is where the spike ticks are drawn.
      + 'for(var y=Math.floor(h*0.80); y<h; y++){'
      + '  for(var i=(y*w)*4; i<(y*w+w)*4; i+=4){'
      + '    if(x[i+3]>40) n++;'
      + '  }'
      + '}'
      + 'return n;})()');
    say('  pixels in the mark strip: ' + painted, 'note');
    check('the draft is drawn on the trace', painted > 50, String(painted));

    // Now commit it, the way a person would: the button, then the name box.
    await openDetector();
    const commitBtn = $$('.mf button').find(
      (b) => /Commit draft/.test(b.textContent));
    check('there is a Commit button', !!commitBtn,
          $$('.mf button').map((b) => b.textContent).join(' | '));
    commitBtn.click();
    const asked = await until(
      () => $('#pathModal') && !$('#pathModal').classList.contains('hidden'),
      6000);
    check('it asks for a name', asked);
    if (asked) {
      // The name box has to be usable -- on top, and reachable.
      const pm = $('#pathModal');
      const box = $('#pathModal .modal, #pathModal > div');
      const z = (n) => Number(W.getComputedStyle(n).zIndex) || 0;
      const bigZ = z($('#bigModal'));
      check('the name box is above the detector dialog',
            z(pm) >= bigZ, 'name ' + z(pm) + ' vs detector ' + bigZ);
      const inp = $('#pathModalInput');
      check('and its input is reachable', !!inp && inp.offsetParent !== null);
      inp.value = 'flow harness ' + mode;
      $('#pathModalOk').click();
    }
    const committed = await until(
      () => (JSON.parse(ev('JSON.stringify(' + S + '.spikeSets||[])')) || [])
        .some((x) => x.name === 'flow harness ' + mode), 20000);
    check('the set is committed', committed);
    const sets = JSON.parse(ev('JSON.stringify((' + S + '.spikeSets||[])'
      + '.map(s => ({name: s.name, n: s.n, ev: (s.events||[]).length})))'));
    say('  sets now: ' + JSON.stringify(sets), 'note');
    const mine = sets.find((x) => x.name === 'flow harness ' + mode) || {};
    check('the committed set carries its events', mine.ev > 0,
          JSON.stringify(mine));
    check('the draft is cleared once committed',
          ev(S + '.spikeDraft') === null);

    /* THE REPORTED SYMPTOM: do the committed spikes reach the places that
       hold marks -- the Marks button, the marks browser, and the events the
       Xplorefinder view knows about? */
    await sleep(1200);
    const marks = $$('.pane-ctl .ctl-menu').find(
      (b) => b.textContent.startsWith('Marks'));
    say('  Marks button reads: ' + (marks ? marks.textContent : 'missing'),
        'note');
    check('the Marks button counts them',
          marks && /\d/.test(marks.textContent)
          && Number((marks.textContent.match(/\d+/) || [0])[0]) > 0,
          marks ? marks.textContent : '');

    const paintedAfter = ev('(function(){'
      + 'var c=document.querySelector(".pane-canvas-host canvas");'
      + 'if(!c) return -1;'
      + 'var x=c.getContext("2d").getImageData(0,0,c.width,c.height).data;'
      + 'var h=c.height, w=c.width, n=0;'
      + 'for(var y=Math.floor(h*0.80); y<h; y++){'
      + '  for(var i=(y*w)*4; i<(y*w+w)*4; i+=4){ if(x[i+3]>40) n++; }'
      + '}'
      + 'return n;})()');
    check('the committed marks are still drawn', paintedAfter > 50,
          String(paintedAfter));

    // The marks browser.
    marks.click();
    await sleep(450);
    $$('.ctl-pop button').find((b) => /Browse/.test(b.textContent)).click();
    await until(() => $('.bm-list'), 9000);
    await sleep(500);
    const rows = $$('.bm-list .bm-row').length;
    const txt = ($('.mb') || {}).textContent || '';
    say('  marks browser rows: ' + rows, 'note');
    check('the marks browser lists the spikes',
          /spike/i.test(txt) || rows > 0, txt.slice(0, 100));
    // The reported gap: committing must make them events, not only marks.
    const counts = (txt.match(/Events \((\d+)\)/) || [])[1];
    say('  the browser counts Events (' + counts + ')', 'note');
    check('the committed spikes are events too, not just ticks',
          Number(counts) > 2, 'Events (' + counts + ')');
    const evN = Number(ev(S + '.events.length'));
    check('they are on the session as events', evN > 2, evN + ' events');
    const cls = ev('JSON.stringify(Object.keys(' + S + '._eventClasses||{}))');
    check('and they get their own class, named after the set',
          new RegExp('flow harness ' + mode).test(cls), cls);
    W.eval('closeModal')();
    await sleep(350);

    // And the export tree, which is what "the event holders" would feed.
    const more2 = $$('.pane-ctl .ctl-menu').find(
      (b) => b.textContent.startsWith('More'));
    more2.click();
    await sleep(450);
    $$('.ctl-pop button').find((b) => /^Export/.test(b.textContent)).click();
    await sleep(500);
    const toBank = $$('.choice').find((b) => /Event Bank/.test(b.textContent));
    if (toBank) {
      toBank.click();
      await until(() => $('.ev-tree'), 8000);
      await sleep(450);
      const labels = $$('.ev-tree .ev-label').map((n) => n.textContent);
      say('  export tree: ' + labels.slice(0, 8).join(' | '), 'note');
      check('the committed spike set is offered for export',
            labels.some((t) => /flow harness/.test(t)),
            labels.join(' | ').slice(0, 140));
    } else {
      check('the export chooser opens', false,
            ($('.mb') || {}).textContent.slice(0, 80));
    }
    W.eval('closeModal')();
    await sleep(400);
  }

  /* ==================================================================
     The reported symptom: getting detected spikes into the event system
     and back onto the trace.
     ================================================================== */
  say('');
  say('=== spikes -> Event Bank -> back onto the trace ===', 'hd');
  const eventsBefore = Number(ev(S + '.events.length'));
  say('  events on the trace before: ' + eventsBefore, 'note');

  // Export the amplitude set to the bank.
  const more3 = $$('.pane-ctl .ctl-menu').find(
    (b) => b.textContent.startsWith('More'));
  more3.click();
  await sleep(450);
  $$('.ctl-pop button').find((b) => /^Export/.test(b.textContent)).click();
  await sleep(500);
  $$('.choice').find((b) => /Event Bank/.test(b.textContent)).click();
  await until(() => $('.ev-tree'), 8000);
  await sleep(500);

  // Keep only the amplitude spike set.
  const noneBtn = $$('.mb .res-toolbar button').find(
    (b) => b.textContent === 'None');
  if (noneBtn) { noneBtn.click(); await sleep(400); }
  const expandBtn = $$('.mb .res-toolbar button').find(
    (b) => b.textContent === 'Expand all');
  if (expandBtn) { expandBtn.click(); await sleep(400); }
  const uvNode = $$('.ev-node').find(
    (n) => /flow harness uv/.test(
      (n.querySelector('.ev-label') || {}).textContent || ''));
  check('the amplitude set is in the export tree', !!uvNode,
        $$('.ev-node .ev-label').map((n) => n.textContent).join(' | ')
          .slice(0, 140));
  if (uvNode) {
    uvNode.querySelector('input[type=checkbox]').click();
    await sleep(500);
    const sel = ($('.mb .stat-chip.good') || {}).textContent || '';
    say('  selected: ' + sel, 'note');
    check('it selects a sensible number', /[1-9]\d* of/.test(sel), sel);

    $$('.mf button').find((b) => /Continue/.test(b.textContent)).click();
    const asked = await until(() => $$('.mb .field label').some(
      (n) => n.textContent === 'Produced by'), 9000);
    check('banking asks for provenance', asked);
    if (asked) {
      const fieldFor = (label) => {
        const f = $$('.mb .field').find(
          (d) => (d.querySelector('label') || {}).textContent === label);
        return f ? f.querySelector('input, select') : null;
      };
      const pipe = $$('.bank-entry-row .field').find(
        (d) => (d.querySelector('label') || {}).textContent === 'Produced by');
      if (pipe) pipe.querySelector('input').value = 'harness: amplitude detector';
      const by = fieldFor('Added by');
      if (by) by.value = 'spikeflow@harness';
      $$('.mf button').find((b) => /^Bank/.test(b.textContent)).click();
      await sleep(2000);
    }
  }

  const banked = await (await fetch('/api/bank')).json();
  const mineBank = (banked.entries || []).filter(
    (e) => (e.added || {}).by === 'spikeflow@harness');
  check('a bank entry was created', mineBank.length > 0,
        mineBank.length + ' entries');
  if (mineBank.length) {
    say('  banked: ' + JSON.stringify({ name: mineBank[0].name,
        n: mineBank[0].n, kind: mineBank[0].kind }), 'note');
    check('it carries the spike times', mineBank[0].n > 0,
          String(mineBank[0].n));
  }

  // And back onto the recording.
  const more4 = $$('.pane-ctl .ctl-menu').find(
    (b) => b.textContent.startsWith('More'));
  more4.click();
  await sleep(450);
  $$('.ctl-pop button').find((b) => /^Import/.test(b.textContent)).click();
  await sleep(500);
  $$('.choice').find((b) => /Event Bank/.test(b.textContent)).click();
  const listed = await until(() => $('.bm-list.tall .bm-row'), 9000);
  check('the bank offers it back for this recording', listed,
        ($('.mb') || {}).textContent.slice(0, 120));
  if (listed) {
    const row = $$('.bm-list.tall .bm-row').find(
      (r) => /amplitude detector|flow harness/i.test(r.textContent))
      || $$('.bm-list.tall .bm-row')[0];
    // The row itself carries the click handler; there is no button in it.
    say('  loading: ' + row.textContent.slice(0, 70), 'note');
    row.click();
    await sleep(2200);
  }
  const eventsAfter = Number(ev(S + '.events.length'));
  say('  events on the trace after: ' + eventsAfter, 'note');
  check('the spikes arrived as events on the trace',
        eventsAfter > eventsBefore,
        eventsBefore + ' -> ' + eventsAfter);
  const firstEv = ev('JSON.stringify(' + S + '.events.slice(-1)[0] || null)');
  say('  last event: ' + firstEv, 'note');
  check('they have real timestamps, not zeros',
        (() => { try { const e = JSON.parse(firstEv);
                       return e && typeof e.start === 'number' && e.start > 0;
                 } catch (x) { return false; } })(), firstEv);
  const evBtn = $$('.pane-ctl .ctl-menu').find(
    (b) => b.textContent.startsWith('Marks'));
  say('  Marks now reads: ' + (evBtn ? evBtn.textContent : '-'), 'note');

  say('');
  say('=== cleaning up ===', 'hd');
  for (const e of mineBank) {
    await fetch('/api/bank/' + e.id + '/delete', { method: 'POST' })
      .catch(() => {});
  }
  const ident = JSON.parse(ev('JSON.stringify(' + S + '.identity)'));
  for (const st of JSON.parse(ev('JSON.stringify(' + S + '.spikeSets||[])'))) {
    if (/flow harness/.test(st.name)) {
      await fetch('/api/spikes/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: ident, id: st.id }),
      });
      say('  removed ' + st.name, 'note');
    }
  }

  say('');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'spikeflow: ' + fails + ' FAILED' : 'spikeflow: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'spikeflow CRASH'; });
</script></body></html>

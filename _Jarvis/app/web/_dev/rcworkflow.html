/* Root Canal's Workflow tab (2026-11-05).

   WHAT WAS ASKED: a Workflow tab -- verified dentate spikes, verified
   P-spikes, ambiguous; Define border, Apply border, Extract -- with the 3D
   picture of each stage; workflows built and archived; results to the Bank,
   rebuilt easily, and every event traced back to its recording and
   waveforms. And every one of the ten features offered.

   ON FIXTURES. Every /api/rootcanal/workflow* answer is made here, from
   synthetic events, so the page is checked against known numbers:
     - the view bar has Workflow, and the tab paints its own part;
     - a strip per workflow, three stage cards each with a picture;
     - opening one draws the 3D stage, the three 2D views, the grace sweep,
       the distances, the flow, every mouse and the lineage;
     - a dot clicked shows its numbers against the cut-offs, its history,
       its waveform (from /api/rootcanal/event) and offers Xplorefinder;
     - out of date says so, and running then takes the newest inputs;
     - banking is its own step: "Run and bank..." previews, a dialog says
       what will be written, and only its button banks; "Run without
       banking" writes nothing to the Bank;
     - archiving writes the shared preference and archives the bank entry;
     - the builder previews and saves what it says; the P-spike one lists
       the hand-sorted sets and checks them;
     - Ambiguous shows the conflicts and banks only what is ticked;
     - a version's side branch in the version tree.

   IT WRITES NOTHING. Every workflow, bank, prefs and pool request is
   answered or refused here; the activity log is quiet. */
const L = document.getElementById('log');
let pass = 0, fail = 0;
const say = (s, cls) => {
  const n = document.createElement('span');
  if (cls) n.className = cls;
  n.textContent = s + '\n';
  L.appendChild(n);
  L.scrollTop = L.scrollHeight;
};
const head = (s) => { say(''); say(s, 'hd'); say('-'.repeat(66), 'dim'); };
const ok = (name, good, why) => {
  if (good) { pass++; say('  ok   ' + name, 'ok'); }
  else { fail++; say('  FAIL ' + name + (why ? '\n       ' + why : ''), 'bad'); }
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms, what) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 15000)) {
    try { if (await fn()) return true; } catch (e) { /* not yet */ }
    await sleep(120);
  }
  say('       timed out waiting for ' + (what || 'something'), 'dim');
  return false;
}

/* ---------- the fixtures ---------- */
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const gauss = () => { let s = 0; for (let k = 0; k < 6; k++) s += rnd(); return s - 3; };
const AXK = ['amp_uV', 'hf_db', 'hw_ms'];
function box(lo, hi) {
  const o = {};
  AXK.forEach((k, a) => { o[k] = { lo: lo[a], hi: hi[a] }; });
  return o;
}
function members(n) {
  const out = [];
  for (let k = 0; k < n; k++) {
    out.push({ key: 'u:e' + k + ':r' + k, gid: 'g' + k, entry_id: 'e' + k,
               session_label: 'PTEN m' + (k + 1) + ' s1 2024-01-0' + (k + 1),
               mouse_key: 'PTEN|m' + (k + 1),
               event_body: { entry_id: 'e' + k, read: 'r' + k, filt: 'ds' },
               from_version: 'v' + k });
  }
  return out;
}
function cols(n, nm, inside, centre) {
  const c = { gids: [], g: [], m: [], i: [], t: [], amp: [], hf: [], hw: [],
              mouse: [], cls: [], d_a: [] };
  for (let k = 0; k < nm; k++) c.gids.push('g' + k);
  for (let j = 0; j < n; j++) {
    const m = j % nm;
    c.g.push(m); c.m.push(m); c.i.push(Math.floor(j / nm));
    c.t.push(10 + j * 1.5);
    c.amp.push(Math.round(centre[0] + gauss() * 500));
    c.hf.push(+(centre[1] + gauss() * 6).toFixed(2));
    c.hw.push(+(centre[2] + gauss() * 9).toFixed(2));
    c.mouse.push('PTEN|m' + (m + 1));
    const v = [c.amp[j], c.hf[j], c.hw[j]];
    c.cls.push(inside(v));
    c.d_a.push([0, 0, 0].map(() => +(gauss() * 0.4).toFixed(3)));
  }
  return c;
}
const BOX_DS = [[400, 2400], [0, 20], [8, 45]];
const BOX_P = [[700, 3000], [8, 35], [6, 30]];
const inBox = (b) => (v) => v.every((x, a) => x >= b[a][0] && x <= b[a][1]);
function border(group, b) {
  return { kind: 'envelope', group,
           strict: box(b.map((r) => r[0] - 100 * 0 - (r[1] - r[0]) * 0.08),
                       b.map((r) => r[1] + (r[1] - r[0]) * 0.08)),
           levels: [{ grace: 0, edges: box(b.map((r) => r[0] - (r[1] - r[0]) * 0.08),
                                           b.map((r) => r[1] + (r[1] - r[0]) * 0.08)) },
                    { grace: 0.05, edges: box(b.map((r) => r[0]), b.map((r) => r[1])) }] };
}
function counts(cls) { const o = {}; cls.forEach((c) => { o[c] = (o[c] || 0) + 1; }); return o; }
function byMouse(c) {
  const o = {};
  c.cls.forEach((k, j) => { const m = c.mouse[j]; o[m] = o[m] || { key: m, label: m, n: 0 };
                            o[m].n += 1; o[m][k] = (o[m][k] || 0) + 1; });
  return Object.values(o);
}
function oneRun(kind) {
  const mem = members(4);
  const group = kind === 'pspike' ? 'ied' : 'ds';
  const B = kind === 'pspike' ? BOX_P : BOX_DS;
  const isIn = inBox(B);
  const tgt = cols(240, 4, (v) => (isIn(v) ? 'inside' : 'outside'), [1300, 12, 24]);
  const src = cols(160, 4, (v) => (isIn(v) ? 'inside' : 'outside'),
                   kind === 'pspike' ? [1700, 20, 16] : [1200, 9, 27]);
  const cc = counts(tgt.cls);
  const sweep = [];
  for (let k = 0; k <= 20; k++) sweep.push({ grace: k * 0.005,
    source_outside: k * 0.005 * 0.95, target_inside: Math.round(230 - k * 3),
    target_measured: 240, box: {} });
  return { kind, group, grace: 0.05,
           rule: 'Solid ' + (group === 'ied' ? 'P-spike' : 'DS') + ': inside a harness box.',
           border: border(group, B),
           border_ref: { artifact_id: 'b-' + kind, version: 2,
                         nickname: (group === 'ied' ? 'P-spike' : 'DS') + ' border · h' },
           target: { artifact_id: 'pT', version: 1, nickname: 'Harness target', n: 240 },
           measure: { lo_hz: 5, hi_hz: 100, mains_out: true },
           mismatch: [], members: mem, src_members: mem, sweep,
           src_cols: src, cols: tgt, counts: cc, n: 240, kept: cc.inside || 0,
           by_mouse: byMouse(tgt), by_recording: [],
           bank: { entry_id: 'bank-' + kind, n: cc.inside || 0, recordings: 4,
                   name: 'Verified ' + kind + ' · harness', version: '3', new: false },
           at: '2026-11-05T12:00:00+00:00', by: 'Debug_Bot',
           diff: { n: 3, moves: { 'inside → outside': 2, 'outside → inside': 1 },
                   examples: [{ gid: 'g0', t: 11.5, was: 'inside', now: 'outside' }] } };
}
function ambRun(a, b) {
  const tgt = JSON.parse(JSON.stringify(a.cols));
  const iDs = inBox(BOX_DS), iP = inBox(BOX_P);
  tgt.cls = tgt.amp.map((x, j) => {
    const v = [tgt.amp[j], tgt.hf[j], tgt.hw[j]];
    const A = iDs(v), P = iP(v);
    return A && P ? 'both' : A ? 'ds' : P ? 'pspike' : 'neither';
  });
  tgt.d_b = tgt.d_a.map((r) => r.map((x) => -x));
  const cc = counts(tgt.cls);
  return { kind: 'ambiguous',
           borders: { ds: { border: a.border, grace: 0.05, border_ref: a.border_ref,
                            workflow: { artifact_id: 'wDS', version: 2, nickname: 'Harness DS' } },
                      pspike: { border: b.border, grace: 0.05, border_ref: b.border_ref,
                                workflow: { artifact_id: 'wP', version: 2, nickname: 'Harness P' } } },
           target: a.target, measure: a.measure, members: a.members, mismatch: [],
           cols: tgt, counts: cc, n: 240, kept: (cc.both || 0) + (cc.neither || 0),
           by_mouse: byMouse(tgt), by_recording: [], bank: null,
           at: '2026-11-05T12:05:00+00:00', by: 'Debug_Bot' };
}
const RUN_DS = oneRun('ds');
const RUN_P = oneRun('pspike');
const RUN_A = ambRun(RUN_DS, RUN_P);
const DEF = {
  ds: { kind: 'ds', grace: 0.05,
        source: { type: 'pool', artifact_id: 'pC', version: 1, nickname: 'Harness controls' },
        target: { artifact_id: 'pT', version: 1, nickname: 'Harness target' } },

                       pspike: { artifact_id: 'wP', version: 2, nickname: 'Harness P' } } },
};

  return { artifact_id: id, nickname: { wDS: 'Harness DS', wP: 'Harness P', wA: 'Harness A' }[id],
           name: kind, version: 2, updated: '2026-11-05', kind, definition: DEF[kind],
           ran: true, counts: run.counts, kept: run.kept, n: run.n, bank: run.bank,
           border_ref: run.border_ref, grace: 0.05, stale: stale || [], mismatch: [] };
}

             n: 11, aligned: false, hand_sorted: true },

           { entry_id: 'c1', session_label: 'PTEN m3 s2', name: 'IED spikes (confirmed)',
             n: 11, aligned: false, hand_sorted: false }],
  },

                      clock: { retime: false, why: 'continuous' }, aligned: false, read: false },
                    { entry_id: 'h2', session_label: 'PTEN m34 s8', n: 7,
                      clock: { retime: true, why: '7 events up to 121.3 ms early' },
                      aligned: true, aligned_name: 'v3', read: false }] },
  event: { ok: true, filter_label: 'DS filter, 5–100 Hz',
           trace: { t_ms: Array.from({ length: 81 }, (_, k) => -40 + k),
                    y: Array.from({ length: 81 }, (_, k) => 900 * Math.exp(-((k - 40) ** 2) / 60)),
                    peak_ms: 0, peak_uV: 900, baseline: 0, amp_uV: 900, hw_ms: 12, half_uV: 450,
                    left_ms: -6, right_ms: 6, contact: 4 },
           spectrum: { f: Array.from({ length: 60 }, (_, k) => 10 + k * 20),
                       event: Array.from({ length: 60 }, (_, k) => 30 - k * 0.3),
                       baseline: Array.from({ length: 60 }, (_, k) => 26 - k * 0.32),
                       band: [500, 1000], contact: 4, db: 6.2, db_flag: true },
           stack: { t_ms: Array.from({ length: 81 }, (_, k) => -40 + k), gain: 4, contact: 4,
                    nums: [1, 2, 3, 4, 5, 6, 7, 8], bad: [false, false, false, false, false, false, false, false],
                    rows: Array.from({ length: 8 }, (_, r) => Array.from({ length: 81 },
                      (_, k) => -(r === 3 ? 1.5 : 0.4) * Math.exp(-((k - 40) ** 2) / 60))) },
           csd: { rows: Array.from({ length: 8 }, (_, r) => Array.from({ length: 81 },
                    (_, k) => (r - 4) * Math.exp(-((k - 40) ** 2) / 80))),

};

(async () => {

  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  await until(() => ev('typeof BARRY') === 'object' && ev('!!BARRY.state'), 25000, 'the app to boot');
  await until(() => ev('!!(BARRY.prefs && BARRY.rootcanal && BARRY.rcWorkflow)'), 10000, 'the modules');

     + '  m = p.match(/^\\/api\\/rootcanal\\/workflow\\/([^\\/]+)$/);'

       && Array.from(D().querySelectorAll('.wf-2d')).every((c) => inked(c) > 500));
    const stSeg = Array.from(D().querySelectorAll('.wf-stage-seg button')).map((b) => b.textContent);
    ok('a switch for the three stages', JSON.stringify(stSeg)
       === '["Define border","Apply border","Extract"]', JSON.stringify(stSeg));
    ok('its rule in words', /Solid DS: inside a harness box/.test(D().querySelector('.wf-rule').textContent));
    const lg = D().querySelector('.wf-legend').textContent;
    ok('the legend names every mark: the dots with their counts, each box, and the frame',
       new RegExp('inside: verified DS' + RUN_DS.counts.inside + ' · ').test(lg)
       && /DS border, grace 5%/.test(lg) && /DS border at no grace \(the widest the box gets\)/.test(lg)
       && /frame: the axes, lowest to highest value on show/.test(lg), lg);
    const panels = Array.from(D().querySelectorAll('.wf-panel > strong')).map((n) => n.textContent);
    ok('the grace sweep, the distances, the flow, every mouse and the averages',
       JSON.stringify(panels) === JSON.stringify(['Grace', 'How far from the border',
         'Where they went', 'Every mouse', 'Averages']), JSON.stringify(panels));
    await sleep(300);
    ok('the grace sweep is drawn', inked(D().querySelector('.wf-sweep')) > 300);
    ok('the distance histograms are drawn, one per axis',
       D().querySelectorAll('.wf-dist').length === 3
       && Array.from(D().querySelectorAll('.wf-dist')).every((c) => inked(c) > 100));
    ok('the flow from mice to classes is drawn', inked(D().querySelector('.wf-flow')) > 500);
    ok('a small picture per mouse', D().querySelectorAll('.wf-mouse').length === 4
       && Array.from(D().querySelectorAll('.wf-mouse-cv')).every((c) => inked(c) > 50));
    ok('the out-of-date line, saying what is newer',
       /Out of date: target pool ‘Harness target’ is at 2, this pins 1/.test(D().querySelector('.wf-detail').textContent));
    ok('the lineage, newest first, with what the run moved',
       D().querySelectorAll('.wf-line').length === 2
       && /3 changed since the run before: inside → outside 2, outside → inside 1/.test(D().querySelector('.wf-lines').textContent));

    for (const [id, words] of [['define', 'Define border'], ['extract', 'Extract']]) {
      btn(new RegExp('^' + words + '$'), D().querySelector('.wf-stage-seg')).click();
      await until(() => S().stage === id && inked(D().querySelector('.wf-3d')) > 1000, 4000, words);
      ok(words + ': the 3D redrawn for it', S().stage === id && inked(D().querySelector('.wf-3d')) > 1000);
    }
    ok('Extract fades what is not extracted', /Faded\s*not extracted: outside the border/.test(D().querySelector('.wf-legend').textContent));
    btn(/^Apply border$/, D().querySelector('.wf-stage-seg')).click();
    await until(() => S().stage === 'apply', 3000, 'apply');

    head('A DOT, CLICKED: ITS NUMBERS, ITS HISTORY, ITS WAVEFORM');
    // The canvas on show, once it has been drawn (each stage is a new one).
    await until(() => { const c = D().querySelector('.wf-3d');
                        return c && c.__pick && c.__pick.pts.length; }, 4000, 'the dots');
    const cv = D().querySelector('.wf-3d');
    const pk = cv.__pick && cv.__pick.pts[0];
    ok('the 3D knows where its dots are', !!pk);
    const b = cv.getBoundingClientRect();
    const PE = frame.contentWindow.PointerEvent || frame.contentWindow.MouseEvent;
    cv.dispatchEvent(new PE('pointerdown', { clientX: b.left + pk.q[0], clientY: b.top + pk.q[1], bubbles: true, pointerId: 1 }));
    cv.dispatchEvent(new PE('pointerup', { clientX: b.left + pk.q[0], clientY: b.top + pk.q[1], bubbles: true, pointerId: 1 }));
    await until(() => D().querySelector('.wf-insp .wf-cut'), 4000, 'the inspector');
    ok('the picked dot is the one under the pointer', S().picked && S().picked.n === pk.p.n,
       JSON.stringify(S().picked));
    const cut = D().querySelector('.wf-cut');
    ok('its three numbers against the border, each inside or outside, how far',
       cut && cut.querySelectorAll('tr').length === 4
       && /box widths (in|out)/.test(cut.textContent), cut && cut.textContent.slice(0, 160));
    const hist = D().querySelector('.wf-hist').textContent;
    ok('its history: the recording and time, the set and version, the pool, the border, the workflow',
       /Recording: PTEN m\d s1/.test(hist) && /Set: bank entry e\d, version v\d/.test(hist)
       && /Pooled in ‘Harness target’ v1/.test(hist) && /Border ‘DS border · h’ v2/.test(hist)
       && /Classified by the workflow ‘Harness DS’ v2/.test(hist), hist.slice(0, 300));
    // Its pictures, at once: Root Canal's own four, drawn by Root Canal.
    const four = ['rcTrace', 'rcSpec', 'rcStack', 'rcCsd'];
    await until(() => sent().some((x) => x[0] === 'event')
                && four.every((id) => inked(D().getElementById(id)) > 300), 6000, 'the four');
    const evSent = sent().filter((x) => x[0] === 'event').pop();
    ok('picked, its traces are asked for at once, of the member’s own read, at its event number',
       evSent && evSent[1].read === 'r' + pk.p.m && evSent[1].i === pk.p.i,
       evSent && JSON.stringify(evSent[1]));
    ok('Root Canal’s own four pictures: max-amp contact, spectrum, every contact, CSD',
       four.every((id) => D().querySelector('.wf-insp #' + id) && inked(D().getElementById(id)) > 300)
       && JSON.stringify(Array.from(D().querySelectorAll('.wf-insp .rc-ev-t strong')).map((n) => n.textContent))
          === '["Max-amp contact","Spectrum","Every contact","CSD"]',
       four.map((id) => id + ':' + inked(D().getElementById(id))).join(' '));
    ev('window.__wfOpened = null');
    // The recording's path comes from the registry; a harness has none, so
    // the press says so instead of opening -- either is the right outcome.
    btn(/^Open in Xplorefinder$/).click();
    await until(() => ev('window.__wfOpened') || toasts().some((t) => /not reachable/.test(t)), 6000, 'Xplorefinder');
    const opened = ev('window.__wfOpened');
    ok('Open in Xplorefinder goes to that recording at that time (or says it cannot)',
       (opened && /#xplore$/.test(opened) && /t0=/.test(opened))
       || toasts().some((t) => /not reachable/.test(t)), opened || toasts().slice(-1)[0]);

    head('AVERAGES OF A CLASS');
    btn(/^Average inside$/).click();
    await until(() => sent().some((x) => x[0] === 'group'), 4000, 'the average');
    const g = sent().filter((x) => x[0] === 'group').pop()[1];
    ok('asked of the target pool, every inside event as [member key, event]',
       g.saved.artifact_id === 'pT' && g.events.length === RUN_DS.counts.inside
       && g.events.every((x) => /^u:e\d:r\d$/.test(x[0])), JSON.stringify(g).slice(0, 200));
    await until(() => /Average · inside/.test((D().querySelector('.wf-insp') || {}).textContent || '')
                && inked(D().getElementById('rcTrace')) > 300, 4000, 'the average drawn');
    ok('and drawn as Root Canal draws an average, in the same four pictures',
       /Average · inside/.test(D().querySelector('.wf-insp').textContent)
       && /Average, max-amp contact/.test(D().querySelector('.wf-insp').textContent)
       && inked(D().getElementById('rcCsd')) > 300);

    head('RUN AND BANK: PREVIEWED, SAID IN A DIALOG, BANKED ONLY BY ITS BUTTON');
    const nPv = sent().filter((x) => x[0] === 'preview').length;
    btn(/^Run and bank…$/, D().querySelector('.wf-strip[data-wf="wDS"]')).click();
    await until(() => sent().some((x) => x[0] === 'run:wDS'), 6000, 'the run');
    ok('what would be banked is worked out first, with nothing saved',
       sent().filter((x) => x[0] === 'preview').length === nPv + 1);
    const dlg = JSON.parse(ev('JSON.stringify(window.__wfDlg)'));
    ok('the dialog says how many, from where, into what: the next version of its entry',
       new RegExp('and bank ' + RUN_DS.kept + ' verified dentate spikes').test(dlg.title)
       && /banks the \d+ of 240 events inside it as ONE Event Bank entry/.test(dlg.what)
       && /NEXT VERSION of ‘Verified ds · harness’/.test(dlg.facts[0])
       && dlg.ok === 'Run and bank ' + RUN_DS.kept + ' events', JSON.stringify(dlg));
    const rb = sent().filter((x) => x[0] === 'run:wDS').pop()[1];
    ok('its button banks, under the name and note given, with the newest inputs (it was out of date)',
       rb.bank === true && rb.bank_name === 'harness picks' && rb.bank_note === 'a note'
       && rb.refresh === true, JSON.stringify(rb));
    await until(() => toasts().some((t) => /‘Harness DS’ v3:/.test(t)), 4000, 'the toast');
    ok('and says what it banked, and where', toasts().some((t) => new RegExp(RUN_DS.kept
       + ' of 240 events inside the border\\. Banked as v3 of ‘Verified ds · harness’\\. 3 changed class').test(t)),
       toasts().slice(-1)[0]);
    await until(() => S().stage === 'extract' && D().querySelector('.wf-bankcard'), 4000, 'extract');
    ok('it opens on Extract, where a card says what is banked and offers to bank again',
       /This run is banked/.test(D().querySelector('.wf-bankcard').textContent)
       && !!btn(/^Run and bank again…$/, D().querySelector('.wf-bankcard')));
    const nRun = sent().filter((x) => x[0] === 'run:wDS').length;
    const nPv2 = sent().filter((x) => x[0] === 'preview').length;
    btn(/^Run without banking$/, D().querySelector('.wf-strip[data-wf="wDS"]')).click();
    await until(() => sent().filter((x) => x[0] === 'run:wDS').length > nRun, 6000, 'the plain run');
    ok('Run without banking asks to bank nothing, with no dialog',
       sent().filter((x) => x[0] === 'run:wDS').pop()[1].bank === false
       && sent().filter((x) => x[0] === 'preview').length === nPv2);

    head('ARCHIVED: THE SHARED PREFERENCE, AND ITS BANK ENTRY WITH IT');
    await until(() => D().querySelector('.wf-strip[data-wf="wP"]'), 4000, 'the strips again');
    btn(/^Archive$/, D().querySelector('.wf-strip[data-wf="wP"]')).click();
    await until(() => sent().some((x) => x[0] === 'archive'), 4000, 'the archive');
    const mem = ev('JSON.stringify(window.__wfMem)');
    ok('written to rootcanal_workflow_archive, for everyone', /rootcanal_workflow_archive/.test(mem)
       && /wP/.test(mem), mem);
    ok('and its bank entry archived too, not deleted',
       sent().some((x) => x[0] === 'archive' && /bank-pspike/.test(x[2]) && x[1].archived === true));
    await until(() => !D().querySelector('.wf-strip[data-wf="wP"]'), 4000, 'it leaves');
    ok('it leaves the list', !D().querySelector('.wf-strip[data-wf="wP"]'));
    ok('and Show archived offers it back', !!btn(/^Show archived · 1$/));
    btn(/^Show archived · 1$/).click();
    await until(() => D().querySelector('.wf-strip.archived[data-wf="wP"]'), 4000, 'shown');
    ok('shown archived, with Put back', !!btn(/^Put back$/, D().querySelector('.wf-strip[data-wf="wP"]')));
    btn(/^Put back$/, D().querySelector('.wf-strip[data-wf="wP"]')).click();
    await until(() => !/wP/.test(ev('JSON.stringify(window.__wfMem)')), 4000, 'put back');
    ok('put back', !/"wP"/.test(ev('JSON.stringify(window.__wfMem)')));

    head('AMBIGUOUS: THE CONFLICTS, AND ONLY WHAT IS TICKED IS BANKED');
    btn(/^Open/, D().querySelector('.wf-strip[data-wf="wA"]')).click();
    await until(() => D().querySelector('.wf-amb-tab'), 6000, 'the ambiguous table');
    const cc = RUN_A.counts;
    ok('the conflicts: DS only, both, P-spike only, and outside both',
       /DS only\s*\d+/.test(D().querySelector('.wf-venn').textContent)
       && new RegExp('both\\s*' + (cc.both || 0)).test(D().querySelector('.wf-venn').textContent)
       && new RegExp('Outside both: ' + (cc.neither || 0)).test(D().querySelector('.wf-venn').textContent),
       D().querySelector('.wf-venn').textContent);
    ok('both borders drawn: two solid boxes and their dashed ones',
       ev(WF + '._boxesOf(' + WF + '._state().data.wA.payload.run, "ambiguous").length') === 4);
    const rowsA = D().querySelectorAll('.wf-amb-tab tr').length - 1;
    ok('a row per ambiguous event', rowsA === (cc.both || 0) + (cc.neither || 0),
       rowsA + ' rows, ' + ((cc.both || 0) + (cc.neither || 0)) + ' ambiguous');
    const boxes = D().querySelectorAll('.wf-amb-tab input[type=checkbox]');
    boxes[0].click(); await sleep(150);
    D().querySelectorAll('.wf-amb-tab input[type=checkbox]')[1].click(); await sleep(150);
    btn(/^Bank the ticked$/).click();
    await until(() => sent().some((x) => x[0] === 'bank:wA'), 4000, 'the bank');
    const bk = sent().filter((x) => x[0] === 'bank:wA').pop()[1];
    ok('exactly the two ticked are banked, as P-spikes, under the name typed',
       bk.picks.length === 2 && bk.type === 'ied' && bk.name === 'harness picks', JSON.stringify(bk));

    head('THE BUILDER: PREVIEW, AND SAVE WHAT IT SAYS');
    btn(/^New workflow$/).click();
    await until(() => D().querySelector('.wf-builder'), 6000, 'the builder');
    const kinds = Array.from(D().querySelectorAll('.wf-builder .seg')[0].querySelectorAll('button')).map((n) => n.textContent);
    ok('the three to choose from', JSON.stringify(kinds)
       === '["Verified dentate spikes","Verified P-spikes","Ambiguous"]', JSON.stringify(kinds));
    const sels = Array.from(D().querySelectorAll('.wf-builder select'));
    ok('the controls and the target picked by name, by default',
       sels.length === 2 && sels[0].value === 'pC' && sels[1].value === 'pT',
       sels.map((s) => s.value).join(','));
    btn(/^Save$/, D().querySelector('.wf-builder')).click();
    await until(() => toasts().some((t) => /Give it a name first/.test(t)), 3000, 'the refusal');
    ok('it will not save without a name', !sent().some((x) => x[0] === 'save'));
    btn(/^Preview$/, D().querySelector('.wf-builder')).click();
    await until(() => sent().some((x) => x[0] === 'preview'), 4000, 'the preview');
    const pv = sent().filter((x) => x[0] === 'preview').pop()[1];
    ok('the preview asks for what the builder says: DS, around the controls, to the target, 5%',
       pv.kind === 'ds' && pv.source.artifact_id === 'pC' && pv.target.artifact_id === 'pT'
       && pv.grace === 0.05, JSON.stringify(pv));
    await until(() => /Preview · nothing saved/.test((D().querySelector('.wf-detail') || {}).textContent || ''), 4000, 'shown');
    ok('shown as a preview, saying nothing is saved, with its 3D',
       inked(D().querySelector('.wf-3d')) > 1000);
    const nm = D().querySelector('.wf-name-in');
    nm.value = 'Harness new'; nm.dispatchEvent(new (frame.contentWindow.Event)('input', { bubbles: true }));
    btn(/^Save$/, D().querySelector('.wf-builder')).click();
    await until(() => sent().some((x) => x[0] === 'save'), 4000, 'the save');
    ok('saved under its name', sent().filter((x) => x[0] === 'save').pop()[1].nickname === 'Harness new');

    head('THE P-SPIKE BUILDER: THE HAND-SORTED SETS, AND MAKING THEM READY');
    btn(/^New workflow$/).click();
    await until(() => D().querySelector('.wf-builder'), 6000, 'the builder');
    btn(/^Verified P-spikes$/, D().querySelector('.wf-builder')).click();
    await until(() => D().querySelector('.wf-sets'), 4000, 'the sets');
    const ticks = Array.from(D().querySelectorAll('.wf-set')).map((n) =>
      [n.textContent.slice(0, 11), n.querySelector('input').checked]);
    ok('every hand-sorted import ticked; a confirmed one offered, not ticked',
       JSON.stringify(ticks) === JSON.stringify([['PTEN m13 s2', true], ['PTEN m34 s8', true],
                                                ['PTEN m3 s2 ', false]]), JSON.stringify(ticks));
    btn(/^Check the sets$/).click();
    await until(() => D().querySelector('.wf-prep'), 4000, 'the check');
    const prep = D().querySelector('.wf-prep').textContent;
    ok('each set: its clock, aligned, read here',
       /needs retiming/.test(prep) && /not yet/.test(prep) && /v3/.test(prep), prep.slice(0, 200));
    const pq = sent().filter((x) => x[0] === 'prepare').pop()[1];
    ok('checked against the target, for the ticked sets only',
       pq.target.artifact_id === 'pT' && JSON.stringify(pq.entries.sort()) === '["h1","h2"]',
       JSON.stringify(pq));
    ok('and Prepare all is offered', !!btn(/^Prepare all$/));
    btn(/^Cancel$/, D().querySelector('.wf-builder')).click();

    head('THE SIDE BRANCH IN A VERSION TREE');
    const vt = ev('(function(){ var n = BARRY.ui.versionTree({ versions: [{ v: 1, at: "2026-11-05",'
      + ' went_into: [{ entry_id: "x1", name: "Verified dentate spikes · H", n: 120,'
      + ' workflow: "H", workflow_version: 2 }] }, { v: 2 }], readonly: true });'
      + ' var b = n.querySelector(".vtree-branch"); return b ? b.textContent : null; })()');
    ok('a version says where its events went, off its row',
       vt === '↳ 120 events went into the Root Canal entry ‘Verified dentate spikes · H’ (workflow ‘H’ v2)', vt);
    ok('nothing was written: every write was answered here',
       !sent().some((x) => x[0] === 'refused'), JSON.stringify(sent().filter((x) => x[0] === 'refused')));
  } catch (err) {
    fail++;
    say('  FAIL the suite threw and stopped here', 'bad');
    say('       THREW L' + ((String((err && err.stack) || '').split('\n').slice(1).join(' ').match(/:(\d+):\d+/) || [])[1]) + ': ' + (err && err.message ? err.message : String(err)), 'bad');
    say('       ' + String((err && err.stack) || '').split('\n').slice(0, 4).join(' | '), 'dim');
  } finally {
    try {
      ev(WF + '.reset()');
      ev('(function(){ var W = window; if (W.__wfFetch) { W.fetch = W.__wfFetch; delete W.__wfFetch; }'
         + ' if (W.__wfLog) { BARRY.activity.log = W.__wfLog; delete W.__wfLog; }'
         + ' if (W.__wfBd) { BARRY.ui.bankDialog = W.__wfBd; delete W.__wfBd; }'
         + ' if (W.__wfOpen) { W.open = W.__wfOpen; delete W.__wfOpen; }'
         + ' if (W.__wfPrefSet) { BARRY.prefs.set = W.__wfPrefSet; BARRY.prefs.get = W.__wfPrefGet;'
         + ' delete W.__wfPrefSet; delete W.__wfPrefGet; } })()');
      ev('(function(v){ try { if (v == null) localStorage.removeItem("barry.rootcanal.view");'
         + ' else localStorage.setItem("barry.rootcanal.view", v); } catch (e) {} })('
         + JSON.stringify(viewWas == null ? null : viewWas) + ')');
    } catch (e) { /* gone */ }
    await sleep(300);
  }
  say('');
  say('  ' + pass + ' ok, ' + fail + ' fail', fail ? 'bad' : 'ok');
  document.title = 'rcworkflow: ' + pass + ' ok, ' + fail + ' fail';
  try { frame.src = 'about:blank'; } catch (e) { /* ok */ }
})();
</script></body></html>

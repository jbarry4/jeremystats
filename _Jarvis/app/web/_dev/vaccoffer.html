<!doctype html>
<html><head><meta charset="utf-8"><title>vaccoffer: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:700px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:700px;top:0;right:0;bottom:0;width:calc(100vw - 700px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/"></iframe>
<script>
/* A VACC tool offers to send what the cluster has not got.

   Constitution §6d. Before this, Incisor and Doppler dropped every
   recording the cluster had no copy of without a word -- so a VACC batch
   quietly did not mention most of the catalogue -- and Circuit named them
   and said "upload it to VACC first" with no way to do it.

   Four things this page is about, and each was wrong somewhere:

     NAMED, NOT DROPPED. A plan that omits what it cannot run reads as
     though those recordings do not exist.

     ONLY WHAT CAN BE SENT. `can_upload` is not "the cluster has not got
     it": a recording this computer cannot open either has nothing to send,
     and a button that cannot work is worse than no button.

     CAPPED, BUT COMPLETE. 1,380 blocked entries is 100 KB of the same
     sentence and 1,380 nodes in a panel nobody opens -- so forty are
     explained and the rest counted. The BUTTON still gets every gid: one
     that offered only the forty you can read would do less than it says.

     ONE PATHWAY. The offer calls the same `upload` Sessions calls. A tool
     writing to the lab's shared space its own way would be a second set of
     rules about the lab's data. */
const L = document.getElementById('log');
let fails = 0, checks = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { checks++; if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 20000)) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    await sleep(70);
  }
  return null;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog'),
              25000);

  say('=== the plan names what it cannot run ===');
  const plan = JSON.parse(await ev(
    'fetch("/api/incisor/batch/plan").then(r=>r.text())'));
  check('the plan answers', plan.ok === true,
        JSON.stringify(plan).slice(0, 90));
  const shown = plan.blocked || [];
  say('    ' + plan.n + ' to run, ' + plan.blocked_total + ' left out, '
      + (plan.upload_gids || []).length + ' of those can be sent', 'note');
  check('recordings the cluster has not got are NAMED, not dropped',
        (plan.blocked_total || 0) > 0, String(plan.blocked_total));

  /* Capped, but complete. These are two different numbers on purpose. */
  check('only a sample is explained, not all of them',
        shown.length <= 40, shown.length + ' explained');
  check('and the true total is stated',
        plan.blocked_total >= shown.length,
        plan.blocked_total + ' vs ' + shown.length + ' shown');
  check('while the button gets every gid, not just the explained ones',
        (plan.upload_gids || []).length >= shown.filter(
          (b) => b.can_upload).length,
        (plan.upload_gids || []).length + ' gids');

  say('');
  say('=== and only offers what can actually be sent ===');
  const can = shown.filter((b) => b.can_upload);
  const cannot = shown.filter((b) => b.can_upload === false);
  say('    of the sample: ' + can.length + ' sendable, ' + cannot.length
      + ' not', 'note');
  check('every blocked entry says whether it can be sent',
        shown.every((b) => typeof b.can_upload === 'boolean'),
        shown.filter((b) => typeof b.can_upload !== 'boolean').length
        + ' without');
  check('and says why, in words', shown.every((b) => (b.why || '').length > 8),
        (shown[0] || {}).why);
  if (cannot.length) {
    /* The distinction the design rests on: missing from the cluster is
       fixable, missing from both is not. */
    check('one that cannot be sent explains that it is missing here too',
          cannot.some((b) => /cannot open/.test(b.why || '')),
          (cannot[0] || {}).why);
  }
  if (can.length) {
    check('and one that can says the cluster simply has not got it',
          can.every((b) => /no copy/.test(b.why || '')),
          (can[0] || {}).why);
  }
  /* A gid offered for upload must never be one nothing can be read from. */
  const bad = shown.filter((b) => b.can_upload === false && b.gid
                                  && (plan.upload_gids || []).includes(b.gid));
  check('nothing unreadable is offered for upload', bad.length === 0,
        bad.map((b) => b.label).join(', '));

  say('');
  say('=== one renderer, and it is the Sessions pathway ===');
  check('the offer is built in one place',
        ev('typeof BARRY.vacc.uploadMissing') === 'function');
  /* Built from the plan exactly as a tool builds it. */
  const node = ev('(function(){'
    + ' var p = ' + JSON.stringify({ blocked: shown.slice(0, 5),
                                     upload_gids: plan.upload_gids || [] })
    + ';'
    + ' var n = BARRY.vacc.uploadMissing(p.blocked, null, p.upload_gids);'
    + ' if (!n) return "null";'
    + ' document.body.appendChild(n); n.id = "offerProbe";'
    + ' return n.querySelector("button").textContent; })()');
  say('    button says: ' + node, 'note');
  if ((plan.upload_gids || []).length) {
    check('it offers a button', node !== 'null', node);
    /* The count on the button is the complete one, not the sample. */
    check('counting every recording it would send, not the sample',
          node.indexOf(String((plan.upload_gids || []).length)) >= 0,
          node + ' for ' + (plan.upload_gids || []).length + ' gids');
    const txt = ev('(document.getElementById("offerProbe")||{}).textContent');
    check('and says what uploading means before it is pressed',
          /already there at the same size is skipped/.test(txt || ''),
          (txt || '').slice(0, 80));
    check('including that the local copy is safe',
          /only read/.test(txt || ''));
  }
  ev('(function(){var n=document.getElementById("offerProbe");'
     + 'if(n)n.remove();})()');

  say('');
  say('=== nothing to offer draws nothing ===');
  /* An empty offer must be absent, not an empty box with a dead button. */
  check('no sendable recordings means no offer',
        ev('BARRY.vacc.uploadMissing([], null, []) === null'));
  check('and a list of only-unreadable ones means no offer either',
        ev('BARRY.vacc.uploadMissing('
           + '[{gid:"x",label:"x",can_upload:false,why:"no"}], null) === null'));

  say('');
  say('=== the tools ask for it ===');
  /* Asserted on the source rather than by driving three tools into their
     batch modes, which needs a cluster, a selection and a plan each. What
     is being checked is that none of them rolled their own. */
  for (const f of ['incisor', 'doppler', 'circuit']) {
    const src = await ev('fetch("/js/' + f + '.js").then(r=>r.text())');
    check(f + ' offers the upload', src.indexOf('uploadMissing') >= 0);
    check('  and does not write to the shared space itself',
          src.indexOf('/api/vacc/upload') < 0,
          'calls the route directly');
  }

  say('');
  say('ran ' + checks + ' checks');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'vaccoffer: ' + fails + ' FAILED'
                         : 'vaccoffer: passed';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'vaccoffer CRASH'; });
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>inside: running</title>
<style>html,body{margin:0;height:100%;background:#0a1310;color:#dfeae4;
font:11px/1.6 ui-monospace,Consolas,monospace}
#log{position:fixed;left:0;top:0;width:640px;height:100vh;overflow:auto;padding:8px;
background:#06100c;white-space:pre-wrap;z-index:9}
.bad{color:#ff8a7a}.good{color:#7fe3b0}.note{color:#7593a2}
iframe{position:fixed;left:640px;top:0;right:0;bottom:0;width:calc(100vw - 640px);
height:100vh;border:0}</style></head>
<body><pre id="log"></pre><iframe id="app" src="/?linkhold=0&menu=0&welcome=0"></iframe>
<script>
/* Inside Jarvis (js/inside.js, backend/inside.py, backend/weekly.py).

   What this has to catch:

   ONE. Numbers that are not the records'. The counters, and the facts beside
   each picture, are checked against /api/inside/census read directly.

   TWO. A picture that does not draw. Each of the five is scrolled into view
   and its canvas is read back for ink. The Sunflower answers a pointer with
   the entry under it; Powers of Ten goes from one sample (simulated, and
   saying so) to everything (the real total).

   THREE. "The UI keeps reloading." An answer with nothing new in it must
   rebuild nothing: the same nodes before and after.

   FOUR. The printer. The week routes are answered in the page, so nothing is
   printed for real and Hater of AI is never asked: a press shows the steps,
   the printout lands with its headline and numbers, it can be saved (the
   save is answered here too), closed, and found again under Earlier
   printouts.

   Writes nothing to the store. Leaves localStorage as it found it. */
const L = document.getElementById('log');
let fails = 0, checks = 0;
const say = (s, c) => { const n = document.createElement('span');
  if (c) n.className = c; n.textContent = s + '\n'; L.appendChild(n); };
const check = (what, ok, note) => { checks++; if (!ok) fails++;
  say((ok ? '  ok   ' : '  FAIL ') + what + (note ? '   [' + note + ']' : ''),
      ok ? 'good' : 'bad'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 20000)) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    await sleep(80);
  }
  return null;
}
const digits = (s) => Number(String(s || '').replace(/[^\d]/g, '') || NaN);

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const ev = (c) => frame.contentWindow.eval(c);
  const D = () => frame.contentDocument;
  const W = () => frame.contentWindow;
  await until(() => ev('typeof BARRY') === 'object' && ev('BARRY.state.catalog')
                    && ev('!!BARRY.inside') && ev('!!BARRY.jarvisshow'), 40000);
  check('the module is loaded', !!ev('BARRY.inside && BARRY.inside.render'));

  let seenWas = null;
  try { seenWas = W().localStorage.getItem('jarvis.inside.seen'); } catch (e) {}
  const errors = [];
  const realReport = W().reportClientError;
  W().reportClientError = function (where, msg) { errors.push(where + ': ' + msg); };

  // The week's routes, answered in the page. Probed first: a stub that
  // does not take would print a real week on the lab's account.
  const realFetch = W().fetch;
  const hits = [];
  const week = { phase: 'idle' };
  const NOW = new Date().toISOString();
  const REPORT = {
    id: 'harness-week', shard: 'harness', at: NOW, who: 'Debug_Bot', machine: 'harness',
    since: new Date(Date.now() - 7 * 864e5).toISOString(), until: NOW, status: 'printed',
    writer: 'Hater of AI', run: { model: 'stub' },
    numbers: { versions: 24, commits: 49, lines_added: 3800, lines_removed: 250, files: 120,
               events_banked: 39410, calls_people: 435, calls_models: 16587, procedures: 6, people: 4 },
    note: { headline: 'A steady, productive week.', summary: 'The harness wrote this.',
            progress: ['One thing got better.'], bench: ['Six behaviour sessions.'],
            data: ['Events were banked.'], next: ['More of the same.'], watch: [] },
    bench: { events: [] },
  };
  // A mailer as this computer would have one; made-up addresses.
  const MAIL = { here: true, lab: 4, schedule: 'Fridays at 3:00 PM', testTo: ['test@example.org'],
                 labTo: ['a@example.org', 'b@example.org', 'c@example.org', 'd@example.org'] };
  const mails = [];
  const json = (o) => new Response(JSON.stringify(o), { status: 200, headers: { 'Content-Type': 'application/json' } });
  W().fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    const path = url.replace(/^https?:\/\/[^/]+/, '');
    if (path.startsWith('/api/inside/week')) {
      hits.push((init && init.method || 'GET') + ' ' + path.split('?')[0]);
      if (path.startsWith('/api/inside/week/probe')) return Promise.resolve(json({ ok: true, probe: true }));
      if (path.startsWith('/api/inside/week/print')) {
        week.phase = 'running'; week.polls = 0;
        return Promise.resolve(json({ ok: true, id: REPORT.id, reports: [],
          run: { running: true, id: REPORT.id, steps: [{ text: 'reading the last 7 days of commits and patch notes' }] } }));
      }
      if (path.startsWith('/api/inside/week/report')) return Promise.resolve(json({ ok: true, report: REPORT, text: 'LAST 7 DAYS\nA steady, productive week.' }));
      if (path.startsWith('/api/inside/week/save')) return Promise.resolve(json({ ok: true, saved: { rel: 'Results/Weekly/harness.txt' } }));
      if (path.startsWith('/api/inside/week/email')) {
        const to = JSON.parse((init && init.body) || '{}').to;
        mails.push(to);
        return Promise.resolve(json({ ok: true, sent: to === 'lab' ? 4 : 1, list: to }));
      }
      if (path.startsWith('/api/inside/week/stop')) { week.phase = 'idle'; return Promise.resolve(json({ ok: true, run: { running: false }, reports: [] })); }
      if (week.phase === 'running') {
        week.polls += 1;
        if (week.polls < 2) {
          return Promise.resolve(json({ ok: true, reports: [], run: { running: true, id: REPORT.id,
            steps: [{ text: 'reading the last 7 days of commits and patch notes' },
                    { text: 'Hater of AI is reading the week' }] } }));
        }
        week.phase = 'done';
      }
      const reports = week.phase === 'done' ? [{ id: REPORT.id, shard: REPORT.shard, at: NOW, who: 'Debug_Bot',
                                                  writer: 'Hater of AI', headline: REPORT.note.headline }] : [];
      return Promise.resolve(json({ ok: true, run: { running: false, id: week.phase === 'done' ? REPORT.id : null, steps: [] },
                                    reports, writer: { engine: true, key: true }, mail: MAIL }));
    }
    return realFetch.apply(this, arguments);
  };
  const probe = await ev('api("/api/inside/week/probe")');
  check('the week routes are answered in the page (probe)', !!(probe && probe.probe) && hits.length === 1, hits.join(' | '));

  try {
  say('');
  say('=== the numbers ===');
  // Held by the server until its count is over (?wait): a poll loop here
  // runs on the runner's virtual clock and is over before anything is
  // counted.
  let census = await (await realFetch.call(W(), '/api/inside/census?wait=220', { cache: 'no-store' })).json();
  if (census.ok && census.busy) {
    census = await (await realFetch.call(W(), '/api/inside/census?wait=220', { cache: 'no-store' })).json();
  }
  check('the census answers every part', census && census.ok && !census.missing.length,
        census ? 'missing: ' + census.missing.join(',') + (census.busy ? ', still counting' : '') : 'no answer');
  const T = census.totals;
  check('and its totals add up from the parts',
        T.events === census.parts.events.rows.reduce((s, r) => s + r[2], 0)
        && T.recordings === census.parts.zoom.rows.length
        && T.versions === census.parts.versions.versions.length, JSON.stringify(T).slice(0, 160));

  ev('BARRY.inside.open()');
  await until(() => D().getElementById('jarvisShow'), 5000);
  const tab = await until(() => D().querySelector('#jarvisShow .jx-tab[data-k="inside"]'), 3000);
  check('the showcase opens on its Inside Jarvis tab', !!tab && tab.classList.contains('on'));
  const body = D().querySelector('#jarvisShow .jx-body');
  await until(() => D().querySelectorAll('#jarvisShow .in-count strong').length === 6
                    && Array.from(D().querySelectorAll('#jarvisShow .in-count strong'))
                      .every((n) => /\d/.test(n.textContent)), 20000);
  await sleep(1800);   // the counts run up, then stop on their values
  const counts = {};
  D().querySelectorAll('#jarvisShow .in-count').forEach((c) => {
    counts[c.querySelector('span').textContent] = digits(c.querySelector('strong').textContent);
  });
  check('recordings on screen = the census', counts.recordings === T.recordings, counts.recordings + ' vs ' + T.recordings);
  check('events banked on screen = the census', counts['events banked'] === T.events, counts['events banked'] + ' vs ' + T.events);
  check('calls made on screen = the census', counts['calls made'] === T.calls, counts['calls made'] + ' vs ' + T.calls);
  check('versions on screen = the census', counts['versions shipped'] === T.versions);
  check('lines of code on screen = the census', counts['lines of code'] === T.lines);
  check('days of building on screen = the census', counts['days of building'] === T.days);

  say('');
  say('=== the five pictures ===');
  const ink = (cv) => {
    try {
      const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
      let lit = 0;
      for (let i = 3; i < d.length; i += 4 * 9) if (d[i] > 0) lit++;
      return lit;
    } catch (e) { return -1; }
  };
  const scene = (k) => D().querySelector('#jarvisShow .in-scene[data-scene="' + k + '"]');
  const fact = (k, name) => {
    const dts = Array.from(scene(k).querySelectorAll('.in-facts dt'));
    const dt = dts.find((d) => d.textContent === name);
    return dt ? dt.nextElementSibling.textContent : null;
  };
  check('five pictures, in order', ['sunflower', 'powers', 'gyrus', 'connectome', 'river']
        .every((k, i) => D().querySelectorAll('#jarvisShow .in-scene')[i] === scene(k)));
  for (const k of ['sunflower', 'powers', 'gyrus', 'connectome', 'river']) {
    scene(k).scrollIntoView({ block: 'start' });
    await sleep(900);
    const cv = scene(k).querySelector('.in-canvas');
    const lit = await until(() => { const n = ink(cv); return n > 400 ? n : 0; }, 12000);
    check(k + ': draws', !!lit, (lit || ink(cv)) + ' lit samples');
  }
  check('no fault while drawing them', !errors.length, errors.join(' | ').slice(0, 400));
  check('the Sunflower counts every event', digits(fact('sunflower', 'Events')) === T.events);
  check('the Gyrus counts every version', digits(fact('gyrus', 'Versions')) === T.versions);
  check('the Connectome counts every module', digits(fact('connectome', 'Modules')) === T.modules);
  check('the River: people and models together = the calls made',
        digits(fact('river', 'Called by people')) + digits(fact('river', 'Called by models')) === T.calls);

  // The Sunflower answers a pointer with the entry under it.
  scene('sunflower').scrollIntoView({ block: 'start' });
  await sleep(400);
  const fcv = scene('sunflower').querySelector('.in-canvas');
  const fr = fcv.getBoundingClientRect();
  const R = Math.min(fr.width, fr.height) * 0.47;
  fcv.dispatchEvent(new (W().PointerEvent)('pointermove', { clientX: fr.left + fr.width / 2 + R * 0.6,
                                                            clientY: fr.top + fr.height / 2, bubbles: true }));
  await sleep(150);
  const read = scene('sunflower').querySelector('.in-read strong');
  check('pointing at a ring names its bank entry', !!read && read.textContent.length > 2,
        read ? read.textContent.slice(0, 60) : 'nothing');
  const rows = census.parts.events.rows;
  check('and it is one of the bank’s entries', !!read && rows.some((r) => r[0] === read.textContent));

  // Powers of Ten: one sample, then everything.
  scene('powers').scrollIntoView({ block: 'start' });
  await sleep(300);
  const stop = (w) => Array.from(scene('powers').querySelectorAll('.in-stop')).find((b) => b.textContent === w);
  check('the zoom has its stops', !!stop('one sample') && !!stop('everything'));
  stop('one sample').click();
  await until(() => /one moment/.test(scene('powers').querySelector('.in-zoom-big span').textContent), 4000);
  check('one sample: one moment on every channel',
        /one moment/.test(scene('powers').querySelector('.in-zoom-big span').textContent),
        scene('powers').querySelector('.in-zoom-big span').textContent.slice(0, 80));
  check('and the trace says it is simulated', !scene('powers').querySelector('.in-sim').hidden
        && /Simulated/.test(scene('powers').querySelector('.in-sim').textContent));
  stop('everything').click();
  await until(() => digits(scene('powers').querySelector('.in-zoom-big strong').textContent) === T.samples, 5000);
  check('everything: the real total of samples', digits(scene('powers').querySelector('.in-zoom-big strong').textContent) === T.samples,
        scene('powers').querySelector('.in-zoom-big strong').textContent + ' vs ' + T.samples);
  check('and the circles are not called simulated', scene('powers').querySelector('.in-sim').hidden);

  say('');
  say('=== nothing rebuilt that has not changed ===');
  const before = Array.from(D().querySelectorAll('#jarvisShow .in-scene, #jarvisShow .in-facts dt, #jarvisShow .in-key'));
  await ev('BARRY.inside._census()');
  await sleep(600);
  const after = Array.from(D().querySelectorAll('#jarvisShow .in-scene, #jarvisShow .in-facts dt, #jarvisShow .in-key'));
  check('an answer with nothing new keeps every node', before.length === after.length
        && before.every((n, i) => n === after[i]), before.length + ' / ' + after.length);
  ev('BARRY.inside.repaint()');
  await sleep(200);
  check('a theme repaint redraws without a fault', !errors.length, errors.join(' | '));

  say('');
  say('=== the printer ===');
  body.scrollTop = 0;
  const btn = D().getElementById('insidePrint');
  check('the printer is there, and says what it prints', !!btn && /Last 7 days/.test(btn.textContent));
  btn.click();
  await until(() => D().querySelector('#jarvisShow .in-feed-steps li'), 4000);
  check('a press shows the steps as they happen', !!D().querySelector('#jarvisShow .in-feed-steps li.now'),
        (D().querySelector('#jarvisShow .in-feed-steps') || {}).textContent);
  check('and the button says it is printing', btn.disabled && /Printing/.test(btn.textContent));
  await until(() => D().querySelector('#jarvisShow .in-slip h4'), 12000);
  const head = D().querySelector('#jarvisShow .in-slip h4');
  check('the printout lands with its headline', !!head && head.textContent === REPORT.note.headline,
        head ? head.textContent : 'nothing landed');
  check('and its numbers', D().querySelectorAll('#jarvisShow .in-slip-nums dt').length >= 6);
  check('and who wrote it', /Hater of AI/.test((D().querySelector('#jarvisShow .in-slip-foot') || {}).textContent || ''));
  check('the printer is ready again', !btn.disabled);
  const saveBtn = Array.from(D().querySelectorAll('#jarvisShow .in-slip-acts button')).find((b) => b.textContent === 'Save to Results');
  saveBtn.click();
  await until(() => hits.some((h) => /week\/save/.test(h)), 3000);
  check('Save to Results asks the server to keep it', hits.some((h) => /POST \/api\/inside\/week\/save/.test(h)), hits.join(' | '));
  check('the printer says when it is emailed, and to how many',
        /Emailed to the lab \(4 people\) Fridays at 3:00 PM/.test((D().querySelector('#jarvisShow .in-print-sub') || {}).textContent || ''));
  const mailBtn = Array.from(D().querySelectorAll('#jarvisShow .in-slip-acts button')).find((b) => b.textContent === 'Email…');
  check('the slip offers Email…', !!mailBtn && !mailBtn.disabled);
  mailBtn.click();
  await sleep(100);
  const panel = D().querySelector('#jarvisShow .in-mail');
  check('Email… opens the panel', !!panel && !panel.hidden);
  const mbtn = (re) => Array.from(panel.querySelectorAll('button')).find((b) => re.test(b.textContent));
  check('the test names who it goes to', !!mbtn(/test@example\.org/));
  mbtn(/Send a test/).click();
  await until(() => /Sent to 1 person/.test(panel.querySelector('.in-mail-say').textContent), 3000);
  check('a test is sent to the test list at once', mails.join(',') === 'test',
        mails.join(',') + ' / ' + panel.querySelector('.in-mail-say').textContent);
  mbtn(/Send to the lab/).click();
  await sleep(100);
  const confirmRow = panel.querySelector('.in-mail-confirm');
  check('the lab is only asked, not sent, on the first press', !confirmRow.hidden && mails.length === 1
        && /a@example\.org/.test(confirmRow.textContent));
  mbtn(/^Cancel$/).click();
  await sleep(50);
  check('Cancel sends nothing', confirmRow.hidden && mails.length === 1);
  mbtn(/Send to the lab/).click();
  await sleep(50);
  mbtn(/^Send it$/).click();
  await until(() => /Sent to 4 people/.test(panel.querySelector('.in-mail-say').textContent), 3000);
  check('Send it sends to the lab list', mails.join(',') === 'test,lab', mails.join(','));
  const earlier = D().querySelectorAll('#jarvisShow .in-earlier-row');
  check('it is listed under Earlier printouts', earlier.length === 1);
  Array.from(D().querySelectorAll('#jarvisShow .in-slip-acts button')).find((b) => b.textContent === 'Close').click();
  await sleep(100);
  check('Close puts it away', D().querySelector('#jarvisShow .in-paper').hidden);
  earlier[0].click();
  await until(() => D().querySelector('#jarvisShow .in-slip h4'), 3000);
  check('and an earlier printout opens again by its id', !!D().querySelector('#jarvisShow .in-slip h4')
        && hits.filter((h) => /week\/report/.test(h)).length >= 2);
  check('nothing was ever sent to print for real', hits.filter((h) => /print/.test(h)).length === 1);

  say('');
  say('=== leaving ===');
  D().querySelector('#jarvisShow .jx-tab[data-k="ds"]').click();
  await sleep(300);
  check('another tab takes the body back', !D().querySelector('#jarvisShow .in-scene'));
  D().querySelector('#jarvisShow .jx-tab[data-k="inside"]').click();
  await until(() => D().querySelector('#jarvisShow .in-scene'), 3000);
  await sleep(500);
  const cnt = D().querySelector('#jarvisShow .in-count strong');
  check('and coming back draws at once from what is held', !!cnt && /\d/.test(cnt.textContent));
  check('no client error from Inside Jarvis', !errors.filter((e) => /inside/.test(e)).length, errors.join(' | '));
  } finally {
    W().fetch = realFetch;
    W().reportClientError = realReport;
    try { ev('BARRY.jarvisshow.close()'); } catch (e) {}
    try {
      if (seenWas === null) W().localStorage.removeItem('jarvis.inside.seen');
      else W().localStorage.setItem('jarvis.inside.seen', seenWas);
    } catch (e) {}
  }

  say('');
  say('ran ' + checks + ' checks');
  say(fails ? fails + ' FAILED' : 'all passed', fails ? 'bad' : 'good');
  document.title = fails ? 'inside: ' + fails + ' FAILED' : 'inside: passed';
  // The app polls for as long as it is open, which pins the runner's
  // virtual clock to the wall; blank it so the dump is taken now.
  frame.src = 'about:blank';
})().catch((e) => { say('CRASH ' + e.message + '\n' + e.stack, 'bad');
                    document.title = 'inside CRASH'; });
</script></body></html>

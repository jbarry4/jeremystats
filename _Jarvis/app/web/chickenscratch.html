<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken Scratch</title>
<!-- Chicken Scratch (BETA): one page per PTEN/KCNT1 mouse, built from every
     sheet, doc, PDF, notebook photo and recording folder the lab has, with
     the places they disagree left showing. Opened from Misc. Facts come from
     /api/chickenscratch/* (backend/chickenscratch.py); notes left here go
     back to the work folder for the next pass. Behaviour:
     js/chickenscratch.js. -->
<link rel="icon" type="image/svg+xml" href="img/jarvis.svg">
<script>
  // Wear the app's theme when opened from it.
  try {
    var t = window.opener && window.opener.document.documentElement.dataset.theme;
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) { /* opened on its own: the default */ }
</script>
<link rel="stylesheet" href="app.css">
<style>
  /* app.css holds html/body still; this page scrolls its own panes. */
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: var(--sans, system-ui, sans-serif); font-size: var(--fs-12, 12px);
         display: flex; flex-direction: column; }
  .cs-head { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
             padding: 8px 14px; border-bottom: 2px solid var(--accent); background: var(--bg-2); }
  .cs-head h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .cs-beta { font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px;
             border-radius: 999px; background: var(--warn-soft); color: var(--warn);
             border: 1px solid var(--warn); }
  .cs-sub { color: var(--text-3); }
  .cs-head input[type=search] { min-width: 200px; flex: 1 1 200px; max-width: 360px; }
  .cs-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .cs-chip { border: 1px solid var(--line); background: var(--bg); color: var(--text-2);
             border-radius: 999px; padding: 2px 9px; cursor: pointer; font: inherit; }
  .cs-chip[aria-pressed=true] { background: var(--accent-soft); color: var(--text);
                                border-color: var(--accent-line, var(--accent)); }
  .cs-main { flex: 1; min-height: 0; display: flex; }
  .cs-list { flex: none; width: 300px; overflow: auto; border-right: 1px solid var(--line);
             background: var(--bg-2); }
  .cs-group { padding: 8px 12px 4px; color: var(--text-3); font-size: 11px; text-transform: uppercase;
              letter-spacing: .06em; }
  .cs-mouse { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; padding: 6px 12px;
              cursor: pointer; border-left: 3px solid transparent; }
  .cs-mouse:hover { background: var(--bg-hover); }
  .cs-mouse[aria-selected=true] { background: var(--accent-soft); border-left-color: var(--accent); }
  .cs-mouse .id { font-weight: 600; }
  .cs-mouse .meta { grid-column: 1 / -1; color: var(--text-3); overflow-wrap: anywhere; }
  .cs-badges { display: flex; gap: 4px; align-items: center; }
  .cs-badge { font-size: 10px; padding: 0 6px; border-radius: 999px; line-height: 16px; }
  .cs-badge.warn { background: var(--warn-soft); color: var(--warn); }
  .cs-badge.ok { background: var(--ok-soft); color: var(--ok); }
  .cs-badge.note { background: var(--accent-2-soft, var(--accent-soft)); color: var(--text); }
  .cs-pane { flex: 1; min-width: 0; overflow: auto; padding: 14px 18px 60px; }
  .cs-pane h2 { margin: 0 0 4px; font-size: 18px; }
  .cs-pane h3 { margin: 22px 0 8px; font-size: 13px; color: var(--text-2);
                text-transform: uppercase; letter-spacing: .05em; }
  .cs-empty { color: var(--text-3); padding: 30px; }
  .cs-attrs { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
  .cs-attrs .k { color: var(--text-3); }
  .cs-attrs .v { overflow-wrap: anywhere; }
  .cs-val { display: inline-flex; gap: 4px; align-items: center; margin-right: 10px; }
  .cs-val small { color: var(--text-3); }
  .cs-dispute { color: var(--warn); font-weight: 600; margin-right: 6px; }
  .cs-story { background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px;
              padding: 10px 14px; line-height: 1.5; }
  .cs-story p { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cs-story ul { margin: 4px 0 8px 18px; padding: 0; }
  .cs-conf { border-left: 3px solid var(--warn); background: var(--warn-soft);
             padding: 7px 10px; margin: 0 0 6px; border-radius: 0 6px 6px 0; }
  .cs-conf .t { overflow-wrap: anywhere; }
  .cs-row { display: grid; grid-template-columns: 92px 150px 1fr; gap: 2px 12px; padding: 6px 0;
            border-bottom: 1px solid var(--line-soft, var(--line)); }
  .cs-row .d { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .cs-row .ty { color: var(--text-3); }
  .cs-row .srcs { grid-column: 3; color: var(--text-3); }
  .cs-facts { grid-column: 1 / -1; margin: 4px 0 2px 104px; }
  .cs-fact { padding: 6px 8px; margin: 4px 0; background: var(--bg-2); border-radius: 6px;
             border: 1px solid var(--line); }
  .cs-fact .src { color: var(--text-3); overflow-wrap: anywhere; }
  .cs-fact .det { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cs-fact .flags { color: var(--warn); }
  .cs-acts { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .cs-acts button { font: inherit; font-size: 11px; padding: 1px 8px; border-radius: 999px;
                    border: 1px solid var(--line); background: var(--bg); color: var(--text-2);
                    cursor: pointer; }
  .cs-acts button:hover { border-color: var(--accent); color: var(--text); }
  .cs-note-box { display: flex; gap: 6px; margin-top: 6px; }
  .cs-note-box[hidden] { display: none; }
  .cs-note-box textarea { flex: 1; min-height: 46px; font: inherit; color: var(--text);
                          background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
                          padding: 6px 8px; }
  .cs-notes .n { padding: 6px 0; border-bottom: 1px solid var(--line-soft, var(--line)); }
  .cs-notes .n small { color: var(--text-3); }
  .cs-thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .cs-thumbs img { height: 90px; border-radius: 4px; border: 1px solid var(--line); cursor: zoom-in; }
  .cs-viewer { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: flex;
               align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .cs-viewer img { max-width: 96vw; max-height: 94vh; }
  .cs-tabs { display: flex; gap: 6px; margin: 10px 0 0; flex-wrap: wrap; }
  /* ---- the Quest: one disagreement at a time ---- */
  .cs-main[hidden], .cs-quest[hidden] { display: none; }
  .cs-modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .cs-mode { font: inherit; border: 0; background: transparent; color: var(--text-2);
             padding: 3px 12px; cursor: pointer; }
  .cs-mode[aria-selected=true] { background: var(--accent); color: var(--on-accent, #fff); }
  body.questing #csSearch, body.questing #csChips { display: none; }
  .cs-quest { flex: 1; min-height: 0; overflow: auto; padding: 22px 16px 60px; }
  .q-wrap { max-width: 720px; margin: 0 auto; }
  .q-hud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .q-level { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
  .q-level .egg { font-size: 22px; line-height: 1; }
  .q-pts, .q-streak { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .q-streak.hot { color: var(--warn); font-weight: 700; }
  .q-scope { margin-left: auto; display: inline-flex; gap: 4px; }
  .q-bar { height: 8px; background: var(--bg-3); border-radius: 999px; overflow: hidden; margin: 4px 0 2px; }
  .q-bar i { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  .q-progress { color: var(--text-3); font-size: 12px; margin-bottom: 18px; }
  .q-card { position: relative; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px;
            padding: 20px 22px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .q-card.enter { animation: qIn .28s ease-out; }
  @keyframes qIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  .q-mouse { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px;
             background: var(--accent-soft); color: var(--text); cursor: pointer; border: 0; font: inherit; }
  .q-kind { color: var(--text-3); font-size: 12px; margin-left: 8px; }
  .q-question { font-size: 19px; font-weight: 650; margin: 12px 0 4px; line-height: 1.35; overflow-wrap: anywhere; }
  .q-subtitle { color: var(--text-3); margin-bottom: 6px; }
  .q-opts { display: grid; gap: 8px; margin: 14px 0 10px; }
  .q-opt { display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; align-items: start; text-align: left;
           font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--bg); color: var(--text); cursor: pointer; transition: transform .08s, border-color .12s; }
  .q-opt:hover { border-color: var(--accent); transform: translateY(-1px); }
  .q-opt:active { transform: scale(.99); }
  .q-opt .k { grid-row: span 2; width: 24px; height: 24px; border-radius: 6px; background: var(--bg-3);
              display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-2); }
  .q-opt .l { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .q-opt .s { color: var(--text-3); font-size: 12px; overflow-wrap: anywhere; }
  .q-opt.picked { border-color: var(--ok); background: var(--ok-soft); }
  .q-side { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .q-side button { font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
                   border: 1px solid var(--line); background: transparent; color: var(--text-2); }
  .q-side button:hover { color: var(--text); border-color: var(--accent); }
  .q-keys { margin-left: auto; color: var(--text-3); font-size: 11px; }
  .q-ev { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .q-ev .e { margin: 0 0 8px; }
  .q-ev .e b { color: var(--text-2); font-weight: 600; }
  .q-ev .e p { margin: 2px 0 0; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  .q-ev img { height: 120px; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; margin-top: 4px; }
  .q-else { display: flex; gap: 6px; margin-top: 10px; }
  .q-else[hidden], .q-ev[hidden] { display: none; }
  .q-else textarea { flex: 1; min-height: 52px; font: inherit; color: var(--text); background: var(--bg);
                     border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .q-plus { position: absolute; right: 18px; top: 12px; font-weight: 800; color: var(--ok);
            animation: qPlus .9s ease-out forwards; pointer-events: none; }
  @keyframes qPlus { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-28px); } }
  .q-feather { position: fixed; pointer-events: none; font-size: 18px; z-index: 60;
               animation: qFeather 1.1s ease-out forwards; }
  @keyframes qFeather { to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
  .q-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70;
             background: var(--bg-2); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 18px;
             box-shadow: 0 8px 30px rgba(0,0,0,.3); font-weight: 650; animation: qIn .3s ease-out; }
  .q-done { text-align: center; padding: 50px 20px; }
  .q-done .big { font-size: 48px; }
  @media (prefers-reduced-motion: reduce) {
    .q-card.enter, .q-plus, .q-feather, .q-toast, .q-bar i { animation: none; transition: none; }
  }
  @media (max-width: 760px) {
    .cs-main { flex-direction: column; }
    .cs-list { width: auto; max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .cs-row { grid-template-columns: 84px 1fr; }
    .cs-row .srcs { grid-column: 1 / -1; }
    .cs-facts { margin-left: 0; }
  }
</style>
</head>
<body>
  <header class="cs-head">
    <h1>Chicken Scratch <span class="cs-beta" title="A first pass. Read it, mark what is right or wrong, and leave notes: they shape the next pass.">BETA</span></h1>
    <div class="cs-modes" role="tablist" aria-label="Mode">
      <button class="cs-mode" role="tab" id="csModeQuest" aria-selected="true">Quest</button>
      <button class="cs-mode" role="tab" id="csModeBrowse" aria-selected="false">Browse</button>
    </div>
    <span class="cs-sub" id="csStats">Loading…</span>
    <input type="search" id="csSearch" placeholder="Find a mouse: 1603, m13, cage, cohort…" aria-label="Find a mouse">
    <div class="cs-chips" id="csChips"></div>
  </header>
  <main class="cs-main" id="csBrowse" hidden>
    <nav class="cs-list" id="csList" aria-label="Mice"></nav>
    <section class="cs-pane" id="csPane">
      <div class="cs-empty">Pick a mouse on the left.</div>
    </section>
  </main>
  <main class="cs-quest" id="csQuest"></main>
<script src="js/chickenscratch.js"></script>
</body>
</html>
